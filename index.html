<script>
(function(){
"use strict";
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(ds,n)=>{const [y,m,d]=ds.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const SEC=['Appearance','Aroma','Flavor','Mouthfeel','Overall Impression'];
const SEC_TH={'Appearance':'ลักษณะภายนอก','Aroma':'กลิ่น','Flavor':'รสชาติ','Mouthfeel':'สัมผัสในปาก','Overall Impression':'ภาพรวม'};
const BY=Object.fromEntries(STYLES.map(s=>[s.c,s]));
const POOL=STYLES.filter(s=>!s.gen);
const FBY=Object.fromEntries(FAULTS.map(f=>[f.k,f]));
const SRM_HEX=['#FFF4C4','#FFE699','#FFD878','#FFCA5A','#FFBF42','#FBB123','#F8A600','#F39C00','#EA8F00','#E58500','#DE7C00','#D77200','#CF6900','#CB6200','#C35900','#BB5100','#B54C00','#B04500','#A63E00','#A13700','#9B3200','#952D00','#8E2900','#882300','#821E00','#7B1A00','#771900','#701400','#6A0E00','#660D00','#5E0B00','#5A0A02','#600903','#520907','#4C0505','#470606','#440607','#3F0708','#3B0607','#3A070B','#36080A'];
const srmHex=v=>SRM_HEX[Math.max(0,Math.min(40,Math.round(v)))];
const INTERVAL=[0,1,2,4,8,16,32];

// ---------- progress store ----------
const blank=()=>({v:1,items:{},days:{},streak:{n:0,last:''},tiers:{},modes:{},prefs:{th:false,sound:true},xp:0,badges:{},best:{combo:0}});
let P=blank(), dbDoc=null, saveT=null, syncMode='local';
const LS='bjcp-daily-flight-v1';
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}}
function merge(a,b){ // keep the richer record per item
  if(!a)return b; if(!b)return a;
  const o=Object.assign(blank(),a,b);
  o.items=Object.assign({},a.items,b.items);
  for(const k in a.items){if(b.items&&b.items[k]&&(a.items[k].t||0)>(b.items[k].t||0))o.items[k]=a.items[k]}
  o.days=Object.assign({},a.days,b.days);
  for(const d in a.days){if(b.days&&b.days[d]){const x=a.days[d],y=b.days[d];o.days[d]=Object.assign({},x,y,{q:Math.max(x.q||0,y.q||0),c:Math.max(x.c||0,y.c||0),sec:Math.max(x.sec||0,y.sec||0),done:!!(x.done||y.done),bd:Array.from(new Set([].concat(x.bd||[],y.bd||[]))),sotd:y.sotd||x.sotd})}}
  o.streak=(a.streak&&b.streak&&(a.streak.last>b.streak.last))?a.streak:(b.streak||a.streak);
  o.tiers=Object.assign({},a.tiers,b.tiers); o.modes=Object.assign({},a.modes,b.modes);
  o.xp=Math.max(a.xp||0,b.xp||0); o.badges=Object.assign({},a.badges,b.badges); o.best={combo:Math.max((a.best||{}).combo||0,(b.best||{}).combo||0)};
  o.prefs=Object.assign({th:false,sound:true},a.prefs,b.prefs);
  return o;
}
function setSync(t){$('#c-sync').textContent=t}
const CFG=window.BJCP_CONFIG||{};
const GAS=CFG.syncUrl||'';
const KEYLS='bjcp-sync-key';
function syncKey(){try{return localStorage.getItem(KEYLS)||''}catch(e){return ''}}
function setSyncKey(k){try{localStorage.setItem(KEYLS,k)}catch(e){}}
(function grabKeyFromUrl(){try{const u=new URL(location.href);const k=u.searchParams.get('k');if(k){setSyncKey(k);u.searchParams.delete('k');history.replaceState(null,'',u.pathname+(u.search||'')+u.hash)}}catch(e){}})();
async function gasGet(){const r=await fetch(GAS+'?key='+encodeURIComponent(syncKey())+'&t='+Date.now());const j=await r.json();if(!j.ok)throw new Error(j.error||'sync');return j.data}
async function gasPut(){const r=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:syncKey(),data:P})});const j=await r.json();if(!j.ok)throw new Error(j.error||'sync');return j}
async function initStore(){
  const local=lsGet(); if(local)P=merge(blank(),local);
  setSync('บันทึกในเครื่องนี้');
  if(GAS){
    if(!syncKey()){setSync('ยังไม่ได้ใส่รหัสซิงก์');return}
    try{setSync('กำลังดึงจาก Google Sheet…');const d=await gasGet();if(d)P=merge(P,merge(blank(),d));
      syncMode='gas';lsSet();renderAll();setSync('ซิงก์ Google Sheet ✓');await gasPut()}
    catch(e){syncMode='gas-off';setSync(String(e.message)==='bad_key'?'รหัสซิงก์ไม่ถูก':'ออฟไลน์ — เก็บในเครื่องไว้ก่อน')}
    return;
  }
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    dbDoc=db.collection('data/users/'+id).doc('progress');
    const snap=await dbDoc.get();
    if(snap.exists){P=merge(P,merge(blank(),snap.data()))}
    syncMode='cloud'; setSync('ซิงก์บัญชี claude.ai'); lsSet(); renderAll();
  }catch(e){setSync('บันทึกในเครื่องนี้')}
}
async function flush(){
  if(syncMode==='gas'||syncMode==='gas-off'){try{await gasPut();syncMode='gas';setSync('ซิงก์ Google Sheet ✓')}catch(e){setSync('ซิงก์ไม่สำเร็จ — เก็บในเครื่องไว้ก่อน')}}
  else if(dbDoc){try{await dbDoc.set(JSON.parse(JSON.stringify(P)));setSync('ซิงก์แล้ว ✓')}catch(e){setSync('ซิงก์ไม่สำเร็จ — เก็บในเครื่องไว้ก่อน')}}
}
function save(){lsSet(); if(!dbDoc&&!syncMode.startsWith('gas'))return; clearTimeout(saveT); saveT=setTimeout(flush,syncMode.startsWith('gas')?4000:1200)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT){clearTimeout(saveT);saveT=null;flush()}});

function tierOf(s){return P.tiers[s.c]||s.tier}
function item(k){return P.items[k]||(P.items[k]={b:0,d:'',ok:0,no:0,t:0})}
function grade(k,ok){
  const it=item(k); it.t=Date.now();
  if(ok){it.ok++;it.b=Math.min(6,it.b+1)}else{it.no++;it.b=1}
  it.d=addDays(today(),INTERVAL[it.b]); save();
}
function modeStat(m,ok){const s=P.modes[m]||(P.modes[m]={c:0,t:0});s.t++;if(ok)s.c++}
function logDay(sec,ok){const d=P.days[today()]||(P.days[today()]={sec:0,q:0,c:0,done:false});d.q++;if(ok)d.c++;}

// ---------- picking ----------
const W={A:.6,B:.3,C:.1};
function pickStyle(exclude=[],pool=POOL){
  const avail=pool.filter(s=>!exclude.includes(s.c));
  const byT={A:[],B:[],C:[]}; avail.forEach(s=>byT[tierOf(s)].push(s));
  let r=Math.random(),t='A';
  const tiers=['A','B','C'].filter(x=>byT[x].length); let tot=tiers.reduce((a,x)=>a+W[x],0);
  for(const x of tiers){r-=W[x]/tot; if(r<=0){t=x;break} t=x}
  const L=byT[t]; const ws=L.map(s=>{const it=P.items['s:'+s.c];return it?(it.b<=1?3:1/it.b):2.5});
  let sum=ws.reduce((a,b)=>a+b,0),x=Math.random()*sum;
  for(let i=0;i<L.length;i++){x-=ws[i];if(x<=0)return L[i]}
  return L[L.length-1];
}
const tagsOf=s=>s.tags.split(',').map(x=>x.trim()).filter(Boolean);
function confusable(s,n,extraExclude=[]){
  const tg=tagsOf(s), fam=tg.find(t=>t.endsWith('-family')), col=tg.find(t=>t.endsWith('-color')), str=tg.find(t=>t.endsWith('-strength'));
  const comp=(s.en['Style Comparison']||'').toLowerCase();
  const sc=POOL.filter(o=>o.c!==s.c&&!extraExclude.includes(o.c)).map(o=>{
    const ot=tagsOf(o);let v=Math.random()*1.5;
    if(fam&&ot.includes(fam))v+=3; if(col&&ot.includes(col))v+=2; if(str&&ot.includes(str))v+=1; if(o.cat===s.cat)v+=2;
    if(comp.includes(o.n.toLowerCase()))v+=2.5; return [v,o]});
  sc.sort((a,b)=>b[0]-a[0]);
  return shuffle(sc.slice(0,Math.max(n+3,7)).map(x=>x[1])).slice(0,n);
}
function twinOf(s){
  const comp=(s.en['Style Comparison']||'').toLowerCase();
  const m=POOL.filter(o=>o.c!==s.c&&o.n.length>4&&comp.includes(o.n.toLowerCase()));
  return m.length?pick(m):confusable(s,1)[0];
}
const GENERIC_WORDS=new Set(['beer','ale','lager','strong','pale','dark','amber','brown','red','golden','light','international','specialty','style','american','english','german','belgian','british','irish','czech','premium','extra','sweet','imperial','double','classic','common','the','and','or','of']);
function mask(text,s,more){
  let t=esc(text); const names=[];[s].concat(more||[]).forEach(st=>{names.push(st.n);st.n.split(/[\s\-]+/).filter(w=>w.length>3&&!GENERIC_WORDS.has(w.toLowerCase())).forEach(w=>names.push(w))});
  names.sort((a,b)=>b.length-a.length).forEach(w=>{const re=new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');t=t.replace(re,'<span class="masked">▢▢▢</span>')});
  return t;
}
function sentences(text){return (text||'').split(/(?<=[.!?])\s+(?=[A-Z“"(])/).map(x=>x.trim()).filter(x=>x.length>28)}
function jac(a,b){const A=new Set(a.toLowerCase().match(/[a-z]+/g)||[]),B=new Set(b.toLowerCase().match(/[a-z]+/g)||[]);let i=0;A.forEach(x=>{if(B.has(x))i++});return i/Math.max(1,A.size+B.size-i)}
function srcTag(kind){return kind==='text'?'<span class="tag src-text">ตัวบท</span>':'<span class="tag src-inf">อนุมาน</span>'}
function thBlock(s,sec){const t=s.th[sec];if(!t)return'';return `<div class="thx" data-th ${P.prefs.th?'':'hidden'}>${esc(t)}</div>`}

// ---------- card generators ----------
// Each card: {mode, key, render(el, done)} ; done(ok)
function mcCard(o){ // o: {mode,key,eyebrow,title,body,options:[html],answer,explain,src}
  return {mode:o.mode,key:o.key,render(el,done){
    el.innerHTML=`<div class="stack">
      <div class="eyebrow">${o.eyebrow}</div>
      <h3>${o.title}</h3>${o.body||''}
      <div class="opts">${o.options.map((x,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]||i+1}</span><span>${x}</span></button>`).join('')}</div>
      <div class="fb"></div></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i, ok=i===o.answer;
      el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===o.answer)x.classList.add('ok')});
      if(!ok)b.classList.add('bad');
      el.querySelector('.fb').innerHTML=fb(ok,o.explain,o.src);
      done(ok);
    });
  }};
}
function fb(ok,explain,src){return `<div class="feedback ${ok?'ok':'bad'}"><div class="verdict">เฉลย</div><div>${explain||''}</div>${src?`<div class="src">${src}</div>`:''}</div>`}
function styleLabel(s){return `<span class="code">${esc(s.c.replace(':',' · '))}</span> ${esc(s.n)}`}
function descBlock(s,sec,maskIt=true){return `<div class="desc"><span class="lab">${sec} · ${SEC_TH[sec]}</span><p>${maskIt?mask(s.en[sec],s):esc(s.en[sec])}</p>${thBlock(s,sec)}</div>`}

// 1) Detective — staged reveal
function detectiveCard(s){
  const opts=shuffle([s].concat(confusable(s,3)));
  return {mode:'detective',key:'s:'+s.c,render(el,done){
    let stage=0, over=false;
    const draw=()=>{
      el.innerHTML=`<div class="stack">
        <div class="eyebrow">นักสืบสไตล์ · เปิดทีละหมวด</div>
        <h3>เบียร์แก้วนี้คือสไตล์อะไร?</h3>
        <div class="stages">${SEC.map((x,i)=>`<span class="${i<=stage?'on':''}">${SEC_TH[x]}</span>`).join('')}</div>
        ${SEC.slice(0,stage+1).map(x=>descBlock(s,x)).join('')}
        <div class="legend">ทายตอนนี้ได้ ${5-stage} คะแนน · ยิ่งทายเร็วยิ่งได้มาก</div>
        <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${styleLabel(o)}</span></button>`).join('')}</div>
        <div class="row">${stage<4?'<button class="btn ghost" id="more">เปิดหมวดถัดไป</button>':''}</div>
        <div class="fb"></div></div>`;
      const m=el.querySelector('#more'); if(m)m.onclick=()=>{stage++;draw()};
      el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        if(over)return; over=true;
        const ok=opts[+b.dataset.i]===s;
        const pts=ok?5-stage:0; stage=4;
        draw(); over=true;
        el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(opts[+x.dataset.i]===s)x.classList.add('ok');if(x.dataset.i===b.dataset.i&&!ok)x.classList.add('bad')});
        const m2=el.querySelector('#more'); if(m2)m2.remove(); el.querySelector('.legend').remove();
        el.querySelectorAll('.masked').forEach(x=>{x.textContent=s.n;x.classList.remove('masked');x.style.fontWeight='600'});
        el.querySelector('.fb').innerHTML=fb(ok,`${ok?`ได้ ${pts} คะแนน · `:''}คำตอบคือ ${styleLabel(s)}<br><span class="muted">ตัวหลอก: ${opts.filter(o=>o!==s).map(o=>esc(o.c+' '+o.n)).join(' · ')}</span>`,`${srcTag('text')} BJCP 2021 Style Guidelines · ${esc(s.c)}`);
        done(ok,{pts});
      });
    };
    draw();
  }};
}

// pick one sentence per section that is distinctive vs others
function secSentence(s,sec,avoid=[]){
  const ss=sentences(s.en[sec]).filter(x=>!avoid.some(a=>jac(a,x)>0.55));
  return ss.length?pick(ss):null;
}
// 2) Scoresheet builder — one card per section
function scoresheetCards(s){
  const others=confusable(s,6);
  return SEC.map(sec=>{
    const right=secSentence(s,sec); if(!right)return null;
    const ownAll=sentences(s.en[sec]);
    const dis=[];for(const o of shuffle(others)){const x=secSentence(o,sec,ownAll.concat(dis.map(d=>d.x),[right]));if(x)dis.push({x,o});if(dis.length===2)break}
    if(dis.length<2)return null;
    const opts=shuffle([{x:right,o:s}].concat(dis));
    return mcCard({mode:'scoresheet',key:'s:'+s.c,eyebrow:`ประกอบ Scoresheet · ${SEC_TH[sec]}`,
      title:`ช่อง <b>${sec}</b> ของ ${styleLabel(s)} ควรเขียนว่าอะไร?`,
      options:opts.map(z=>mask(z.x,s)),answer:opts.findIndex(z=>z.o===s),
      explain:`ข้อความที่ถูกมาจาก ${esc(s.c)} · ${sec}<br><span class="muted">${opts.filter(z=>z.o!==s).map(z=>`ตัวหลอกมาจาก ${esc(z.o.c+' '+z.o.n)}`).join(' · ')}</span>${P.prefs.th&&s.th[sec]?`<div class="thx">${esc(s.th[sec])}</div>`:''}`,
      src:`${srcTag('text')} BJCP 2021 · ${esc(s.c)} ${sec}`});
  }).filter(Boolean);
}
// 3) Twins
function twinCards(s,n=6){
  const w=twinOf(s); if(!w)return [];
  const pool=[];
  [s,w].forEach(st=>SEC.forEach(sec=>sentences(st.en[sec]).forEach(x=>pool.push({x,st,sec}))));
  const chosen=[];
  for(const p of shuffle(pool)){ if(chosen.some(c=>jac(c.x,p.x)>0.45))continue; const other=p.st===s?w:s; if(sentences(other.en[p.sec]).some(y=>jac(y,p.x)>0.5))continue; chosen.push(p); if(chosen.length===n)break}
  const both=[s,w];
  return chosen.map(p=>mcCard({mode:'twins',key:'s:'+p.st.c,eyebrow:`คู่แฝด · ${esc(s.c)} vs ${esc(w.c)}`,
    title:`ประโยคนี้ (${SEC_TH[p.sec]}) เป็นของสไตล์ไหน?`,
    body:`<div class="desc"><span class="lab">${p.sec}</span><p>${mask(p.x,s,[w])}</p></div>`,
    options:both.map(styleLabel),answer:both.indexOf(p.st),
    explain:`มาจาก ${styleLabel(p.st)} · ${p.sec}<div class="desc" style="margin-top:8px"><span class="lab">Style Comparison (${esc(s.c)})</span><p>${esc(s.en['Style Comparison'])}</p>${P.prefs.th?`<div class="thx">${esc(s.th['Style Comparison'])}</div>`:''}</div>`,
    src:`${srcTag('text')} BJCP 2021 · ${esc(p.st.c)} ${p.sec}`}));
}
// 4) Odd one out
function oddCard(s){
  const secs=shuffle(SEC.slice(0,4)).slice(0,3);
  const own=secs.map(sec=>({x:secSentence(s,sec),sec,st:s})).filter(z=>z.x);
  const y=confusable(s,1)[0]; const sec=pick(secs);
  const ox=secSentence(y,sec,sentences(s.en[sec])); if(!ox||own.length<3)return null;
  const opts=shuffle(own.concat([{x:ox,sec,st:y}]));
  return mcCard({mode:'odd',key:'s:'+s.c,eyebrow:'ตัวไหนไม่เข้าพวก',
    title:`3 ประโยคเป็นของ ${styleLabel(s)} — ข้อไหน<b>ไม่ใช่</b>?`,
    options:opts.map(z=>`<span class="tag">${SEC_TH[z.sec]}</span> ${mask(z.x,s)}`),answer:opts.findIndex(z=>z.st===y),
    explain:`ข้อที่ไม่เข้าพวกมาจาก ${styleLabel(y)} (${z2(sec)})`,src:`${srcTag('text')} BJCP 2021 · ${esc(s.c)} / ${esc(y.c)}`});
}
const z2=sec=>sec+' · '+SEC_TH[sec];
// 5) Sliders
function sliderCard(s){
  return {mode:'slider',key:'s:'+s.c,render(el,done){
    const mid=r=>((r[0]+r[1])/2);
    el.innerHTML=`<div class="stack">
      <div class="eyebrow">กะค่า Vital Statistics</div>

      <div class="sl"><label for="sl-srm">สี (SRM) <output id="o-srm">10</output></label><div class="srmbar" id="srmbar" style="background:linear-gradient(90deg,${SRM_HEX.filter((_,i)=>i%2===0).join(',')})"></div><input type="range" id="sl-srm" min="1" max="40" step="1" value="10"><div class="row"><span class="swatch" id="sw-srm" style="width:22px;height:30px"></span><span class="legend">สีจำลองโดยประมาณ (ไม่ใช่ข้อมูลในตัวบท)</span></div></div>

function dueCards(max){

function practiceSet(m,tierF){
  const pool=tierF?POOL.filter(s=>tierOf(s)===tierF):POOL;
  const used=[];const p=()=>{const x=pickStyle(used,pool.length?pool:POOL);used.push(x.c);return x};
  let cards=[];
  if(m==='detective')for(let i=0;i<6;i++)cards.push(detectiveCard(p()));
  if(m==='scoresheet'){cards=scoresheetCards(p()).concat(scoresheetCards(p()))}
  if(m==='twins'){cards=twinCards(p(),5).concat(twinCards(p(),5))}
  if(m==='odd')for(let i=0;i<8;i++){const c=oddCard(p());if(c)cards.push(c)}
  if(m==='slider'){const pool2=pool.filter(s=>s.SRM);for(let i=0;i<6;i++){const x=pickStyle(used,pool2.length?pool2:POOL.filter(s=>s.SRM));used.push(x.c);cards.push(sliderCard(x))}}
  if(m==='clinic')for(let i=0;i<4;i++)cards=cards.concat(clinicCards());
  if(m==='review'){cards=dueCards(20);}
  return cards;
}

    <h3>Off-flavor ที่พลาดบ่อย</h3><div>${weakF.length?weakF.map(([k,v])=>`<div>${esc((FBY[k.slice(2)]||{en:k}).en)} <span class="muted">ผิด ${v.no} · ถูก ${v.ok}</span></div>`).join(''):'<span class="muted">ยังไม่มีข้อมูล</span>'}</div>
    <h2 style="margin-top:12px">การบันทึก</h2>
    <p style="margin:0">${syncMode==='cloud'?'ความคืบหน้าผูกกับบัญชี claude.ai ของคุณ เปิดจากมือถือหรือคอมก็เห็นชุดเดียวกัน':syncMode==='gas'?'ความคืบหน้าซิงก์กับ Google Sheet ของคุณ เปิดจากเครื่องไหนก็ได้ (ใส่รหัสซิงก์ครั้งแรกครั้งเดียวต่อเครื่อง)':'ตอนนี้เก็บในเบราว์เซอร์เครื่องนี้เท่านั้น ใช้รหัสสำรองด้านล่างย้ายข้ามเครื่อง'}</p>
    ${GAS?`<label for="sk" class="muted">รหัสซิงก์ Google Sheet (ใส่ครั้งเดียวต่อเครื่อง)</label><div class="row"><input class="search" id="sk" type="password" autocomplete="off" value="${esc(syncKey())}" style="flex:1;min-width:0"><button class="btn primary" id="sk-go">เชื่อมต่อ</button></div><div class="row"><button class="btn ghost" id="sync-now">ซิงก์ตอนนี้</button><span class="legend" id="skmsg"></span></div>`:''}
    <label for="exp" class="muted">รหัสสำรองความคืบหน้า (คัดลอกไปวางอีกเครื่องได้)</label><textarea id="exp" readonly>${esc(btoa(unescape(encodeURIComponent(JSON.stringify(P)))))}</textarea>
    <div class="row"><button class="btn ghost" id="cp">คัดลอก</button></div>
    <label for="imp" class="muted">วางรหัสจากอีกเครื่องเพื่อรวมความคืบหน้า</label><textarea id="imp" placeholder="วางรหัสที่นี่"></textarea>
    <div class="row"><button class="btn ghost" id="im">รวมเข้าเครื่องนี้</button><span class="legend" id="immsg"></span></div>
    <h2 style="margin-top:12px">ที่มาข้อมูล</h2>
    <div class="legend">${srcTag('text')} คำบรรยายสไตล์ + Vital Statistics: BJCP 2021 Beer Style Guidelines (EN) และฉบับแปลไทย 2024-11-15 · Off-flavor: BJCP Beer Fault List + หนังสือ Beer Faults (TH) โดย SPACEMAN<br>${srcTag('inf')} ระดับความถี่ A/B/C, การจัดกลุ่ม "ไม่ควรมี/ยอมรับระดับต่ำ/ควรมี", ตัวหลอก และสีจำลอง SRM เป็นการจัดของผู้สร้างแอป</div>
  </div>`;
  if(GAS){$('#sk-go').onclick=async()=>{setSyncKey($('#sk').value.trim());$('#skmsg').textContent='กำลังเชื่อมต่อ…';await initStore();$('#skmsg').textContent=syncMode==='gas'?'เชื่อมต่อแล้ว':$('#c-sync').textContent;};
    $('#sync-now').onclick=async()=>{$('#skmsg').textContent='กำลังซิงก์…';await flush();$('#skmsg').textContent=$('#c-sync').textContent}}
  $('#cp').onclick=async()=>{const t=$('#exp');try{await navigator.clipboard.writeText(t.value);$('#cp').textContent='คัดลอกแล้ว'}catch(e){t.select();$('#cp').textContent='เลือกข้อความแล้ว กด Ctrl/⌘+C'}};
  $('#im').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));P=merge(P,o);save();$('#immsg').textContent='รวมแล้ว';setTimeout(viewStats,600)}catch(e){$('#immsg').textContent='รหัสไม่ถูกต้อง ลองคัดลอกใหม่ทั้งก้อน'}};
}
// ---------- boot ----------
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{RUN=null;show(b.dataset.tab)});
setInterval(()=>{if(document.hidden||!RUN)return;const t=today();const d=P.days[t]||(P.days[t]={sec:0,q:0,c:0,done:false});d.sec=(d.sec||0)+1;updateChips();if(d.sec%30===0)save()},1000);
document.getElementById('snd').onclick=()=>{P.prefs.sound=!P.prefs.sound;save();updateChips();if(P.prefs.sound)beep('ok')};
show('today'); initStore();
})();

</script>
</body></html>
