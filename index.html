ละไม่โดดเด่นแบบ American Stout"},"tags":"standard-strength, dark-color, top-fermented, north-america, craft-style, porter-family, bitter, roasty, hoppy","ex":"Anchor Porter, Bell’s Porter, Deschutes Black Butte Porter, Great Lakes Edmund Fitzgerald Porter, Sierra Nevada Porter, Smuttynose Robust Porter","OG":[1.05,1.07],"FG":[1.012,1.018],"IBU":[25.0,50.0],"SRM":[22.0,40.0],"ABV":[4.8,6.5]},{"c":"20B","n":"American Stout","cat":"20","cn":"American Porter and Stout","tier":"A","gen":false,"en":{"Overall Impression":"A fairly strong, highly roasted, bitter, hoppy dark stout. The body and dark flavors typical of stouts with a more aggressive American hop character and bitterness.","Aroma":"Moderate to strong roast aroma, often with a roasted coffee or dark chocolate quality. Burnt or charcoal aromas are acceptable at low levels. Medium to very low hop aroma, often with a citrusy or resiny character. Medium esters optional. Light alcohol optional. Should not seem sharp, acrid, or acidic.","Appearance":"Generally a jet black color, although some may appear very dark brown. Large, persistent head of light tan to light brown in color. Usually opaque.","Flavor":"Moderate to very high roasted flavors, often tasting of coffee, dark or bittersweet chocolate, or roasted coffee beans. May taste of slightly burnt coffee grounds, but this character should not be prominent. Low to medium malt sweetness, often with rich chocolate or caramel flavors. Medium to high bitterness. Low to high hop flavor, generally citrusy or resiny. Medium to dry finish, occasionally with a lightly burnt quality. Low esters optional. Light but smooth alcohol flavor optional.","Mouthfeel":"Medium to full body. Can be somewhat creamy. Can have a bit of roast-derived astringency, but this character should not be excessive. Medium-high to high carbonation. Light to moderately strong alcohol warmth, but smooth and not excessively hot.","Style Comparison":"Like a hoppy, bitter, strongly roasted Irish Extra Stout. Much more roast and body than a Black IPA. Bigger, stronger versions belong in the Imperial Stout style. Stronger and more assertive, particularly in the dark malt or grain additions and hop character, than American Porter."},"th":{"Overall Impression":"Stout สีเข้ม ค่อนข้างแรง มีความคั่วเข้ม ขมและฮอปจัด เนื้อเบียร์และรสคั่วเป็นแบบ Stout แต่มากับความดุดันทางคาแรคเตอร์และความขมจากฮอปสายพันธุ์อเมริกา","Aroma":"กลิ่นคั่วระดับปานกลางถึงเข้ม มักมีคาแรคเตอร์ของกาแฟคั่วหรือดาร์กช็อกโกแลต มีกลิ่นไหม้หรือกลิ่นถ่านได้ถ้าอยู่ในระดับต่ำ กลิ่นฮอปปานกลางถึงต่ำมาก มักมีกลิ่น citrusy หรือ resiny สามารถมี ester แบบปานกลางได้ สามารถมีกลิ่นแอลกอฮอล์อ่อนๆได้ แต่ไม่ควรมีกลิ่นคมฉุน หรือกลิ่นกรด","Appearance":"ทั่วไปแล้วจะเป็นสีดำสนิท (jet black) แม้บางชนิดอาจมีสีออกน้ำตาลเข้มเกือบดำ (very dark brown) มีฟองขนาดใหญ่เกาะแก้วได้ดีสีน้ำตาลจนถึงน้ำตาลอ่อน มักจะทึบแสง","Flavor":"รสคั่วปานกลางถึงสูงมาก มักจะเป็นรสแบบกาแฟ, ช็อคโกแลตเข้ม, ช็อคโกแล็ตหวานปนขมหรือเมล็ดกาแฟคั่ว อาจมีรสไหม้ของกากกาแฟได้เล็กน้อยแต่ไม่ควรจะโดดเด่น มีความหวานจากมอลต์ต่ำถึงปานกลางมักมีรสช็อกโกแลตเข้มข้นหรือคาราเมล มีความขมปานกลางถึงสูง มีรสฮอปในระดับต่ำถึงสูงในแบบ citrusy หรือ resiny จบรสแบบ medium-dry หรือ dry ที่บางทีมาพร้อมความไหม้เล็กน้อย สามารถมี ester ได้เล็กน้อยสามารถมีคาแรคเตอร์ของแอลกอฮอล์ออกมาได้เล็กน้อย","Mouthfeel":"เนื้อเบียร์เป็นแบบปานกลางจนถึงหนา มีความ creamy ได้มีความฝาดเล็กน้อยที่มาจากการคั่วได้แต่คาแรคเตอร์นี้ไม่ควรมากเกินไปมีคาร์โบเนชั่นสูงปานกลางถึงสูง มีความรู้สึกถึงแอลกอฮอล์ได้เล็กน้อยถึงปานกลางแต่ต้องลื่นและไม่รุนแรง","Style Comparison":"เหมือนเบียร์ฮอปจัดที่ขมและคั่วเข้มแบบ Irish Extra Stout มีความคั่วและเนื้อเบียร์หนากว่า Black IPA แรงกว่าและเข้มกว่านี้จะกลายเป็นสไตล์ Imperial Stout สไตล์นี้คือแบบที่แรงกว่าและชัดเจนกว่า American Porter ทั้งในด้านการใช้ grain, การใช้ dark มอลต์และการใช้ฮอป"},"tags":"high-strength, dark-color, top-fermented, north-america, craft-style, stout-family, bitter, roasty, hoppy","ex":"Avery Out of Bounds Stout, Bell’s Kalamazoo Stout, Deschutes Obsidian Stout, Sierra Nevada Stout, Trillium Secret Stairs","OG":[1.05,1.075],"FG":[1.01,1.022],"IBU":[35.0,75.0],"SRM":[30.0,40.0],"ABV":[5.0,7.0]},{"c":"20C","n":"Imperial Stout","cat":"20","cn":"American Porter and Stout","tier":"A","gen":false,"en":{"Overall Impression":"An intensely-flavored, very strong, very dark stout with a broad range of interpretations. Roasty-burnt malt with a depth of dark or dried fruit flavors, and a warming, bittersweet finish. Despite the intense flavors, the components need to meld together to create a complex, harmonious beer, not a hot mess – sometimes only accomplished with age.","Aroma":"Rich, deep, complex, and often quite intense, with a pleasant blend of roast, fruit, hops, and alcohol. Light to moderately strong roast can have a coffee, bittersweet or dark chocolate, cocoa, black licorice, tar, or slightly burnt grain quality, sometimes with a light caramel sweetness or toasty maltiness. Low to moderately strong esters often perceived as dark or dried fruits like plums, prunes, figs, black currants, or raisins. Very low to fairly aggressive hops, often English or American in character. Alcohol flavor optional, but should not be sharp, hot, or solventy. The balance between these main four components can vary greatly; not all need to be noticeable, but those present should have a smooth interplay. Age can add another dimension, including a vinous or port-like impression, but not sourness. Age can decrease aroma intensity.","Appearance":"Color ranges from very dark reddish-brown to jet black. Opaque. Deep tan to dark brown head. Generally has a well-formed head, although head retention may be low to moderate. High alcohol and viscosity may be visible as legs.","Flavor":"Like the aroma, a complex mix of roast, fruit, hops, and alcohol (same descriptors apply). The flavors can be quite intense, often greater than in the aroma, but the same warning about the balance varying greatly still applies. Medium to aggressively high bitterness. The maltiness balances and supports the other flavors, and may have qualities of bread, toast, or caramel. The palate and finish can be fairly dry to moderately sweet, an impression that often changes with age. Should not by syrupy or cloying. Aftertaste of roast, bitterness, and warmth. Same age effects as in the aroma apply.","Mouthfeel":"Full to very full-bodied and chewy, with a velvety, luscious texture. The body and texture may decline with age. Gentle, smooth warmth should be present and noticeable, but as a background character. Low to moderate carbonation.","Style Comparison":"Darker and more roasty than Barleywines, but with similar alcohol. More complex, with a broader range of possible flavors, than lower-gravity stouts."},"th":{"Overall Impression":"รสเข้มข้นและแรงมาก เป็น Stout สีเข้มที่พร้อมให้ผู้ผลิตตีความได้หลากหลาย มอลต์คั่วไหม้ที่มาพร้อมความลึกของผลไม้แห้งหรือผลไม้สีเข้ม ความอุ่น และขมหวานตอนจบ แต่รสชาติที่เข้มต้องมาจากส่วนประกอบที่ผสมผสานกันจนเกิดความซับซ้อน กลมกลืน ไม่ยุ่งเหยิง บางครั้งต้องใช้เวลาบ่มถึงจะออกมาสมบูรณ์","Aroma":"เข้ม ลึก ซับซ้อน และค่อนข้างเข้มข้น ด้วยการผสมผสานที่ลงตัวของความคั่ว ผลไม้ ฮอป และแอลกอฮอล์ กลิ่นคั่วแบบอ่อนถึงเข้มปานกลางสามารถพบกาแฟ ความขมอมหวานหรือ dark chocolate, cocoa, black licorice, tar หรือกลิ่นคั่วจากวัตถุดิบ ที่บางครั้งจะมาพร้อมความหวานบางๆจาก caramel หรือกลิ่นมอลต์แบบ toasty กลิ่น ester แบบอ่อนถึงเข้มปานกลางที่ออกมาในแนวผลไม้แห้งหรือผลไม้สีเข้ม เช่น plum, prune, fig, black currant หรือ raisin กลิ่นฮอปสามารถมีได้ตั้งแต่ต่ำจนถึงค่อนข้างดุดัน มักจะใช้ฮอปที่ให้คาแรคเตอร์แบบ English หรือ American สามารถมีกลิ่นแอลกอฮอล์ได้แต่ห้ามบาด ร้อนหรือออกเป็นกลิ่น solvent ความสมดุลระหว่างองค์ประกอบหลักทั้ง 4 ชนิดอาจแตกต่างกันได้อย่างมาก ไม่จำเป็นต้องออกมาทั้งหมด แต่สิ่งเหล่านี้ควรผสมกันออกมาแล้วราบรื่น การบ่มเอาไว้สามารถเพิ่มมิติของเบียร์ได้ในแบบ vinous หรือ port-like แต่ห้ามออกมาเปรี้ยว การบ่มเอาไว้สามารถลดความเข้มข้นของกลิ่นได้","Appearance":"สีเบียร์มีตั้งแต่น้ำตาลแดงเข้ม (very dark reddish- brown) จนถึงดำสนิท (jet black) ทึบแสง ฟองสีน้ำตาลอ่อนจนถึงน้ำตาลเข้ม โดยทั่วไปฟองจะขึ้นรูปดี แม้ว่าจะคงอยู่กับแก้วได้น้อยถึงปานกลางตัวอย่างที่แอลกอฮอล์สูงและหนืดอาจมี leg ให้เห็นได้","Flavor":"มาในรูปแบบเดียวกับอโรม่า ผสมผสานความซับซ้อนของกลิ่นคั่วผลไม้ ฮอป และแอลกอฮอล์ที่ซับซ้อน (แบบที่อธิบายไป) รสชาติอาจค่อนข้างเข้มข้น มักจะชัดกว่าอโรม่า แต่ต้องใช้ความสมดุลในความหลากหลายแบบเดียวกัน ความขมปานกลางถึงรุนแรง มีมอลต์ในแบบสมดุลและสนับสนุนรสอื่นๆ อาจพบคาแรคเตอร์ในแบบ bread, toast หรือ caramel การรับรสและรสตอนจบจะหวานปานกลางจนถึง dry ปานกลาง และจะเปลี่ยนไปเมื่อเบียร์ผ่านการบ่ม ไม่ควรมีรสแบบน้ำเชื่อมหรือหวานเหนียว aftertaste จะเป็นแบบ คั่ว ขม และอุ่น การบ่มจะมีผลในแบบที่เกิดกับอโรม่า","Mouthfeel":"เนื้อเบียร์หนาถึงหนามากๆ เต็มปากเต็มคำ พร้อมด้วยเนื้อสัมผัสที่นุ่มละมุนลิ้น เนื้อเบียร์และรสสัมผัสอาจลดลงตามอายุที่บ่มไว้ ควรดื่มแล้วอบอุ่นนุ่มนวลอย่างชัดเจน แต่ควรมาเป็นคาแรคเตอร์เสริม มีคาร์โบเนชั่นต่ำถึงปานกลาง","Style Comparison":"เข้มและคั่วเข้มกว่า Barleywine แต่มีแอลกอฮอล์ใกล้เคียงกัน ซับซ้อนกว่าด้วยรสชาติที่หลากหลาย มากกว่า Stout ในแบบที่เบากว่านี้"},"tags":"very-high-strength, dark-color, top-fermented, british-isles, north-america, traditional-style, craft-style, stout-family, malty, bitter, roasty","ex":"American – Bell’s Expedition Stout, Great Divide Yeti Imperial Stout, North Coast Old Rasputin Imperial Stout, Oskar Blues Ten Fidy, Sierra Nevada Narwhal Imperial Stout; English – 2SP Brewing Co The Russian, Courage Imperial Russian Stout, Le Coq Imperial Extra Double Stout, Samuel Smith Imperial Stout, Thornbridge Saint Petersburg","OG":[1.075,1.115],"FG":[1.018,1.03],"IBU":[50.0,90.0],"SRM":[30.0,40.0],"ABV":[8.0,12.0]},{"c":"21A","n":"American IPA","cat":"21","cn":"IPA","tier":"A","gen":false,"en":{"Overall Impression":"A decidedly hoppy and bitter, moderately strong, pale American ale. The balance is hop- forward, with a clean fermentation profile, dryish finish, and clean, supporting malt allowing a creative range of hop character to shine through.","Aroma":"A prominent to intense hop aroma often featuring American or New World hop characteristics, such as citrus, floral, pine, resin, spice, tropical fruit, stone fruit, berry, or melon. Low to medium-low clean, grainy maltiness supports the hop presentation. Generally clean fermentation profile, but light fruitiness acceptable. Restrained alcohol optional.","Appearance":"Color ranging from medium gold to light reddish-amber. Clear, but light haze allowable. Medium-sized, white to off-white head with good persistence.","Flavor":"Medium to very high hop flavor (same descriptors as aroma). Low to medium-low clean and grainy maltiness, possibly with light caramel and toast flavors. Medium-high to very high bitterness. Dry to medium-dry finish. Hoppy, bitter aftertaste with supportive malt. Low esters optional. Background clean alcohol flavor optional.","Mouthfeel":"Medium-light to medium body, with a smooth texture. Medium to medium-high carbonation. No harshness. Very light, smooth warmth optional.","Style Comparison":"Stronger and more highly hopped than American Pale Ale. Compared to English IPA, has less caramel, bread, and toast; often more American or New World hops; fewer yeast-derived esters; less body and often a more hoppy balance; and is slightly stronger than most examples. Less alcohol than a Double IPA, but with a similar balance."},"th":{"Overall Impression":"เบียร์ที่เด็ดขาดด้านกลิ่นฮอปและความขม มีความแรงปานกลาง เป็นเบียร์เอลสไตล์อเมริกันที่มีสีอ่อน เป็นเบียร์แบบสมดุลที่มีฮอปเป็นตัวนำ มีโปรไฟล์การหมักที่สะอาด จบรสในแบบ dry ผสมผสานด้วยการใช้มอลต์เพื่อเพิ่มมิติและสนับสนุนให้ฮอปเปล่งประกาย","Aroma":"ด้วยฮอปที่เข้มข้นและโดดเด่น จากการใช้คาแรคเตอร์ของอเมริกันฮอปและฮอปโลกใหม่ เช่น citrus, floral, pine, resin, spice, tropical fruit, stone fruit, berry หรือ melon มีกลิ่น malty grainy ต่ำถึงต่ำปานกลางที่มาช่วยเสริมจุดเด่นของฮอป ทั่วไปจะมีโปรไฟล์การหมักที่สะอาด แต่ยอมให้หลงเหลือความ fruity ในระดับต่ำไว้ได้ สามารถควบคุมคาแรคเตอร์แอลกอฮอล์","Appearance":"มีช่วงสีจากสีทองปานกลาง (medium gold) จนไปถึงสีแดงอำพันอ่อนๆ (light reddish-amber) เนื้อเบียร์ต้องใส แต่อาจจะยอมให้มีความขุ่นบางๆได้ ฟองขนาดกลางสีขาวจนถึงขาวขุ่น ฟองเกาะอยู่กับแก้วได้ดี","Flavor":"มีรสฮอปปานกลางไปจนถึงหนัก (รสชาติในแบบเดียวกับที่อธิบายไปในอโรม่า) มีความ malty grainy ที่สะอาดในแบบต่ำหรือต่ำปานกลาง อาจจะมีรสของ caramel บางๆและ toast ได้บ้าง มีความขมสูงปานกลางจนถึงสูงมากๆ รสจบแบบ medium-dry จนถึง dry มีความ Hoppy, Bitter ใน aftertaste ที่มีมอลต์มาช่วยเสริม สามารถมี ester ในระดับต่ำได้ และอาจจะมีรสของแอลกอฮอล์ออกมาได้บ้าง","Mouthfeel":"เนื้อเบียร์แบบบางปานกลางจนถึงปานกลาง นุ่มลื่น มีคาร์โบเนชั่นปานกลางจนถึงสูงปานกลาง ไม่มีรสกระด้าง บางเบา นุ่มลื่นสามารถพบความอุ่นจากแอลกอฮอล์ได้","Style Comparison":"แรงและมีฮอปหนักแน่นกว่า American Pale Ale จะมีความ caramel, bread, toast น้อยกว่าเมื่อเทียบกับ English IPA นิยมการใช้ American ฮอปและฮอปโลกใหม่ ester จากยีสต์ต้องน้อย มีเนื้อเบียร์บางแต่มีความสมดุลจากฮอป และมีความเข้มข้นสูงกว่าตัวอย่างส่วนใหญ่เล็กน้อย มีแอลกอฮอล์ต่ำกว่า Double IPA แต่มีความสมดุลที่คล้ายกัน"},"tags":"high-strength, pale-color, top-fermented, north-america, craft-style, ipa-family, bitter, hoppy","ex":"Bell’s Two-Hearted Ale, Cigar City Jai Alai, Fat Heads Head Hunter IPA, Firestone Walker Union Jack, Maine Lunch, Russian River Blind Pig IPA","OG":[1.056,1.07],"FG":[1.008,1.014],"IBU":[40.0,70.0],"SRM":[6.0,14.0],"ABV":[5.5,7.5]},{"c":"21B","n":"Specialty IPA","cat":"21","cn":"IPA","tier":"C","gen":true,"en":{"Overall Impression":"Recognizable as an IPA by balance – a hop-forward, bitter, dryish beer – with something else present to distinguish it from the standard categories. Should have good drinkability, regardless of the form. Excessive harshness and heaviness are typically faults, as are strong flavor clashes between the hops and the other specialty ingredients.","Aroma":"Detectable hop aroma is required; characterization of hops is dependent on the specific type of Specialty IPA. Other aromatics may be present; hop aroma is typically the strongest element.","Appearance":"Color depends on specific type of Specialty IPA. Most should be clear, but a slight haze is acceptable in most styles. Darker types can be opaque, making clarity irrelevant. Good, persistent head stand with color dependent on the specific type of Specialty IPA.","Flavor":"Variable by type, with the quality of each component dependent on the specific Specialty IPA. Hop flavor typically medium-low to high. Hop bitterness typically medium-high to very high. Malt flavor generally low to medium. Commonly has a medium-dry to dry finish. Some clean alcohol flavor can be noted in stronger versions. Various types of Specialty IPAs can show additional malt and yeast characteristics, depending on the type.","Mouthfeel":"Smooth. Medium-light to medium body. Medium carbonation, generally. A background alcohol warmth can be perceived in stronger versions.","Style Comparison":""},"th":{"Overall Impression":"IPA ถูกจดจำในด้านความสมดุล - มีฮอปนำ มีความขมและรสจบในปากแบบไม่ทิ้งความหวาน – ถ้ามี IPA แบบอื่นที่แตกต่างออกจากหมวดหมู่ IPA มาตรฐาน ควรจะดื่มได้ดีโดยไม่คำนึงถึงรูปแบบ -- ความกระด้างและความหนักที่มากเกินไปมักจะไม่ถูกต้องเช่นเดียวกับการเกิดรสชาติที่ขัดกันระหว่างฮอปกับส่วนผสมพิเศษอื่นๆ","Aroma":"ต้องรับรู้ถึงกลิ่นฮอปได้ ลักษณะของฮอปขึ้นอยู่กับประเภทเฉพาะของ Specialty IPA สามารถมีอโรม่าอื่นๆได้ แต่กลิ่นของฮอปจะเป็นองค์ประกอบที่เด่นที่สุด","Appearance":"สีจะขึ้นอยู่กับประเภทของ Specialty IPA โดยทั่วไปต้องใส แต่ก็ยอมรับความขุ่นเล็กน้อยได้ในสไตล์ส่วนใหญ่ ประเภทที่สีเข้มกว่าอาจมีความทึบแสง ฟองต้องคงอยู่กับแก้วได้ดี สีของฟองขึ้นอยู่กับประเภทเฉพาะของ Specialty IPA","Flavor":"แตกต่างตามชนิด คุณภาพจะขึ้นกับวัตถุดิบต่างๆที่ใส่ลงไปขึ้นอยู่ว่าจะเป็น Special IPA แบบไหน รสชาติจากฮอปมักจะอยู่ที่ระดับสูงปานกลางจนถึงสูง ความขมจากฮอปก็จะอยู่ที่ระดับสูงปานกลางจนถึงสูงมาก รสจากมอลต์จะอยู่ที่ปานกลางถึงต่ำ โดยทั้วไปเนื้อเบียร์จะจบในปากแบบ dry หรือหวานน้อย จะรู้สึกถึงแอลกอฮอล์บ้างถ้าเป็นเบียร์ที่แรง Special IPA แต่ละชนิดจะแสดงถึงลักษณะของมอลต์และยีสต์ ขึ้นอยู่กับสไตล์","Mouthfeel":"นุ่มนวล มีเนื้อเบียร์ปานกลางจนถึงบางปานกลาง มีคาร์โบเนชั้นปานกลาง อาจจะพบคาแรคเตอร์ของแอลกอฮอล์ในแบบที่แรงกว่า","Style Comparison":""},"tags":"","ex":"","ABV":[3.0,5.0]},{"c":"21B:Belgian IPA","n":"Belgian IPA","cat":"21","cn":"IPA","tier":"B","gen":false,"en":{"Overall Impression":"A dry, hoppy IPA with fruitiness and spiciness of Belgian yeast. Often lighter in color and more attenuated, similar to a Belgian Tripel that has been brewed with more hops.","Aroma":"Moderate to high hop aroma, often reflecting the character of American or New World hops (tropical, melon, stone fruit, citrus, piney, etc.) or Continental hops (spicy, herbal, floral, etc.), possibly with a light dry-hop note. Gentle malt sweetness, sometimes with a sugary or honey character, but rarely caramel. Moderate to high esters, often pears, apples, citrus, or banana. Light spice, clove or pepper, optional. Light alcohol aroma optional.","Appearance":"Light golden to amber in color. Moderate to large off-white head with good retention. Good to quite hazy clarity.","Flavor":"Moderate fruity and spicy flavors, same descriptors as aroma. Moderate to high hop flavor, same descriptors as aroma. Light, relatively neutral grainy malt flavor, optionally with low toast, caramel, or honey. Moderate to high bitterness. Dry to medium-dry finish that often accentuates the perception of bitterness. Aftertaste has a lingering bitterness but is not harsh.","Mouthfeel":"Light to medium body. Medium to high carbonation level, which can lighten the impression of body. Light warmth optional.","Style Comparison":"A cross between an American IPA or Double IPA with a Belgian Golden Strong Ale or Belgian Tripel. This style is may be spicier, stronger, drier, and fruitier than an American IPA."},"th":{"Overall Impression":"เป็น IPA ที่ dry เด่นที่ฮอปมากับความ fruity spicy จากยีสต์ของเบลเยี่ยม มักจะมีสีอ่อน ยีสต์จัดการน้ำตาลได้มากคล้ายกับสไตล์ Belgian Tripel ที่มีฮอปมากกว่า","Aroma":"กลิ่นของฮอปอยู่ในระดับปานกลางจนถึงสูง ที่พบบ่อยคือคาแรคเตอร์ในแบบอเมริกันฮอปและฮอปโลกใหม่ (tropical, melon, stone fruit, citrus, piney, และอื่นๆ) หรือ Continental ฮอป (spicy, herbal, floral, และอื่นๆ) พบคาแรคเตอร์ของฮอปบางๆจากการ Dry-hop ได้ มีความหอมหวานจากมอลต์แบบนุ่มนวลและบางทีจะมีลักษณะจากน้ำตาลและน้ำผึ้งมาผสม แต่แบบคาราเมลไม่ค่อยนิยม มี esters แบบปานกลางจนถึงสูงในแบบ pears, apples, citrus, หรือ banana สามารถพบ spice, clove หรือ pepper ได้ในระดับต่ำ สามารถพบคาแรคเตอร์จากแอลกอฮอล์ได้ในระดับต่ำ","Appearance":"สีทองอ่อน (light gold) จนไปถึงสีอำพัน (amber) ฟองขนาดกลางจนถึงขนาดใหญ่สีขาวนวล ฟองเกาะขอบแก้วได้ดี สีจะออกขุ่น","Flavor":"มีรส fruity และ spicy แบบปานกลาง ใช้คำอธิบายเดียวกันกับอโรม่า มีรสชาติฮอปในระดับปานกลางจนถึงสูงใช้คำอธิบายเดียวกันกับอโรม่า มีรสมอลต์ในระดับต่ำในแบบ grainy malty ที่ให้รสเป็นกลาง บางทีอาจจะพบความ toast, caramel หรือ honey บ้าง มีความขมปานกลางถึงสูง รสจบในปากแบบ medium-dry จนถึง dry ที่ช่วยเน้นการรับรสขม aftertaste จะขมลากยาวแต่ไม่บาด","Mouthfeel":"เนื้อเบียร์ปานกลางจนถึงบาง คาร์โบเนชั้นปานกลางจนถึงสูงซึ่งจะช่วยชูการรับรสจากเนื้อเบียร์ อาจจะพบเนื้อเบียร์บางและพบความอุ่นจากแอลกอฮอล์ได้","Style Comparison":"ลูกผสมระหว่าง American IPA หรือ Double IPA กับ Belgian Golden Strong Ale หรือ Belgian Tripel สไตล์นี้อาจจะมีความ spicy มากขึ้น แรงขึ้น dry และ fruity กว่า American IPA"},"tags":"high-strength, pale-color, top-fermented, north-america, craft-style, ipa-family, specialty-family, bitter, hoppy","ex":"Brewery Vivant Triomphe, Green Flash Le Freak, Houblon Chouffe, Urthel Hop It","OG":[1.058,1.08],"FG":[1.008,1.016],"IBU":[50.0,100.0],"SRM":[5.0,8.0],"ABV":[6.2,9.5]},{"c":"21B:Black IPA","n":"Black IPA","cat":"21","cn":"IPA","tier":"B","gen":false,"en":{"Overall Impression":"A beer with the dryness, hop-forward balance, and flavor characteristics of an American IPA, but darker in color. Darker malts add a gentle and supportive flavor, not a strongly roasted or burnt character.","Aroma":"Moderate to high hop aroma, often with a stone fruit, tropical, citrusy, resinous, pine, berry, or melon character. Very low to moderate malt, possibly with light chocolate, coffee, or toast notes, as well as a background caramel sweetness. Clean fermentation profile, but light esters acceptable.","Appearance":"Dark brown to black color. Clear, if not opaque. Light haze allowable, but should not be murky. Light tan to tan head, moderate size, persistent.","Flavor":"Medium-low to high hop flavor, same descriptors as aroma. Low to medium malt flavor, with restrained chocolate or coffee notes, but not burnt or ashy. The roasted notes should not clash with the hops. Light caramel or toffee optional. Medium-high to very high bitterness. Dry to slightly off-dry finish, with a bitter but not harsh aftertaste, often with a light roast flavor that can contribute to the dry impression. Low to moderate esters optional. Background alcohol flavor optional.","Mouthfeel":"Smooth. Medium-light to medium body. Medium carbonation. Light creaminess optional. Light warmth optional.","Style Comparison":"Balance and overall impression of an American or Double IPA with restrained roast similar to the type found in Schwarzbier. Not as rich and roasty as American Stout and Porter, and with less body and increased smoothness and drinkability."},"th":{"Overall Impression":"เบียร์ที่ dry มีฮอปนำแบบสมดุล มีคาแรคเตอร์และรสชาติของฮอปจาก American IPA แต่มีสีเข้มกว่า มอลต์สีเข้มช่วยเสริมรสชาติแบบอ่อนโยนและน่าดื่ม ไม่มีกลิ่นคั่วหรือไหม้ที่รุนแรง","Aroma":"มีกลิ่นฮอปในระดับปานกลางถึงสูง มักมีกลิ่นแบบ stone fruit , tropical, citrusy, resin, pine, berry, หรือ melon มีกลิ่นมอลต์ต่ำมากจนถึงปานกลาง อาจพบกลิ่น light chocolate, coffee, หรือ toast รวมกับความหวานจาก caramel มาสนับสนุน มีโปรไฟล์การหมักที่สะอาด แต่ยอมรับ ester ที่เหลือบางๆได้","Appearance":"สีน้ำตาลเข้ม (dark brown) ถึงสีดำ (black) เนื้อเบียร์ใสถ้าไม่ทึบแสง ยอมรับความขุ่นได้เล็กน้อย แต่ไม่ควรทึบ ฟองสีน้ำตาลอ่อนถึงสีน้ำตาล ขนาดปานกลาง ฟองคงอยู่บนแก้วได้ดี","Flavor":"มีรสฮอปในระดับต่ำปานกลางถึงสูง ใช้คำอธิบายเดียวกันกับอโรม่า รสมอลต์ต่ำถึงปานกลาง มีรสช็อกโกแลตหรือกาแฟที่ถูกควบคุมไว้แต่ไม่ควรเป็นแบบไหม้หรือขี้เถ้า ความคั่วไม่ควรขัดกับฮอป สามารถมีรสคาราเมลหรือทอฟฟี่บางๆ มีความขมปานกลางถึงสูงมาก มีความ dry เล็กน้อยจนถึง dry มีรสขมใน aftertaste ที่ไม่หยาบกระด้าง มักมาในแบบรสคั่วอ่อนๆที่ช่วยสนับสนุนความ dry สามารถมี ester แบบบางจนถึงปานกลางได้ อาจจะพบรสจากแอลกอฮอล์ได้","Mouthfeel":"นุ่มลื่น มีเนื้อเบียร์บางปานกลางถึงปานกลาง มีคาร์โบเนชั่นปานกลาง มีความ creamy บางๆได้ อาจจะพบความอุ่นจากแอลกอฮอล์เล็กน้อยได้","Style Comparison":"มีความสมดุลและความประทับใจเหมือน American IPA หรือ Double IPA พร้อมความคั่วที่ไม่มากมาย ที่คล้ายกับใน Schwarzbier ไม่เข้มและคั่วหนักเหมือน American Stout และ Porter ด้วยเบียร์ที่เบาทำให้เพิ่มความลื่นพร้อมเพิ่มความสามารถในการดื่ม"},"tags":"high-strength, dark-color, top-fermented, north-america, craft-style, ipa-family, specialty-family, bitter, hoppy","ex":"21st Amendment Back in Black, Duck-Rabbit Hoppy Bunny ABA, Stone Sublimely Self- Righteous Black IPA","OG":[1.05,1.085],"FG":[1.01,1.018],"IBU":[50.0,90.0],"SRM":[25.0,40.0],"ABV":[5.5,9.0]},{"c":"21B:Brown IPA","n":"Brown IPA","cat":"21","cn":"IPA","tier":"C","gen":false,"en":{"Overall Impression":"Hoppy, bitter, and moderately strong like an American IPA, but with dark caramel, chocolate, toffee, or dark fruit character as in an American Brown Ale. Retaining the dryish finish and lean body that makes IPAs so drinkable, a Brown IPA is a little more flavorful and malty than an American IPA without being sweet or heavy.","Aroma":"Moderate to moderately-high hop aroma, often with a stone fruit, tropical fruit, citrus, resin, pine, berry, or melon character. Medium-low to medium malty-sweet aroma mixes in well with the hop selection, and often features milk chocolate, cocoa, toffee, nuts, biscuits, dark caramel, toasted bread, or dark fruit character. Clean fermentation profile. Light esters optional. Light alcohol aroma optional.","Appearance":"Color ranging from reddish-brown to dark brown but not black. Clear, if not opaque. Light haze optional. Medium-sized, cream-colored to tan head นกลางจนถึงบางปานกลาง มีสัมผัสที่นุ่มลื่น มีคาร์โบเนชั่นปานกลางถึงสูงปานกลาง ไม่มีความกระด้าง สามารถพบความอุ่นจากแอลกอฮอล์แบบบางๆได้","Style Comparison":"รูปแบบที่แรงขึ้น มีฮอปมากขึ้น และขมขึ้นของ American Amber Ale ไม่ malty และหวานแบบ American Strong Ale มีความ dry กว่า มีแอลกอฮอล์น้อยกว่าและไม่ malty แบบ American Barleywine มีคาแรคเตอร์ของ chocolate และ caramel น้อยกว่า Brown IPA แต่ต้องสมดุลเหมือนกัน"},"tags":"high-strength, amber-color, top-fermented, north-america, craft-style, ipa-family, specialty-family, bitter, hoppy","ex":"Avery Hog Heaven, Cigar City Tocobaga Red IPA, Modern Times Blazing World, Tröegs Nugget Nectar","OG":[1.056,1.07],"FG":[1.008,1.016],"IBU":[40.0,70.0],"SRM":[11.0,17.0],"ABV":[5.5,7.5]},{"c":"21B:Rye IPA","n":"Rye IPA","cat":"21","cn":"IPA","tier":"B","gen":false,"en":{"Overall Impression":"An American IPA with spicy, grainy rye malt. The rye gives a bready and peppery flavor, a creamier body, and a dry, grainy finish.","Aroma":"Prominent to intense hop aroma, often with a stone fruit, tropical fruit, citrus, resin, pine, berry, or melon character. Low peppery rye malt aroma, along with a clean, background grainy maltiness. Clean fermentation profile. Light esters optional. Light alcohol aroma optional.","Appearance":"Color ranging from medium gold to light reddish-amber. Clear. Light haze optional. Medium-sized, white to off-white head with good persistence.","Flavor":"Medium to very high hop flavor, same descriptors as aroma. Low to medium-low clean, supportive malt possibly with light caramel or toast flavors. Low to moderate grainy, peppery, spicy rye flavor that adds to the dry finish. Medium- high to very high bitterness, no harshness. Dry, bitter, hoppy aftertaste. Low esters optional. Background alcohol flavor optional.","Mouthfeel":"Medium-light to medium body. Smooth texture, may be lightly creamy. Medium to medium-high carbonation. No harshness. Low warmth optional.","Style Comparison":"Drier, slightly spicier, and slightly creamier than an American IPA, with more of a lingering bitterness and spiciness in the finish. Does not have the intense rye malt or Weizen yeast character of a Roggenbier."},"th":{"Overall Impression":"เป็น American IPA ที่มีความ spicy, grainy จากมอลต์ข้าวไรย์ ที่ให้รส bready และ peppery มีเนื้อเบียร์แบบครีมมี่ จบรสแบบ dry และ grainy","Aroma":"มีกลิ่นฮอปที่โดดเด่น เข้มข้น ที่มาในคาแรคเตอร์ stone fruit, tropical fruit, citrus, resin, pine, berry, หรือ melon มีกลิ่นมอลต์แบบ peppery จากมอลต์ข้าวไรย์แบบอ่อนๆ พร้อมด้วยกลิ่นมอลต์แบบสะอาดที่มาเสริม มีโปรไฟล์การหมักที่สะอาด สามารถมี esters เล็กน้อยได้สามารถมีคาแรคเตอร์ของแอลกอฮอล์แบบอ่อนๆได้","Appearance":"สีพบได้ตั้งแต่สีทองปานกลาง (medium gold) จนถึงสีเหลืองอำพันอ่อน (light reddish-amber) เนื้อเบียร์ใส อาจจะขุ่นได้เล็กน้อยฟองมีขนาดกลาง สีขาวขุ่นถึงสีครีม ฟองเกาะอยู่กับแก้วได้ดี","Flavor":"มีรสฮอปปานกลางถึงสูง ใช้คำอธิบายเดียวกันกับอโรม่า มีความ malty ที่สะอาดในระดับต่ำจนถึงต่ำปานกลางในแบบ caramel หรือ toast มาเสริม มีรสมอลต์ในระดับต่ำจนถึงปานกลางในแบบ grainy, peppery, spicy จากมอลต์ข้าวไรน์ที่ผสมกันในการจบรสแบบ dry มีความขมในระดับสูงปานกลางจนถึงสูงมาก ไม่มีความกระด้าง มีความ dry มีความขมและมีฮอปใน aftertaste สามารถมี esters ในระดับต่ำได้ สามารถมีคาแรคเตอร์ของแอลกอฮอล์แบบอ่อนๆได้","Mouthfeel":"เนื้อเบียร์ปานกลางจนถึงบางปานกลาง ให้ความรู้สึกนุ่มลื่นรู้สึกได้ถึงความ creamy บางๆ มีคาร์โบเนชั่นปานกลางถึงสูงปานกลาง ไม่มีความกระด้าง สามารถพบความอุ่นจากแอลกอฮอล์แบบบางๆได้","Style Comparison":"มีความ dry กว่า มีความ spicy มากกว่าและ creamy มากกว่า American IPA ที่มีความขมและความ spicy ที่ลากยาวในตอนจบ ไม่ควรมีความเข้มข้นเกินไปจากมอลต์ข้าวไรน์หรือจากยีสต์ weizen แบบคาแรคเตอร์แบบ Roggenbier"},"tags":"high-strength, amber-color, top-fermented, north-america, craft-style, ipa-family, specialty-family, bitter, hoppy","ex":"Founders Red’s Rye IPA, Sierra Nevada Ruthless Rye","OG":[1.056,1.075],"FG":[1.008,1.014],"IBU":[50.0,75.0],"SRM":[6.0,14.0],"ABV":[5.5,8.0]},{"c":"21B:White IPA","n":"White IPA","cat":"21","cn":"IPA","tier":"B","gen":false,"en":{"Overall Impression":"A fruity, spicy, refreshing version of an American IPA, but with a lighter color, less body, and featuring the distinctive yeast or spice additions typical of a Witbier.","Aroma":"Moderate esters, often orange, grapefruit, apricot, or sometimes banana. Light spices optional, usually coriander, orange peel, pepper, or clove. Medium-low to medium hop aroma, often stone fruit, citrus, or tropical fruit. Esters and spices may reduce perception of hop aroma. Low neutral, grainy, or bready malt. Light alcohol aroma optional.","Appearance":"Pale to deep golden color. Typically hazy. Moderate to large, dense white head that persists.","Flavor":"Moderate to high esters, medium-low to medium-high hop flavor, and light spices, all with the same descriptors as aroma. Light malt flavor, perhaps a bit bready. High bitterness. Moderately dry, refreshing finish. Background alcohol flavor optional.","Mouthfeel":"Medium-light body. Medium to medium-high carbonation. Light spice astringency optional. Low warmth optional.","Style Comparison":"Bitter, hoppy, and stronger like an American IPA but fruity, spicy, and light like a Witbier. Typically late hops are not as prominent as in American IPA."},"th":{"Overall Impression":"American IPA แบบที่มีความ fruity, spicy และสดชื่น แต่มีสีอ่อนกว่า เนื้อเบียร์บางกว่า และมีส่วนผสมของยีสต์หรือเครื่องเทศที่โดดเด่นตามแบบฉบับของ Witbier","Aroma":"มี esters แบบปานกลาง มักจะมาในแบบ orange, grapefruit, apricot หรือบางทีเป็นกล้วย มีกลิ่นจากเครื่องเทศอ่อนๆได้ มักจะมาในแบบ coriander, orange peel, pepper หรือ clove มีกลิ่นฮอปในระดับปานกลางถึงต่ำปานกลาง มักเป็นแนว stone fruit, citrus หรือ tropical fruit แต่ esters และเครื่องเทศอาจลดการรับรู้ในฮอป มีกลิ่นมอลต์แบบกลางๆ ในระดับต่ำในแบบ grainy หรือ bready สามารถมีคาแรคเตอร์ของแอลกอฮอล์แบบอ่อนๆได้","Appearance":"สีอ่อน (pale) ถึงสีทองเข้ม (deep gold) มักจะขุ่น มีฟองขนาดปานกลางจนถึงใหญ่ สีขาว หนา ฟองเกาะอยู่กับแก้วได้ดี","Flavor":"มี esters ในระดับปานกลางจนถึงสูง มีรสฮอปในระดับต่ำปานกลางจนถึงสูงปานกลาง มีรสเครื่องเทศอ่อนๆ ใช้คำอธิบายเดียวกันกับอโรม่า มีรสมอลต์อ่อนๆในแบบ bready มีความขมสูง จบรสในแบบ medium dry แบบสดชื่น สามารถมีคาแรคเตอร์ของแอลกอฮอล์บางๆได้","Mouthfeel":"มีเนื้อเบียร์บางปานกลาง มีคาร์โบเนชั่นปานกลางจนถึงสูงปานกลาง สามารถพบความฝาดจากเครื่องเทศบางๆได้ สามารถพบความอุ่นจากแอลกอฮอล์แบบบางๆได้","Style Comparison":"ขมและฮอปจัด มีความแรงเหมือน American IPA แต่มีความ fruity, spicy และบางเหมือน Witbier การใส่ฮอปช่วง late-hop จะไม่โดดเด่นแบบที่ใช้ใน American IPA"},"tags":"high-strength, pale-color, top-fermented, north-america, craft-style, ipa-family, specialty-family, bitter, hoppy, spice","ex":"Lagunitas A Little Sumpin' Sumpin' Ale, New Belgium Accumulation","OG":[1.056,1.065],"FG":[1.01,1.016],"IBU":[40.0,70.0],"SRM":[5.0,6.0],"ABV":[5.5,7.0]},{"c":"21B:Brut IPA","n":"Brut IPA","cat":"21","cn":"IPA","tier":"C","gen":false,"en":{"Overall Impression":"A very pale, hop-forward American IPA variant with a bone-dry finish, very high carbonation, and a restrained bitterness level. Can be suggestive of a sparkling white wine or Champagne. The hop character is modern, and emphasizes flavor and aroma dimensions.","Aroma":"Moderately high to intense hop aroma, very bright and hop-forward in the balance. Modern American and New World hop varieties provide a wide range of possible characteristics, such as tropical, stone fruit, citrusy, or white grape, but not grassy, vegetal, or herbal. Malt is subtle, neutral, and in the background, but never caramelly or overly corny- sweet. A light, clean alcohol note is optional. Very clean fermentation character; should not be yeasty.","Appearance":"Very pale color, ranging from very pale straw to very light gold. Crystal clear but a touch of haze is acceptable. High to very high carbonation gives a massive, rocky, billowy, white head with tight, persistent bubbles.","Flavor":"High to very high hop flavor, same descriptors as aroma. Low to very low neutral malt character, subtle in the balance. No strong malt flavors, no caramel. Perceived bitterness is low to very low due to the bone-dry finish and very high carbonation. Neutral to slightly fruity fermentation profile. No diacetyl. Dry to very dry finish with a fresh, hoppy aftertaste, and a clean bitterness.","Mouthfeel":"Light to very light body with a spritzy carbonation (high to very high), reminiscent of a sparkling white wine. No bitter, harsh, hop-derived astringency. Alcohol warmth may be present but should never be hot.","Style Comparison":"Less malt flavor, bitterness, and color than an American IPA, and much drier and more highly carbonated. Dry-hopped like an American IPA. Similar aroma and flavor as a Hazy IPA but without sweetness and with much less haze. Very pale, highly carbonated, and dry like a Belgian Golden Strong Ale but not as strong and without Belgian yeast character."},"th":{"Overall Impression":"เป็น American IPA ที่ฮอปโดดเด่น มีสีอ่อนมาก เป็นรูปแบบที่จบรสแบบไม่มีความหวานใดๆเหลือ มีคาร์โบเนชั่นสูงมาก มีระดับความขมที่ควบคุมไว้ สามารถรู้สึกถึง sparkling white wine หรือ Champagne มีกลิ่นคาแรคเตอร์ฮอปในแบบเบียร์สมัยใหม่ ที่ช่วยเน้นมิติของรสชาติและกลิ่น","Aroma":"มีกลิ่นฮอปแรงปานกลางถึงเข้มข้น มีความสว่างสดใสที่นำไปสู่ความสมดุล ใช้คาแรคเตอร์ที่หลากหลายจากฮอปอเมริกันและฮอปโลกใหม่ในแบบ tropical, stone fruit, citrusy หรือ white grape แต่ไม่ออก grassy, vegetal หรือ herbal มีกลิ่นมอลต์ที่นุ่มนวล เป็นกลางที่ช่วยสนับสนุน แต่ห้ามออกไปในทาง caramelly หรือ corny-sweet สามารถมีคาแรคเตอร์ของแอลกอฮอล์แบบสะอาดๆบางๆได้ มีโปรไฟล์การหมักที่สะอาดมากๆ ห้ามมีคาแรคเตอร์ใดๆจากยีสต์","Appearance":"มีสีอ่อนมากๆ ตั้งแต่สีฟางอ่อน (pale straw) จนถึงสีทองอ่อนมากๆ (very light gold) น้ำเบียร์ใสเหมือนคริสตัลแต่ยอมให้ขุ่นได้นิดหน่อย มีคาร์โบเนชั่นที่สูงจนถึงสูงมาก ฟองมีขนาดใหญ่สีขาวและคงอยู่กับแก้วได้ดี","Flavor":"มีรสฮอปสูงจนถึงสูงมาก ใช้คำอธิบายเดียวกันกับอโรม่า มีคาแรคเตอร์ของมอลต์ต่ำถึงต่ำที่สุดในแบบกลาง ที่นุ่มนวลและเข้ามาเพิ่มความสมดุล ห้ามมีรสมอลต์ที่เข้มข้น ห้ามมี caramel การรับรู้ต่อความขมต้องต่ำถึงต่ำมาก เพราะไม่หลงเหลือความหวานใดๆในรสชาติและมีคาร์โบเนชั่นที่สูงมากๆ มีโปรไฟล์การหมักในแบบกลางจนถึงออก fruity เล็กน้อย ห้ามมี diacetyl จบรสแบบ dry จนถึง dry มากที่สุดพร้อมกับความสดชื่นและฮอปใน aftertaste พร้อมความขมแบบสะอาด","Mouthfeel":"เนื้อเบียร์บางถึงบางที่สุด มาพร้อมความซ่าที่สูงจนถึงสูงที่สุด แบบที่ชวนให้นึกถึง sparkling white wine ไม่ขม ไม่กระด้าง ไม่มีความฝาดจากฮอป อาจจะพบคาแรคเตอร์ของแอลกอฮอล์ได้แต่ห้ามรุนแรง","Style Comparison":"มีรสมอลต์ ความขม และสีอ่อนกว่า American IPA มีความ dry มากกว่าและมีคาร์โบเนชั่นมากกว่า มีการ Dry-hop แบบ American IPA มีรสชาติและอโรม่าในแบบ Hazy IPA แต่ไม่เหลือความหวานและขุ่นน้อยกว่ามาก มีสีอ่อนมาก มีคาร์โบเนชั่นสูงมาก และไม่เหลือความหวานแบบ Belgian Golden Strong Ale แต่แรงไม่เท่าและห้ามมีคาแรคเตอร์แบบยีสต์เบลเยี่ยม"},"tags":"high-strength, pale-color, top-fermented, north-america, craft-style, ipa-family, specialty-family, bitter, hoppy","ex":"Drake’s Brightside Extra Brut IPA, Fair State Brewing Co-Op The Brut Squad, Ommegang Brut IPA","OG":[1.046,1.057],"FG":[0.99,1.004],"IBU":[20.0,30.0],"SRM":[2.0,4.0],"ABV":[6.0,7.5]},{"c":"21C","n":"Hazy IPA","cat":"21","cn":"IPA","tier":"A","gen":false,"en":{"Overall Impression":"An American IPA with intense fruit flavors and aromas, a soft body, smooth mouthfeel, and often opaque with substantial haze. Less perceived bitterness than traditional IPAs but always massively hop-forward.","Aroma":"Intense hop aroma, with stone fruit, tropical fruit, citrus, or other fruity qualities; not grassy or herbal. Clean, neutral, grainy, or lightly bready malt in the background; no caramel or toast. Absence of any malt character is a fault. Neutral to fruity fermentation character. Esters from yeast and hops should not clash. A creamy, buttery, or acidic aroma is inappropriate. Light alcohol aroma optional.","Appearance":"Color ranging from straw to very light amber, sometimes with an orange hue. Hazy, often opaque, clarity; should not be cloudy or murky. The opacity can add a ‘shine’ to the beer and make the color seem darker. Any visible floating hop matter, yeast clumps, or other particulates is a fault. Medium to rocky, meringue-like white head with high to very high retention.","Flavor":"High to very high fruity hop flavor, same descriptors as aroma. Low to medium malt flavor, same descriptors as aroma. Low to medium-high perceived bitterness, often masked by the fuller body and soft, off-dry to medium finish. The hop character in the aftertaste should not be sharp or harsh. Neutral to fruity fermentation profile, supportive of the hops. Should not be sweet, although high ester levels and lower bitterness may sometimes give that impression. Background alcohol flavor optional.","Mouthfeel":"Medium to medium-full body. Medium carbonation. Smooth. No harshness. Light warmth optional. The beer should not have a creamy or viscous mouthfeel, an acidic twang, or a raw starch texture.","Style Comparison":"Has a fuller, softer mouthfeel, a more fruit-forward late hop expression, a more restrained perceived bitterness balance, and a hazier appearance than American IPA. Many modern American IPAs are fruity and somewhat hazy; examples with a dry, crisp finish, at most medium body, and high perceived bitterness should be entered as 21A American IPA. Noticeable additions of fruit, lactose, vanilla, etc. to increase the fruity, smooth character should be entered in a specialty category defined by the additives (e.g., 29A Fruit Beer, 29C Specialty Fruit Beer, 30D Specialty Spice Beer). OG: 1.060 – 1.085"},"th":{"Overall Impression":"American IPA ที่มีรสและอโรม่าแบบ fruity ที่เข้มข้น มีเนื้อเบียร์นุ่ม ให้ความนุ่มนวลตอนดื่ม มักจะขุ่นและทึบแสง มีความขมน้อยกว่า IPA แบบดั้งเดิม แต่จะมีฮอปที่โดดเด่นชัดเจนมาก","Aroma":"กลิ่นฮอปเข้มข้นในแบบ stone fruit, tropical fruit, citrus หรือความ fruity แบบอื่นๆ ห้ามมีความ grassy หรือ herbal มีมอลต์ในแบบ grainy หรือ bready ที่ให้รสเป็นกลางมาคอยสนับหนุน ห้ามมี caramel หรือ toast การไม่มีคาแรคเตอร์ของมอลต์ถือเป็นข้อบกพร่อง มีการหมักที่เป็นกลางถึง fruity ได้ -- ester จากยีสต์และฮอปต้องเข้ากัน ห้ามมีความ creamy, buttery หรือ acidic สามารถมีกลิ่นของแอลกอฮอล์บางๆได้","Appearance":"มีสีไล่ตั้งแต่สีฟาง (straw) จนถึงสีเหลืองอำพันแบบอ่อน (very light amber) บางครั้งอาจพบเฉดสีส้ม มีความขุ่น มีความทึบแสง แต่สว่าง แต่ไม่ควรเข้มหรือขุ่นเกินไป ความทึบแสงช่วยทำให้เบียร์ “มีประกาย” และอาจจะทำให้สีดูเข้มขึ้น ห้ามมีเนื้อฮอป ยีสต์ หรืออะไรก็ตามให้เห็น มีฟองขนาดกลางถึงใหญ่และเกาะแน่น สีขาวเหมือนเมอแรงก์ ฟองเกาะแก้วได้ดีถึงดีมาก","Flavor":"มีรสฮอปในแบบ fruity สูงถึงสูงมาก ใช้คำอธิบายเดียวกันกับอโรม่า มีคาแรคเตอร์มอลต์ในระดับปานกลางถึงต่ำ ใช้คำอธิบายเดียวกันกับอโรม่า มีระดับความรับรู้ในรสขมน้อยจนถึงมากปานกลาง ที่ถูกซ่อนด้วยเนื้อเบียร์ที่หนานุ่ม จบรสแบบ off-dry หรือ medium-dry ก็ได้คาแรคเตอร์ของฮอปใน aftertaste ห้ามคมหรือกระด้าง โปรไฟล์การหมักแบบเป็นกลางหรือมีความ fruity ได้ที่ช่วยสนับสนุนฮอป ห้ามรู้สึกหวาน แม้ ester ที่สูงหรือความขมต่ำอาจทำให้รู้สึกแบบนั้น อาจพบคาแรคเตอร์ของแอลกอฮอล์ได้","Mouthfeel":"เนื้อเบียร์ปานกลางถึงหนาปานกลาง มีคาร์โบเนชั่นปานกลาง นุ่มลื่น ไม่มีความกระด้าง สามารถพบความอุ่นจากแอลกอฮอล์ได้เนื้อเบียร์ไม่ควรมีรสสัมผัสที่ creamy หรือหนืด ไม่ควรมีรส acidic หรือรสแบบแป้งดิบ","Style Comparison":"เนื้อเบียร์แน่นกว่า ดื่มแล้วนุ่มกว่า มี fruity เด่นจากการที่ใส่ฮอปในช่วงท้ายการ boil มีความสมดุลด้านความขมที่ถูกคุมเอาไว้และรับรู้ได้ดีกว่า มีความขุ่นกว่า American IPA ใน American IPA สมัยใหม่จะมีความ fruity และ hazy ร่วมกับความ dry ความ crisp ในตอนจบ ส่วนใหญ่จะมีเนื้อเบียร์แบบปานกลาง มีความขมสูงควรส่งเข้าไปที่หมวด 21A American IPA; ถ้าใส่ผลไม้ แลคโตส วานิลลา หรืออย่างอื่นเพื่อเพิ่มความ fruity และความลื่นต้องส่งเข้าไปในหมวด Special ที่แบ่งแยกจากวัตถุดิบที่ใส่ลงไป (เช่น 29A Fruit Beer, 29C Specialty Fruit Beer, 30D Specialty Spice Beer)"},"tags":"high-strength, pale-color, top-fermented, north-america, craft-style, ipa-family, bitter, hoppy","ex":"Belching Beaver Hazers Gonna Haze, Hill Farmstead Susan, Other Half Green Diamonds Double IPA, Pinthouse Electric Jellyfish, Tree House Julius, Trillium Congress Street, WeldWerks Juicy Bits","OG":[1.06,1.085],"FG":[1.01,1.015],"IBU":[25.0,60.0],"SRM":[3.0,7.0],"ABV":[6.0,9.0]},{"c":"22A","n":"Double IPA","cat":"22","cn":"Strong American Ale","tier":"A","gen":false,"en":{"Overall Impression":"An intensely hoppy, fairly strong, bitter pale ale without the big, rich, complex maltiness, residual sweetness, and body of an American Barleywine. Strongly hopped, but clean, dry, and lacking harshness. Despite showing its strength, drinkability is an important consideration.","Aroma":"A prominent to intense hop aroma typically featuring modern American or New World hop characteristics such as citrus, floral, pine, resin, spice, tropical fruit, stone fruit, berry, or melon. A supportive, clean, neutral to grainy maltiness may be found in the background. Neutral to lightly fruity fermentation profile. Alcohol may be noted, but should not be solventy.","Appearance":"Gold to light orange-copper color, but most modern versions are fairly pale. Good clarity, although a little haze is acceptable. Moderate-sized, persistent, white to off- white head.","Flavor":"Strong and complex hop flavor (same descriptors as aroma). Moderately high to very high bitterness, but should not be harsh. Low to medium supportive, clean, soft, unobtrusive malt character; may have light caramel or toast flavors. Dry to medium-dry finish, not sweet or heavy, with a lingering hoppy, bitter aftertaste. Low to moderate fruitiness optional. A light, clean, smooth alcohol flavor is allowable.","Mouthfeel":"Medium-light to medium body, with a smooth texture. Medium to medium-high carbonation. No harsh hop- derived astringency. Restrained, smooth alcohol warmth acceptable.","Style Comparison":"Bigger than English and American IPAs in alcohol strength, bitterness, and hoppiness. Less malty-rich, less body, drier, and with a greater overall hop balance than American Barleywine."},"th":{"Overall Impression":"เบียร์เอลสีอ่อนที่ฮอปเข้มข้น ค่อนข้างแรง มีความขม โดยไม่มีคาแรคเตอร์จากมอลต์ที่ซับซ้อนเข้มข้น ไม่มีความหวานที่หลงเหลือ และไม่มีเนื้อเบียร์ที่หนักแน่นแบบ American Barleywine; เบียร์ที่ฮอปเข้มข้น เนื้อเบียร์สะอาด มีความ dry และไม่มีความกระด้าง แม้จะเป็นเบียร์ที่แรง แต่ก็สามารถดื่มได้ง่าย","Aroma":"กลิ่นฮอปเด่นชัดและเข้มข้น โดยทั่วไปจะมีลักษณะเฉพาะของฮอปสายพันธุ์อเมริกันหรือฮอปโลกใหม่ในแบบ citrus, floral, pine, resin, spice, tropical fruit, stone fruit, berry, หรือ melon มีมอลต์ที่สะอาด ให้รสเป็นกลางจนถึง grainy มาสนับสนุน มีโปรไฟล์การหมักแบบกลางหรือแบบ fruity อ่อนๆ อาจจะสัมผัสถึงแอลกอฮอล์ได้ แต่ห้ามออกมาในแบบ solventy","Appearance":"มีสีทอง (gold) ไปจนถึงทองแดงกึ่งส้มอ่อน (light orange-copper) แต่เบียร์รุ่นใหม่ส่วนใหญ่จะเป็นสีอ่อน มีความใส แม้จะมีความขุ่นเล็กน้อยก็ยอมรับได้ ฟองมีขนาดกลางสีขาวหรือขาวขุ่นเกาะติดแก้วได้ดี","Flavor":"มีรสฮอปที่รุนแรงและซับซ้อน (ใช้คำอธิบายเดียวกันกับอโรม่า) มีความขมสูงปานกลางจนถึงสูงมาก แต่ไม่ควรกระด้าง มีมอลต์สนับสนุนในระดับต่ำถึงปานกลาง ซึ่งสะอาด นุ่มนวล และไม่เด่นชัด อาจพบรสชาติของ caramel หรือ toast อ่อนๆ จบรสแบบ dry ถึง medium-dry ไม่ควรออกหวานหรือหนัก มาพร้อมกับรสขมของฮอปใน aftertaste สามารถพบความ fruity แบบปานกลางถึงต่ำได้ รสแอลกอฮอล์ในแบบที่สะอาดนุ่มนวล นุ่มลื่นยอมรับได้","Mouthfeel":"เนื้อเบียร์ปานกลางถึงบางปานกลาง มีเนื้อเนียนละเอียด มีคาร์โบเนชั่นปานกลางถึงสูงปานกลาง ไม่มีความฝาดและความกระด้างจากฮอป มีคาแรคเตอร์ของแอลกอฮอล์ตอนอุ่นที่นุ่มและคุมไว้อย่างดีได้","Style Comparison":"หนักกว่า English และ American IPA ในด้านความแรงแอลกอฮอล์ ความขม และคาแรคเตอร์จากฮอป; เทียบกับ American Barleywine แล้วจะมีความเข้มข้นของมอลต์น้อยกว่า เนื้อเบียร์บางกว่า dry กว่า แต่มีฮอปโดยรวมที่สมดุลกว่า"},"tags":"very-high-strength, pale-color, top-fermented, north-america, craft-style, ipa-family, bitter, hoppy","ex":"Columbus Brewing Bohdi, Fat Head’s Hop Juju, Port Brewing Hop-15, Russian River Pliny the Elder, Stone Ruination Double IPA 2.0, Wicked Weed Freak of Nature","OG":[1.065,1.085],"FG":[1.008,1.018],"IBU":[60.0,100.0],"SRM":[6.0,14.0],"ABV":[7.5,10.0]},{"c":"22B","n":"American Strong Ale","cat":"22","cn":"Strong American Ale","tier":"B","gen":false,"en":{"Overall Impression":"A malty, bitter, and strong American Ale fitting in the space between American Barleywine, Double IPA, and Red IPA. The malty and hoppy flavors can be quite strong, but are generally in balance.","Aroma":"Medium to high hop aroma typically featuring modern American or New World hop characteristics such as citrus, floral, pine, resinous, spicy, tropical fruit, stone fruit, berry, or melon. Moderate to bold maltiness supporting the hop profile, with medium to dark caramel common, toasty or bready possible, and background notes of light roast or chocolate allowable. Neutral to moderately fruity fermentation profile. Alcohol may be noted, but should not be solventy.","Appearance":"Medium amber to deep copper or light brown. Moderate-low to medium-sized off-white to light tan head; may have low head retention. Good clarity. Legs possible.","Flavor":"Medium to high malt, with a caramel, toffee, or dark fruit quality. Malt complexity can include additional toasty, bready, or rich flavors in support. Light chocolate or roast allowable, but should not be burnt or sharp. Medium-high to high bitterness. Moderate to high hop flavor, same descriptors as aroma. Low to moderate esters. May have a noticeable alcohol flavor, but should not be sharp. Medium to high malty sweetness on the palate, finishing somewhat dry to somewhat sweet. Should not be syrupy, sweet, or cloying. Bitter to bittersweet aftertaste, with hops, malt, and alcohol noticeable.","Mouthfeel":"Medium to full body. An alcohol warmth may be present, but should not be excessively hot. Light hop astringency allowable. Medium-low to medium carbonation.","Style Comparison":"Generally not as strong and as rich as an American Barleywine. More malt balanced than an American or Double IPA. More American hop intensity than a British Strong Ale. Maltier and fuller-bodied than a Red IPA."},"th":{"Overall Impression":"American Ale ที่มีมอลต์ชัด ขมและแรง ที่อยู่ตรงกลางระหว่าง American Barleywine, Double IPA และ Red IPA รสฮอปและมอลต์สามารถแรงได้แต่ต้องสมดุล","Aroma":"มีกลิ่นฮอปในระดับปานกลางถึงสูง โดยทั่วไปจะมาจากฮอปอเมริกันสมัยใหม่และฮอปโลกใหม่ที่ให้คาแรคเตอร์ citrus, floral, pine, resinous, spicy, tropical fruit, stone fruit, berry หรือ melon มีรสมอลต์แบบปานกลางถึงเข้มข้นที่ช่วยสนับสนุนฮอป อาจพบคาราเมลปานกลางถึงเข้มรวมถึง toasty หรือ bready และมีคาแรคเตอร์คั่วอ่อนหรือช็อกโกแลตมาเสริม มีโปรไฟล์การหมักที่เป็นกลางหรือมีความ fruity ได้ปานกลาง อาจพบแอลกอฮอล์ได้ แต่ห้ามออกมาทาง solventy","Appearance":"สีเป็นได้ตั้งแต่อำพันปานกลาง (medium amber) ไปถึงทองแดงเข้ม (deep copper) หรือน้ำตาลอ่อน (light brown) ฟองมีขนาดปานกลางถึงเล็กปานกลาง สีขาวนวลถึงน้ำตาลอ่อน และอาจเกาะแก้วไม่ดีเนื้อเบียร์ใส อาจพบ leg ได้","Flavor":"มีรสมอลต์ปานกลางถึงสูงพร้อม caramel, toffee หรือ dark fruit ความซับซ้อนของมอลต์อาจมีรส toasty, bready หรือรสเข้มข้นที่มาสนับสนุน รส chocolate แบบบางหรือ roast สามารถมีได้ แต่ไม่ควรมีรสไหม้หรือรสคม มีความขมสูงปานกลางถึงสูง มีรสฮอปปานกลางถึงสูง ใช้คำอธิบายเดียวกันกับอโรม่า มี ester ปานกลางถึงต่ำ อาจสัมผัสได้ถึงรสแอลกอฮอล์แต่ไม่ควรคม มีความหวานจากมอลต์ในแบบปานกลางถึงสูงอาจจบรสในแบบ dry หรืออาจจะหวาน แต่ไม่ควรหวานเกินไปหรือคล้ายน้ำเชื่อม มี aftertaste ในแบบขมหรือแบบหวานปนขมพร้อมกับฮอป มอลต์และอาจจะพบแอลกอฮอล์ได้","Mouthfeel":"มีเนื้อเบียร์แบบปานกลางจนถึงหนา อาจพบคาแรคเตอร์ของแอลกอฮอล์แต่ไม่ควรแรงเกินไป ยอมรับการมีรสฝาดจากฮอปได้ มีคาร์โบเนชั่นปานกลางถึงต่ำปานกลาง","Style Comparison":"โดยทั่วไปแล้วจะไม่แรงและเข้มข้นเท่า American Barleywine มีมอลต์ที่สมดุลมากกว่า American หรือ Double IPA มีความเข้มข้นของฮอปแบบอเมริกันมากกว่า British Strong Ale; มีมอลต์ชัดกว่าและเนื้อเบียร์แน่นกว่า Red IPA"},"tags":"high-strength, amber-color, top-fermented, north-america, craft-style, strong-ale-family, bitter, hoppy","ex":"Arrogant Bastard Ale, Fat Head’s Bone Head, Great Lakes Nosferatu, Oskar Blues G’Knight, Port Brewing Shark Attack Double Red Ale","OG":[1.062,1.09],"FG":[1.014,1.024],"IBU":[50.0,100.0],"SRM":[7.0,18.0],"ABV":[6.3,10.0]},{"c":"22C","n":"American Barleywine","cat":"22","cn":"Strong American Ale","tier":"B","gen":false,"en":{"Overall Impression":"A very strong, malty, hoppy, bitter American ale with a rich palate, full mouthfeel, and warming aftertaste, suitable for contemplative sipping.","Aroma":"Strong malt and hop aroma dominates. Hops are moderate to assertive, showing a range of American, New World, or English characteristics. Citrusy, fruity, or resiny are classic attributes, but others are possible, including those from modern hops. Strong grainy, bready, toasty, light caramel, or neutral malt richness, but typically not with darker caramel, roast, or deep fruit aspects. Low to moderately strong esters and alcohol, lower in the balance than the malt and hops. Intensities fade with age.","Appearance":"Color ranges from amber to medium copper, rarely up to light brown. Ruby highlights common. Moderately- low to large off-white to light tan head; may have low head retention. Good to brilliant clarity but may have some chill haze. The color may appear to have great depth, as if viewed through a thick glass lens. Legs possible.","Flavor":"Similar malt and hop flavors as the aroma (same descriptors apply). Moderately strong to aggressive bitterness, tempered by a rich, malty palate. Moderate to high hop flavor. Low to moderate esters. Noticeable alcohol, but not solventy. Moderately low to moderately high malty sweetness on the palate, with a somewhat malty to dry but full finish. Age will often dry out the beer, and smooth out the flavors. The balance is malty, but always bitter.","Mouthfeel":"Full-bodied and chewy, with a velvety, luscious texture, declining with age. A smooth alcohol warmth should be noticeable, but shouldn’t burn. Carbonation may be low to moderate, depending on age and conditioning.","Style Comparison":"Greater emphasis on hop bitterness, flavor, and aroma than English Barley Wine, often featuring American hop varieties. Typically paler than the darker English Barley Wines and lacking their deeper malt flavors, but darker than the golden English Barley Wines. Differs from a Double IPA in that the hops are not extreme, the malt is more forward, and the body is fuller and often richer. American Barleywine typically has more residual sweetness than Double IPA, which affects the overall drinkability (sipping vs. drinking)."},"th":{"Overall Impression":"เบียร์ American ale ที่แรงมาก มีมอลต์ชัด มีฮอปชัด รสเข้มเต็มปาก มีความขมมาพร้อม aftertaste แบบอุ่นๆ เหมาะสำหรับการค่อยๆจิบแบบละเมียด","Aroma":"กลิ่นมอลต์และกลิ่นฮอปที่แรงคือความโดดเด่น มีฮอปในระดับปานกลางจนถึงเด่นชัด ที่แสดงคาแรคเตอร์ของฮอปสายพันธุ์อเมริกัน ฮอปโลกใหม่หรือฮอปสายพันธุ์อังกฤษ ความ citrus, fruity หรือ resin คือความคลาสสิกแต่ก็พบแบบอื่นได้โดยเฉพาะจากฮอปสมัยใหม่ มีกลิ่นมอลต์ในแบบ strong grainy, bready, toasty, light caramel หรือมอลต์แบบเป็นกลาง แต่ห้ามมี dark caramel, roast หรือ deep fruit ; มี esters และคาแรคเตอร์จากแอลกอฮอล์ในระดับต่ำจนถึงแรงปานกลาง ที่ช่วยทำให้สมดุลแต่น้อยกว่าจากมอลต์และฮอป คาแรคเตอร์ที่ชัดเจนจะหายไปตามเวลา","Appearance":"ช่วงสีมีตั้งแต่สีอำพัน (amber) ถึงทองแดงปานกลาง (medium copper) ไม่ค่อยเห็นสีน้ำตาลอ่อน มีความแวววาวแบบทับทิม มีฟองสีขาวนวลถึงสีน้ำตาลอ่อนขนาดเล็กปานกลางถึงใหญ่ อาจจะเกาะแก้วได้ไม่ดี เนื้อเบียร์ใสคมชัด อาจจะพบ chill haze ได้บ้าง สีเบียร์แสดงให้ถึงมิติราวกับมองผ่านเลนส์ อาจพบ leg ได้","Flavor":"มีรสชาติของมอลต์และฮอปคล้ายคลึงกับอโรม่า (ใช้คำอธิบายเดียวกัน) มีความขมปานกลางถึงรุนแรง ที่มากับรสมอลต์เข้มข้น มีรสฮอปปานกลางถึงสูง มี ester ต่ำถึงปานกลาง พบคาแรคเตอร์ของแอลกอฮอล์ได้ชัดเจนแต่ห้ามออกมาในแบบ solventy รสในปากเป็นรสหวานจากมอลต์ในระดับต่ำปานกลางถึงสูงปานกลาง ด้วยความ malty ที่ dry และจบรสแบบ full การบ่มเบียร์ไว้ทำให้เบียร์ dry ขึ้นแต่ก็จะให้รสชาติที่นุ่มขึ้น มีความสมดุลจากมอลต์แต่ต้องขมเสมอ","Mouthfeel":"เนื้อแน่นเต็มปากพร้อมเนื้อสัมผัสเนียนนุ่ม ที่จะลดลงตามเวลาการบ่ม พบความอุ่นจากแอลกอฮอล์ได้แต่ต้องไม่รุนแรง มีคาร์โบเนชั่นในระดับต่ำจนถึงปานกลาง ขึ้นอยู่กับอายุและการบ่ม","Style Comparison":"มีความขม รสชาติ และกลิ่นของฮอปมากกว่า English Barley Wine ด้วยฮอปสายพันธุ์อเมริกัน ทั่วไปจะสีอ่อนกว่า English Barley Wine ที่ปกติสีเข้มและไม่มีรสมอลต์ที่ลึกเท่า แต่สีเข้มกว่า English Barley Wines แบบสีทอง แตกต่างจาก Double IPA ตรงที่ฮอปไม่สุดโต่ง มอลต์นำมากกว่า มีเนื้อเบียร์เต็มกว่าและเข้มข้นกว่า American Barleywine มักจะมีความหวานตกค้างมากกว่า Double IPA ซึ่งส่งผลต่อความสามารถในการดื่มโดยรวม (การจิบกับการดื่ม)"},"tags":"very-high-strength, amber-color, top-fermented, north-america, craft-style, strong-ale-family, bitter, hoppy","ex":"Anchor Old Foghorn, Bell’s Third Coast Old Ale, East End Gratitude, Hair of the Dog Doggie Claws, Sierra Nevada Bigfoot","OG":[1.08,1.12],"FG":[1.016,1.03],"IBU":[50.0,100.0],"SRM":[9.0,18.0],"ABV":[8.0,12.0]},{"c":"22D","n":"Wheatwine","cat":"22","cn":"Strong American Ale","tier":"B","gen":false,"en":{"Overall Impression":"A richly textured, high alcohol sipping beer with a significant grainy, bready flavor, and a sleek body. The emphasis is first on the bready, wheaty flavors with malt, hops, fruity yeast, and alcohol complexity.","Aroma":"Hop aroma is mild and can represent just about any hop variety. Moderate to moderately-strong bready, wheaty malt character, often with additional malt complexity such as honey and caramel. A light, clean, alcohol aroma may be noted. Low to medium fruity notes may be apparent. Very low diacetyl optional. Banana-and-clove Weizen yeast character is inappropriate.","Appearance":"Color ranging from gold to deep amber, often with garnet or ruby highlights. Low to medium off-white head. The head may have creamy texture, and good retention. Chill haze is allowable, but usually clears up as the beer gets warmer. High alcohol and viscosity may be visible as legs.","Flavor":"Moderate to moderately-high bready wheat malt flavor, dominant in the flavor balance over any hop character. Low to moderate toasty, caramel, biscuity, or honey malt notes can add a welcome complexity, but are not required. Low to medium hop flavor, reflecting any variety. Moderate to moderately-high fruitiness, often with a dried-fruit character. Low to moderate bitterness, creating a malty to even balance. Should not be syrupy or under-attenuated.","Mouthfeel":"Medium-full to full body. Chewy, often with a luscious, velvety texture. Low to moderate carbonation. Light to moderate smooth alcohol warmth optional.","Style Comparison":"More than simply a wheat-based Barleywine, many versions have very expressive fruity and hoppy notes, while others develop complexity through oak aging. Less emphasis on the hops than American Barleywine. Has roots in American Wheat Beer rather than any German wheat style, so should not have any Weizen yeast character."},"th":{"Overall Impression":"เบียร์ที่มีเนื้อสัมผัสเข้มข้นมีแอลกอฮอล์สูงเหมาะสำหรับการจิบดื่มช้าๆ มีรสชาติที่โดดเด่นของ grainy และ bready โดยเน้นรสชาติของ bready และ wheaty เป็นหลัก พร้อมกับความซับซ้อนจากมอลต์, ฮอป, fruity yeast และความซับซ้อนจากแอลกอฮอล์","Aroma":"มีกลิ่นของฮอปที่ไม่รุนแรงและสามารถแสดงถึงความหลากหลายของฮอปได้ มีกลิ่นมอลต์แบบ bready, wheaty ปานกลางถึงเข้มข้นปานกลางและมักจะพบความซับซ้อนจาก honey และ caramel; อาจมีกลิ่นแอลกอฮอล์ที่บางเบา สะอาด และสังเกตได้ อาจพบกลิ่น fruity ระดับต่ำถึงปานกลาง อาจพบ diacetyl ในระดับต่ำมากๆได้ กลิ่นกล้วยและกานพลูจากยีสต์ Weizen ไม่เหมาะสมต่อสไตล์นี้","Appearance":"สีมีได้ตั้งแต่สีทอง (gold) ไปจนถึงอำพันเข้ม (deep amber) มักจะพบประกายโกเมนหรือทับทิม ฟองสีขาวนวลขนาดเล็กถึงปานกลาง ฟองอาจมีความครีมมี่และเกาะแก้วได้ดี สามารถมี chill haze ได้ แต่มักจะหายไปเมื่อเบียร์อุ่นขึ้น ถ้ามีแอลกอฮอล์และความหนืดสูงอาจพบ leg","Flavor":"มีรสมอลต์แบบ wheat bready ในระดับสูงปานกลางถึงสูง โดดเด่นในเรื่องความสมดุลเหนือกว่าคาแรคเตอร์ของฮอป มีรส toasty, caramel, biscuity หรือ honey ในระดับปานกลางถึงต่ำที่ช่วยสร้างความซับซ้อนแต่ไม่จำเป็นก็ได้ มีรสฮอปในระดับปานกลางถึงต่ำ หลากหลาย มีความ fruity ปานกลางจนถึงสูงปานกลาง ส่วนใหญ่เป็น dried-fruit มีความขมต่ำจนถึงปานกลางที่ช่วยสร้างความสมดุลให้มอลต์ ไม่ควรมีรสหวานแบบน้ำเชื่อมหรือการหมักที่ไม่จบ","Mouthfeel":"เนื้อเบียร์ปานกลางถึงแน่น เต็มปากเต็มคำ นุ่มนวล มีคาร์โบเนชั่นปานกลางถึงต่ำ พบคาแรคเตอร์อุ่นจากแอลกอฮอล์ในระดับปานกลางจนถึงอ่อนได้","Style Comparison":"เหนือกว่า Barleywine ที่ทำจาก wheat มอลต์เบียร์ในแบบอื่นๆจะมีกลิ่น fruity และมีฮอปแบบเห็นได้ชัด ในขณะที่บางชนิดจะไปในทางสร้างความสมดุลผ่าน oak-aged; มีการเน้นฮอปน้อยกว่า American Barleywine มีรากฐานมาจาก American Wheat Beer มากกว่าจากสไตล์ German wheat ไม่ควรมีคาแรคเตอร์ของ Weizen ยีสต์"},"tags":"very-high-strength, amber-color, top-fermented, north-america, craft-style, strong-ale-family, wheat-beer-family, balanced, hoppy","ex":"The Bruery White Oak, Castelain Winter Ale, Perennial Heart of Gold, Two Brothers Bare Tree","OG":[1.08,1.12],"FG":[1.016,1.03],"IBU":[30.0,60.0],"SRM":[6.0,14.0],"ABV":[8.0,12.0]},{"c":"23A","n":"Berliner Weisse","cat":"23","cn":"European Sour Ale","tier":"A","gen":false,"en":{"Overall Impression":"A very pale, refreshing, low-alcohol German wheat beer with a clean lactic sourness and a very high carbonation level. A light bread dough malt flavor supports the sourness, which shouldn’t seem artificial. A gentle fruitiness is found in the best examples.","Aroma":"A moderate to moderately-high sharply sour character is dominant. Can have up to a moderately fruitiness, often lemon, tart apple, peach, or apricot, and a light floral note. No hop aroma. The wheat may be perceived as raw bread dough in fresher versions; combined with the acidity, may suggest sourdough bread.","Appearance":"Straw in color, can be very pale. Clarity ranges from clear to somewhat hazy. Large, dense, white head with poor retention. Highly effervescent.","Flavor":"Clean lactic sourness dominates and can be quite strong. A complementary doughy, bready, or grainy wheat flavor is generally noticeable. Hop bitterness is undetectable; sourness provides the balance rather than hops. Never vinegary. Bright yet restrained fruitiness may be detected as apricot-peach, citrus-lemon, or tart apple. Very dry finish. Balance dominated by sourness, but some malt flavor should be present. No hop flavor. No THP.","Mouthfeel":"Light body, but never thin. Very high carbonation. No sensation of alcohol. Crisp acidity.","Style Comparison":"Compared to Lambic, has a clean lactic sourness with restrained to below sensory threshold Brett. Also lower in alcohol content. Compared to Straight Sour Beer and Catharina Sour, is lower gravity and may contain Brett."},"th":{"Overall Impression":"เบียร์ข้าวสาลีจากเยอรมันที่มีแอลกอฮอล์ต่ำ มีสีอ่อน ให้สดชื่น มีความเปรี้ยวของ lactic ที่สะอาดและมีระดับคาร์โบเนชั่นสูงมาก รสมอลต์แบบ bread dough อ่อนๆรองรับรสเปรี้ยวที่ไม่ควรดูสังเคราะห์ ในตัวอย่างที่ดีจะพบความ fruity ที่อ่อนโยน","Aroma":"มีความเปรี้ยวที่โดดเด่นและคม ในระดับปานกลางถึงสูงปานกลาง สามารถให้รส fruity ได้ในระดับปานกลาง มักมาในแบบ lemon, tart apple, peach, apricot, หรือ floral แบบอ่อนๆ ไม่มีกลิ่นฮอปคาแรคเตอร์ wheat อาจถูกมองว่าเป็น raw bread dough ที่จะพบในเบียร์ที่สดใหม่ร่วมกับความ acidity ที่คล้ายขนมปัง sourdough","Appearance":"สีฟาง (straw) สามารถมีสีอ่อนมากได้ (very pale) มีความชัดเจน มีตั้งแต่สีใสไปจนถึงค่อนข้างขุ่น ฟองขนาดใหญ่ สีขาว แน่นแต่เกาะแก้วได้ไม่ดี มีชีวิตชีวา","Flavor":"มีความเปรี้ยวจาก lactic ที่สะอาด ชัดเจน และอาจจะค่อนข้างแรงได้ โดยทั่วไปจะพบคาแรคเตอร์ของ Wheat ในแบบ doughy, bready หรือ grainy ไม่มีความขมจากฮอป โดยใช้ความเปรี้ยวให้ความสมดุลแทนฮอป ไม่ควรเปรียวแบบ vinegary มีความ fruity ที่สดใสและกำหนดมาแล้วในแบบ apricot-peach, citrus-lemon หรือ tart apple จบรสแบบ dry ความสมดุลมาจากความเปรี้ยว แต่ต้องพบคาแรคเตอร์ของมอลต์อยู่เช่นกันไม่มีรสฮอป ไม่มี THP","Mouthfeel":"เนื้อเบียร์บางเบาแต่ไม่เรียบ มีคาร์โบเนชั่นสูงมาก ไม่มีความรู้สึกของแอลกอฮอล์ มี acidity ที่คมชัด","Style Comparison":"เทียบกับ Lambic จะมีรสเปรี้ยวของ lactic ที่สะอาดและรู้สึกถึง Brett ได้ในระดับต่ำ มีปริมาณแอลกอฮอล์ต่ำ เมื่อเทียบกับเบียร์ Straight Sour และ Catharina Sour จะมี gravity ต่ำกว่าและอาจมี Brett"},"tags":"session-strength, pale-color, top-fermented, central-europe, traditional-style, wheat-beer-family, sour","ex":"Bayerischer Bahnhof Berliner Style Weisse, Berliner Berg Berliner Weisse, Brauerei Meierei Weiße, Lemke Berlin Budike Weisse, Schell's Brewing Company Schelltheiss, Urban Chestnut Ku’damm","OG":[1.028,1.032],"FG":[1.003,1.006],"IBU":[3.0,8.0],"SRM":[2.0,3.0],"ABV":[2.8,3.8]},{"c":"23B","n":"Flanders Red Ale","cat":"23","cn":"European Sour Ale","tier":"B","gen":false,"en":{"Overall Impression":"A sour and fruity oak-aged reddish- brown Belgian-style ale with supportive toasty malt flavors and fruit complexity. The dry, tannic finish supports the suggestion of a vintage red wine.","Aroma":"Complex fruity-sour profile with supporting malt. Fruitiness is high, and reminiscent of black cherries, oranges, plums, red currants, or fruit leather. Low to medium-low vanilla, chocolate, or peppery phenol can be present for complexity. The sour aroma ranges from moderate to high. A dominant vinegary character is inappropriate, although low to moderate levels of acetic acid are acceptable if balanced with the malt. No hop aroma.","Appearance":"Deep red, burgundy to reddish-brown in color. Good clarity. White to very pale tan head. Average to good head retention.","Flavor":"Moderate to moderately-high malty flavors often have a soft toasty-rich quality. Intense fruit flavors, same descriptors as aroma. Complex, moderate to high sourness, accentuated by the esters; should not be a simple lactic sourness. A dominant vinegary character is inappropriate, although low to moderate acetic acid is acceptable if balanced with the malt. Generally as the sour character increases, the malt character fades to more of a background flavor (and vice versa). Low to medium-low vanilla, chocolate, or peppery phenols optional. No hop flavor. Restrained bitterness; balanced to the malt side. Acids and tannins can enhance the perception of bitterness, and provide balance and structure. Some versions are sweetened, or blended to be sweet; allow for a wide range of sweetness levels, which can soften the acidic bite and acetic perception.","Mouthfeel":"Medium body, often enhanced by tannins. Low to medium carbonation. Low to medium astringency, often with a prickly acidity. Deceivingly light and crisp on the palate although a somewhat sweet finish is not uncommon.","Style Comparison":"Less malty-rich than an Oud Bruin, often with more of a fruity-tart and acetic profile."},"th":{"Overall Impression":"เบียร์เอลสไตล์ Belgian สีน้ำตาลแดงอมเปรี้ยวมีความ fruity ที่มีกลิ่นมอลต์แบบ toasty พร้อมความซับซ้อนจากผลไม้ ไม่เหลือรสหวาน จบรสแบบ tannic ในแบบเดียวกับ vintage red wine","Aroma":"มีโปรไฟล์ fruity-sour ที่ซับซ้อนที่มีมอลต์มาคอยเสริม มีความ fruity สูงที่ชวนให้นึกถึง black cherries, oranges, plums, red currants หรือ fruit leather มีคาแรคเตอร์ vanilla, chocolate หรือ peppery phenol แบบต่ำถึงต่ำปานกลางที่มาช่วยสร้างความซับซ้อน อโรม่าจากความเปรี้ยวมีตั้งแต่ปานกลางจนถึงสูง ห้ามมีคาแรคเตอร์แบบ vinegary แต่มีคาแรคเตอร์ของ acetic acid แบบต่ำถึงปานกลางได้ ถ้ามีแล้วสมดุลไปกับมอลต์ ไม่มีกลิ่นฮอป","Appearance":"มีสีแดงเข้ม (deep red) สีเบอร์กันดี (burgundy) ถึงน้ำตาลแดง (reddish-brown) มีความคมชัดดี มีฟองสีขาวถึงสีอ่อนมากฟองเกาะแก้วได้ปานกลางถึงดี","Flavor":"มีรสมอลต์ระดับปานกลางถึงสูงปานกลาง มักมีรสชาติ toasty ที่นุ่มละมุนแต่เข้มข้น มีรสผลไม้เข้มข้น แบบเดียวกับที่อธิบายในอโรม่า มีความเปรี้ยวแบบปานกลางถึงสูงอันซับซ้อน ที่ถูกเน้นออกมาโดย ester; ไม่ควรมีรส lactic แบบตรงๆ การมีคาแรคเตอร์แบบ vinegary ที่เด่นออกมานั้นไม่เหมาะสม สามารถมีคาแรคเตอร์ของกรด Acetic แบบต่ำถึงปานกลางได้ ถ้ามีแล้วสมดุลไปกับมอลต์ โดยทั่วไปเมื่อคาแรคเตอร์ความเปรี้ยวเพิ่มขึ้น คาแรคเตอร์ของของมอลต์จะจางหายไป (จะสลับกัน) สามารถพบ vanilla, chocolate หรือ peppery phenols แบบต่ำถึงต่ำปานกลางได้ ไม่มีรสฮอป ความขมถูกควบคุมเอาไว้เพื่อให้สมดุลกับมอลต์ รส Acids และ tannin สามารถเพิ่มการรับรู้รสขม และให้ความสมดุล บางรูปแบบอาจจะหวานหรือผสมกันให้ออกมาหวาน อนุญาตให้มีระดับความหวานที่หลากหลาย ที่ช่วยให้รสเปรี้ยวที่กัดและการรับรู้ถึง Acetic นั้นนุ่มลง","Mouthfeel":"เนื้อเบียร์แบบปานกลาง มักมีรส tannin เป็นตัวเสริม มีคาร์โบเนชั่นต่ำถึงปานกลาง มีความฝาดเล็กน้อยถึงปานกลาง มักพบความเป็นกรด มีการรับรสที่บางและคม แม้ว่าจะพบรสหวานก็ไม่ใช้เรื่องแปลก","Style Comparison":"มีมอลต์เข้มข้นน้อยกว่า Oud Bruin โดยมักมีรส fruity-tart และ acetic มากกว่า"},"tags":"standard-strength, amber-color, top-fermented, western-europe, traditional-style, balanced, sour, wood","ex":"Cuvée des Jacobins, Duchesse de Bourgogne, New Belgium La Folie, Rodenbach Classic, Rodenbach Grand Cru, Vichtenaar Flemish Ale","OG":[1.048,1.057],"FG":[1.002,1.012],"IBU":[10.0,25.0],"SRM":[10.0,17.0],"ABV":[4.6,6.5]},{"c":"23C","n":"Oud Bruin","cat":"23","cn":"European Sour Ale","tier":"B","gen":false,"en":{"Overall Impression":"A malty, fruity, aged, somewhat sour Belgian-style brown ale with a caramel-chocolate malt flavor, and often substantial alcohol.","Aroma":"Richly malty with fruity esters and an aged sourness. Medium to medium-high esters commonly reminiscent of raisins, plums, figs, dates, oranges, black cherries, or prunes. Medium-low to medium-high malt with caramel, toffee, treacle, or chocolate character. Low spicy-peppery phenols optional. A low sour aroma may be present, and can modestly increase with age but should not grow to a strongly acetic, vinegary character. Hop aroma absent. Aged examples can show a lightly nutty, sherry-like oxidation character.","Appearance":"Dark reddish-brown to brown in color. Good clarity. Average to good head retention. Ivory to light tan head color.","Flavor":"Malty with fruity complexity and typically some dark caramel or burnt sugar flavor. Medium-low to medium-high malt, same descriptors as aroma. Medium to medium-high fruitiness, same descriptors as aroma. Low spicy-peppery phenols optional. A slight sourness often becomes more pronounced in well-aged examples, along with some sherry- like character, producing a “sweet-and-sour” profile and aftertaste. The sourness should not grow to a strongly acetic, vinegary character. Hop flavor absent. Restrained hop bitterness. Balance is malty, but with fruitiness and sourness present. Blending and sweetening may produce a range of finishes, and balances.","Mouthfeel":"Medium to medium-full body. Low to moderate carbonation. No astringency. Stronger versions can be noticeably warming.","Style Comparison":"A deeper malt character with more caramel, toffee, and chocolate flavors and darker color distinguishes these beers from Flanders Red Ale. The Oud Bruin is less acetic and maltier than a Flanders Red, and the fruity flavors are more malt-oriented. In modern times, Oud Bruin also tends to be higher in alcohol than is typically seen in Flanders Red Ales. Differs from Lambic in that they are not spontaneously fermented, and don’t contain wheat."},"th":{"Overall Impression":"เบียร์ Brown Ale สไตล์เบลเยียมที่ค่อนข้างเปรี้ยว มีกลิ่นมอลต์ กลิ่น fruity และการบ่ม มีรสมอลต์แบบ caramel- chocolate และมักจะมีปริมาณแอลกอฮอล์สูง","Aroma":"กลิ่นมอลต์เข้มข้นมาพร้อมกับ fruity ester และความเปรี้ยวจากการบ่ม มี ester ในระดับปานกลางถึงสูงปานกลาง ที่มักชวนให้นึกถึง raisins, plums, figs, dates, oranges, black cherries หรือ prunes มีกลิ่นมอลต์ระดับต่ำปานกลางถึงสูงปานกลาง ที่ให้คาแรคเตอร์แบบ caramel, toffee, treacle หรือ chocolate สามารถพบ phenol ระดับต่ำในแบบ spicy-peppery อาจพบกลิ่นเปรี้ยวแบบต่ำและอาจเพิ่มขึ้นตามอายุแต่ไม่ควรเปลี่ยนไปจนมีลักษณะเป็นกรด acetic ที่รุนแรงหรือกลายเป็นแบบ vinegary ไม่มีกลิ่นฮอป เบียร์ตัวอย่างที่บ่มมานานอาจแสดงลักษณะ oxidation แบบ nutty, sherry-like เล็กน้อย","Appearance":"มีสีน้ำตาลแดงเข้ม (dark reddish-brown) ถึงน้ำตาล (brown) มีความใส ฟองเกาะแก้วได้ปานกลางถึงดี ฟองมีสีงาช้างถึงสีน้ำตาลอ่อน","Flavor":"มีรสมอลต์ผสมกับรส fruity ที่ซับซ้อน และมักพบรส dark caramel หรือ burnt sugar มีรสมอลต์ในระดับต่ำปานกลางถึงสูงปานกลางแบบเดียวกับที่อธิบายในอโรม่า มีความ fruity ในระดับปานกลางถึงสูงปานกลางแบบเดียวกับที่อธิบายในอโรม่า สามารถพบ phenol ระดับต่ำในแบบ spicy-peppery มีความเปรี้ยวอันเบาบางจะโดดเด่นเมื่อเบียร์ผ่านการบ่มมาอย่างดี ที่มาพร้อมกับคาแรคเตอร์ sherry ที่สร้างโปรไฟล์ “sweet-and-sour” ใน aftertaste ความเปรี้ยวไม่ควรเปลี่ยนไปจนมีลักษณะเป็นกรด acetic ที่รุนแรง หรือกลายเป็นแบบ vinegary ไม่มีกลิ่นฮอป ความขมจากฮอปถูกคุมเอาไว้ สมดุลด้วยมอลต์แต่มีรสเปรี้ยวและ fruity อยู่ การ blend และการเพิ่มความหวานอาจทำให้ได้การจบรสหลายแบบและความสมดุลที่หลากหลาย","Mouthfeel":"เนื้อเบียร์ปานกลางถึงหนาปานกลาง มีคาร์โบเนชั่นต่ำถึงปานกลาง ไม่มีความฝาด แบบที่แรงกว่าสามารถพบความอุ่นจากแอลกอฮอล์ได้ชัด","Style Comparison":"มีคาแรคเตอร์เฉพาะของมอลต์ที่ลึกกว่าด้วยรสชาติ caramel, toffee และ chocolate ที่มากกว่าและสีเข้มกว่า ทำให้เบียร์เหล่านี้แตกต่างจาก Flanders Red Ale; Oud Bruin มีกรด acetic และมอลต์น้อยกว่า Flanders Red และรสชาติ fruity จะเน้นที่มอลต์มากกว่า ในยุคปัจจุบัน Oud Bruin มีแนวโน้มที่จะมีแอลกอฮอล์สูงกว่าปกติเมื่อเทียบกับ Flanders Red Ale แตกต่างจาก Lambic ตรงที่ไม่มีการหมักแบบต่อเนื่องและไม่มี wheat"},"tags":"standard-strength, dark-color, top-fermented, western-europe, traditional-style, malty, sour","ex":"Ichtegem Oud Bruin, Liefmans Goudenband, Liefmans Oud Bruin, Petrus Roodbruin, pFriem Oud Bruin, VanderGhinste Roodbruin","OG":[1.04,1.074],"FG":[1.008,1.012],"IBU":[20.0,25.0],"SRM":[17.0,22.0],"ABV":[4.0,8.0]},{"c":"23D","n":"Lambic","cat":"23","cn":"European Sour Ale","tier":"B","gen":false,"en":{"Overall Impression":"A fairly sour, often moderately funky, wild Belgian wheat beer with sourness taking the place of hop bitterness in the balance. Traditionally served uncarbonated as a café drink.","Aroma":"Young versions can be quite sour and fruity, but can develop barnyard, earthy, goaty, hay, horsey, or horse blanket funkiness with age. The fruit character can take on a light citrus fruit, citrus rind, pome fruit, or rhubarb quality, getting more complex with age. Malt can have a light bready, grainy, honey, or wheat-like quality, if noticeable. Should not have enteric, smoky, cigar-like, or cheesy faults. No hops.","Appearance":"Pale yellow to deep golden in color; age tends to darken the beer. Clarity is hazy to good. Younger versions are often cloudy, while older ones are generally clear. White colored head generally has poor retention.","Flavor":"Young versions often have a strong lactic sourness with fruity flavors (same descriptors as aroma), while aged versions are more balanced and complex. Funky notes can develop over time, same descriptors as aroma. Low bready, grainy malt. Bitterness generally below sensory threshold; sourness provides the balance. No hop flavor. Dry finish, increasing with age. Should not have enteric, smoky, cigar-like, or cheesy faults.","Mouthfeel":"Light to medium-light body; should not be watery. Has a medium to high tart, puckering quality without being sharply astringent. Traditional versions are virtually to completely uncarbonated, but bottled examples can pick up moderate carbonation with age.","Style Comparison":"Often has a simpler sourness and less complexity than a Gueuze, but more variability from batch to batch. Traditionally served uncarbonated from pitchers, while Gueuze is bottled and very highly carbonated."},"th":{"Overall Impression":"เบียร์ข้าวสาลีจากเบลเยี่ยมที่มีรสค่อนข้างเปรี้ยว มักจะมีความ funky ปานกลาง ใช้ความเปรี้ยวมาทดแทนความขมจากฮอปเพื่อความสมดุล ตามธรรมเนียมจะเสิร์ฟแบบไม่อัดลมในแบบเครื่องดื่มตามคาเฟ่","Aroma":"เบียร์ที่ใหม่อาจมีรสเปรี้ยวและ fruity ที่จะพัฒนาไปเป็นคาแรคเตอร์ funky ในรูปแบบ barnyard, earthy, goaty, hay, horsey หรือ horse blanket ตามอายุ คาแรคเตอร์ fruity จะมาในรูปแบบ light citrus fruit, citrus rind, pome fruit หรือ rhubarb ที่จะซับซ้อนขึ้นตามการบ่มสามารถพบมอลต์ในแบบ light bready, grainy, honey หรือคล้าย wheat ไม่ควรพบคาแรคเตอร์ enteric, smoky, cigar-like หรือ cheesy ไม่พบฮอป","Appearance":"สีเหลืองอ่อน (pale yellow) ถึงสีทองเข้ม (deep gold) การบ่มมีแนวโน้มที่จะทำให้เบียร์สีเข้มขึ้น มีความชัดเจนหรือขุ่น เบียร์ที่ผลิตใหม่อาจพบความขุ่น ในขณะที่เบียร์ที่ผลิตมานานแล้วทั่วไปจะมีความใส มีฟองสีขาว ที่เกาะแก้วได้ไม่ดี","Flavor":"เบียร์ที่ผลิตใหม่มักมีรสเปรี้ยวของ lactic เข้มข้นพร้อมรส fruity (ใช้คำอธิบายในแบบเดียวกับอโรม่า) ในขณะที่เบียร์ที่ผลิตมานานแล้วจะมีความสมดุลและซับซ้อนกว่า ความ funky บางๆสามารถพัฒนาได้เมื่อเวลาผ่านไป อธิบายได้ในแบบเดียวกับอโรม่า มีรสมอลต์ต่ำในแบบ bready, grainy ความขมจะมีต่ำกว่าระดับที่สามารถรับรสได้ มีความเปรี้ยวที่ทำให้เบียร์สมดุล ไม่มีรสฮอป จบรสแบบ dry ที่เพิ่มขึ้นตามอายุ ไม่ควรพบคาแรคเตอร์ enteric, smoky, cigar-like หรือ cheesy","Mouthfeel":"มีเนื้อเบียร์บางถึงบางปานกลาง ไม่ควร watery มีรสเปรี้ยวปานกลางถึงสูง โดยไม่มีความฝาดที่บาดลิ้น เบียร์ในแบบดั้งเดิมจะดูเหมือนไม่มีความซ่า แต่ตัวอย่างจากแบบขวดจะมีคาร์โบเนชั่นปานกลางเมื่อผ่านการบ่ม","Style Comparison":"มักจะมีรสเปรี้ยวที่ง่ายกว่าและซับซ้อนน้อยกว่า Gueuze แต่มีความแตกต่างในแต่ละการผลิตมากกว่า ตามธรรมเนียมจะเสิร์ฟแบบไม่อัดลมจากเหยือก ในขณะที่ Gueuze จะบรรจุขวดและมีคาร์โบเนชั่นสูงมาก"},"tags":"standard-strength, pale-color, wild-fermented, western-europe, traditional-style, wheat-beer-family, sour","ex":"Cantillon Grand Cru Bruocsella. In the Brussels area, many specialty cafés have draught lambic from Boon, De Cam, Cantillon, Drie Fonteinen, Lindemans, Timmermans, Girardin and others.","OG":[1.04,1.054],"FG":[1.001,1.01],"IBU":[0.0,10.0],"SRM":[3.0,6.0],"ABV":[5.0,6.5]},{"c":"23E","n":"Gueuze","cat":"23","cn":"European Sour Ale","tier":"B","gen":false,"en":{"Overall Impression":"A very refreshing, highly carbonated, pleasantly sour but balanced wild Belgian wheat beer. The wild beer character can be complex and varied, combining sour, funky, and fruity flavors.","Aroma":"Moderately sour with complex but balanced funkiness accented by fruity notes. The funkiness can be moderate to strong, and can be described as barnyard, leather, earthy, goaty, hay, horsey, or horse blanket. Fruitiness is light to moderate, with a citrus fruit, citrus rind, pome fruit, or rhubarb quality. Malt is supportive, and can be lightly bready, grainy, honey, or wheat-like, if noticeable. Should not have enteric, smoky, cigar-like, or cheesy faults. No hops. Light oak acceptable. Complexity of aroma is valued more than intensity, but a balanced sour presentation is desirable.","Appearance":"Golden color, with excellent clarity and a thick, rocky, mousse-like, white head that seems to last forever. Effervescent.","Flavor":"Sour and funky on the palate, with a similar character as the aroma (same descriptors and intensities apply for funk and fruit). Low bready, grainy malt. Bitterness low to none; sourness provides most of the balance. No hop flavor. Crisp, dry finish, with a tart and funky aftertaste. Light oak, vanilla, and honey are acceptable. Should not have enteric, smoky, cigar-like, or cheesy faults. The beer should not be one dimensionally sour; a balanced, moderately sour presentation is classic, with the funky and fruity notes providing complexity. May be aged.","Mouthfeel":"Light to medium-light body; should not be watery. Has a low to high tart, puckering quality without being sharply astringent. Some versions have a very light warming character. Highly carbonated.","Style Comparison":"More complex and carbonated than a Lambic. The sourness isn’t necessarily stronger, but it tends to have more of a well-developed wild character."},"th":{"Overall Impression":"เบียร์ข้าวสาลีจากเบลเยี่ยมที่ให้ความสดชื่นสูงมีคาร์โบเนชั่นสูง มีรสเปรี้ยวที่รื่นรมย์ มีความสมดุลในสไตล์ “Wild Beer” คาแรคเตอร์ของ Wild Beer นั้นซับซ้อนและหลากหลาย โดยผสมผสานรสชาติเปรี้ยว ความ funky, และรส fruity เข้าด้วยกัน","Aroma":"เปรี้ยวปานกลางพร้อมความ funky ที่ซับซ้อนแต่สมดุล ที่เน้นด้วยกลิ่น fruity คาแรคเตอร์ funky อาจอยู่ในระดับปานกลางถึงรุนแรงสามารถพบในแบบ barnyard, leather, earthy, goaty, hay, horsey หรือ horse blanket มีความ Fruity แบบบางจนถึงปานกลางในแบบ citrus fruit, citrus rind, pome fruit หรือ rhubarb มีมอลต์ที่คอยสนับสนุน ในแบบ lightly bready, grainy, honey หรือ wheat-like ถ้าพบ ไม่ควรพบคาแรคเตอร์ enteric, smoky, cigar-like หรือ cheesy ไม่พบฮอป อาจพบ oak บางๆได้ ความซับซ้อนจากอโรม่ามีค่ามากกว่าความเข้มข้น การพบความเปรี้ยวที่สมดุลคือสิ่งที่แสวงหา","Appearance":"มีสีทอง (gold) มีความใสเป็นเลิศ ฟองหนา ฟองสีขาวคล้ายหิน เหมือนมูส ที่ดูเหมือนจะเกาะแก้วอยู่ตลอดไป ดูมีชีวิตชีวา","Flavor":"มีความเปรี้ยวและความ funky เวลารับรส มีลักษณะคล้ายคลึงกับอโรม่า (คำอธิบายและระดับความเข้มข้นที่ใช้กับกลิ่น funk และ fruit) มีมอลต์แบบ bready, grainy ระดับต่ำ ความขมต่ำถึงไม่มีเลย ความเปรี้ยวให้ความสมดุลมากที่สุด ไม่มีรสฮอป dry และ crisp มีความเปรี้ยวและ funky ใน aftertaste สามารถพบ light oak, vanilla และ honey ได้ แต่ไม่ควรพบคาแรคเตอร์ enteric, smoky, cigar-like หรือ cheesy ความเปรี้ยวในเบียร์ไม่ควรมีแค่มิติเดียว เบียร์ในแบบสมดุลที่มีความเปรี้ยวปานกลางคือความคลาสสิกที่มีคาแรคเตอร์ funky และ fruity ช่วยสร้างความซับซ้อนเบียร์อาจผ่านการบ่ม","Mouthfeel":"เนื้อเบียร์บางถึงบางปานกลาง ไม่ควร watery มีรสเปรี้ยวแบบ tart ต่ำถึงสูงโดยไม่มีความฝาดที่บาดลิ้น บางรูปแบบอาจพบคาแรคเตอร์ความอุ่นจากแอลกอฮอล์เล็กน้อย มีคาร์โบเนชั่นสูง","Style Comparison":"มีความซับซ้อนและคาร์โบเนชั่นมากกว่า Lambic ความเปรี้ยวไม่จำเป็นต้องแรงกว่าเสมอไป แต่จะมีแนวโน้มของคาแรคเตอร์ที่จะพัฒนาไปทาง wild อย่างดีมากกว่า"},"tags":"high-strength, pale-color, wild-fermented, western-europe, traditional-style, wheat-beer-family, aged, sour","ex":"3 Fonteinen Oud Gueuze, Cantillon Classic Gueuze 100% Lambic, Girardin Gueuze 1882 (Black label), Hanssens Oude Gueuze, Lindemans Gueuze Cuvée René, Oude Gueuze Boon","OG":[1.04,1.054],"FG":[1.0,1.006],"IBU":[0.0,10.0],"SRM":[5.0,6.0],"ABV":[5.0,8.0]},{"c":"23F","n":"Fruit Lambic","cat":"23","cn":"European Sour Ale","tier":"B","gen":false,"en":{"Overall Impression":"A complex, refreshing, pleasantly sour Belgian wheat beer blending a complementary fermented fruit character with a sour, funky Gueuze.","Aroma":"The specified fruit should be the dominant aroma, blending well with similar aromatics as Gueuze (same description applies, but with the addition of a fermented fruit character).","Appearance":"Like Gueuze, but modified by the color of the fruit used, fading in intensity with age. Clarity is often good, although some fruit will not drop bright. If highly carbonated in the traditional manner, will have a thick rocky, generally long-lasting, mousse-like head, sometimes with a hue reflecting the added fruit.","Flavor":"Combines the flavor profile of a Gueuze (same description applies) with noticeable flavor contributions from the added fruit. Traditional versions are dry and tart, with an added fermented fruit flavor. Modern versions may have a variable sweetness, which can offset the acidity. Fruit flavors also fade with age, and lose their vibrancy, so can be low to high in intensity.","Mouthfeel":"Light to medium-light body; should not be watery. Has a low to high tart, puckering quality without being sharply astringent. Some versions have a light warming character. Carbonation can vary from sparkling to nearly still.","Style Comparison":"A Gueuze with fruit, not just a sour Fruit Beer; the wild character must be evident."},"th":{"Overall Impression":"เบียร์ข้าวสาลีจากเบลเยี่ยม มีความซับซ้อนสดชื่น ความเปรี้ยวที่รื่นรมย์ ผสมผสานคาแรคเตอร์ผลไม้หมักรวมกับความเปรี้ยวแบบ Gueuze ที่ funky","Aroma":"ผลไม้ที่ใช้ควรจะสร้างกลิ่นหอมที่โดดเด่น ผสมผสานอย่างดีกับอโรม่าที่คล้ายคลึงกันกับ Gueuze (ใช้คำอธิบายเดียวกัน แต่เพิ่มคาแรคเตอร์ผลไม้หมัก)","Appearance":"เหมือน Gueuze แต่ถูกดัดแปลงโดยสีของผลไม้ที่ใช้ และความเข้มข้นจะค่อยๆจางลงตามอายุ มักจะมีความใส แม้ว่าผลไม้บางชนิดจะไม่สดใส หากมีคาร์โบเนชั่นสูงในแบบดั้งเดิมฟองจะคล้ายหินที่หนา ที่คงอยู่นาน คล้ายมูส บางครั้งก็มีสีที่สะท้อนถึงผลไม้ที่เติมเข้าไป","Flavor":"รวมโปรไฟล์รสชาติของ Gueuze (ใช้คำอธิบายเดียวกัน) กับรสชาติที่ชัดเจนจากผลไม้ที่เพิ่มเข้าไป แบบดั้งเดิมจะเปรี้ยว tart และ dry ผสมด้วยรสชาติของผลไม้หมัก ในแบบสมัยใหม่จะมีความหวานที่หลากหลายที่สามารถชดเชยรส acidity รสชาติของผลไม้จะค่อยๆหายไปตามเวลาและจะสูญเสียความมีชีวิตชีวา ดังนั้นอาจพบความเข้มข้นต่ำถึงสูง","Mouthfeel":"เนื้อเบียร์บางถึงบางปานกลาง ไม่ควร watery มีรสเปรี้ยวแบบ tart ในระดับต่ำถึงสูงโดยไม่มีความฝาดที่บาดลิ้น บางแบบมีคาแรคเตอร์ที่อุ่นเล็กน้อย สามารถมีคาร์โบเนชั่นในแบบซ่าจนถึงเกือบไร้ความซ่า","Style Comparison":"เป็น Gueuze ที่ใส่ผลไม้ ไม่ใช่แค่เบียร์ผลไม้รสเปรี้ยว คาแรคเตอร์จะต้องชัดเจน"},"tags":"standard-strength, pale-color, wild-fermented, western-europe, tradi
