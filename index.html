<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"></head><body><script>window.BJCP_CONFIG={syncUrl:"https://script.google.com/macros/s/AKfycbzSJ3BUqC9vn26dyPXTidnPi42AB_q4k_VN398ePniZ0m3EQN7cvC5jrxdCspuwmAUs/exec"};</script>
<title>BJCP Daily Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a taproom game board — HUD header (level, streak, clock), a pint that fills with today's style colour, a zig-zag quest map of six stations, chunky 3D answer buttons and a bottom action bar */
:root{
  --paper:#EDF0E6; --card:#FFFFFF; --ink:#22201A; --muted:#66655A; --line:#D3D6C8;
  --amber:#E8920F; --amber-deep:#A9600A; --amber-ink:#1E1404; --amber-soft:#FBE7C4;
  --hop:#3F7A32; --hop-deep:#2C5823; --hop-soft:#DDEBD3;
  --ok:#2B9A57; --ok-deep:#1F7340; --ok-soft:#DCF3E4; --bad:#D4473B; --bad-deep:#A3322A; --bad-soft:#FADDD9;
  --glass:#E4EAE0; --foam:#FFFDF6; --mark:#FFE59A;
  --f-display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Mitr",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16140F; --card:#221F18; --ink:#F1EBDD; --muted:#A79F8E; --line:#3A352C;
  --amber:#F3A738; --amber-deep:#B9720F; --amber-ink:#1E1404; --amber-soft:#3F2D12;
  --hop:#93C26A; --hop-deep:#5F8A3F; --hop-soft:#25321B;
  --ok:#4FCB82; --ok-deep:#2F9A5B; --ok-soft:#163525; --bad:#F27466; --bad-deep:#B84A3E; --bad-soft:#3E1C18;
  --glass:#2C2922; --foam:#F6F0DF; --mark:#6A5517; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16140F; --card:#221F18; --ink:#F1EBDD; --muted:#A79F8E; --line:#3A352C;
  --amber:#F3A738; --amber-deep:#B9720F; --amber-ink:#1E1404; --amber-soft:#3F2D12;
  --hop:#93C26A; --hop-deep:#5F8A3F; --hop-soft:#25321B;
  --ok:#4FCB82; --ok-deep:#2F9A5B; --ok-soft:#163525; --bad:#F27466; --bad-deep:#B84A3E; --bad-soft:#3E1C18;
  --glass:#2C2922; --foam:#F6F0DF; --mark:#6A5517; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0;
  background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 0);background-size:22px 22px}
body.running{padding-bottom:110px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 72px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,6vw,2.3rem)} h2{font-size:1.45rem} h3{font-size:1.08rem;font-weight:500}
.ico{width:20px;height:20px;flex:none;vertical-align:-4px}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.eyebrow .ico{width:16px;height:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
section.view{padding-top:18px}

/* header HUD */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.12rem;display:flex;align-items:center;gap:8px}
.brand em{font-style:normal;color:var(--amber)}
.brand .glass{width:15px;height:21px;border-radius:2px 2px 6px 6px;background:linear-gradient(var(--foam) 0 26%,var(--amber) 26%);border:2px solid var(--ink)}
.hud{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lv{display:flex;align-items:center;gap:6px}
.lvdisc{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--amber);color:var(--amber-ink);font:600 1.2rem var(--f-display);box-shadow:inset 0 -4px 0 var(--amber-deep);flex:none}
.lvdisc.sm{width:30px;height:30px;font-size:.92rem;box-shadow:inset 0 -3px 0 var(--amber-deep)}
.lvtxt{display:flex;flex-direction:column;gap:2px;font:500 .72rem var(--f-display);color:var(--muted);min-width:84px}
.xpbar{display:block;height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--amber);border-radius:9px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.pill{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:999px;padding:1px 9px;font:500 .82rem var(--f-mono);background:var(--card);font-variant-numeric:tabular-nums}
.pill b{font-weight:500}
.pill.streak{color:var(--amber);border-color:var(--amber-soft)}
.pill.streak b{color:var(--ink)}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:600 .95rem var(--f-display)}
nav.tabs{max-width:760px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;align-items:center}
nav.tabs button{font:500 .93rem var(--f-display);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:6px 10px 7px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--amber)}
.sync{margin-left:auto;font:400 .7rem var(--f-mono);color:var(--muted);white-space:nowrap;padding-left:8px}

/* buttons */
.btn{font:500 1rem var(--f-display);border-radius:14px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--ink);padding:9px 18px;cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.primary{background:var(--amber);border-color:var(--amber-deep);color:var(--amber-ink)}
.btn.big{font-size:1.1rem;padding:12px 26px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}

/* today hero + quest map */
.hero{display:flex;gap:18px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 20px}
.hero-glass{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.hero-count{font:500 .85rem var(--f-mono);color:var(--muted)} .hero-count b{font:600 1.2rem var(--f-display);color:var(--ink)}
.hero-txt{min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pint .beer{transition:y .8s cubic-bezier(.3,1.3,.5,1),height .8s cubic-bezier(.3,1.3,.5,1)}
.pint .b1,.pint .b2,.pint .b3{animation:rise 2.6s linear infinite}
.pint .b2{animation-delay:.9s}.pint .b3{animation-delay:1.7s}
@keyframes rise{from{transform:translateY(0);opacity:.8}to{transform:translateY(-90px);opacity:0}}
.code{font:500 .82rem var(--f-mono);border:2px solid var(--ink);border-radius:6px;padding:0 6px;white-space:nowrap}
.tierchip{font:500 .74rem var(--f-mono);border-radius:999px;padding:1px 8px;background:var(--hop-soft);color:var(--hop)}
.tierchip.tA{background:var(--amber-soft);color:var(--amber-deep)}
.okc{color:var(--ok)}
.map{display:flex;flex-direction:column;gap:10px;position:relative;padding:6px 0}
.map::before{content:"";position:absolute;left:50%;top:24px;bottom:24px;border-left:4px dotted var(--line);transform:translateX(-2px)}
.node{position:relative;display:flex;align-items:center;gap:12px;width:min(78%,420px);background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:10px 14px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.node.l{align-self:flex-start}.node.r{align-self:flex-end;flex-direction:row-reverse;text-align:right}
.node:active{transform:translateY(3px);border-bottom-width:2px}
.node .disc{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--paper);border:2px solid var(--line);color:var(--muted);flex:none}
.node .disc .ico{width:26px;height:26px}
.node .lbl{display:flex;flex-direction:column;min-width:0}.node .lbl b{font:500 1rem var(--f-display)}.node .lbl span{font-size:.82rem;color:var(--muted)}
.node.done .disc{background:var(--hop);border-color:var(--hop-deep);color:var(--card)}
.node.now{border-color:var(--amber-deep);box-shadow:0 0 0 4px var(--amber-soft)}
.node.now .disc{background:var(--amber);border-color:var(--amber-deep);color:var(--amber-ink);animation:pulse 1.6s ease-in-out infinite}
.node.empty{opacity:.6}
@keyframes pulse{50%{transform:scale(1.08)}}

/* practice modes */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:14px;cursor:pointer;font:inherit}
.mode:active{transform:translateY(3px);border-bottom-width:2px}
.mode .disc{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--amber-soft);color:var(--amber-deep);margin-bottom:4px}
.mode .disc .ico{width:24px;height:24px}
.mode b{font:500 1.02rem var(--f-display)} .mode .muted{font-size:.85rem}
.mode .mstat{font:500 .72rem var(--f-mono);color:var(--hop);margin-top:auto}

/* run screen */
.runbar{display:flex;align-items:center;gap:10px}
.meter{flex:1;height:18px;border-radius:12px;background:var(--glass);border:2px solid var(--line);overflow:hidden;position:relative}
.meter i{display:block;height:100%;border-radius:10px;transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.foamline{position:absolute;top:2px;width:12px;height:10px;border-radius:6px;background:var(--foam);transform:translateX(-12px);opacity:.85}
.combo{font:600 .85rem var(--f-display);color:var(--muted);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.combo.hot{color:var(--amber);animation:pulse .5s}
.q-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px}
.qcard{border-radius:22px;padding:20px}
.qcard.pop{animation:popc .35s}
.qcard.shake{animation:shake .4s}
@keyframes popc{40%{transform:scale(1.015)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.desc{border-left:4px solid var(--hop);padding:4px 0 4px 14px;margin:0}
.desc .lab{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--hop);display:block}
.desc p{margin:2px 0 0}
.desc .thx,.thx{color:var(--muted);font-size:.93rem;margin-top:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;font:400 .98rem var(--f-body);background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:11px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;min-width:0;transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--amber)}
.opt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.opt .k{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);font:500 .78rem var(--f-mono);color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok-deep);background:var(--ok-soft);animation:popc .35s}
.opt.ok .k{background:var(--ok);border-color:var(--ok-deep);color:var(--card)}
.opt.bad{border-color:var(--bad-deep);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);border-color:var(--bad-deep);color:var(--card)}
.opt:disabled{cursor:default}
.feedback{border-radius:14px;padding:12px 14px;border:2px dashed var(--line);background:var(--paper)}
.feedback .verdict{font:500 .74rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.src{font:400 .74rem var(--f-mono);color:var(--muted);margin-top:8px}
.tag{display:inline-block;font:500 .7rem var(--f-mono);padding:0 6px;border-radius:5px;border:1.5px solid var(--line);color:var(--muted);margin-right:4px}
.tag.src-text{border-color:var(--hop);color:var(--hop)}
.tag.src-inf{border-color:var(--amber);color:var(--amber-deep)}
mark{background:var(--mark);color:inherit;padding:0 3px;border-radius:4px}
.masked{font-family:var(--f-mono);letter-spacing:-.05em;color:var(--amber);background:var(--amber-soft);border-radius:4px;padding:0 3px}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.stages span{font:500 .74rem var(--f-display);padding:3px 10px;border-radius:999px;border:2px solid var(--line);color:var(--muted)}
.stages span.on{border-color:var(--hop);color:var(--card);background:var(--hop)}
.legend{font-size:.84rem;color:var(--muted)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--line);background:var(--card);animation:slideup .25s ease-out}
.actionbar.ok{background:var(--ok-soft);border-color:var(--ok)}
.actionbar.bad{background:var(--bad-soft);border-color:var(--bad)}
.ab-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.ab-msg{display:flex;flex-direction:column}
.ab-msg b{font:600 1.25rem var(--f-display)}
.actionbar.ok .ab-msg b{color:var(--ok)} .actionbar.bad .ab-msg b{color:var(--bad)}
.ab-msg span{font:500 .82rem var(--f-mono);color:var(--muted)}
.actionbar.ok .btn{background:var(--ok);border-color:var(--ok-deep);color:var(--card)}
.actionbar.bad .btn{background:var(--bad);border-color:var(--bad-deep);color:var(--card)}
@keyframes slideup{from{transform:translateY(100%)}}
/* slider */
.sl{display:grid;gap:6px}
.sl label{display:flex;justify-content:space-between;font:500 .95rem var(--f-display)}
.sl output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;background:var(--amber-soft);padding:0 8px;border-radius:6px}
input[type=range]{width:100%;accent-color:var(--amber);height:26px}
.srmbar{height:16px;border-radius:8px;border:2px solid var(--line);position:relative}
.rangebox{position:absolute;top:-5px;bottom:-5px;border:3px solid var(--ink);border-radius:6px}
.swatch{border-radius:3px 3px 8px 8px;border:2px solid var(--ink);flex:none}
/* toasts + bubbles */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--paper);font:500 .95rem var(--f-display);padding:8px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:drop .3s cubic-bezier(.3,1.4,.5,1);transition:opacity .4s,transform .4s;max-width:calc(100vw - 32px);text-align:center}
.toast.lvl{background:var(--amber);color:var(--amber-ink)}
.toast.badge{background:var(--hop);color:var(--card)}
.toast.out{opacity:0;transform:translate(-50%,-10px)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.bub{position:absolute;z-index:30;border-radius:50%;border:2px solid var(--amber);background:color-mix(in srgb,var(--foam) 60%,transparent);pointer-events:none;animation:bub 1.2s ease-out forwards}
@keyframes bub{to{transform:translate(var(--dx),-140px) scale(.6);opacity:0}}
/* results + badges */
.caps{display:flex;justify-content:center;gap:10px}
.cap path,.cap circle{fill:var(--line);stroke:var(--muted);stroke-width:1.5}
.cap path:last-child{stroke:var(--muted);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.4}
.cap.on path:first-child{fill:var(--amber);stroke:var(--amber-deep)}
.cap.on circle{fill:var(--amber-deep);stroke:var(--amber-deep)}
.cap.on path:last-child{stroke:var(--foam);opacity:1}
.caps .cap{width:68px;height:68px}
.caps .cap.on{animation:capin .5s cubic-bezier(.3,1.6,.5,1) backwards}
.caps .cap.on:nth-child(2){animation-delay:.15s}.caps .cap.on:nth-child(3){animation-delay:.3s}
@keyframes capin{from{transform:scale(0) rotate(-120deg)}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);opacity:.55}
.badge.on{opacity:1;border-color:var(--amber-soft)}
.badge .cap{width:46px;height:46px}
.badge b{font:500 .88rem var(--f-display)} .badge span{font-size:.74rem;color:var(--muted)}
.prof{display:flex;gap:14px;align-items:center}
.prof .lvdisc{width:64px;height:64px;font-size:1.7rem}
/* lists, stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:2px}
.stat .v{font:600 1.6rem var(--f-display);font-variant-numeric:tabular-nums}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hop);border-radius:9px}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 12px;font-size:.92rem}
.kv>div:nth-child(odd){color:var(--muted)}
.search{width:100%;font:400 1rem var(--f-body);padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.slist{display:grid;border:2px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.srow:first-child{border-top:0}
.srow .nm{min-width:0}
.tierpick{display:flex;gap:3px}
.tierpick button{font:500 .74rem var(--f-mono);min-width:28px;height:28px;border:2px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;cursor:pointer}
.tierpick button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--hop)}
textarea{width:100%;min-height:90px;font:400 .8rem var(--f-mono);padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:.86rem;color:var(--muted);cursor:pointer}
@media (max-width:560px){
  .hero{flex-direction:row;padding:14px}
  .lvtxt{display:none}
  .node{width:88%}
  .sync{display:none}
  .brand em{display:none}
  .top-in{flex-wrap:nowrap}
  .pill{padding:1px 7px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="glass" aria-hidden="true"></span><span>BJCP <em>Daily Flight</em></span></div>
    <div class="hud">
      <div class="lv" title="เลเวล"><span class="lvdisc sm" id="c-lv">1</span><span class="lvtxt"><span id="c-title">มือใหม่หัดจิบ</span><span class="xpbar"><i id="c-xp" style="width:0%"></i></span></span></div>
      <span class="pill streak" title="วันติดต่อกัน"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3.5 5 5.5 5 10.5A5 5 0 0 1 7 12.5c0-2 1-3.5 2-4.5.3 2 1.3 3 2.5 3.5C11 9 11 5 12 2z"/></svg><b id="c-streak">0</b></span>
      <span class="pill" title="เวลาฝึกวันนี้ เป้า 30 นาที"><b id="c-time">0:00</b><span class="muted">/30</span></span>
      <button class="iconbtn" id="snd" aria-label="ปิดเสียง"></button>
    </div>
  </div>
  <nav class="tabs" role="tablist">

<script>
const STYLES=[{"c":"1A","n":"American Light Lager","cat":"1","cn":"Standard American Beer","tier":"A","gen":false,"en":{"Overall Impression":"A highly carbonated, very light-bodied, nearly flavorless lager designed to be consumed very cold. Very refreshing and thirst-quenching.","Aroma":"Low malt aroma optional, but may be perceived as grainy, sweet, or corn-like, if present. Light spicy, floral, or herbal hop aroma optional. While a clean fermentation profile is desirable, a light amount of yeast character is not a fault.","Appearance":"Very pale straw to pale yellow color. White, frothy head seldom persists. Very clear.","Flavor":"Relatively neutral palate with a crisp, dry finish and a low to very low grainy or corn-like flavor that might be perceived as sweetness due to the low bitterness. Low floral, spicy, or herbal hop flavor optional, but is rarely strong enough to detect. Low to very low bitterness. Balance may vary from slightly malty to slightly bitter, but is usually close to even. High carbonation may accentuate the crispness of the dry finish. Clean fermentation profile.","Mouthfeel":"Very light, sometimes watery, body. Very highly carbonated with slight carbonic bite on the tongue.","Style Comparison":"A lighter-bodied, lower-alcohol, lower calorie version of an American Lager. Less hop character and bitterness than a German Leichtbier."},"th":{"Overall Impression":"เบียร์ลาเกอร์ที่มีคาร์โบเนชั่นสูง เนื้อเบียร์บางที่สุด เบียร์แบบที่แทบไม่มีรสชาติอะไรเด่นชัด ออกแบบมาให้เหมาะกับการดื่มแบบเย็นจัด สดชื่นและดับกระหาย","Aroma":"อาจพบอโรม่าจากมอลต์ในระดับต่ำได้ บางทีอาจให้ความรู้สึกถึง grainy ที่มีความหวานหรือลักษณะคล้ายข้าวโพด สามารถมีอโรม่าจากฮอปในแบบ light spicy, floral, herbal ได้ มีโปรไฟล์การหมักที่สะอาดอาจจะมีคาแรคเตอร์จากยีสต์ได้เล็กน้อย","Appearance":"สีฟางข้าว สีอ่อนมาก (very pale straw) จนถึงสีเหลืองอ่อน (pale yellow) มีฟองสีขาว แต่ฟองจะเกาะอยู่กับแก้วได้ไม่นาน น้ำเบียร์ใสมาก","Flavor":"รสชาติเป็นกลางแต่มีความคม จบรสแบบ dry อาจพบรส grain หรือ corn ในระดับต่ำจนถึงต่ำมากที่ให้รสหวาน เพราะเบียร์มีความขมต่ำอาจพบคาแรคเตอร์จากฮอปในแบบ floral, spicy และ herbal ในระดับต่ำได้ แต่ยากที่จะพบ มีความขมในระดับต่ำจนถึงต่ำมาก ความสมดุลมีหลากหลายตั้งแต่มีความ malty เล็กน้อยไปจนถึงมีความขมเล็กน้อย แต่มักจะเสมอกัน มีคาร์โบเนชั่นที่สูง ช่วยเพิ่มความ crisp จากความ dry ตอนจบ มีโปรไฟล์การหมักที่สะอาด","Mouthfeel":"บางเบา บางครั้งจะออก watery มีคาร์โบเนชั่นสูงมากจนอาจจะพบอาการกัดลิ้นจากความซ่า","Style Comparison":"American Lager รุ่นที่มีแอลกอฮอล์ต่ำและมีแคลอรีต่ำ ฮอปไม่โดดเด่น และมีความขมน้อยกว่าเยอรมัน Leichtbier"},"tags":"session-strength, pale-color, bottom-fermented, lagered, north-america, traditional-style, pale-lager-family, balanced","ex":"Bud Light, Coors Light, Grain Belt Premium Light American Lager, Michelob Light, Miller Lite, Old Milwaukee Light","OG":[1.028,1.04],"FG":[0.998,1.008],"IBU":[8.0,12.0],"SRM":[2.0,3.0],"ABV":[2.8,4.2]},{"c":"1B","n":"American Lager","cat":"1","cn":"Standard American Beer","tier":"A","gen":false,"en":{"Overall Impression":"A very pale, highly-carbonated, light- bodied, well-attenuated lager with a very neutral flavor profile and low bitterness. Served very cold, it can be a very refreshing and thirst-quenching drink.","Aroma":"Low malt aroma optional, but may be perceived as grainy, sweet, or corn-like, if present. Light spicy or floral hop aroma optional. While a clean fermentation profile is desirable, a light amount of yeast character is not a fault.","Appearance":"Very pale straw to medium yellow color. White, frothy head seldom persists. Very clear.","Flavor":"Relatively neutral palate with a crisp, dry finish and a moderately-low to low grainy or corn-like flavor that might be perceived as sweetness due to the low bitterness. Moderately low hop flavor optional, with a floral, spicy, or herbal quality, if strong enough to distinguish. Low to medium-low bitterness. Balance may vary from slightly malty to slightly bitter, but is usually close to even. High carbonation may accentuate the crispness of the dry finish. Clean fermentation profile.","Mouthfeel":"Low to medium-low body. Very highly carbonated with slight carbonic bite on the tongue.","Style Comparison":"Stronger, more flavor and body than an American Light Lager. Less bitterness and flavor than an International Pale Lager. Significantly less flavor, hops, and bitterness than traditional European Pilsners. OG: 1.040 – 1.050"},"th":{"Overall Impression":"เบียร์ลาเกอร์ที่สีอ่อนมาก มีคาร์โบเนชั่นสูงเนื้อเบียร์บางเบา ผ่านการหมักมาอย่างดี ให้รสชาติที่เป็นกลางและมีความขมต่ำ ควรเสิร์ฟที่อุณหภูมิเย็นจัด เป็นเครื่องดื่มที่สดชื่นและดับกระหาย","Aroma":"อาจมีอโรม่าจากมอลต์ในระดับต่ำได้ แต่ต้องให้ความรู้สึกถึง grain ที่มีความหวาน หรือลักษณะคล้ายข้าวโพด อาจพบอโรม่าจากฮอปในแบบ spicy, floral ในระดับต่ำได้ มีโปรไฟล์การหมักที่สะอาด แม้จะเหลือคาแรคเตอร์จากยีสต์อยู่บ้างก็ไม่ถือเป็นข้อผิดพลาด","Appearance":"สีออกไปทางสีฟางอ่อนมาก (very pale straw) จนถึงสีเหลืองปานกลาง (medium yellow) มีฟองสีขาว แต่ฟองจะเกาะอยู่กับแก้วไม่นาน มีความใสมาก","Flavor":"รสชาติเป็นกลางแต่มีความคม จบรสแบบ dry อาจพบรส grain หรือ corn ในระดับต่ำปานกลางจนถึงต่ำ ที่ทำให้รู้สึกหวานจากการที่มีความขมต่ำ สามารถมีรสฮอปในระดับปานกลางได้ ในแบบ floral, spicy และ herbal ถ้าชัดเจนพอที่จะแยกแยะได้ มีความขมในระดับต่ำถึงต่ำปานกลาง ความสมดุลมีได้หลากหลายตั้งแต่มีความ malty เล็กน้อยไปจนถึงมีความขมเล็กน้อย แต่มักจะเสมอกัน คาร์โบเนชั่นที่สูงจะเพิ่มความ crisp จากความ dry ตอนจบ มีโปรไฟล์การหมักที่สะอาด","Mouthfeel":"เนื้อเบียร์บางจนถึงบางปานกลาง มีคาร์โบเนชั่นสูงมากจนอาจจะพบอาการกัดลิ้นจากความซ่า","Style Comparison":"หนักแน่น มีรสชาติและเนื้อสัมผัสที่เข้มข้นกว่า American Light Lager มีความขมและรสชาติน้อยกว่า International Pale Lager มีรสชาติจากฮอปและความขมน้อยกว่า Pilsners แบบดั้งเดิมของยุโรปอย่างเห็นได้ชัด"},"tags":"standard-strength, pale-color, bottom-fermented, lagered, north-america, traditional-style, pale-lager-family, balanced","ex":"Budweiser, Coors Original, Grain Belt Premium American Lager, Miller High Life, Old Style, Pabst Blue Ribbon, Special Export","OG":[1.04,1.05],"FG":[1.004,1.01],"IBU":[8.0,18.0],"SRM":[2.0,3.5],"ABV":[4.2,5.3]},{"c":"1C","n":"Cream Ale","cat":"1","cn":"Standard American Beer","tier":"B","gen":false,"en":{"Overall Impression":"A clean, well-attenuated, highly carbonated, flavorful American “lawnmower” beer. Easily drinkable, smooth, and refreshing, with more character than typical American lagers, yet still subtle and restrained.","Aroma":"Medium-low to low malt notes, with a sweet, corn- like aroma. Low DMS optional. Medium-low hop aroma optional, using any variety but floral, spicy, or herbal notes are most common. Overall, has a subtle, balanced aroma. Low fruity esters optional.","Appearance":"Pale straw to light gold color, although usually on the pale side. Low to medium head with medium to high carbonation. Fair head retention. Brilliant, sparkling clarity. Effervescent.","Flavor":"Low to medium-low hop bitterness. Low to moderate malty sweetness, varying with gravity and attenuation. The malt is generally neutral, possibly grainy or crackery. Usually well-attenuated. Balanced palate, with hops only enough to support the malt. A low to moderate corny flavor is commonly found, but light DMS is optional. Finish can vary from somewhat light, dry, and crisp to faintly sweet. Clean fermentation profile, but low fruity esters are optional. Low to medium-low hop flavor of any variety, but typically floral, spicy, or herbal. Subtle.","Mouthfeel":"Generally light and crisp, although body can reach medium. Smooth mouthfeel with medium to high attenuation; higher attenuation levels can lend a “thirst quenching” quality. High carbonation.","Style Comparison":"Similar to a Standard American Lager, but with more character. Lighter body, smoother, and more carbonated than a Blonde Ale. May seem like a somewhat subtle Kölsch."},"th":{"Overall Impression":"เบียร์ที่คลีน ยีสต์จัดการกับน้ำตาลอย่างดี มีคาร์โบเนชั่นสูง เบียร์เต็มรสชาติแบบอเมริกันที่ได้ฉายาว่า “lawnmower” (เบียร์ที่เอาไว้ดื่มเวลาตัดหญ้าหรือทำงานสนาม ส่วนมากจะเป็น American Light Lager) ดื่มง่าย นุ่มนวล และสดชื่น มีคาแรคเตอร์มากกว่า American Lager ทั่วไป แต่ยังคงความอ่อนละมุน ละเอียดอ่อน","Aroma":"มีอโรม่าจากมอลต์ในระดับต่ำจนถึงต่ำปานกลาง มีกลิ่นหอมคล้ายข้าวโพด สามารถมี DMS ในระดับต่ำได้ มีอโรม่าจากฮอปในระดับต่ำปานกลางได้ จะเลือกให้อโรม่ามีกลิ่นแบบไหนก็ได้ แต่ปกติจะเป็นกลิ่น floral, spicy หรือ herbal โดยรวมแล้วมีกลิ่นหอมที่ละเอียดอ่อนและสมดุลสามารถมี ester บางๆ แบบ fruity ได้","Appearance":"มีสีฟางอ่อน (pale straw) ถึงสีทองอ่อน (light gold) โดยทั่วไปแล้วจะอยู่ด้านสีอ่อน มีฟองในระดับต่ำถึงปานกลาง มีคาร์โบเนชั่นปานกลางถึงสูง ฟองคงอยู่กับแก้วแบบพอใช้ ดูสว่างไสว เปล่งประกาย มีชีวิตชีวา","Flavor":"มีความขมจากฮอปในระดับต่ำถึงต่ำปานกลาง มีความหวานจากมอลต์ในระดับต่ำถึงปานกลาง แปรผันตาม gravity ของเบียร์และการทำงานของยีสต์ มอลต์โดยทั่วไปจะให้รสกลางๆ อาจมีรส grainy หรือ crackery มักจะหมักมาอย่างดี การรับรสจะเป็นแบบกลาง มีฮอปเพียงพอที่ช่วยเสริมรสมอลต์ โดยทั่วไปจะพบรส corny ในระดับต่ำถึงปานกลางสามารถมี DMS ในระดับต่ำได้ รสชาติตอนจบมีได้ตั้งแต่ บาง dry และ crisp ไปจนถึงจบแบบหวาน มีโปรไฟล์การหมักที่สะอาด สามารถมี ester แบบ fruity บางๆได้ มีรสฮอปในระดับต่ำถึงต่ำปานกลางได้หลายรูปแบบส่วนมากจะเป็นคาแรคเตอร์ของ floral, spicy หรือ herbal ที่ละเอียดอ่อน","Mouthfeel":"โดยทั่วไปแล้วจะบางและ crisp แม้ว่าเนื้อเบียร์อาจจะหนาไปถึงแบบกลางได้ มีรสสัมผัสนุ่มนวลด้วยการจัดการน้ำตาลของยีสต์ระดับปานกลางถึงสูง มีคาร์โบเนชั่นสูง","Style Comparison":"คล้ายกับ American Lager แบบมาตรฐาน แต่มีลักษณะเฉพาะมากกว่า เนื้อเบียร์ที่เบากว่า นุ่มนวลกว่า และมีคาร์โบเนชั่นมากกว่า Blonde Ale อาจดูเหมือน Kölsch ในแบบที่นุ่มนวลกว่า"},"tags":"standard-strength, pale-color, any-fermentation, north-america, traditional-style, pale-ale-family, balanced","ex":"Genesee Cream Ale, Liebotschaner Cream Ale, Kiwanda Pre-Prohibition Cream Ale, Little Kings Cream Ale, Sleeman Cream Ale, Sun King Sunlight Cream Ale","OG":[1.042,1.055],"FG":[1.006,1.012],"IBU":[8.0,20.0],"SRM":[2.0,5.0],"ABV":[4.2,5.6]},{"c":"1D","n":"American Wheat Beer","cat":"1","cn":"Standard American Beer","tier":"A","gen":false,"en":{"Overall Impression":"A pale, refreshing grainy, doughy, or bready wheat beer with a clean fermentation profile and a variable hop character and bitterness. Its lighter body and higher carbonation contribute to its easy-drinking nature.","Aroma":"Low to moderate grainy, bready, or doughy wheat character. A light to moderate malty sweetness is acceptable. Moderate esters optional, usually a neutral profile; banana is inappropriate. Low to moderate citrusy, spicy, floral, or fruity hop aroma. Not typically dry-hopped. No clove phenols.","Appearance":"Usually pale yellow to gold. Clarity may range from brilliant to hazy with yeast approximating a Weissbier. Big, long-lasting white head.","Flavor":"Light to moderately-strong bready, doughy, or grainy wheat flavor, which can linger into the finish. May have a moderate malty sweetness or can finish quite dry and crisp. Low to moderate hop bitterness, sometimes lasting into the finish. Balance is usually even, but may be slightly bitter. Low to moderate citrusy, spicy, floral, or fruity hop flavor. Moderate esters optional. No banana. No clove phenols.","Mouthfeel":"Medium-light to medium body. Medium-high to high carbonation. Slight creaminess is optional; wheat beers sometimes have a soft, ‘fluffy’ impression.","Style Comparison":"More hop character and less yeast character than Weissbier. Never with the banana and clove character of Weissbier. Generally has the same range and balance as Blonde Ales, but with a wheat character as the primary malt flavor."},"th":{"Overall Impression":"เบียร์สีอ่อน เป็นเบียร์ข้าวสาลีที่ให้ความสดชื่นจากคาแรคเตอร์ของ grainy, doughy หรือ bready ด้วยโปรไฟล์การหมักที่สะอาดพร้อมด้วยความหลากหลายจากฮอปทั้งด้านคาแรคเตอร์และความขม มีเนื้อเบียร์ที่บางกว่าและคาร์โบเนชั่นที่มากกว่า ช่วยทำให้เป็นเบียร์ที่ดื่มง่ายโดยธรรมชาติ","Aroma":"มีคาแรคเตอร์แบบ grainy, bready หรือ doughy wheat ในระดับต่ำถึงปานกลาง ความหอมหวานจากมอลต์ในระดับต่ำถึงปานกลางเป็นสิ่งที่ยอมรับได้ สามารถมี ester แบบปานกลางได้ แต่ต้องมีโปรไฟล์แบบเป็นกลาง การมี ester แบบกล้วยไม่เหมาะสม มีกลิ่นฮอปในแบบ citrusy, spicy, floral หรือ fruity ได้ในแบบต่ำถึงปานกลาง ปกติจะไม่มีการ dry-hop ห้ามมีกลิ่น clove phenol","Appearance":"ปกติจะมีสีเหลืองอ่อน (pale yellow) ถึงสีทอง (gold) มีความใส อาจมีตั้งแต่สว่างใสไปจนถึงขุ่นจากยีสต์ คล้ายในแบบ Weissbier มีฟองขนาดใหญ่สีขาว ฟองเกาะติดแก้วได้นาน","Flavor":"มีรสจาก wheat ในแบบ bready, doughy หรือ grainy ในแบบอ่อนจนถึงเข้มปานกลาง ที่สามารถยาวไปจนถึงตอนจบรส อาจมีความหวานจากมอลต์แบบกลางในตอนจบหรือจะจบแบบ dry และ crisp ก็ได้สามารถมีความขมจากฮอปแบบน้อยจนถึงปานกลาง ที่บางทีจะลากยาวไปถึงตอนจบ ปกติจะเป็นเบียร์ที่สมดุลแต่สามารถขมได้เล็กน้อย มีรส citrusy, spicy, floral หรือ fruity จากฮอปในระดับต่ำถึงปานกลาง สามารถมี ester แบบปานกลางได้ แต่ห้ามมีคาแรคเตอร์ banana และ clove phenol","Mouthfeel":"มีเนื้อเบียร์บางปานกลางจนถึงปานกลาง มีคาร์โบเนชั่นระดับปานกลางถึงสูง อาจมีความครีมมี่เล็กน้อยได้ wheat เบียร์บางครั้งจะให้ความรู้สึก ‘fluffy’","Style Comparison":"มีคาแรคเตอร์จากฮอปในระดับสูงและมีคาแรคเตอร์ของยีสต์น้อยกว่า Weissbier ไม่ควรมีคาแรคเตอร์ของ banana และ clove แบบ Weissbier โดยทั่วไปจะอยู่ในระดับและความสมดุลเดียวกันกับ Blonde Ales แต่มีคาแรคเตอร์ของ wheat มอลต์มากกว่า"},"tags":"standard-strength, pale-color, any-fermentation, north-america, craft-style, wheat-beer-family, balanced","ex":"Bell’s Oberon, Boulevard Unfiltered Wheat Beer, GoodLife Sweet As! Pacific Ale, Goose Island 312 Urban Wheat Ale, Widmer Hefeweizen","OG":[1.04,1.055],"FG":[1.008,1.013],"IBU":[15.0,30.0],"SRM":[3.0,6.0],"ABV":[4.0,5.5]},{"c":"2A","n":"International Pale Lager","cat":"2","cn":"International Lager","tier":"A","gen":false,"en":{"Overall Impression":"A highly-attenuated pale lager without strong flavors, typically well-balanced and highly carbonated. Served cold, it is refreshing and thirst-quenching.","Aroma":"Low to medium-low grainy-malty or slightly corny- sweet malt aroma. Very low to medium spicy, floral, or herbal hop aroma. Clean fermentation profile.","Appearance":"Pale straw to gold color. White, frothy head may not be long lasting. Very clear.","Flavor":"Low to moderate levels of grainy-malt flavor, medium-low to medium bitterness, with a crisp, dry, well- attenuated finish. The grain character can be somewhat neutral, or show a light bready-crackery quality. Moderate corny or malty sweetness optional. Medium floral, spicy, or herbal hop flavor optional. Balance may vary from slightly malty to slightly bitter, but is usually relatively close to even. Neutral aftertaste with light malt and sometimes hop flavors.","Mouthfeel":"Light to medium body. Moderately high to highly carbonated. Can have a slight carbonic bite on the tongue.","Style Comparison":"Generally more bitter and filling than American Lager. Less hoppy and bitter than a German Pils. Less body, malt flavor, and hop character than a Czech Premium Pale Lager. More robust versions can approach a Munich Helles in flavor, but with more of an adjunct quality."},"th":{"Overall Impression":"ลาเกอร์สีอ่อนที่ยีสต์จัดการกับน้ำตาลได้อย่างดี โดยไม่มีรสชาติที่เข้มข้น ทั่วไปจะเป็นเบียร์ที่มีความสมดุลและคาร์โบเนชั่นสูง เป็นเบียร์ที่ควรเสิร์ฟเย็น สดชื่นดับกระหาย","Aroma":"มีกลิ่นมอลต์แบบ grainy หรือกลิ่นหวานจากข้าวโพดในระดับต่ำจนถึงต่ำปานกลาง มีกลิ่นฮอปแบบ spicy, floral หรือ herbal ในระดับปานกลางจนถึงต่ำมาก มีโปรไฟล์การหมักที่สะอาด","Appearance":"สีออกไปทางฟางสีอ่อน (pale straw) จนถึงสีทอง (gold) ฟองสีขาวอาจอยู่ได้ไม่นาน เนื้อเบียร์ใสมาก","Flavor":"มีรสมอลต์แบบ grainy ในระดับต่ำถึงปานกลาง ความขมปานกลางถึงต่ำปานกลาง มีความ crisp มีความ dry และยีสต์จัดการน้ำตาลดีในตอนจบรส รสจาก grain จะออกรสกลางและมีคาแรคเตอร์ของ bready- crackery เล็กน้อย อาจจะมีรสหวานจากมอลต์และข้าวโพดแบบกลางๆได้สามารถมีรสฮอปแบบ floral, spicy หรือ herbal แบบกลางๆได้ ความสมดุลมีได้ทั้งจากมอลต์หรือจากความขมแต่ทั่วไปจะพอๆกัน aftertaste แบบกลางพร้อมคาแรคเตอร์ของมอลต์และฮอปอ่อนๆ","Mouthfeel":"เนื้อเบียร์แบบกลางจนถึงบาง คาร์โบเนชั่นสูงปานกลางจนถึงสูง อาจมีการกัดลิ้นจากความซ่าได้เล็กน้อย","Style Comparison":"โดยทั่วไปแล้วจะขมและรสแน่นกว่า American Lager มีรสฮอปและความขมน้อยกว่า German Pils มีเนื้อเบียร์บาง รสมอลต์ และคาแรคเตอร์ของฮอปน้อยกว่า Czech Premium Pale Lager แบบที่แรงกว่าสามารถใกล้เคียง Munich Helles ในด้านรสชาติ แต่ก็จะรู้สึกถึง adjunct มากกว่า"},"tags":"standard-strength, pale-color, bottom-fermented, lagered, traditional-style, pale-lager-family, balanced","ex":"Asahi Super Dry, Birra Moretti, Corona Extra, Devils Backbone Gold Leaf Lager, Full Sail Session Premium Lager, Heineken, Red Stripe, Singha","OG":[1.042,1.05],"FG":[1.008,1.012],"IBU":[18.0,25.0],"SRM":[2.0,6.0],"ABV":[4.5,6.0]},{"c":"2B","n":"International Amber Lager","cat":"2","cn":"International Lager","tier":"B","gen":false,"en":{"Overall Impression":"A smooth, easily-drinkable, malty amber lager with a flavorful caramel or toast character. Usually fairly well-attenuated, often with an adjunct quality and restrained bitterness.","Aroma":"Low to moderate grainy malt aroma often with very low to moderate caramel or toasty malt accents. Occasionally, nutty or biscuity, but never roasty. Low, unobtrusive floral or spicy hop aroma. Clean fermentation profile.","Appearance":"Golden-amber to reddish-copper color. Bright clarity. White to off-white foam stand which may not last.","Flavor":"Low to moderate malt flavor, often with caramel or toasty-bready flavors. Low to medium-low corny sweetness optional. Low to moderate bitterness, giving the beer a malty to fairly even balance. Low to moderate spicy, herbal, or floral hop flavor. Clean fermentation profile. The finish is moderately dry with a moderately malty aftertaste. The beer may seem a touch sweet if the bitterness level is low.","Mouthfeel":"Light to medium body. Medium to high carbonation. Smooth. Some examples can be slightly creamy.","Style Comparison":"Less well-developed malt flavor than a Vienna Lager, often with an adjunct taste. Less robust flavor and bitterness than Altbier."},"th":{"Overall Impression":"เบียร์ที่นุ่มลื่น ดื่มง่ายเป็น amber lager ที่เต็มไปด้วยรสชาติ malty และรสของ caramel กับ toasty มักจะผ่านการจัดการน้ำตาลที่เหมาะสมของยีสต์ ส่วนมากใช้ adjunct และมีความขมที่กำหนดมาแล้ว","Aroma":"มีกลิ่นจากมอลต์แบบ grainy น้อยจนถึงปานกลาง มักมีกลิ่น caramel ต่ำถึงปานกลางหรือกลิ่น toasty บางครั้งจะมีกลิ่น nutty หรือ biscuity แต่ห้ามมี roasty อาจพบกลิ่นฮอปแบบ floral หรือ spicy บางๆมีโปรไฟล์การหมักที่สะอาด","Appearance":"มีสีทองแดง (golden-amber) จนถึงแดง (reddish- copper) มีความใสและสว่าง ฟองสีขาวถึงขาวขุ่น แต่จะเกาะอยู่กับแก้วไม่นาน","Flavor":"มีรสมอลต์ในระดับต่ำถึงปานกลาง มักมีรส caramel หรือ toasty-bready สามารถมีรสหวานแบบ corny ได้ต่ำถึงปานกลาง มีความขมได้ต่ำถึงปานกลางที่เข้าไปผสมกับความ malty แล้วออกมาสมดุล มีรสฮอปในแบบ spicy, herbal หรือ floral ในระดับต่ำถึงปานกลางได้ มีโปรไฟล์การหมักที่สะอาด ตอนจบรสต้อง dry ปานกลางที่มาพร้อมกับความ malty แบบกลางใน aftertaste ตัวเบียร์จะรู้สึกหวานถ้าความขมต่ำ","Mouthfeel":"เนื้อเบียร์ปานกลางจนถึงบาง มีคาร์โบเนชั่นปานกลางจนถึงสูง นุ่มลื่น บางตัวอย่างอาจพบความ creamy เล็กน้อย","Style Comparison":"มีรสชาติมอลต์ แต่น้อยกว่า Vienna Lager ปกติจะมีรสจาก adjunct มีรสชาติความเข้มข้นและความขมน้อยกว่า Altbier"},"tags":"standard-strength, amber-color, bottom-fermented, lagered, traditional-style, amber-lager-family, malty","ex":"Abita Amber Lager, Brooklyn Lager, Capital Wisconsin Amber Lager, Dos Equis Amber, Grain Belt NordEast, Yuengling Lager","OG":[1.042,1.055],"FG":[1.008,1.014],"IBU":[8.0,25.0],"SRM":[6.0,14.0],"ABV":[4.5,6.0]},{"c":"2C","n":"International Dark Lager","cat":"2","cn":"International Lager","tier":"B","gen":false,"en":{"Overall Impression":"A darker, richer, and somewhat sweeter version of international pale lager with a little more body and flavor, but equally restrained in bitterness. The low bitterness leaves the malt as the primary flavor element, and the low hop levels provide very little in the way of balance.","Aroma":"Faint malt aroma. Medium-low roast and caramel malt aroma optional. Light spicy, herbal, or floral hop aroma optional. Clean fermentation profile.","Appearance":"Deep amber to very dark brown with bright clarity and ruby highlights. Foam stand may not be long lasting, and is beige to light tan in color.","Flavor":"Low to medium sweet maltiness. Medium-low caramel or roasted malt flavors optional, possibly with hints of coffee, molasses, brown sugar, or cocoa. Low floral, spicy, or herbal hop flavor optional. Low to medium bitterness. May have a very light fruitiness. Moderately crisp finish. The balance is typically somewhat malty. Burnt or moderately strong roasted malt flavors are inappropriate.","Mouthfeel":"Light to medium-light body. Smooth with a light creaminess. Medium to high carbonation.","Style Comparison":"Less flavor and richness than Munich Dunkel, Schwarzbier, or other dark lagers. Frequently uses adjuncts, as is typical of other International Lagers."},"th":{"Overall Impression":"สีเข้มกว่า รสเข้มกว่า บางทีหวานกว่า International Pale lager แต่มีเนื้อเบียร์และรสชาติมากกว่ามีความขมที่ถูกคุมเอาไว้ ด้วยความขมที่ต่ำทำให้มอลต์กลายเป็นรสชาติหลัก การที่มีฮอปต่ำช่วยทำให้เบียร์สมดุลเล็กน้อย","Aroma":"กลิ่นมอลต์อ่อนๆ สามารถมีคาแรคเตอร์คั่วและ caramel แบบต่ำปานกลาง สามารถมีคาแรคเตอร์ฮอปแบบ spicy, herbal หรือ floral อ่อนๆได้ ต้องมีโปรไฟล์การหมักที่สะอาด","Appearance":"สีอำพันเข้ม (deep amber) ถึงน้ำตาลเข้ม (dark brown) พร้อมความใสสว่าง ฟองอาจจะไม่ติดแก้วนาน ฟองสีครีมจนถึงสีน้ำตาลอ่อน","Flavor":"มีความหวานจากมอลต์น้อยถึงปานกลาง มีรสคาราเมลหรือมอลต์คั่วได้ในระดับต่ำถึงปานกลาง โดยอาจจะเสริมด้วยคาแรคเตอร์ของ coffee, molasses, brown sugar หรือ cocoa มีคาแรคเตอร์ของฮอปแบบ floral, spicy หรือ herbal แบบบางๆได้ มีความขมต่ำถึงปานกลาง อาจจะมีความ fruity บางๆ มีความ crisp ตอนจบแบบกลางๆ ความสมดุลมาจากมอลต์ การมีกลิ่นไหม้หรือกลิ่นคั่วที่แรงไม่เหมาะสม","Mouthfeel":"มีเนื้อเบียร์แบบกลางจนถึงบาง นุ่มลื่นมีความ creamy มีคาร์โบเนชั่นแบบปานกลางจนถึงสูง","Style Comparison":"รสชาติและความเข้มข้นน้อยกว่า Munich Dunkel, Schwarzbier หรือ dark lager อื่นๆ มักใช้ adjunct แบบที่ใช้ใน International Lagers อื่นๆ"},"tags":"standard-strength, dark-color, bottom-fermented, lagered, traditional-style, dark-lager-family, malty","ex":"Baltika #4 Original, Dixie Blackened Voodoo, Heineken Dark Lager, Saint Pauli Girl Special Dark, San Miguel Dark, Shiner Bock","OG":[1.044,1.056],"FG":[1.008,1.012],"IBU":[8.0,20.0],"SRM":[14.0,30.0],"ABV":[4.2,6.0]},{"c":"3A","n":"Czech Pale Lager","cat":"3","cn":"Czech Lager","tier":"B","gen":false,"en":{"Overall Impression":"A lighter-bodied, rich, refreshing, hoppy, bitter pale Czech lager having the familiar flavors of the stronger Czech Premium Pale Lager (Pilsner-type) beer but in a lower alcohol, lighter-bodied, and slightly less intense format.","Aroma":"Light to moderate bready-rich malt combined with light to moderate spicy or herbal hop bouquet; the balance between the malt and hops may vary. Faint hint of caramel is acceptable. Light (but never intrusive) diacetyl and light, fruity esters are optional. No sulfur.","Appearance":"Light yellow to deep gold color. Brilliant to very clear, with a long-lasting, creamy white head.","Flavor":"Medium-low to medium bready-rich malt flavor with a rounded, hoppy finish. Low to medium-high spicy or herbal hop flavor. Bitterness is prominent but never harsh. Flavorful and refreshing. Low diacetyl or fruity esters are optional, but should never be overbearing.","Mouthfeel":"Medium-light to medium body. Moderate carbonation.","Style Comparison":"A lighter-bodied, lower-intensity, refreshing, everyday version of Czech Premium Pale Lager."},"th":{"Overall Impression":"เบียร์ที่มีเนื้อเบียร์บาง รสเข้ม สดชื่น มีฮอปและความขม Czech Pale Lager มีรสชาติที่คุ้นเคยของเบียร์ Czech Premium Pale Lager (ประเภท Pilsner) แต่มีแอลกอฮอล์ที่ต่ำกว่า เนื้อเบียร์บางกว่าและมีความเข้มข้นน้อยกว่าเล็กน้อย","Aroma":"มีคาแรคเตอร์มอลต์แบบ bready เข้มข้นที่ผสมกับความ spicy หรือ herbal จากฮอปในระดับต่ำจนถึงปานกลาง ความสมดุลระหว่างมอลต์และฮอปอาจแตกต่างกันไป สามารถมีรสเสริมแบบ caramel ได้เล็กน้อย สามารถมี diacetyl และ ester แบบ fruity ได้เล็กน้อย ห้ามมี sulfur","Appearance":"มีสีเหลืองอ่อน (light yellow) ถึงสีทองเข้ม (deep gold) เนื้อเบียร์ใสมากและแวววาวถึงขีดสุด ฟองออก creamy สีขาวติดแก้วทนนาน","Flavor":"มีรสมอลต์แบบ bready ที่เข้มข้นในระดับต่ำปานกลางจนถึงปานกลาง ปิดท้ายด้วยฮอปแบบ spicy หรือ herbal ที่ต่ำจนถึงสูงปานกลางความขมนั้นเด่นชัดแต่ไม่เคยหยาบ มีรสชาติและสดชื่น สามารถมี diacetyl และ ester แบบ fruity ได้เล็กน้อย แต่ไม่ควรชัดไป","Mouthfeel":"เนื้อเบียร์แบบปานกลางจนถึงบางปานกลาง คาร์โบเนชั่นปานกลาง","Style Comparison":"เบียร์ Czech Premium Pale Lager ในแบบเนื้อเบียร์บาง ไม่เข้มข้น สดชื่นที่ดื่มได้ทุกวัน OG: 1.028 – 1.044"},"tags":"session-strength, pale-color, bottom-fermented, lagered, central-europe, traditional-style, pale-lager-family, bitter, hoppy","ex":"Bernard světlé pivo 10, Březňák světlé výčepní pivo, Notch Session Pils, Primátor Antonín světlé výčepní, Radegast Rázna 10, Únětické pivo 10°","OG":[1.028,1.044],"FG":[1.008,1.014],"IBU":[20.0,35.0],"SRM":[3.0,6.0],"ABV":[3.0,4.1]},{"c":"3B","n":"Czech Premium Pale Lager","cat":"3","cn":"Czech Lager","tier":"A","gen":false,"en":{"Overall Impression":"A refreshing pale Czech lager with considerable malt and hop character and a long finish. The malt flavors are complex for a Pilsner-type beer. The bitterness is strong and clean but lacks harshness, which gives a well- balanced, rounded flavor impression that enhances drinkability.","Aroma":"Medium to medium-high bready-rich malt and medium-low to medium-high spicy, floral, or herbal hop bouquet; though the balance between the malt and hops may vary, the interplay is rich and complex. Light diacetyl, or very low fruity esters are optional. Esters tend to increase with gravity.","Appearance":"Medium yellow to deep gold color. Brilliant to very clear clarity. Dense, long-lasting, creamy white head.","Flavor":"Rich, complex, bready maltiness combined with a pronounced yet soft and rounded bitterness and floral and spicy hop flavor. Malt and hop flavors are medium to medium- high, and the malt may contain a slight impression of caramel. Bitterness is prominent but never harsh. The long finish can be balanced towards hops or malt but is never aggressively tilted either way. Light to moderately-low diacetyl and low hop- derived esters are acceptable, but need not be present.","Mouthfeel":"Medium body. Moderate to low carbonation.","Style Comparison":"More color, malt richness, and body than a German Pils, with a fuller finish and a cleaner, softer impression. Stronger than a Czech Pale Lager."},"th":{"Overall Impression":"เบียร์ Czech lager สีอ่อนที่ดื่มแล้วสดชื่นด้วยมอลต์และฮอปในปริมาณมาก มีรสสัมผัสที่ลากยาว เบียร์สไตล์ Pilsner ที่มีความซับซ้อนในรสชาติของมอลต์ ความขมสูง คลีน ไม่มีความกระด้าง มีความสมดุล นุ่มนวล ดื่มได้ง่าย","Aroma":"มีคาแรคเตอร์มอลต์ bready ปานกลางถึงสูงปานกลาง มีกลิ่น spicy, floral หรือ herbal จากฮอปปานกลางถึงสูงปานกลาง มีความสมดุลระหว่างมอลต์และฮอปในรูปแบบที่แตกต่างกัน แต่ต้องออกมาเข้มและซับซ้อน สามารถมี diacetyl และ ester แบบ fruity ได้เล็กน้อย ester จะชัดขึ้นตามความแรงของเบียร์","Appearance":"เบียร์สีเหลืองแบบกลาง (medium yellow) จนไปถึงสีทองเข้ม (deep gold) เนื้อเบียร์ใสมากและแวววาว ฟองครีมมี่สีขาว แน่นเกาะติดแก้วทนนาน","Flavor":"รสชาติมอลต์แบบ bready ที่เข้มข้น ซับซ้อน ผสมผสานกับความขมที่เด่นชัดแต่นุ่ม กลมกล่อม และรสฮอปแบบ floral และ spicy รสจากมอลต์และฮอปจะอยู่ในระดับปานกลางถึงสูงปานกลาง มอลต์อาจจะมีรสสัมผัสแบบ caramel ความขมจะเด่นชัดแต่ไม่หยาบ จบรสในแบบสมดุลและลากยาวจากรสมอลต์และฮอปที่ไม่รุนแรง มี diacetyl แบบต่ำปานกลางจนถึงปานกลาง มี fruity ester แบบต่ำยอมรับได้ แต่ไม่มีก็ได้","Mouthfeel":"เนื้อเบียร์ปานกลาง มีคาร์โบเนชั่นปานกลางจนถึงต่ำ","Style Comparison":"มีสีสัน มอลต์เข้มข้น และมีเนื้อเบียร์หนากว่า German Pils ด้วยการจบรสที่แน่นกว่าและคลีนกว่า ได้ความรู้สึกนุ่ม และแรงกว่า Czech Pale Lager"},"tags":"standard-strength, pale-color, bottom-fermented, lagered, central-europe, traditional-style, pilsner-family, balanced, hoppy","ex":"Bernard světlé ležák 12°, Budvar 33 světlý ležák, Pilsner Urquell, Pivovar Jihlava Ježek 11%, Primátor Premium lager, Radegast Ryze hořká 12, Únětická pivo 12°","OG":[1.044,1.06],"FG":[1.013,1.017],"IBU":[30.0,45.0],"SRM":[3.5,6.0],"ABV":[4.2,5.8]},{"c":"3C","n":"Czech Amber Lager","cat":"3","cn":"Czech Lager","tier":"B","gen":false,"en":{"Overall Impression":"A malty amber Czech lager with a hop character that can vary from low to quite significant. The malt flavors also can vary, leading to different interpretations and balances ranging from drier, bready, and slightly biscuity to sweeter and somewhat caramel-like.","Aroma":"Moderate intensity, rich malt aroma that can be either bready and Maillard product-dominant or slightly caramelly sweet. Spicy, floral, or herbal hop character may be moderate to none. Clean lager character, though low fruity esters (stone fruit or berries) may be present. Low diacetyl optional.","Appearance":"Deep amber to copper color. Clear to bright clarity. Large, off-white, persistent head.","Flavor":"Complex malt flavor is dominant (medium to medium-high), though its nature may vary from dry and Maillard product-dominant to caramelly and almost sweet. Some examples have a candy-like to graham-cracker malt character. Low to moderate spicy hop flavor. Prominent but clean hop bitterness provides a balanced finish. Subtle plum or berry esters optional. Low diacetyl optional. No roasted malt flavor. Finish may vary from dry and hoppy to relatively sweet.","Mouthfeel":"Medium-full to medium body. Soft and round, often with a gentle creaminess. Moderate to low carbonation.","Style Comparison":"The style can be similar to a Vienna Lager but with stronger Czech late hop character, or that approaching a British Bitter but significantly richer with more of a deep caramel character. Large brewery versions are generally similar to Czech Premium Pale Lager with slightly darker malt flavors and less hop, while smaller breweries often make versions with considerable hop character, malt complexity, or residual sweetness."},"th":{"Overall Impression":"เบียร์มอลต์นำสีเหลืองอำพันจากเช็ก ที่มีกลิ่นฮอปที่กว้าง มีตั้งแต่ฮอปน้อยจนถึงฮอปเด่นชัด รสของมอลต์มีได้หลายแบบขึ้นอยู่กับการตีความและความสมดุล โดยมีได้ตั้งแต่จบแบบ dry, bready หรือ biscuity เล็กน้อย ถึงจบแบบหวานที่มีความรู้สึกถึงคาราเมล","Aroma":"มีความเข้มข้นปานกลาง กลิ่นของมอลต์เข้มข้นที่เป็นได้ทั้ง bready และคาแรคเตอร์ที่เกิดจากปฏิกิริยา Maillard หรือมีความหวานจาก caramel มีฮอปที่ออกไปในทาง spicy, floral หรือ herbal แบบปานกลางหรือไม่มีก็ได้ มีลักษณะของเบียร์ลาเกอร์ที่สะอาด อาจจะมี ester แบบ fruity (stone fruit หรือ berry) แบบต่ำ สามารถมี diacetyl แบบต่ำได้","Appearance":"สีอำพันเข้ม (deep amber) ถึงสีทองแดง (copper) เนื้อเบียร์มีความใสคมชัด ฟองขนาดใหญ่ สีขาวนวล เกาะกับแก้วได้ดี","Flavor":"โดดเด่นด้วยความซับซ้อนจากมอลต์ (ปานกลางถึงสูงปานกลาง) ลักษณะของมอลต์อาจจะแตกต่างกันไป มีได้ตั้งแต่แบบ dry และคาแรคเตอร์ที่เกิดจากปฏิกิริยา Maillard ที่โดดเด่น ไปจนถึงคาราเมลและเกือบหวาน บางชนิดจะมีมอลต์ที่ออกเหมือน candy หรือ graham-cracker รสฮอปแบบ spicy ได้ในระดับปานกลางถึงต่ำ ความขมของฮอปโดดเด่นที่พาไปสู่ความสมดุลในตอนจบ สามารถมี ester บางๆในแบบ plum หรือ berry ได้ มี diacetyl ระดับต่ำได้ ห้ามมีรสมอลต์คั่ว จบรสได้หลายแบบตั้งแต่ dry พร้อมฮอป ไปจนถึงจบแบบหวาน","Mouthfeel":"เนื้อเบียร์แบบกลางจนถึงแน่นปานกลาง นุ่มและกลมกล่อมมักมีความนุ่มนวลแบบครีมมี่ มีคาร์โบเนชั่นปานกลางถึงต่ำ","Style Comparison":"สไตล์นี้อาจคล้ายกับ Vienna Lager แต่มีคาแรคเตอร์รุนแรงกว่า จากฮอปสายพันธุ์เช็กที่ใส่ไปในตอนท้าย เป็นสไตล์ที่เข้าใกล้ British Bitter แต่เข้มข้นกว่าด้วยคาแรคเตอร์คาราเมลที่ลึกกว่าแบบที่ผลิตโดยโรงเบียร์ขนาดใหญ่จะใกล้เคียง Czech Premium Pale Lager ที่มีรสของ dark มอลต์และฮอปต่ำ แบบที่ผลิตโดยโรงเบียร์ขนาดเล็กจะมีคาแรคเตอร์ฮอปมากขึ้น มีความซับซ้อนของมอลต์ และมีความหวานเหลืออยู่"},"tags":"standard-strength, amber-color, bottom-fermented, lagered, central-europe, traditional-style, amber-lager-family, balanced","ex":"Bernard Jantarový ležák 12°, Gambrinus Polotmavá 12°, Kozel Semi-Dark, Lobkowicz Démon 13, Primátor 13 polotmavé, Strakonický Dudák Klostermann polotmavý ležák","OG":[1.044,1.06],"FG":[1.013,1.017],"IBU":[20.0,35.0],"SRM":[10.0,16.0],"ABV":[4.4,5.8]},{"c":"3D","n":"Czech Dark Lager","cat":"3","cn":"Czech Lager","tier":"B","gen":false,"en":{"Overall Impression":"A rich, dark, malty Czech lager with a roast character that can vary from almost absent to quite prominent. Malty balance and an interesting and complex flavor profile, with variable levels of hopping that provides a range of possible interpretations.","Aroma":"Medium to medium-high rich, deep, sometimes sweet maltiness, with optional qualities such as bread crusts, toast, nuts, cola, dark fruit, or caramel. Roasted malt characters such as chocolate or sweetened coffee can vary from moderate to none but should not overwhelm the base malt character. Low to moderate spicy hop aroma optional. Low diacetyl and low to moderate fruity esters (plums or berries) may be present.","Appearance":"Dark copper to almost black color, often with a red or garnet tint. Clear to bright clarity. Large, off-white to tan, persistent head.","Flavor":"Medium to medium-high deep, complex maltiness dominates, typically with malty-rich Maillard products and a light to moderate residual malt sweetness. Malt flavors such as caramel, toast, nuts, licorice, dried dark fruit, chocolate, or coffee may also be present, with very low to moderate roast character. Low to moderate spicy hop flavor. Moderate to medium-low bitterness, but should be perceptible. Balance can vary from malty to relatively well-balanced to gently hop- forward. Low to moderate diacetyl and light plum or berry esters may be present.","Mouthfeel":"Medium to medium-full body, considerable mouthfeel without being heavy or cloying. Moderately creamy in texture. Smooth. Moderate to low carbonation. Can have a slight alcohol warmth in stronger versions.","Style Comparison":"The beer is the Czech equivalent of a dark lager ranging in character from Munich Dunkel to Schwarzbier, but typically with greater malt richness and hop aroma, flavor, and bitterness."},"th":{"Overall Impression":"เบียร์ lager จากเช็กที่มีมอลต์เข้มข้น ที่มาพร้อมมอลต์คั่วที่ความคั่วมีตั้งแต่สัมผัสไม่ได้จนถึงคั่วชัดเจน มีความสมดุลจากมอลต์ที่โดดเด่น พร้อมด้วยระดับการใช้ฮอปที่หลากหลาย","Aroma":"รสมอลต์ ลึก เข้มข้นบางครั้งก็มีรสหวาน ในระดับปานกลางถึงสูงปานกลาง โดยสามารถจะมีคาแรคเตอร์ของ bread crusts, toast, nuts, cola, dark fruit หรือ caramel คาแรคเตอร์จากมอลต์คั่ว เช่น chocolate หรือความหวานจาก coffee ซึ่งอาจจะมีแบบปานกลางหรือไม่มีก็ได้แต่ไม่ควรเด่นกว่ามอลต์พื้นฐาน มีกลิ่นฮอปแบบ spicy ได้ อาจมี diacetyl และ ester แบบ fruity (plums หรือ berries) ในระดับต่ำได้","Appearance":"สีทองแดงเข้ม (dark copper) ถึงเกือบดำ มักมีประกายโทนสีแดง (red) หรือโกเมน (garnet) เบียร์ใส ชัดเจนฟองขนาดใหญ่ สีขาวนวลเกาะแก้วได้ดี","Flavor":"มีคาแรคเตอร์มอลต์ที่ลึกและซับซ้อนแบบปานกลางถึงสูงปานกลาง มักมีคาแรคเตอร์ที่เกิดจากปฏิกิริยา Maillard และความหวานของมอลต์ที่ตกค้างอยู่เล็กน้อย รสชาติของมอลต์เป็นแบบ caramel, toast, nuts, licorice, dried dark fruit, chocolate หรือ coffee พร้อมกับรสคั่วแบบกลางถึงอ่อน มีฮอปแบบ spicy ต่ำถึงปานกลาง มีความขมต่ำปานกลางถึงปานกลาง แต่ต้องรับรู้ได้ ความสมดุลของเบียร์มีได้ตั้งแต่แบบ malty จนถึงฮอปนำ อาจมี diacetyl ต่ำถึงปานกลาง มี ester แบบ light plum หรือ berry ได้","Mouthfeel":"เนื้อเบียร์แบบปานกลางถึงหนาปานกลาง ให้ความรู้สึกตอนดื่มได้เต็มปากเต็มคำแต่ไม่หนักหรือหวานเกินไป มีความครีมมี่ปานกลางนุ่มลื่น มีคาร์โบเนชั่นต่ำจนถึงปานกลาง ในแบบที่แอลกอฮอล์สูงอาจจะพบความอุ่นจากแอลกอฮอล์ได้","Style Comparison":"เบียร์นี้เทียบเท่ากับ Dark Lager ในสาธารณรัฐเช็ก ซึ่งมีให้เลือกตั้งแต่ Munich Dunkel จนถึง Schwarzbier ทั่วไปแล้วจะมีความเข้มข้นรวมทั้งจาก มอลต์ ฮอป รสชาติ และความขม"},"tags":"standard-strength, dark-color, bottom-fermented, lagered, central-europe, traditional-style, dark-lager-family, balanced","ex":"Bernard černý ležák 12°, Budvar tmavý ležák, Herold lmavé silné pivo 13°, Kozel Dark , Krušovice černé, Primátor dark lager, U Fleků Flekovský tmavý ležák 13°","OG":[1.044,1.06],"FG":[1.013,1.017],"IBU":[18.0,34.0],"SRM":[17.0,35.0],"ABV":[4.4,5.8]},{"c":"4A","n":"Munich Helles","cat":"4","cn":"Pale Malty European Lager","tier":"A","gen":false,"en":{"Overall Impression":"A gold-colored German lager with a smooth, malty flavor and a soft, dry finish. Subtle spicy, floral, or herbal hops and restrained bitterness help keep the balance malty but not sweet, which helps make this beer a refreshing, everyday drink.","Aroma":"Moderate grainy-sweet malt aroma. Low to moderately-low spicy, floral, or herbal hop aroma. Pleasant, clean fermentation profile, with malt dominating the balance. The freshest examples will have more of a malty-sweet aroma.","Appearance":"Pale yellow to pale gold. Clear. Persistent creamy white head.","Flavor":"Moderately malty start with the suggestion of sweetness, moderate grainy-sweet malt flavor with a soft, rounded palate impression, supported by a low to medium-low bitterness. Soft and dry finish, not crisp and biting. Low to moderately-low spicy, floral, or herbal hop flavor. Malt dominates hops in the palate, finish, and aftertaste, but hops should be noticeable. No residual sweetness, simply the impression of maltiness with restrained bitterness. Clean fermentation profile.","Mouthfeel":"Medium body. Medium carbonation. Smooth, well-lagered character.","Style Comparison":"Similar in malt balance and bitterness to Munich Dunkel, but less malty-sweet in nature and pale rather than dark and rich. More body and malt presence than a German Pils, but less crisp and with less hop character throughout. Similar malt profile as a German Helles Exportbier, but with fewer hops in the balance and slightly less alcohol. Less body and alcohol than a Festbier."},"th":{"Overall Impression":"เบียร์เยอรมันลาเกอร์สีทองที่ให้รสชาตินุ่มนวลมีความ malty พร้อมเนื้อสัมผัสที่นุ่มและ dry สัมผัสได้ถึงฮอปในแบบ spicy, floral หรือ herbal มีความขมที่ถูกกำหนดไว้เพื่อให้ออกมาสมดุลกับมอลต์แต่ไม่หวาน ช่วยให้เบียร์ออกมาสดชื่นดื่มได้ทุกวัน","Aroma":"กลิ่นมอลต์ grainy-sweet ปานกลาง กลิ่นฮอปแบบ spicy, floral หรือ herbal ต่ำถึงต่ำปานกลาง รื่นรมย์ มีโปรไฟล์การหมักที่สะอาด ในความสมดุลมีมอลต์โดดเด่น เบียร์ที่สดใหม่จะมีความหอมหวานจากมอลต์มากกว่า","Appearance":"สีเหลืองอ่อน (pale yellow) ถึงสีทองอ่อน (pale gold) มีความใส ฟองสีขาวเกาะอยู่กับแก้วได้ดี","Flavor":"รสมอลต์ระดับปานกลางที่เริ่มต้นด้วยความหวาน รสหวานจาก grain แบบนุ่มนวลให้รสชาตินวลกลมที่เสริมด้วยความขมปานกลางถึงต่ำนุ่มและจบแบบ dry แต่ไม่คมและกัดลิ้น กลิ่นฮอปแบบ spicy, floral หรือ herbal แบบต่ำจนถึงต่ำปานกลาง การรับรู้รส จบรสและ aftertaste จะมาจากมอลต์มากกว่าฮอปแต่ยังต้องรู้สึกถึงฮอปได้ ไม่ควรหลงเหลือความหวาน มีเพียงรสมอลต์และรสขมที่ถูกคุมไว้ มีโปรไฟล์การหมักที่สะอาด","Mouthfeel":"มีเนื้อเบียร์ปานกลาง มีคาร์โบเนชั่นปานกลาง นุ่มลื่น มีคาแรคเตอร์แบบเบียร์ลาเกอร์ที่ดี","Style Comparison":"ความสมดุลของมอลต์และความขมคล้ายกับ Munich Dunkel แต่มีความหวานจากมอลต์น้อยกว่าตามธรรมชาติของเบียร์สีอ่อน แทนที่จะมีสีเข้มและเข้มข้น มีเนื้อเบียร์และความชัดเจนของมอลต์มากกว่า German Pils แต่ความ crisp และคาแรคเตอร์ของฮอปน้อยกว่า มีมอลต์โปรไฟล์แบบเดียวกับ German Helles Exportbier แต่ฮอปสมดุลน้อยกว่า แอลกอฮอล์ต่ำกว่า เนื้อเบียร์และแอลกอฮอล์น้อยกว่า Festbier"},"tags":"standard-strength, pale-color, bottom-fermented, lagered, central-europe, traditional-style, pale-lager-family, malty","ex":"Augustiner Lagerbier Hell, Hacker- Pschorr Münchner Gold, Löwenbraü Original, Paulaner Münchner Lager, Schönramer Hell, Spaten Münchner Hell, Weihenstephaner Original Heles","OG":[1.044,1.048],"FG":[1.006,1.012],"IBU":[16.0,22.0],"SRM":[3.0,5.0],"ABV":[4.7,5.4]},{"c":"4B","n":"Festbier","cat":"4","cn":"Pale Malty European Lager","tier":"A","gen":false,"en":{"Overall Impression":"A smooth, clean, pale German lager with a moderately strong malty flavor and a light hop character. Deftly balances strength and drinkability, with a palate impression and finish that encourages drinking. Showcases elegant German malt flavors without becoming too heavy or filling.","Aroma":"Moderate malty richness, with an emphasis on toasty- doughy aromatics and an impression of sweetness. Low to medium-low floral, herbal, or spicy hops. The malt should not have a deeply toasted, caramel, or biscuity quality. Clean lager fermentation profile.","Appearance":"Deep yellow to deep gold color; should not have amber hues. Bright clarity. Persistent white to off-white foam stand. Most commercial examples are pale gold in color.","Flavor":"Medium to medium-high malty flavor initially, with a lightly toasty, bread dough quality and an impression of soft malty richness. Medium to medium-low bitterness, definitely malty in the balance. Well-attenuated and crisp, but not dry. Medium-low to medium floral, herbal, or spicy hop flavor. Clean fermentation profile. The taste is mostly of Pils malt, but with slightly toasty hints. The bitterness is supportive, but still should yield a malty, flavorful finish.","Mouthfeel":"Medium body, with a smooth, somewhat creamy texture. Medium carbonation. Alcohol strength barely noticeable as warming, if at all.","Style Comparison":"Less intense and less richly toasted than a Märzen. Stronger than a Munich Helles, with a bit more body, and hop and malt flavor. Less rich in malt intensity than a Helles Bock. The malt complexity is similar to a higher- gravity Czech Premium Pale Lager, although without the associated hops."},"th":{"Overall Impression":"เบียร์เยอรมันลาเกอร์สีอ่อนที่รสเนียนสะอาดพร้อมกลิ่นมอลต์เข้มข้นปานกลางและกลิ่นฮอปอ่อนๆ สร้างความสมดุลจากความแรงและความดื่มง่าย โดยการนำเสนอรสมอลต์จากเยอรมันที่หรูหราในเบียร์ที่ไม่หนักเกินไป","Aroma":"มีความเข้มข้นของมอลต์ในระดับปานกลาง โดยเน้นที่กลิ่น toasty-doughy และกลิ่นหอมหวาน มีฮอปในแบบ floral, herbal หรือ spicy ในระดับต่ำจนถึงต่ำปานกลาง มอลต์ไม่ควรมีคาแรคเตอร์ toasty, caramel หรือ biscuity ลึกเกินไป เป็นลาเกอร์ที่มีโปรไฟล์การหมักที่สะอาด","Appearance":"สีเหลืองเข้ม (deep yellow) ถึงสีทองเข้ม (deep gold) ไม่ควรเป็นสีอำพัน น้ำเบียร์ใสสว่าง ฟองมีสีขาวหรือขาวนวลเกาะขอบแก้วได้ดี ตัวอย่างในแบบที่ขายในตลาดจะเป็นสีทองอ่อน","Flavor":"เริ่มด้วยรสมอลต์ปานกลางถึงสูงปานกลาง ตามมาด้วย toasty, bread dough ที่ให้ความประทับใจด้วยความนุ่มของมอลต์ที่เข้มข้น ความขมปานกลางถึงต่ำปานกลางที่มีรสมอลต์ทำให้สมดุล ยีสต์จัดการน้ำตาลมาอย่างดีและมีความ crisp แต่ไม่ dry มีรสฮอปแบบ floral, herbal หรือ spicy ระดับปานกลางถึงต่ำปานกลาง มีโปรไฟล์การหมักที่สะอาด รสชาติส่วนใหญ่มาจาก Pils มอลต์ที่มีรส toasty บางๆซ่อนอยู่ ความขมมีเพื่อเพิ่มรสชาติ แต่มอลต์ยังไงก็เป็นตัวเอก จบแบบเต็มรสชาติ","Mouthfeel":"เนื้อเบียร์แบบปานกลาง พร้อมความนุ่มลื่น บางทีมาพร้อมความครีมมี่ มีคาร์โบเนชั่นปานกลาง ความแรงจากแอลกอฮอล์จะสัมผัสได้เมื่อเบียร์อุ่นขึ้น","Style Comparison":"มีความเข้มข้นของ toast น้อยกว่า Märzen แรงกว่า Munich Helles และมีเนื้อเบียร์หนากว่าและมีรสมอลต์กับฮอปมากกว่า มอลต์ไม่เข้มข้นเท่า Helles Bock ความซับซ้อนของมอลต์นั้นคล้ายคลึงกับ Czech Premium Pale Lager ที่มี gravity สูงกว่า โดยไม่มีฮอปมาเกี่ยวข้อง"},"tags":"standard-strength, pale-color, bottom-fermented, lagered, central-europe, traditional-style, pale-lager-family, malty","ex":"Augustiner Oktoberfest, Hacker- Pschorr Superior Festbier, Hofbräu Oktoberfestbier, Löwenbräu Oktoberfestbier, Paulaner Oktoberfest Bier, Weihenstephaner Festbier","OG":[1.054,1.057],"FG":[1.01,1.012],"IBU":[18.0,25.0],"SRM":[4.0,6.0],"ABV":[5.8,6.3]},{"c":"4C","n":"Helles Bock","cat":"4","cn":"Pale Malty European Lager","tier":"B","gen":false,"en":{"Overall Impression":"A relatively pale, strong, malty German lager with a nicely attenuated finish that enhances drinkability. The hop character is generally more apparent and the malt character less deeply rich than in other Bocks.","Aroma":"Moderate to strong grainy-sweet malt aroma, often with a lightly toasted quality and low Maillard products. Moderately-low spicy, herbal, or floral hop aroma optional. Clean fermentation profile. Low fruity esters optional. Very light alcohol optional.","Appearance":"Deep gold to light amber in color. Bright to clear clarity. Large, creamy, persistent, white head.","Flavor":"Moderately to moderately strong grainy-sweet, doughy, bready, or lightly toasty malt flavor dominates with some rich Maillard products providing added interest. Few caramel flavors optional. Low to moderate spicy, herbal, floral, peppery hop flavor optional, but present in the best examples. Moderate hop bitterness, more so in the balance than in other Bocks. Clean fermentation profile. Well-attenuated, not cloying, with a moderately-dry finish that may taste of both malt and hops.","Mouthfeel":"Medium-bodied. Moderate to moderately-high carbonation. Smooth and clean with no harshness or astringency, despite the increased hop bitterness. Light alcohol warming optional.","Style Comparison":"Can be thought of as either a pale version of a Dunkles Bock, or a Munich Helles or Festbier brewed to bock strength. While quite malty, this beer typically has less dark and rich malt flavors, and can be drier, hoppier, and more bitter than a Dunkles Bock. Less strong than a pale Doppelbock, but with similar flavors."},"th":{"Overall Impression":"เบียร์ German lager ที่สีอ่อน แรง และ malty จบรสด้วยการจัดการน้ำตาลของยีสต์ที่สวยงามที่ทำให้ดื่มง่าย โดยทั่วไปลักษณะของฮอปจะชัดเจนมากกว่า และลักษณะของมอลต์นั้นมีความเข้มข้นน้อยกว่าในสไตล์ Bock อื่นๆ","Aroma":"มีกลิ่นมอลต์ที่มีรสหวานปานกลางถึงเข้มข้น มักมีกลิ่น toast เล็กน้อยและคาแรคเตอร์ที่เกิดจากปฏิกิริยา Maillard ต่ำ มีฮอปในแบบ spicy, herbal หรือ floral ในระดับปานกลางถึงต่ำได้ มีโปรไฟล์การหมักที่สะอาด มี ester แบบ fruity แบบต่ำได้ สามารถพบคาแรคเตอร์แอลกอฮอล์แบบต่ำได้","Appearance":"มีสีทองเข้ม (deep gold) ถึงสีเหลืองอำพันแบบอ่อน (light amber) เนื้อเบียร์ใสและสว่าง ฟองใหญ่แบบครีมมี่ ฟองสีขาวเกาะแก้วได้ดี","Flavor":"รสชาติมอลต์ในแบบ grainy-sweet, doughy, bready หรือ lightly toasty ปานกลางถึงเข้มข้นปานกลาง รสมอลต์จะเป็นตัวนำที่มาพร้อมกับคาแรคเตอร์ที่เกิดจากปฏิกิริยา Maillard ที่เสริมความน่าสนใจ มี caramel เล็กน้อยได้ มีคาแรคเตอร์ของฮอปแบบ spicy, herbal, floral, peppery แบบต่ำจนถึงปานกลางได้แต่ต้องออกมาดี มีความขมปานกลางมาช่วยเสริมความสมดุลมากกว่า Bock อื่นๆ มีโปรไฟล์การหมักที่สะอาดมีระดับการจัดการน้ำตาลของยีสต์ที่ดี ไม่มีความหวานตกค้าง จบรสแบบเหลือความหวานปานกลางที่มีรสของมอลต์และฮอป","Mouthfeel":"เนื้อเบียร์แบบปานกลาง คาร์โบเนชั่นปานกลางถึงสูงปานกลาง นุ่มลื่นและคลีนไม่มีความหยาบหรือความฝาดแม้จะมีความขมที่เพิ่มขึ้น สามารถมีคาแรคเตอร์ของแอลกอฮอล์แบบบางๆได้","Style Comparison":"อาจจะคิดได้ว่าเป็นรุ่นสีอ่อนของ Dunkles Bock หรือ Munich Helles หรือ Festbier ที่ผลิตมาได้ความแรงระดับ Bock แม้ว่าเบียร์จะมีรสมอลต์ค่อนข้างมาก แต่โดยทั่วไปแล้วเบียร์ชนิดนี้จะมีรสชาติของ dark มอลต์และความเข้มข้นจากมอลต์น้อยกว่า สามารถจบแบบ dry กว่ามีฮอปมากว่า และขมได้มากกว่า Dunkles Bock แรงน้อยกว่า Doppelbock ที่สีอ่อน ที่มีรสชาติคล้ายกัน"},"tags":"high-strength, pale-color, bottom-fermented, lagered, central-europe, traditional-style, bock-family, malty","ex":"Altenmünster Maibock, Ayinger Maibock, Chuckanut Maibock, Einbecker Mai-Ur-Bock, Hofbräu Maibock, Mahr’s Heller Bock","OG":[1.064,1.072],"FG":[1.011,1.018],"IBU":[23.0,35.0],"SRM":[6.0,9.0],"ABV":[6.3,7.4]},{"c":"5A","n":"German Leichtbier","cat":"5","cn":"Pale Bitter European Beer","tier":"B","gen":false,"en":{"Overall Impression":"A pale, highly-attenuated, light-bodied German lager with lower alcohol and calories than standard- strength beers. Moderately bitter with noticeable malt and hop flavors, the beer is still interesting to drink.","Aroma":"Low to medium hop aroma, with a spicy, herbal, or floral character. Low to medium-low grainy-sweet or slightly crackery malt aroma. Clean fermentation profile.","Appearance":"Pale straw to deep yellow in color. Brilliant clarity. Moderate white head with average to below average persistence.","Flavor":"Low to medium grainy-sweet malt flavor initially. Medium hop bitterness. Low to medium hop flavor, with a spicy, herbal, or floral quality. Clean fermentation character, well-lagered. Dry finish with a light malty and hoppy aftertaste.","Mouthfeel":"Light to very light body. Medium to high carbonation. Smooth, well-attenuated.","Style Comparison":"Like a lower-alcohol, lighter-bodied, slightly less aggressive German Pils or Munich Helles. More bitter and flavorful than an American Light Lager."},"th":{"Overall Impression":"เบียร์เยอรมันสีอ่อน ที่ยีสต์จัดการน้ำตาลได้มาก มีเนื้อเบียร์บางเบา มีแอลกอฮอล์และแคลอรีต่ำกว่าเบียร์มาตรฐานมีรสขมปานกลางพร้อมกลิ่นฮอปชัดเจนที่ทำให้เบียร์มีความน่าสนใจ","Aroma":"มีกลิ่นฮอปในระดับต่ำถึงปานกลางในแบบ spicy, herbal หรือ floral มีความหอมหวานจากมอลต์ในระดับต่ำถึงต่ำปานกลางในแบบ grainy-sweet หรือ crackery มาพร้อมกับโปรไฟล์การหมักที่สะอาด","Appearance":"สีฟางอ่อน (pale straw) ถึงเหลืองเข้ม (deep yellow) เนื้อเบียร์ใสที่สุด ฟองมีขนาดปานกลางสีขาวเกาะอยู่กับแก้วได้ปานกลางถึงเกาะแก้วได้ต่ำกว่ามาตรฐาน","Flavor":"จะพบความหวานจากมอลต์ในระดับต่ำถึงปานกลางในช่วงแรกมีความขมของฮอปในระดับปานกลาง มีรสฮอปในระดับต่ำถึงปานกลางแบบ spicy, herbal หรือ floral มีการหมักที่สะอาด ลักษณะการหมักแบบ ”lager” ที่ดี จบรสแบบ dry พร้อมด้วยรสมอลต์และฮอปเล็กน้อยใน aftertaste","Mouthfeel":"เนื้อเบียร์บางถึงบางมาก มีคาร์โบเนชั่นในระดับปานกลางจนถึงสูง เนียนนุ่ม เป็นเบียร์ที่ผ่านการหมักมาอย่างดี","Style Comparison":"เหมือนกับเบียร์ German Pils หรือ Munich Helles ที่แอลกอฮอล์ต่ำกว่า เนื้อเบียร์บางกว่า มีความขมและรสชาติมากกว่า American Light Lager"},"tags":"session-strength, pale-color, bottom-fermented, lagered, central-europe, traditional-style, pale-lager-family, bitter, hoppy","ex":"Autenrieder Schlossbräu Leicht, Greif Bräu Leicht, Hohenthanner Tannen Hell Leicht, Müllerbrau Heimer Leicht, Schönramer Surtaler Schankbier, Waldhaus Sommer Bier","OG":[1.026,1.034],"FG":[1.006,1.01],"IBU":[15.0,28.0],"SRM":[1.5,4.0],"ABV":[2.4,3.6]},{"c":"5B","n":"Kölsch","cat":"5","cn":"Pale Bitter European Beer","tier":"A","gen":false,"en":{"Overall Impression":"A subtle, brilliantly clear, pale beer with a delicate balance of malt, fruit, and hop character, moderate bitterness, and a well-attenuated but soft finish. Freshness makes a huge difference with this beer, as the delicate character can fade quickly with age.","Aroma":"Low to very low grainy-sweet malt aroma. A subtle fruit aroma (apple, pear, or sometimes cherry) is optional, but welcome. Low floral, spicy, or herbal hop aroma optional. The intensity of aromatics is fairly subtle but generally balanced, clean, fresh, and pleasant.","Appearance":"Medium yellow to light gold. Brilliant clarity. Has a delicate white head that may not persist.","Flavor":"A delicate flavor balance between malt, fruitiness, bitterness, and hops, with a clean, well-attenuated finish. The medium to medium-low grainy maltiness may have very light bready or honey notes. The fruitiness can have an almost imperceptible sweetness. Medium-low to medium bitterness. Low to moderately-high floral, spicy, or herbal hop flavor; most are medium-low to medium. May have a neutral-grainy to light malty sweet impression at the start. Soft, rounded palate. Finish is soft, dry, and slightly crisp, not sharp or biting. No noticeable residual sweetness. While the balance between the flavor components can vary, none are ever strong.","Mouthfeel":"Medium-light to medium body; most are medium-light. Medium to medium-high carbonation. Smooth and soft, but well-attenuated and not heavy. Not harsh.","Style Comparison":"Can be mistaken for a Cream Ale or somewhat subtle German Pils."},"th":{"Overall Impression":"เบียร์สีอ่อนที่ใสเป็นประกายและมีความนุ่มนวล ด้วยความสมดุลจากกลิ่นมอลต์ ผลไม้และฮอป มีความขมปานกลาง ยีสต์จัดการน้ำตาลได้ดีแต่จบรสแบบนุ่มนวล ความสดใหม่ของเบียร์มีผลอย่างมากต่อสไตล์นี้เพราะคาแรคเตอร์ต่างๆจะค่อยๆหายไปตามเวลา","Aroma":"มีกลิ่นจากมอลต์แบบ grainy-sweet ในระดับต่ำจนถึงต่ำมากอาจมีกลิ่นอ่อนๆจากผลไม้ สามารถมีกลิ่นแอปเปิ้ล ลูกแพร์ หรือเชอร์รี่ได้สามารถมีกลิ่นฮอปในระดับต่ำในแบบ floral, spicy หรือ herbal ได้ มีความเข้มข้นของอโรม่าที่นุ่มนวล แต่ทั่วไปจะสมดุล สะอาด สดใหม่ และรื่นรมย์","Appearance":"มีสีเหลืองปานกลาง (medium yellow) จนถึงสีทองอ่อน (light gold) เนื้อเบียร์ใสที่สุด มีฟองสีขาวละเอียด ที่เกาะติดแก้วได้ไม่นาน","Flavor":"มีรสชาติอันละเอียดอ่อนจากความสมดุลระหว่างมอลต์ รสชาติของผลไม้ รสขม และฮอป มีการหมักที่สะอาด หมักมาอย่างดีในตอนจบ มีคาแรคเตอร์มอลต์แบบ bready และ honey ในระดับปานกลางถึงต่ำปานกลาง ความหวานจากผลไม้มีในระดับน้อยจนแทบไม่รู้สึก มีความขมในระดับปานกลางถึงต่ำปานกลาง มีฮอปในแบบ floral, spicy หรือ herbal ในระดับต่ำจนถึงสูงปานกลาง อาจจะพบความ grainy แบบปานกลางหรือความหวานอ่อนๆจากมอลต์ในสัมผัสแรก ที่ทำให้รู้สึกนุ่มและเนียน จบรสแบบนุ่มนวลไม่เหลือความหวานและมีความ crisp แต่ไม่บาดหรือกัดลิ้นห้ามพบความหวานตกค้าง แม้ว่าความสมดุลระหว่างส่วนประกอบรสชาติอาจแตกต่างกันไปแต่ก็ไม่ควรให้มีอะไรเด่นออกมา","Mouthfeel":"มีเนื้อเบียร์ปานกลางถึงบางปานกลาง แต่ส่วนใหญ่จะมาในแบบบางปานกลาง มีคาร์โบเนชั่นในระดับปานกลางถึงสูงปานกลาง เนื้อเบียร์เนียนนุ่ม ยีสต์จัดการน้ำตาลมาอย่างดี ไม่รุนแรง ไม่กระด้าง","Style Comparison":"อาจเข้าใจผิดว่าเป็น Cream Ale หรือ German Pils ที่ละเอียดอ่อน"},"tags":"standard-strength, pale-color, top-fermented, lagered, central-europe, traditional-style, pale-ale-family, balanced","ex":"Früh Kölsch, Gaffel Kölsch, Mühlen Kölsch, Päffgen Kolsch, Reissdorf Kölsch, Sion Kölsch, Sünner Kölsch","OG":[1.044,1.05],"FG":[1.007,1.011],"IBU":[18.0,30.0],"SRM":[3.5,5.0],"ABV":[4.4,5.2]},{"c":"5C","n":"German Helles Exportbier","cat":"5","cn":"Pale Bitter European Beer","tier":"B","gen":false,"en":{"Overall Impression":"A golden German lager balancing a smooth malty profile with a bitter, hoppy character in a slightly above-average body and strength beer.","Aroma":"Medium-low to medium floral, spicy, or herbal hop aroma. Moderate grainy-sweet malt aroma, possibly with light toasty, bready, or doughy notes. Clean fermentation profile. Hops and malt both noticeable, and generally balanced.","Appearance":"Medium yellow to deep gold. Clear. Persistent white head.","Flavor":"Moderate, balanced malt and hops with supporting bitterness. Malt and hop flavors similar to aroma (same descriptors and intensities). Medium, noticeable bitterness, full on the palate, with a medium-dry finish. Clean fermentation character. Aftertaste of both malt and hops, generally in balance. Mineral character typically perceived more as a roundness and fullness of flavor, and a dry, flinty sharpness in the finish rather than overt mineral flavors. Background sulfate optional.","Mouthfeel":"Medium to medium-full body. Medium carbonation. Smooth and mellow on the palate. Very slight warmth may be noted in stronger versions.","Style Comparison":"Less finishing hops and more body than a German Pils. More bitter and drier than a Munich Helles. Stronger, drier, but less hoppy than a Czech Premium Pale Lager."},"th":{"Overall Impression":"คือเบียร์เยอรมันสีทองที่มีความสมดุลระหว่างมอลต์ที่นุ่มนวลกับความขมและคาแรคเตอร์จากฮอป ในเนื้อเบียร์ที่หนากว่าและแรงกว่าเบียร์ปกติเล็กน้อย","Aroma":"มีกลิ่นฮอปในระดับปานกลางถึงต่ำปานกลางในแบบ floral, spicy หรือ herbal มีกลิ่นมอลต์ในระดับปานกลาง อาจพบได้ในแบบ light toasty, bready หรือ doughy มีโปรไฟล์การหมักที่สะอาด กลิ่นฮอปและมอลต์พบได้ชัดเจนและสมดุล","Appearance":"มีสีเหลืองปานกลาง (medium yellow) ถึงสีทองเข้ม (deep gold) มีความใส มีฟองสีขาวเกาะกับแก้วได้ดี","Flavor":"มีรสชาติที่มาจากความสมดุลของมอลต์กับฮอปและความขมในระดับปานกลาง มีคาแรคเตอร์จากมอลต์และฮอปคล้ายกับกลิ่นอโรม่า มีความขมในระดับปานกลางที่รู้สึกได้ ให้ความรู้สึกเต็มรสชาติ พร้อมการจบรสแบบ medium-dry มีโปรไฟล์การหมักที่สะอาด ใน aftertaste มีรสมอลต์และฮอปที่สมดุล คาแรคเตอร์จากแร่ธาตุในน้ำช่วยให้รสกลม เต็มรสชาติพร้อมรสชาติที่คมและ dry สามารถใช้ sulfate ได้","Mouthfeel":"มีเนื้อเบียร์แบบปานกลางจนถึงหนาปานกลาง มีคาร์โบเนชั่นในระดับปานกลาง กลมกล่อมและให้สัมผัสในปากที่ดี อาจจะพบความอุ่นจากแอลกอฮอล์เล็กน้อยได้ในเบียร์แบบที่แรงกว่า","Style Comparison":"มีคาแรคเตอร์ฮอปตอนจบน้อยกว่าและมีเนื้อเบียร์หนากว่า German Pils มีความขมและ dry กว่า Munich Helles มีความแรงกว่า dry กว่าแต่มีฮอปน้อยกว่า Czech Premium Pale Lager"},"tags":"standard-strength, pale-color, bottom-fermented, lagered, central-europe, traditional-style, pale-lager-family, balanced","ex":"Chuckanut Export Dortmunder Lager, DAB Dortmunder Export, Dortmunder Kronen, Landshuter Edel Hell, Müllerbräu Export Gold, Schönramer Gold","OG":[1.05,1.058],"FG":[1.008,1.015],"IBU":[20.0,30.0],"SRM":[4.0,6.0],"ABV":[5.0,6.0]},{"c":"5D","n":"German Pils","cat":"5","cn":"Pale Bitter European Beer","tier":"A","gen":false,"en":{"Overall Impression":"A pale, dry, bitter German lager featuring a prominent hop aroma. Crisp, clean, and refreshing, showing a brilliant gold color with excellent head retention.","Aroma":"Moderately to moderately-high flowery, spicy, or herbal hops. Low to medium grainy, sweet, or doughy malt character, often with a light honey and toasted cracker quality. Clean fermentation profile. The hops should be forward, but not totally dominate the malt in the balance.","Appearance":"Straw to deep yellow, brilliant to very clear, with a creamy, long-lasting white head.","Flavor":"Initial malt flavor quickly overcome with hop flavor and bitterness, leading into a dry, crisp finish. Malt and hop flavors similar to aroma (same descriptors and intensities). Medium to high bitterness, lingering into the aftertaste along with a touch of malt and hops. Clean fermentation profile. Minerally water can accentuate and lengthen the dry finish. Hops and malt can fade with age, but the beer should always have a bitter balance.","Mouthfeel":"Medium-light body. Medium to high carbonation. Should not feel heavy. Not harsh, but may have a flinty, minerally, sharpness in some examples.","Style Comparison":"Lighter in body and color, drier, crisper, more fully attenuated, more lingering bitterness, and higher carbonation than a Czech Premium Pale Lager. More hop character, malt flavor, and bitterness than International Pale Lager. More hop character and bitterness with a drier, crisper finish than a Munich Helles; the Helles has more malt intensity, but of the same character as the German Pils."},"th":{"Overall Impression":"คือเบียร์เยอรมันลาเกอร์ที่มีสีอ่อน มีความ dry และความขม มีอโรม่าของฮอปที่โดดเด่น มีความ crisp มีความคลีน และสดชื่น ที่แสดงถึงสีทองสดใสพร้อมฟองที่เกาะแก้วดีเยี่ยม","Aroma":"มีกลิ่นฮอปในระดับปานกลางถึงสูงปานกลางในแบบ flowery, spicy หรือ herbal มีคาแรคเตอร์มอลต์ในแบบ grainy, sweet หรือ doughy ในระดับต่ำจนถึงปานกลาง มักพบคาแรคเตอร์ของ honey และ toasted cracker มีโปรไฟล์การหมักที่สะอาด มีคาแรคเตอร์ฮอปเป็นตัวนำแต่ไม่กลบคาแรคเตอร์จากมอลต์ในเรื่องความสมดุล","Appearance":"มีสีฟาง (straw) จนถึงสีเหลืองเข้ม (deep yellow) มีน้ำเบียร์ใสมากเป็นประกาย มาพร้อมฟองครีมมี่ สีขาวเกาะแก้วได้ยาวนาน","Flavor":"ควรพบรสมอลต์ตอนเริ่มต้นที่เด่นกว่ารสฮอปและความขม ที่นำไปสู่ความ dry และจบรสในแบบ crisp มีรสชาติมอลต์และฮอปในแบบเดียวกับกับกลิ่นอโรมา (ตัวอธิบายและความเข้มข้นเดียวกัน) มีความขมในระดับปานกลางถึงสูง ที่ลากยาวคู่กันไปกับรสมอลต์และฮอปจนถึงใน aftertaste มีโปรไฟล์การหมักที่สะอาด แร่ธาตุในน้ำจะช่วยเน้นและยืดความรู้สึก dry ในตอนจบ แม้รสชาติของมอลต์และฮอปอาจจางหายไปตามเวลา แต่เบียร์ควรมีรสขมที่สมดุลอยู่เสมอ","Mouthfeel":"มีเนื้อเบียร์แบบบางปานกลาง มีคาร์โบเนชั่นในระดับปานกลางถึงสูง เบียร์ไม่ควรรู้สึกหนัก ไม่กระด้าง แต่อาจมีความรู้สึกแข็งและคมที่มาจากแร่ธาตุในน้ำในบางตัวอย่าง","Style Comparison":"เนื้อเบียร์บาง, สีอ่อนกว่า, dry กว่า, ยีสต์จัดการน้ำตาลได้ดีกว่า มีความขมที่คงอยู่ยาวนานกว่า มีคาร์โบเนชั่นสูงกว่า Czech Premium Pale Lager มีคาแรคเตอร์ของฮอป, มอลต์และความขมมากว่า International Pale Lager มีคาแรคเตอร์ของฮอป, ความขม, dry และ crisp กว่า Munich Helles โดย Helles จะมีมอลต์เข้มข้นกว่า แต่มีคาแรคเตอร์แบบเดียวกับ German Pils"},"tags":"standard-strength, pale-color, bottom-fermented, lagered, central-europe, traditional-style, pilsner-family, bitter, hoppy","ex":"ABK Pils Anno 1907, Jever Pilsener, König Pilsener, Paulaner Pils, Bierstadt Slow-Pour Pils, Rothaus Pils, Schönramer Pils, Trumer Pils","OG":[1.044,1.05],"FG":[1.008,1.013],"IBU":[22.0,40.0],"SRM":[2.0,4.0],"ABV":[4.4,5.2]},{"c":"6A","n":"Märzen","cat":"6","cn":"Amber Malty European Lager","tier":"A","gen":false,"en":{"Overall Impression":"An amber, malty German lager with a clean, rich, toasty, bready malt flavor, restrained bitterness, and a well-attenuated finish. The overall malt impression is soft, elegant, and complex, with a rich malty afte
