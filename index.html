 ไม่ควร flat, watery หรือ thin","Style Comparison":"บางชนิดอาจดูเหมือน English Porter สมัยใหม่ที่มีแอลกอฮอล์ต่ำกว่า และหวานน้อยกว่า London Brown Ale มาก"},"tags":"session-strength, dark-color, top-fermented, british-isles, traditional-style, brown-ale-family, malty","ex":"Brain’s Dark, Greene King XX Mild, Hobson’s Champion Mild, Mighty Oak Oscar Wilde, Moorhouse Black Cat, Theakston Traditional Mild","OG":[1.03,1.038],"FG":[1.008,1.013],"IBU":[10.0,25.0],"SRM":[14.0,25.0],"ABV":[3.0,3.8]},{"c":"13B","n":"British Brown Ale","cat":"13","cn":"Brown British Beer","tier":"B","gen":false,"en":{"Overall Impression":"A malty, caramelly, brown British ale without the roasted flavors of a Porter. Balanced and flavorful, but usually a little stronger than most average UK beers.","Aroma":"Light, sweet malt aroma with toffee, nutty, or light chocolate notes, and a light to heavy caramel quality. A light but appealing floral or earthy hop aroma may also be noticed. A light fruity aroma may be evident, but should not dominate.","Appearance":"Dark amber to dark reddish-brown color. Clear. Low to moderate off-white to light tan head.","Flavor":"Gentle to moderate malt sweetness, with a light to heavy caramel character, and a medium to dry finish. Malt may also have a nutty, toasted, biscuity, toffee, or light chocolate character. Medium to medium-low bitterness. Malt-hop balance ranges from even to malt-focused. Low floral or earthy hop flavor optional. Low to moderate fruity esters optional.","Mouthfeel":"Medium-light to medium body. Medium to medium-high carbonation.","Style Comparison":"More malty balance than British Bitters, with more malt flavors from darker grains. Stronger than a Dark Mild. Less roast than an English Porter. Stronger and much less sweet than London Brown Ale."},"th":{"Overall Impression":"เบียร์ British ale สีน้ำตาลที่มีรสมอลต์ caramel โดยปราศจากรสชาติคั่วแบบ Porter มีความสมดุลและเต็มรสชาติแต่มักจะแรงกว่าเบียร์ทั่วไปของสหราชอาณาจักรเล็กน้อย","Aroma":"กลิ่นมอลต์อ่อนๆ หอมหวาน พร้อมด้วยกลิ่น toffee, nutty หรือ light chocolate ตามมาด้วยกลิ่น caramel แบบบางจนถึงหนัก มีกลิ่นฮอปที่บางแต่น่าดึงดูดในแบบ floral หรือ earthy อาจพบกลิ่น fruity แบบอ่อนแต่ไม่ควรโดดเด่น","Appearance":"อำพันเข้ม (dark amber) ถึงน้ำตาลแดงเข้ม (dark reddish-brown) น้ำเบียร์ใส มีฟองในแบบต่ำถึงปานกลางสีขาวนวลถึงสีน้ำตาลอ่อน","Flavor":"มีความหวานจากมอลต์ที่นุ่มนวลจนถึงปานกลาง พร้อมด้วยคาแรคเตอร์ของ caramel แบบเบาจนถึงหนัก และจบรสแบบ dry ปานกลางจนถึง dry มอลต์อาจจะให้รสชาติ nutty, toasted, biscuity, toffee หรือ light chocolate มีความขมปานกลางถึงต่ำปานกลาง มีความสมดุลจากมอลต์และฮอปแบบเท่ากันจนถึงมอลต์นำ สามารถพบฮอปแบบ floral หรือ earthy แบบบางๆได้ สามารถพบ fruity ester ในแบบต่ำถึงปานกลางได้","Mouthfeel":"เนื้อเบียร์บางปานกลางถึงปานกลาง มีคาร์โบเนชั่นปานกลางถึงสูงปานกลาง","Style Comparison":"มีรสมอลต์ที่สมดุลมากกว่า British Bitter โดยมีรสชาติของมอลต์จาก grain ที่เข้มกว่า แรงกว่า Dark Mild มีความคั่วน้อยกว่า English Porter แรงและหวานน้อยกว่า London Brown Ale มาก"},"tags":"standard-strength, amber-color, top-fermented, british-isles, traditional-style, brown-ale-family, malty","ex":"AleSmith Nut Brown Ale, Cigar City Maduro Brown Ale, Maxim Double Maxim, Newcastle Brown Ale, Riggwelter Yorkshire Ale, Samuel Smith’s Nut Brown Ale","OG":[1.04,1.052],"FG":[1.008,1.013],"IBU":[20.0,30.0],"SRM":[12.0,22.0],"ABV":[4.2,5.9]},{"c":"13C","n":"English Porter","cat":"13","cn":"Brown British Beer","tier":"A","gen":false,"en":{"Overall Impression":"A moderate-strength dark brown English ale with a restrained roasty, bitter character. May have a range of roasted flavors, generally without burnt qualities, and often has a malty chocolate and caramel profile.","Aroma":"Moderate to moderately low bready, biscuity, and toasty malt aroma with mild roastiness, often like chocolate. Additional malt complexity may be present as caramel, nuts, toffee sweetness. May have up to a moderate level of floral or earthy hops. Moderate fruity esters optional, but desirable. Low diacetyl optional.","Appearance":"Brown to dark brown in color, often with ruby highlights. Good clarity, although may be opaque. Moderate off-white to light tan head with good to fair retention.","Flavor":"Moderate bready, biscuity, and toasty malt flavor with a mild to moderate chocolate roastiness, and often a significant caramel, nutty, or toffee character, possibly with lower levels of darker flavors like coffee or licorice. Should not be burnt or harshly roasted, although small amounts may contribute a bitter chocolate complexity. Up to moderate earthy or floral hop flavor optional. Low to moderate fruity esters. Medium- low to medium bitterness varies the balance from slightly malty to slightly bitter, with a fairly dry to slightly sweet finish. Moderately-low diacetyl optional.","Mouthfeel":"Medium-light to medium body. Moderately-low to moderately-high carbonation. Light to moderate creamy texture.","Style Comparison":"Differs from American Porter in that it usually has softer, sweeter, and more caramelly flavors, lower gravities, and usually less alcohol; American Porter also usually has more hop character. More substance and roast than a British Brown Ale. Higher in gravity than a Dark Mild."},"th":{"Overall Impression":"เบียร์ English Ale สีน้ำตาลเข้มความแรงปานกลาง ที่ถูกควบคุมคาแรคเตอร์ความขมและรสคั่ว อาจมีรสคั่วในแบบต่างๆ แต่โดยทั่วไปจะไม่มีรสไหม้ และมักมีรสมอลต์แบบ chocolate และ caramel","Aroma":"กลิ่นมอลต์ในแบบ bready, biscuity และ toasty ปานกลางถึงต่ำปานกลาง พร้อมความคั่วอ่อนๆ ที่มักจะมาในแบบ chocolate ความซับซ้อนของมอลต์อาจพบเพิ่มในแบบ caramel, nut และความหวานแบบ toffee อาจพบฮอปถึงระดับปานกลางในแบบ floral หรือ earthy อาจพบ ester แบบ fruity ปานกลาง แต่ต้องเป็นที่ต้องการ สามารถพบ diacetyl แบบต่ำได้","Appearance":"สีน้ำตาล (brown) ถึงน้ำตาลเข้ม (dark brown) มักมีไฮไลท์สีทับทิม มีความใสที่ดี แม้บางทีอาจจะทึบแสง ฟองสีขาวนวลถึงสีนำตาลอ่อนขนาดปานกลาง เกาะแก้วดีถึงปานกลาง","Flavor":"รสมอลต์ในแบบ bready, biscuity และ toasty ปานกลาง ที่มาพร้อมรสคั่วของ chocolate แบบนุ่มนวลถึงปานกลาง มักพบคาแรคเตอร์ caramel, nutty หรือ toffee และอาจพบ coffee หรือ licoriceในระดับต่ำไม่ควรพบรสไหม้หรือคั่วแบบกระด้าง แต่ถ้ามีเล็กน้อยอาจช่วยเรื่องความขมที่ซับซ้อนของ chocolate สามารถพบคาแรคเตอร์ฮอปแบบ earthy หรือ floral ในแบบปานกลาง มี ester แบบ fruity แบบต่ำถึงปานกลาง มีความขมต่ำปานกลางถึงปานกลางที่ไปช่วยทำให้ความสมดุลนั้นหลากหลายเป็นได้ตั้งแต่มอลต์เด่นจนไปถึงขมเล็กน้อย มาพร้อมกับการจบแบบ dry ปานกลางจนถึงหวานเล็กน้อย สามารถพบ diacetyl แบบปานกลางได้","Mouthfeel":"เนื้อเบียร์แบบบางปานกลางถึงปานกลาง คาร์โบเนชั่นต่ำปานกลางถึงสูงปานกลาง มีความครีมมี่แบบบางเบาถึงปานกลาง","Style Comparison":"แตกต่างจาก American Porter ตรงที่มักจะมีรสชาติที่นุ่มนวลกว่า หอมหวานกว่าและมีรส caramel มากกว่า มี Gravity และแอลกอฮอล์น้อยกว่า; American Porter มักจะมีฮอปมากกว่า มีเนื้อเบียร์และรสคั่วมากกว่า British Brown Ale มี Gravity สูงกว่า Dark Mild"},"tags":"standard-strength, dark-color, top-fermented, british-isles, traditional-style, porter-family, malty, roasty","ex":"Bateman’s Salem Porter, Burton Bridge Burton Porter, Fuller's London Porter, Nethergate Old Growler Porter, RCH Old Slug Porter, Samuel Smith Taddy Porter","OG":[1.04,1.052],"FG":[1.008,1.014],"IBU":[18.0,35.0],"SRM":[20.0,30.0],"ABV":[4.0,5.4]},{"c":"14A","n":"Scottish Light","cat":"14","cn":"Scottish Ale","tier":"C","gen":false,"en":{"Overall Impression":"A low-alcohol, malty beer with light caramel, toast, toffee, and fruit flavors. A slight roast dryness offsets the residual sweetness in the finish, with the bitterness perceived only to keep the beer from being cloying.","Aroma":"Low to medium maltiness with caramel and toffee notes, and light toasty and sugary qualities that might be reminiscent of toasted breadcrumbs, ladyfingers, English biscuits, graham crackers, or butterscotch. Light pome fruitiness and light English hop aroma (earthy, floral, orange- citrus, spicy, etc.) allowable.","Appearance":"Deep copper to dark brown. Clear. Low to moderate, creamy off-white.","Flavor":"Medium toasty-bready malt with caramel and toffee overtones, finishing with a slightly roasty dryness. A wide range of caramelized sugar and toasted bread type of flavors are possible, using similar descriptors as the aroma. Clean maltiness and fermentation profile. Light esters and hop flavor allowable (similar descriptors as aroma). Sufficient bitterness to not be cloying, but with a malty balance and aftertaste.","Mouthfeel":"Medium-low to medium body. Low to moderate carbonation. Maybe be moderately creamy.","Style Comparison":"See category introduction. Similar to other Scottish Ales but lower in alcohol, and darker in color. Similar in strength to the low end of Dark Mild, but with a different flavor profile and balance."},"th":{"Overall Impression":"เบียร์ที่มีแอลกอฮอล์ต่ำ คาแรคเตอร์มอลต์ชัดพร้อมรสบางๆของ caramel, toast, toffee และ fruity มีความคั่วเล็กน้อยและความ dry ที่ช่วยให้ความสมดุลในตอนจบ มีความขมที่รับรู้ได้ที่ช่วยทำให้ไม่รู้สึกหวาน","Aroma":"มีคาแรคเตอร์มอลต์ในระดับต่ำถึงปานกลางพร้อมด้วยกลิ่น caramel, toffee, light toasty และรสหวานอ่อนๆ ที่ชวนให้นึกถึง toasted breadcrumbs, ladyfingers, English biscuits, graham crackers หรือ butterscotch กลิ่น pome fruity อ่อนๆกับกลิ่นฮอปสายพันธุ์อังกฤษแบบบางๆที่ยอมรับได้ (earthy, floral, orange- citrus, spicy และอื่นๆ)","Appearance":"ทองแดงเข้ม (deep copper) ถึงน้ำตาลเข้ม (dark brown) น้ำเบียร์ใส ฟองต่ำถึงปานกลางสีขาวนวลแบบครีมมี่","Flavor":"มีรสมอลต์ในแบบ toasty-bready ปานกลางตามด้วยรส caramel และ toffee ที่แทรกขึ้นมา จบด้วยรสคั่วแบบ dry ใช้คาแรคเตอร์ของ caramelized sugar และ toasted bread ได้หลากหลาย โดยที่ใช้คาแรคเตอร์แบบเดียวกันกับอโรม่า มีโปรไฟล์มอลต์และโปรไฟล์การหมักที่สะอาด สามารถพบ ester บางๆและฮอปได้ (ที่อธิบายคล้ายกับอโรม่า) มีความขมเพียงพอเพื่อคุมรสหวาน ตอนจบต้องมีความสมดุลจากมอลต์ใน aftertaste","Mouthfeel":"เนื้อเบียร์บางปานกลางถึงปานกลาง คาร์โบเนชั่นต่ำถึงปานกลาง อาจพบความครีมมี่ปานกลาง","Style Comparison":"ดูบทนำของหมวดหมู่ คล้ายกับเบียร์ Scottish Ale อื่นๆ แต่มีแอลกอฮอล์ต่ำกว่าและมีสีเข้มกว่า ความแรงคล้ายกับจุดต่ำสุดของ Dark Mild แต่มีรสชาติและความสมดุลที่แตกต่างกัน"},"tags":"session-strength, amber-color, top-fermented, british-isles, traditional-style, amber-ale-family, malty","ex":"Belhaven Best, McEwan's 60/-","OG":[1.03,1.035],"FG":[1.01,1.013],"IBU":[10.0,20.0],"SRM":[17.0,25.0],"ABV":[2.5,3.3]},{"c":"14B","n":"Scottish Heavy","cat":"14","cn":"Scottish Ale","tier":"C","gen":false,"en":{"Overall Impression":"A lower-alcohol, malty beer with light caramel, toast, toffee, and fruity flavors. A slight roast dryness offsets the residual sweetness in the finish, with the bitterness perceived only to keep the beer from being cloying.","Aroma":"Medium-low to medium maltiness with caramel and toffee notes, and light toasty and sugary qualities that might be reminiscent of toasted breadcrumbs, ladyfingers, English biscuits, graham crackers, or butterscotch. Light pome fruitiness and light English hop aroma (earthy, floral, orange- citrus, spicy, etc.) allowable.","Appearance":"Pale copper to brown. Clear. Low to moderate, creamy off-white.","Flavor":"Medium toasty-bready malt with caramel and toffee overtones, finishing with a slightly roasty dryness. A wide range of caramelized sugar and toasted bread type of flavors are possible, using similar descriptors as the aroma. Clean maltiness and fermentation profile. Light esters and hop flavor allowable (similar descriptors as aroma). Sufficient bitterness to not be cloying, but with a malty balance and aftertaste.","Mouthfeel":"Medium-low to medium body. Low to moderate carbonation. Maybe be moderately creamy.","Style Comparison":"See category introduction. Similar to other Scottish Ales in flavor profile, lighter in color and stronger than a Scottish Light. Similar in strength to Ordinary Bitter, but with a different flavor profile and balance."},"th":{"Overall Impression":"เบียร์ที่มีคาแรคเตอร์มอลต์ชัดแต่แอลกอฮอล์ต่ำพร้อมรส caramel, toast, toffee และ fruity มีความคั่วเล็กน้อยและความ dry ที่ช่วยให้ความสมดุลในตอนจบ มีความขมที่รับรู้ได้ที่ช่วยทำให้ไม่ range-citrus, spicy, etc.) allowable.","Appearance":"Pale copper to brown. Clear. Low to moderate, creamy off-white.","Flavor":"Medium toasty-bready malt with caramel and toffee overtones, finishing with a slightly roasty dryness. A wide range of caramelized sugar and toasted bread type of flavors are possible, using similar descriptors as the aroma. Clean maltiness and fermentation profile. Light esters and hop flavor allowable (similar descriptors as aroma). Sufficient bitterness to not be cloying, but with a malty balance and aftertaste.","Mouthfeel":"Medium body. Medium-low to medium carbonation. Maybe be moderately creamy.","Style Comparison":"See category introduction. Stronger than other Scottish Ales, but with a similar flavor profile. Similar in strength to Best Bitter and Strong Bitter, but with a different flavor profile and balance."},"th":{"Overall Impression":"เบียร์ที่มีคาแรคเตอร์มอลต์ชัดที่มีความแรงแอลกอฮอล์ปานกลาง พร้อมรส caramel, toast, toffee และ fruity มีความคั่วเล็กน้อยและความ dry ที่ช่วยให้ความสมดุลในตอนจบ มีความขมที่รับรู้ได้ที่ช่วยต้านรสหวาน","Aroma":"มีคาแรคเตอร์มอลต์ในระดับปานกลางพร้อมด้วยกลิ่น caramel, toffee, light toasty และรสหวานอ่อนๆ ที่ชวนให้นึกถึง toasted breadcrumbs, ladyfingers, English biscuits, graham crackers หรือ butterscotch กลิ่น pome fruity อ่อนๆกับกลิ่นฮอปสายพันธุ์อังกฤษแบบบางที่ยอมรับได้ (earthy, floral, orange- citrus, spicy และอื่นๆ)","Appearance":"สีทองแดงอ่อน (pale copper) ถึงน้ำตาล (brown) น้ำเบียร์ใส มีฟองต่ำถึงปานกลางสีขาวนวลแบบครีมมี่","Flavor":"มีรสมอลต์ในแบบ toasty-bready ปานกลางตามด้วยรส caramel และ toffee ที่แทรกขึ้นมา จบด้วยรสคั่วแบบ dry ใช้คาแรคเตอร์ของ caramelized sugar และ toasted bread ได้หลากหลาย โดยที่ใช้คาแรคเตอร์แบบเดียวกันกับอโรม่า มีโปรไฟล์มอลต์และโปรไฟล์การหมักที่สะอาด สามารถพบ ester บางๆและฮอปได้ (ที่อธิบายคล้ายกับอโรม่า) มีความขมเพียงพอเพื่อคุมรสหวาน ตอนจบต้องมีความสมดุลจากมอลต์ใน aftertaste","Mouthfeel":"เนื้อเบียร์แบบปานกลาง มีคาร์โบเนชั่นต่ำปานกลางถึงปานกลาง อาจพบความครีมมี่ปานกลาง","Style Comparison":"ดูบทนำของหมวดหมู่ แรงกว่าเบียร์ Scottish Ale อื่นๆแต่มีรสชาติใกล้เคียงกัน มีความแรงใกล้เคียงกับ Best Bitter และ Strong Bitter แต่มีรสชาติและความสมดุลที่แตกต่างกัน"},"tags":"standard-strength, amber-color, top-fermented, british-isles, traditional-style, amber-ale-family, malty","ex":"Belhaven Scottish Ale, Broughton Wee Jock 80 Shilling, Caledonian Edinburgh Castle, McEwan’s 80/-, McEwan’s Export, Traquair Bear Ale","OG":[1.04,1.06],"FG":[1.01,1.016],"IBU":[15.0,30.0],"SRM":[12.0,20.0],"ABV":[3.9,6.0]},{"c":"15A","n":"Irish Red Ale","cat":"15","cn":"Irish Beer","tier":"B","gen":false,"en":{"Overall Impression":"An easy-drinking pint, often with subtle flavors. Slightly malty in the balance sometimes with an initial soft toffee or caramel sweetness, a slightly grainy- biscuity palate, and a touch of roasted dryness in the finish. Some versions can emphasize the caramel and sweetness more, while others will favor the grainy palate and roasted dryness.","Aroma":"Low to moderate malt aroma, either neutral-grainy or with a lightly caramel, toast, or toffee character. Very light buttery character optional. Low earthy or floral hop aroma optional. Quite clean.","Appearance":"Medium amber to medium reddish-copper color. Clear. Low off-white to tan colored head, average persistence.","Flavor":"Moderate to very little caramel malt flavor and sweetness, rarely with a light buttered toast or toffee-like quality. The palate often is fairly neutral and grainy, or can take on a lightly toasty or biscuity note as it finishes with a light taste of roasted grain, which lends a characteristic dryness to the finish. A light earthy or floral hop flavor is optional. Medium to medium-low bitterness. Medium-dry to dry finish. Clean and smooth. Low esters optional. The balance tends to be slightly towards the malt, although light use of roasted grains may increase the perception of bitterness slightly.","Mouthfeel":"Medium-light to medium body, although examples containing low levels of diacetyl may have a slightly slick mouthfeel (not required). Moderate carbonation. Smooth.","Style Comparison":"A less-bitter and hoppy Irish equivalent to an English Bitter, with a dryish finish due to roasted barley. More attenuated with less caramel flavor and body than equivalent-strength Scottish Ales."},"th":{"Overall Impression":"เบียร์ที่ดื่มง่าย มักมีรสชาติที่อ่อนนุ่ม สมดุลด้วยมอลต์บางๆที่บางครั้งมาพร้อม toffee และความหวานจาก caramel รส grainy-biscuit บางๆ และรสคั่วที่ทำให้มีการจบรสแบบ dry บางรูปแบบสามารถเน้นคาราเมลและความหวานได้มากกว่า ขณะที่บางรูปแบบจะมีรสชาติ grainy และรสคั่วที่ทำให้รู้สึก dry","Aroma":"กลิ่นมอลต์ต่ำถึงปานกลาง มีทั้ง grainy แบบกลางๆ หรือมีคาแรคเตอร์แบบ lightly caramel, toast หรือ toffee สามารถพบคาแรคเตอร์แบบ buttery บางๆได้ สามารถมีฮอปแบบ earthy หรือ floral ได้ ค่อนข้างสะอาด","Appearance":"สีอำพันปานกลาง (medium amber) ถึงแดงทองแดงปานกลาง (medium reddish-copper) ใส ฟองต่ำสีขาวนวลจนถึงน้ำตาลอ่อน ฟองเกาะแก้วได้ดีปานกลาง","Flavor":"มีความหวานและรส caramel จากมอลต์ปานกลางถึงน้อยมากไม่ค่อยพบ buttered toast หรือ toffee การรับรสในปากแบบกลางและ grainy หรืออาจพบ lightly toasty หรือ biscuity บางๆที่จบพร้อมกับรส dry ที่มาจากรสคั่วอ่อน สามารถมีฮอปในแบบ earthy หรือ floral ได้ มีความขมต่ำปานกลางถึงปานกลาง จบรสแบบ dry ปานกลางจนถึง dry สะอาดและเรียบเนียน สามารถพบ ester แบบต่ำได้ ความสมดุลไปในด้านมอลต์และการใช้ grain แบบคั่วจะช่วยเพิ่มความขมเล็กน้อย","Mouthfeel":"เนื้อเบียร์บางปานกลางถึงปานกลาง แม้ว่าตัวอย่างที่มี diacetyl ในระดับต่ำอาจมีความรู้สึกปากลื่นเล็กน้อย (ไม่จำเป็น) มีคาร์โบเนชั่นปานกลาง นุ่มลื่น","Style Comparison":"เบียร์ Irish ที่มีรสขมน้อยกว่าและมีฮอปเทียบเท่ากับ English Bitter มีการจบรสแบบ dry จาก roasted barley ยีสต์จัดการน้ำตาลได้ดี มีรส caramel และเนื้อเบียร์บางกว่า Scottish Ale ที่มีความเข้มข้นเท่ากัน"},"tags":"standard-strength, amber-color, top-fermented, british-isles, traditional-style, amber-ale-family, balanced","ex":"Franciscan Well Rebel Red, Kilkenny Irish Beer, Murphy’s Irish Red, O’Hara’s Irish Red Ale, Porterhouse Nitro Red Ale, Smithwick’s Irish Ale","OG":[1.036,1.046],"FG":[1.01,1.014],"IBU":[18.0,28.0],"SRM":[9.0,14.0],"ABV":[3.8,5.0]},{"c":"15B","n":"Irish Stout","cat":"15","cn":"Irish Beer","tier":"A","gen":false,"en":{"Overall Impression":"A black beer with a pronounced roasted flavor, often similar to coffee. The balance can range from fairly even to quite bitter, with the more balanced versions having a little malty sweetness and the bitter versions being quite dry. Draught versions typically are creamy from a nitro pour, but bottled versions will not have this dispense- derived character. The roasted flavor can range from dry and coffee-like to somewhat chocolaty.","Aroma":"Moderate coffee-like aroma typically dominates; may have slight dark chocolate, cocoa, or roasted grain secondary notes. Medium-low esters optional. Low earthy or floral hop aroma optional.","Appearance":"Jet black to deep brown with garnet highlights in color. According to Guinness, “Guinness beer may appear black, but it is actually a very dark shade of ruby.” Opaque. A thick, creamy, long-lasting, tan- to brown-colored head is characteristic when served on nitro, but don’t expect a tight, creamy head on a bottled beer.","Flavor":"Moderate roasted grain or malt flavor with a medium to high bitterness. The finish can be dry and coffee-like to moderately balanced with a touch of caramel or malty sweetness. Typically has coffee-like flavors, but also may have a bittersweet or unsweetened chocolate character in the palate, lasting into the finish. Balancing factors may include some creaminess, medium-low fruitiness, or medium earthy hop flavor. The level of bitterness is somewhat variable, as is the roasted character and the dryness of the finish; allow for interpretation by brewers.","Mouthfeel":"Medium-light to medium-full body, with a somewhat creamy character – especially when served by nitro pour. Low to moderate carbonation. For the high hop bitterness and significant proportion of dark grains present, this beer is remarkably smooth. May have a light astringency from the roasted grains, although harshness is undesirable.","Style Comparison":"Lower strength than an Irish Extra Stout. Darker in color (black) than an English Porter (brown)."},"th":{"Overall Impression":"เบียร์ดำที่มีรสคั่วเด่นชัด มักคล้ายกับกาแฟ มีความสมดุลตั้งแต่กลางๆจนถึงค่อนข้างขม โดยในแบบที่มีความสมดุลจะมีความหวานจากมอลต์เล็กน้อย และในแบบที่ขมจะ dry ในรูปแบบเบียร์สดจะพบความครีมมี่จากการเสิร์ฟด้วย Nitro แต่ในแบบขวดจะไม่มีความรู้สึกนี้ รสคั่วจะมีได้ตั้งแต่คล้ายกาแฟและ dry จนไปถึงแบบ chocolate","Aroma":"กลิ่นหอมคล้ายกาแฟที่โดดเด่นแบบปานกลาง อาจพบกลิ่นแฝงในแบบ dark chocolate, cocoa หรือ roasted grain สามารถมี ester แบบต่ำปานกลางได้ สามารถพบฮอปในแบบ earthy หรือ floral แบบต่ำได้","Appearance":"สีดำสนิท (jet black) ถึงสีน้ำตาลเข้ม (deep brown) พร้อมไฮไลท์เป็นสีโกเมน ตามคำพูดของ Guinness “เบียร์ Guinness อาจดูเหมือนเป็นสีดำแต่จริงๆ แล้วมันเป็นสีทับทิมที่เข้มมาก” ทึบแสง ฟองหนาครีมมี่ เกาะแก้วนาน ฟองสีน้ำตาลอ่อน (tan) ถึงสีน้ำตาล (brown) เป็นลักษณะเฉพาะเมื่อเสิร์ฟจาก Nitro แต่อย่าคาดหวังว่าเบียร์ขวดจะมีฟองแน่นและครีมมี่แบบนี้","Flavor":"รส grain คั่วหรือรสมอลต์ที่มีความขมแบบปานกลางถึงสูง ตอนจบรสอาจจะพบรส dry คล้ายกาแฟจนถึงความสมดุลที่มาจากความหวานของมอลต์และ caramel โดยทั่วไปแล้วจะมีรสชาติเหมือนกาแฟแต่อาจพบรสหวานปนขมหรือ chocolate แบบไม่หวานในการรับรสที่อยู่ไปจนจบรสความสมดุลมาจากความครีมมี่ fruity แบบต่ำปานกลาง หรือจากฮอปแบบ earthy ปานกลาง ระดับของความขมนั้นมีได้หลายแบบ ตั้งแต่แบบคั่วจนถึงแบบ dry ที่ปล่อยให้ผู้ผลิตเป็นคนตีความ","Mouthfeel":"เนื้อเบียร์บางปานกลางถึงหนาปานกลาง มีความครีมมี่เล็กน้อย โดยเฉพาะอย่างยิ่งเมื่อเสิร์ฟโดย Nitro คาร์โบเนชั่นต่ำถึงปานกลาง แม้ความขมของฮอปจะสูงและสัดส่วนของ dark grain ที่ชัดเจนแต่เบียร์สไตล์นี้กลับมีความนุ่มนวลอย่างน่าทึ่ง อาจมีความฝาดเล็กน้อยจาก roasted grain แต่ก็ไม่ควรมีความกระด้าง","Style Comparison":"ความแรงน้อยกว่า Irish Extra Stout สีเข้ม (black) มากกว่า English Porter (brown)"},"tags":"standard-strength, dark-color, top-fermented, british-isles, traditional-style, stout-family, bitter, roasty","ex":"Beamish Irish Stout, Belhaven Black Stout, Guinness Draught, Murphy's Irish Stout, O’Hara’s Irish Stout, Porterhouse Irish Stout","OG":[1.036,1.044],"FG":[1.007,1.011],"IBU":[25.0,45.0],"SRM":[25.0,40.0],"ABV":[3.8,5.0]},{"c":"15C","n":"Irish Extra Stout","cat":"15","cn":"Irish Beer","tier":"C","gen":false,"en":{"Overall Impression":"A fuller-bodied black beer with a pronounced roasted flavor, often similar to coffee and dark chocolate with some malty complexity. The balance can range from moderately bittersweet to bitter, with the more balanced versions having up to moderate malty richness and the bitter versions being quite dry.","Aroma":"Moderate to moderately high coffee-like aroma, often with slight dark chocolate, cocoa, biscuit, vanilla, or roasted grain secondary notes. Medium-low esters optional. Hop aroma low to none, may be lightly earthy or spicy, but is typically absent. Malt and roast dominate the aroma.","Appearance":"Jet black. Opaque. A thick, creamy, persistent tan head is characteristic.","Flavor":"Moderate to moderately high dark-roasted grain or malt flavor with a medium to medium-high bitterness. The finish can be dry and coffee-like to moderately balanced with up to moderate caramel or malty sweetness. Typically has roasted coffee-like flavors, but also often has a dark chocolate character in the palate, lasting into the finish. Background mocha or biscuit flavors are often present and add complexity. Medium-low fruitiness optional. Medium earthy or spicy hop flavor optional. The level of bitterness is somewhat variable, as is the roasted character and the dryness of the finish; allow for interpretation by brewers.","Mouthfeel":"Medium-full to full body, with a somewhat creamy character. Moderate carbonation. Very smooth. May have a light astringency from the roasted grains, although harshness is undesirable. A slightly warming character may be detected.","Style Comparison":"Midway between an Irish Stout and a Foreign Extra Stout in strength and flavor intensity, although with a similar balance. More body, richness, and often malt complexity than an Irish Stout. Black in color, not brown like an English Porter."},"th":{"Overall Impression":"เบียร์ดำที่เนื้อเบียร์แน่นกว่า มีรสคั่วที่เด่นชัดมักคล้ายกับกาแฟและดาร์กช็อกโกแลตที่มีความซับซ้อนของมอลต์ ความสมดุลอาจมีตั้งแต่รสหวานปนขมปานกลางไปจนถึงรสขม โดยแบบที่สมดุลกว่าจะมีความเข้มข้นของมอลต์ปานกลาง และแบบที่ขมจะ dry","Aroma":"กลิ่นหอมคล้ายกาแฟปานกลางถึงสูงปานกลาง มักมีกลิ่นดาร์กช็อกโกแลต โกโก้ บิสกิต วานิลลา หรือ grain คั่วเล็กน้อยเป็นกลิ่นเสริมสามารถมี ester แบบปานกลางถึงต่ำได้ อาจจะพบกลิ่นฮอปแบบต่ำจนถึงไม่พบเลยในแบบ earthy หรือ spicy กลิ่นมอลต์และกลิ่นคั่วเป็นจุดเด่นด้านอโรม่า","Appearance":"สีดำสนิท (jet black) ทึบแสง (opaque) มีฟองสีน้ำตาลอ่อนที่หนา ครีมมี่ และเกาะแก้วได้ดีคือจุดเด่น","Flavor":"มีรสในแบบ grain ที่คั่วเข้มปานกลางถึงสูงปานกลางหรือรสมอลต์ที่มากับความขมปานกลางจนถึงขมสูงปานกลาง การจบรสจะมีในแบบคล้ายกาแฟที่ dry หรือจบแบบสมดุลจากความหวานของมอลต์พร้อม caramel ปานกลาง โดยทั่วไปแล้วจะมีรสชาติเหมือนกาแฟคั่ว แต่มักจะมีลักษณะของดาร์กช็อกโกแลตที่อยู่ในรสที่ยาวไปถึงตอนจบรส มีรส mocha หรือ biscuit เป็นฉากหลังที่ช่วยเพิ่มความซับซ้อน พบความ fruity แบบต่ำปานกลางได้ สามารถพบรสฮอปในแบบ earthy หรือ spicy ปานกลางได้ระดับความขมมีได้หลายระดับ ตั้งแต่รสคั่วถึงแบบ dry แล้วแต่การตีความของผู้ผลิต","Mouthfeel":"เนื้อเบียร์หนาปานกลางจนถึงหนา ที่มีความครีมมี่ มีคาร์โบเนชั่นปานกลาง เนียนนุ่ม อาจมีความฝาดเล็กน้อยจาก roasted grain แต่ไม่ควรมีความกระด้าง อาจพบคาแรคเตอร์แอลกอฮอล์ตอนที่อุ่นขึ้นได้","Style Comparison":"ตรงกลางระหว่าง Irish Stout และ Foreign Extra Stout ในด้านความแรงและความเข้มข้นของรสชาติ แม้ว่าจะมีความ สมดุลใกล้เคียงกัน มีเนื้อเบียร์หนากว่า เข้มข้นกว่า และความซับซ้อนของมอลต์มักจะมากกว่า Irish Stout มีสีดำ ไม่ใช่สีน้ำตาล เหมือน English Porter"},"tags":"high-strength, dark-color, top-fermented, british-isles, traditional-style, stout-family, bitter, roasty","ex":"Guinness Extra Stout, O’Hara’s Leann Folláin, Porterhouse XXXX, Sheaf Stout","OG":[1.052,1.062],"FG":[1.01,1.014],"IBU":[35.0,50.0],"SRM":[30.0,40.0],"ABV":[5.0,6.5]},{"c":"16A","n":"Sweet Stout","cat":"16","cn":"Dark British Beer","tier":"B","gen":false,"en":{"Overall Impression":"A very dark, sweet, full-bodied, slightly roasty stout that can suggest coffee-and-cream, or sweetened espresso.","Aroma":"Mild roasted grain aroma, sometimes with coffee or chocolate notes. An impression of cream-like sweetness often exists. Fruitiness can be low to moderately high. Low diacetyl optional. Low floral or earthy hop aroma optional.","Appearance":"Very dark brown to black in color. Clear, if not opaque. Creamy tan to brown head.","Flavor":"Dark, roasted, coffee or chocolate flavors dominate the palate. Low to moderate fruity esters. Moderate bitterness. Medium to high sweetness provides a counterpoint to the roasted character and bitterness, lasting into the finish. The balance between dark grains or malts and sweetness can vary, from quite sweet to moderately dry and somewhat roasty. Low diacetyl optional. Low floral or earthy hop flavor optional.","Mouthfeel":"Medium-full to full-bodied and creamy. Low to moderate carbonation. High residual sweetness from unfermented sugars enhances the full-tasting mouthfeel.","Style Comparison":"Much sweeter and less bitter-tasting than other stouts, except the stronger Tropical Stout. The roast character is mild, not burnt like other stouts. Can be similar in balance to Oatmeal Stout, albeit with more sweetness."},"th":{"Overall Impression":"เบียร์ Stout สีดำสนิท หวาน เนื้อเบียร์แน่นคั่วเล็กน้อย ให้ความรู้สึกเหมือน coffee-and-cream หรือ sweetened espresso","Aroma":"กลิ่นหอมของ grain แบบคั่วอ่อน บางครั้งจะพบกลิ่นบางๆของ coffee หรือ chocolate มักมีความรู้สึกหวานเหมือนครีม อาจพบความ fruity ได้ในแบบต่ำถึงสูงปานกลาง สามารถพบ diacetyl แบบต่ำได้สามารถพบฮอปในแบบ floral หรือ earthy แบบต่ำได้","Appearance":"มีสีน้ำตาลเข้ม (dark brown) ถึงสีดำ (black) ใส ถ้าไม่ทึบแสง ฟองสีน้ำตาลอ่อนถึงสีน้ำตาลแบบครีมมี่","Flavor":"มีรสเข้ม รสคั่ว coffee หรือ chocolate ตลอดการรับรส มี ester แบบ fruity ต่ำถึงปานกลาง ความขมปานกลาง ความหวานปานกลางถึงสูงที่ให้ความรู้สึกแตกต่างระหว่างคาแรคเตอร์คั่วและขม ที่ค้างไปจนจบความสมดุลจาก dark grain หรือ dark มอลต์และความหวานเป็นไปได้หลายแบบ ทั้งออกหวานหรือ dry ปานกลาง หรือรสคั่ว สามารถพบ diacetyl แบบต่ำได้ สามารถพบฮอปในแบบ floral หรือ earthy แบบต่ำได้","Mouthfeel":"เนื้อเบียร์ปานกลางถึงแน่น มีความครีมมี่ มีคาร์โบเนชั่นต่ำถึงปานกลาง มีความหวานที่ตกค้างจากน้ำตาลที่ยีสต์ไม่สามารถจัดการได้สูงที่ช่วยเพิ่มรสชาติเต็มปากเต็มคำ","Style Comparison":"รสหวานกว่าและขมน้อยกว่า Stout อื่นๆมากยกเว้น Tropical Stout ที่แรงกว่า คาแรคเตอร์ความคั่วจะนุ่มนวล ไม่ไหม้เหมือน Stout อื่นๆ อาจจะคล้ายกับ Oatmeal Stout ในด้านความสมดุลแม้ว่าจะมีความหวานมากกว่า"},"tags":"standard-strength, dark-color, top-fermented, british-isles, traditional-style, stout-family, malty, roasty, sweet","ex":"Bristol Beer Factory Milk Stout, Firestone Nitro Merlin Milk Stout, Left Hand Milk Stout, Lancaster Milk Stout, Mackeson's XXX Stout, Marston’s Pearl Jet Stout","OG":[1.044,1.06],"FG":[1.012,1.024],"IBU":[20.0,40.0],"SRM":[30.0,40.0],"ABV":[4.0,6.0]},{"c":"16B","n":"Oatmeal Stout","cat":"16","cn":"Dark British Beer","tier":"A","gen":false,"en":{"Overall Impression":"A dark, roasty, full-bodied stout with enough sweetness to support the oat backbone. The sweetness, balance, and oatmeal impression can vary considerably.","Aroma":"Mild grainy, roasty, coffee-like character with a light malty sweetness that can give a coffee-and-cream impression. Low to medium-high fruitiness. Medium-low earthy or floral hop aroma optional. A light grainy-nutty oatmeal aroma is optional. Medium-low diacetyl optional but typically absent.","Appearance":"Brown to black in color. Thick, creamy, persistent tan- to brown-colored head. Clear, if not opaque.","Flavor":"Similar to the aroma, with a mild roasted coffee, milk chocolate, or coffee-and-cream flavor, and low to moderately- high fruitiness. Oats can add a toasty-nutty, grainy, or earthy flavor. Medium bitterness. Medium-sweet to medium-dry finish, which affects the perception of balance. Malty, roasty, nutty aftertaste. Medium-low earthy or floral hop flavor optional. Medium-low diacetyl optional but typically absent.","Mouthfeel":"Medium-full to full body, with a smooth, silky, velvety, sometimes an almost oily slickness from the oatmeal. Creamy. Medium to medium-high carbonation. Stronger versions may be lightly warming.","Style Comparison":"Most are like a cross between an Irish Extra Stout and a Sweet Stout with oatmeal added. Several variations exist, with the sweeter versions more like a Sweet Stout with oatmeal instead of lactose, and the drier versions more like a more nutty, flavorful Irish Extra Stout. Both tend to emphasize the body and mouthfeel."},"th":{"Overall Impression":"Stout สีเข้ม มีความคั่ว เนื้อเบียร์แน่นมีรสหวานพอที่จะรองรับคาแรคเตอร์ของข้าวโอ๊ต มีความหวาน ความสมดุลและคาแรคเตอร์ของข้าวโอ๊ตที่อาจจะมีความแตกต่างกัน","Aroma":"มีกลิ่นหอมอ่อนแบบ grainy มีความคั่ว มีความคล้ายกาแฟพร้อมความหวานอ่อนๆจากมอลต์ที่ทำให้รู้สึกถึง coffee-and-cream มีความ fruity ต่ำถึงสูงปานกลาง สามารถพบฮอปในแบบ floral หรือ earthy แบบต่ำปานกลางได้ สามารถพบกลิ่นข้าวโอ๊ตบางๆในแบบ grainy-nutty ได้ สามารถพบ diacetyl แบบต่ำปานกลางได้แต่มักไม่มี","Appearance":"มีสีน้ำตาล (brown) ถึงดำ (black) ฟองหนา ครีมมี่ สีน้ำตาลอ่อนจนถึงสีน้ำตาล เกาะแก้วได้ดี ใส ถ้าไม่ทึบแสง","Flavor":"คล้ายกับอโรม่า ด้วยกลิ่นกาแฟคั่วอ่อนๆ ช็อกโกแลตนม หรือรส coffee-and-cream มีความ fruity ต่ำจนถึงสูงปานกลาง รสข้าวโอ๊ตสามารถเพิ่มรสในแบบ toasty-nutty, grainy หรือ earthy มีความขมปานกลาง จบรสแบบ medium-sweet จนถึง medium-dry ที่ส่งผลต่อการรับรู้ในความสมดุล มี aftertaste ในแบบ malty, roasty, nutty สามารถพบฮอปในแบบ floral หรือ earthy แบบต่ำปานกลางได้ สามารถพบ diacetyl แบบต่ำปานกลางได้แต่มักไม่มี","Mouthfeel":"เนื้อเบียร์หนาปานกลางถึงหนา มีความเนียนนุ่ม บางครั้งอาจพบความมันจากข้าวโอ๊ต ครีมมี่ มีคาร์โบเนชั่นปานกลางถึงสูงปานกลาง เบียร์แบบที่แรงกว่าอาจพบความอุ่นจากแอลกอฮอล์เล็กน้อย","Style Comparison":"ส่วนใหญ่จะเป็นเหมือนลูกผสมระหว่าง Irish Extra Stout และ Sweet Stout ที่เติมข้าวโอ๊ต พบได้หลายรูปแบบ โดยแบบที่หวานกว่าเช่น Sweet Stout จะใช้ข้าวโอ๊ตแทน lactose และแบบที่ dry กว่านั้นจะมีคาแรคเตอร์ nutty รสเบียร์แบบเต็มรสชาติคล้ายกับ Irish Extra Stout ทั้งสองแบบมักจะเน้นเนื้อเบียร์และความรู้สึกเต็มปากเต็มคำ"},"tags":"standard-strength, dark-color, top-fermented, british-isles, traditional-style, stout-family, balanced, roasty","ex":"Anderson Valley Barney Flats Oatmeal Stout, Broughton Stout Jock, St-Ambroise Oatmeal Stout, Samuel Smith Oatmeal Stout, Summit Oatmeal Stout, Young's London Stout","OG":[1.045,1.065],"FG":[1.01,1.018],"IBU":[25.0,40.0],"SRM":[22.0,40.0],"ABV":[4.2,5.9]},{"c":"16C","n":"Tropical Stout","cat":"16","cn":"Dark British Beer","tier":"B","gen":false,"en":{"Overall Impression":"A very dark, sweet, fruity, moderately strong stout with smooth, roasty flavors, yet no burnt harshness.","Aroma":"Moderate to high intensity sweetness is prominent. Moderate to high coffee or chocolate roasty aroma, but not burnt. Medium to high fruitiness. May have a molasses, licorice, burnt sugar, dried fruit, or vinous aromatics. Stronger versions can have a subtle, clean aroma of alcohol. Low hop aroma optional. Low diacetyl optional.","Appearance":"Very deep brown to black in color. Clarity usually obscured by deep color. Clear, if not opaque. Large tan to brown head with good retention.","Flavor":"Quite sweet with a smooth dark grain flavors, and restrained, medium-low to medium bitterness. Smooth, roasty flavor, often like coffee or chocolate, although moderated in the balance by the sweet finish. No burnt malt flavor or harsh bite in the finish. Moderate to high fruity esters. Can have a sweet, dark rum, molasses, or burnt sugar-like quality. Low hop flavor optional. Medium-low diacetyl optional.","Mouthfeel":"Medium-full to full body, often with a smooth, creamy character. May have a warming but not hot alcohol presence. Moderate to moderately-high carbonation.","Style Comparison":"Tastes like a scaled-up Sweet Stout with higher fruitiness. Similar to some Imperial Stouts without the high bitterness, strong or burnt roastiness, and late hops, and with lower alcohol. Much sweeter and less hoppy than American Stouts. Much sweeter and less bitter than the similar-gravity Foreign Extra Stouts."},"th":{"Overall Impression":"เบียร์ Stout ความแรงปานกลางสีดำสนิทหวาน fruity ให้รสคั่วที่กลมกล่อม ไม่มีความไหม้และกระด้าง","Aroma":"ความหวานที่เข้มข้นโดดเด่นระดับปานกลางถึงสูง กลิ่นคั่วจาก coffee หรือ chocolate ปานกลางถึงสูง แต่ต้องไม่ไหม้ มีความ fruity ในระดับปานกลางถึงสูง อาจพบกลิ่น molasses, licorice, burnt sugar, dried fruit หรือ vinous แบบที่แอลกอฮอล์แรงกว่าสามารถมีกลิ่นหอมของแอลกอฮอล์ที่ละเอียดอ่อนและสะอาด สามารถมีกลิ่นฮอปในระดับต่ำได้สามารถพบ diacetyl แบบต่ำได้","Appearance":"มีสีน้ำตาลเข้ม (very deep brown) ถึงดำ (black) มีความใสที่มักจะถูกบดบังด้วยสีเข้ม ใส ถ้าไม่ทึบแสง ฟองขนาดใหญ่สีน้ำตาลอ่อนจนถึงสีน้ำตาล เกาะกับแก้วได้ดี","Flavor":"ค่อนข้างหวานด้วยรสชาติของ dark grain ที่นุ่มนวล และความขมปานกลางถึงต่ำปานกลาง รสชาติกลมกล่อม มีรสคั่ว ที่มักจะเหมือน coffee หรือ chocolate มีความสมดุลจากความหวานในตอนจบ ไม่ควรมีรสมอลต์ไหม้หรือรสกระด้างในตอนจบ มี ester แบบ fruity ปานกลางถึงสูง สามารถพบ รสหวาน dark rum, molasses หรือรสน้ำตาลไหม้สามารถพบฮอปในแบบต่ำได้ สามารถมี diacetyl ในแบบต่ำปานกลางได้","Mouthfeel":"เนื้อเบียร์แน่นปานกลางจนถึงแน่น มักมีลักษณะ ครีมมี่เนียนนุ่ม อาจพบคาแรคเตอร์แอลกอฮอล์ตอนอุ่นแต่ต้องไม่รุนแรง คาร์โบเนชั่นปานกลางถึงสูงปานกลาง","Style Comparison":"รสชาติเหมือน Sweet Stout ที่ขยายขนาดและให้รส fruity ที่สูงขึ้น; คล้ายกับ Imperial Stout ที่ความขมต่ำ ความคั่วเข้มหรือความไหม้ต่ำ ใช้ฮอปช่วงท้าย และมีแอลกอฮอล์ต่ำกว่า; หวานกว่าและฮอปน้อยกว่า American Stout มาก รสหวานและขมน้อยกว่าของ Foreign Extra Stout ที่มี gravity ใกล้เคียงกัน"},"tags":"high-strength, dark-color, top-fermented, british-isles, traditional-style, stout-family, malty, roasty, sweet","ex":"ABC Extra Stout, Bahamian Strong Back Stout, Dragon Stout, Jamaica Stout, Lion Stout, Royal Extra Stout","OG":[1.056,1.075],"FG":[1.01,1.018],"IBU":[30.0,50.0],"SRM":[30.0,40.0],"ABV":[5.5,8.0]},{"c":"16D","n":"Foreign Extra Stout","cat":"16","cn":"Dark British Beer","tier":"B","gen":false,"en":{"Overall Impression":"A very dark, rich, moderately strong, fairly dry stout with prominent roast flavors.","Aroma":"Moderate to high roast, like coffee, dark chocolate, or lightly burnt grain. Low to medium fruitiness. May have a sweet aroma, or molasses, licorice, dried fruit, or vinous aromatics. Stronger versions can have a subtle, clean aroma of alcohol. Low earthy, herbal, or floral hop aroma optional. Low diacetyl optional.","Appearance":"Very deep brown to black in color. Clarity usually obscured by deep color. Clear, if not opaque. Large tan to brown head with good retention.","Flavor":"Moderate to high roast, like coffee, dark chocolate, or lightly burnt grain, although without a sharp bite. Low to medium esters. Medium to high bitterness. Moderately dry finish. Moderate earthy, herbal, or floral hop flavor optional. Medium-low diacetyl optional.","Mouthfeel":"Medium-full to full body, often with a smooth, sometimes creamy character. May have a warming but not hot alcohol presence. Moderate to moderately-high carbonation.","Style Comparison":"Similar in balance to an Irish Extra Stout, but with more alcohol. Not as big or intense as an Imperial Stout. Lacking the strong bitterness and high late hops of American Stout. Similar gravity as Tropical Stout, but with a drier finish and higher bitterness."},"th":{"Overall Impression":"เบียร์ Stout ที่สีเข้มมาก เข้มข้นมาก ความแรงปานกลาง ค่อนข้าง dry พร้อมรสคั่วที่โดดเด่น","Aroma":"กลิ่นคั่วในระดับปานกลางถึงสูงในแบบ coffee, dark chocolate หรือ burnt grain อ่อนๆ มีความ fruity น้อยถึงปานกลาง อาจมีกลิ่นหอมหวาน molasses, licorice, dried fruit หรือ vinous เบียร์ในแบบที่แรงกว่าสามารถมีกลิ่นหอมของแอลกอฮอล์ที่ละเอียดอ่อนและสะอาดสามารถมีกลิ่นฮอปแบบ earthy, herbal หรือ floral ในแบบต่ำได้ สามารถพบ diacetyl แบบต่ำได้","Appearance":"มีสีน้ำตาลเข้ม (deep brown) ถึงดำมาก (black) ความโปร่งใสมักจะถูกบดบังด้วยสีเข้ม ใส ถ้าไม่ทึบแสง ฟองมีขนาดใหญ่สีน้ำตาลอ่อนถึงน้ำตาล เกาะแก้วได้ดี","Flavor":"รสคั่วระดับปานกลางถึงสูง ในแบบ coffee, dark chocolate หรือ burnt grain อ่อนๆโดยไม่มีรสคมจนกัดลิ้น มี ester ต่ำถึงปานกลางมีความขมปานกลางถึงสูง จบรสแบบเหลือความหวานปานกลาง สามารถพบกลิ่นฮอปแบบ earthy, herbal หรือ floral ในแบบปานกลางได้ สามารถพบ diacetyl แบบต่ำปานกลางได้","Mouthfeel":"เนื้อเบียร์แน่นปานกลางจนถึงแน่น มักจะเนี่ยนนุ่ม บางครั้งจะพบความครีมมี่ อาจพบคาแรคเตอร์แอลกอฮอล์ตอนอุ่นแต่ไม่รุนแรงคาร์โบเนชั่นปานกลางถึงสูงปานกลาง","Style Comparison":"มีความสมดุลคล้าย Irish Extra Stout แต่มีแอลกอฮอล์แรงกว่า ไม่เข้มข้นเท่า Imperial Stout ไม่มีความขมและการใช้ฮอปในช่วง late hop แบบ American Stout มี gravity คล้ายกับ Tropical Stout แต่มีการจบแบบ dry กว่า และความขมที่สูงกว่า"},"tags":"high-strength, dark-color, top-fermented, british-isles, traditional-style, stout-family, balanced, roasty","ex":"Coopers Best Extra Stout, Guinness Foreign Extra Stout, The Kernel Export Stout London 1890, La Cumbre Malpais Stout, Pelican Tsunami Export Stout, Ridgeway Foreign Export Stout","OG":[1.056,1.075],"FG":[1.01,1.018],"IBU":[50.0,70.0],"SRM":[30.0,40.0],"ABV":[6.3,8.0]},{"c":"17A","n":"British Strong Ale","cat":"17","cn":"Strong British Ale","tier":"B","gen":false,"en":{"Overall Impression":"An ale of respectable alcoholic strength, traditionally bottled-conditioned and cellared. Can have a wide range of interpretations, but most will have varying degrees of malty richness, late hops and bitterness, fruity esters, and alcohol warmth. The malt and adjunct flavors and intensity can vary widely, but any combination should result in an agreeable palate experience.","Aroma":"Malty-sweet with fruity esters, often with a complex blend of dried-fruit, caramel, nuts, toffee, or other specialty malt aromas. Some alcohol notes are acceptable, but shouldn’t be hot or solventy. Hop aromas can vary widely, but typically have earthy, resiny, fruity, or floral notes. The balance can vary widely, but most examples will have a blend of malt, fruit, hops, and alcohol in varying intensities.","Appearance":"Amber to dark reddish-brown color; many are fairly dark. Generally clear, although darker versions may be almost opaque. Moderate to low cream- to light tan-colored head with average retention.","Flavor":"Medium to high malt character often rich with nutty, toffee, or caramel flavors. Light chocolate notes are sometimes found in darker beers. May have interesting flavor complexity from brewing sugars. Balance is often malty, but may be well hopped, which affects the impression of maltiness. Moderate fruity esters are common, often with a dark fruit or dried fruit character. The finish may vary from medium dry to somewhat sweet. Alcoholic strength should be evident, not overwhelming. Low diacetyl optional, but generally not desirable.","Mouthfeel":"Medium to full, chewy body. Alcohol warmth is often evident and always welcome. Low to moderate carbonation. Smooth texture.","Style Comparison":"Significant overlap in gravity with Old Ale, but not having an aged character. A wide range of interpretations is possible. Should not be as rich or strong as an English Barley Wine. Stronger than the stronger everyday Strong Bitter, British Brown Ale, and English Porter. More specialty malt or sugar character than American Strong Ale."},"th":{"Overall Impression":"เบียร์เอลที่มีความเข้มข้นของแอลกอฮอล์สูง ใช้การหมักต่อในขวดและเก็บเบียร์แบบดั้งเดิม สามารถตีความได้หลายแบบแต่ส่วนใหญ่จะมีระดับของมอลต์ที่เข้มข้น ใส่ฮอปในช่วง late hop มีความขม มี ester ในแบบ fruity และความอุ่นจากแอลกอฮอล์ มีรสของมอลต์กับ adjunct และความเข้มข้นออกมาได้หลายแบบ แต่ทุกการผสมผสานควรส่งผลให้ได้รับประสบการณ์ที่น่าพึงพอใจ","Aroma":"กลิ่นหวานจากมอลต์พร้อมกับ fruity ester ที่มักจะพบความซับซ้อนจาก dried-fruit, caramel, nuts, toffee และ special มอลต์ กลิ่นแอลกอฮอล์เล็กน้อยเป็นที่ยอมรับได้ แต่ไม่ควรรุนแรงหรือออกมาในแบบ solventy กลิ่นของฮอปออกมาได้หลายรูปแบบ ปกติจะเป็นกลิ่น earthy, resiny, fruity หรือ floral ความสมดุลออกมาได้หลายรูปแบบ แต่ส่วนมากจะออกมาในแบบการผสมกันของ malt, fruit, hop และแอลกอฮอล์ที่ความเข้มข้นหลากหลาย","Appearance":"สีเหลืองอำพัน (amber) ถึงสีน้ำตาลแดงเข้ม (dark reddish-brown) หลายตัวอย่างค่อนข้างเข้ม โดยทั่วไปแล้วจะใส แม้ว่าแบบที่สีเข้มกว่าอาจเกือบจะทึบแสงก็ตาม ฟองขนาดปานกลางถึงต่ำ ฟองสีครีมถึงสีน้ำตาลอ่อน มีการเกาะแก้วตามค่าเฉลี่ย","Flavor":"มีคาแรคเตอร์ของมอลต์ปานกลางถึงสูง มักจะเข้มข้นด้วยรส nutty, toffee หรือ caramel กลิ่น chocolate บางๆอาจพบได้ในเบียร์ที่สีเข้ม อาจพบรสที่ซับซ้อนจาก brewing sugar ความสมดุลส่วนใหญ่จะมาทางมอลต์แต่บางทีก็อาจมาจากการใช้ฮอปได้อย่างดีที่ส่งผลต่อการรับรู้ของรสมอลต์ มี ester แบบ fruity ระดับปานกลางในแบบ dark fruit หรือ dried fruit มีรสตอนจบได้หลายแบบตั้งแต่ dry ปานกลางจนถึงหวานความแรงของแอลกอฮอล์อาจพบได้แต่ไม่ควรชัดเจนมากเกินไป สามารถพบ diacetyl แบบต่ำได้แต่ทั่วไปเป็นสิ่งที่ไม่ต้องการ","Mouthfeel":"เนื้อเบียร์ปานกลางจนถึงหนา เต็มปากเต็มคำ พบความอุ่นจากแอลกอฮอล์ได้เป็นปกติและเป็นสิ่งดี คาร์โบเนชั่นต่ำจนถึงปานกลางเนื้อเรียบเนียน","Style Comparison":"มีความเหลื่อมล้ำใน gravity กับสไตล์ Old Ale แต่ไม่มีคาแรคเตอร์ที่ผ่านการบ่ม สามารถตีความได้หลากหลาย ไม่ควรที่จะเข้มข้นหรือแรงเท่า English Barley Wine แรงกว่า Strong Bitter, British Brown Ale และ English Porter มีคาแรคเตอร์ของมอลต์หรือน้ำตาลมากกว่า American Strong Ale"},"tags":"high-strength, amber-color, top-fermented, british-isles, traditional-style, strong-ale-family, malty","ex":"Fuller’s 1845, Harvey’s Elizabethan Ale, J.W. Lees Moonraker, McEwan’s Champion, Samuel Smith’s Winter Welcome, Shepherd Neame 1698","OG":[1.055,1.08],"FG":[1.015,1.022],"IBU":[30.0,60.0],"SRM":[8.0,22.0],"ABV":[5.5,8.0]},{"c":"17B","n":"Old Ale","cat":"17","cn":"Strong British Ale","tier":"B","gen":false,"en":{"Overall Impression":"A stronger-than-average English ale, though usually not as strong or rich as an English Barley Wine, but usually malty. Warming. Shows positive maturation effects of a well-kept, aged beer.","Aroma":"Malty-sweet with fruity esters, often with a complex blend of dried fruit, vinous, caramel, molasses, toffee, light treacle, or other specialty malt aromas. Some alcohol and nutty oxidative notes are acceptable, akin to those found in Sherry, Port, or Madeira. Hop aroma not usually present.","Appearance":"Deep amber to very dark reddish-brown color, but most are fairly dark. Age and oxidation may darken the beer further. Clear, but can be almost opaque. Moderate to low cream- to light tan-colored head; retention average to poor.","Flavor":"Medium to high malt character with a luscious malt complexity, often with nut, caramel, or molasses-like flavors. Light chocolate or roasted malt flavors are optional, but should never be prominent. Balance is often malty-sweet, but may be well hopped; the impression of bitterness often depends on amount of aging. Moderate to high fruity esters are common, and may take on a dried-fruit or vinous character. The finish may vary from dry to somewhat sweet. Extended aging may contribute oxidative flavors similar to a fine old Sherry, Port, or Madeira. Alcoholic strength should be evident, though not overwhelming. Low diacetyl optional.","Mouthfeel":"Medium to full, chewy body, although older examples may be lower in body due to continued attenuation during conditioning. Alcohol warmth is often evident and always welcome. Low to moderate carbonation, depending on age and conditioning. Light acidity may be present, as well as some tannin if wood-aged; both are optional.","Style Comparison":"Roughly overlapping the British Strong Ale and the lower end of the English Barley Wine styles, but always having an aged quality. The distinction between an Old Ale and a Barley Wine is somewhat arbitrary above 7% ABV, and generally means having a more significant aged quality."},"th":{"Overall Impression":"เบียร์เอลจากอังกฤษที่แรงกว่าปกติ แม้ว่าจะไม่แรงหรือเข้มข้นเท่า English Barley Wine แต่มักจะเด่นที่มอลต์ และความอุ่นจากแอลกอฮอล์ แสดงถึงผลของการบ่มเป็นอย่างดี","Aroma":"มีความหวานจากมอลต์คู่กับ fruity ester มักออกมาในรูปความซับซ้อนในแบบการผสมกันของ dried fruit, vinous, caramel, molasses, toffee, light treacle หรือ special มอลต์ กลิ่นแอลกอฮอล์และกลิ่น nutty ที่เกิดจากการ oxidation บางชนิดเป็นที่ยอมรับได้ เช่นเดียวกับที่พบใน Sherry, Port หรือ Madeira มักจะไม่พบกลิ่นฮอป","Appearance":"สีอำพันเข้ม (deep amber) ถึงน้ำตาลแดงเข้มมาก (very dark reddish-brown) ส่วนใหญ่จะสีค่อนข้างเข้ม การบ่มและการเกิด oxidation อาจทำให้เบียร์สีเข้มขึ้นได้อีก มีความใสแต่เกือบจะทึบแสงได้ฟองปานกลางถึงต่ำ ฟองสีครีมจนถึงสีน้ำตาลอ่อน ฟองเกาะแก้วได้ปานกลางถึงแย่","Flavor":"มีคาแรคเตอร์มอลต์ปานกลางถึงสูงที่มีความซับซ้อนอันหวานฉ่ำมักมีรสชาติคล้าย nut, caramel หรือ molasses สามารถมีรส chocolate แบบอ่อนหรือรสมอลต์คั่วได้ แต่ไม่ควรโดดเด่น ความสมดุลมาจากความหวานของมอลต์ที่บางทีมาจากการใช้ฮอปได้อย่างดี การรับรู้รสขมมักขึ้นอยู่กับเวลาการบ่ม มี ester แบบ fruity ปานกลางถึงสูง ที่อาจให้คาแรคเตอร์ของ dried-fruit หรือ vinous การจบรสเป็นได้หลายทางตั้งแต่แบบไม่เหลือความหวานจนถึงจบแบบหวาน การบ่มที่นานขึ้นอาจมีส่วนทำให้เกิดรส oxidation คล้ายกับ Sherry, Port หรือ Madeira ชั้นดี ความแรงของแอลกอฮอล์ควรเป็นที่ประจักษ์แต่ไม่มากจนเกินไป สามารถพบ diacetyl แบบต่ำได้","Mouthfeel":"เนื้อเบียร์ปานกลางจนถึงหนา เต็มปากเต็มคำ แม้ว่าตัวอย่างแบบที่เก่าจะมีเนื้อเบียร์บางลงเนื่องจากยีสต์จัดการน้ำตาลอย่างต่อเนื่องในช่วง conditioning พบความอุ่นจากแอลกอฮอล์ได้เป็นปกติและเป็นสิ่งดี คาร์โบเนชั่นต่ำจนถึงปานกลาง ขึ้นอยู่กับการบ่มและ conditioning สามารถพบความเป็นกรดอ่อนๆได้ เช่นเดียวกับการพบ tannin หากบ่มไว้ในถังไม้","Style Comparison":"มีความทับซ้อนกับเบียร์สไตล์ British Strong Ale และเป็นขอบล่างของ English Barley Wine แต่ควรมีคุณภาพที่ดีจากการบ่ม ความแตกต่างระหว่าง Old Ale และ Barley Wine คือ Barley Wine ค่อนข้างจะเกิน 7% ABV ส่วน Old Ale จะมีคาแรคเตอร์จากการบ่มมากกว่า"},"tags":"high-strength, amber-color, top-fermented, british-isles, traditional-style, strong-ale-family, malty, aged","ex":"Avery Old Jubilation, Berlina Old Ale, Greene King Strong Suffolk Ale, Marston Owd Roger, Theakston Old Peculier","OG":[1.055,1.088],"FG":[1.015,1.022],"IBU":[30.0,60.0],"SRM":[10.0,22.0],"ABV":[5.5,9.0]},{"c":"17C","n":"Wee Heavy","cat":"17","cn":"Strong British Ale","tier":"B","gen":false,"en":{"Overall Impression":"Rich, sweet malt depth with caramel, toffee, and fruity flavors. Full-bodied and chewy, with warming alcohol. Restrained bitterness, but not cloying or syrupy.","Aroma":"Strong bready-toasty malt, with a high caramel and toffee aspect. A wide range of supportive caramelized sugar and toasty bread type aromas are possible (toasted breadcrumbs, ladyfingers, English biscuits, graham crackers, nougat, butterscotch, etc.). Faint hint of roast is sometimes noted. Low to moderate dark or dried fruit esters and alcohol. Very low earthy, floral, orange-citrus, or spicy hops optional.","Appearance":"Light copper to dark brown color, often with deep ruby highlights. Clear. Usually has a large tan head, which may not persist. Legs may be evident in stronger versions.","Flavor":"Rich, bready-toasty malt that is often full and sweet on the palate with caramel and toffee flavors, but balanced by alcohol and a hint of grainy roast in the finish. The malt often has caramelized sugar and toasty flavors of the same type as described in the aroma. Medium to low alcohol and esters (plums, raisins, dried fruit, etc.). Bitterness low in the balance, giving a sweet to medium-dry finish. Medium-low hop flavor optional, with similar descriptors as the aroma.","Mouthfeel":"Medium-full to full-bodied, sometimes with a thick, chewy, sometimes creamy, viscosity. A smooth alcohol warmth is usually present and is desirable since it balances the malty sweetness. Moderate carbonation.","Style Comparison":"Somewhat similar to an English Barley Wine, but often darker and more caramelly."},"th":{"Overall Impression":"เข้มข้น มีความหวานจากมอลต์ที่มีรส caramel, toffee และ fruity เนื้อเบียร์หนา เต็มปากเต็มคำพร้อมความอุ่นจากแอลกอฮอล์ มีความขมที่ถูกคุมเอาไว้ แต่ไม่หวานหรือมีคาแรคเตอร์คล้ายน้ำเชื่อม","Aroma":"กลิ่นมอลต์เข้มข้นในแบบ bready-toasty มีส่วนผสมของ caramel และ toffee สูง สามารถใช้ caramelized sugar มาเสริมเพิ่มความหลากหลายได้ พบกลิ่น toasty bread ได้ (toasted breadcrumbs, ladyfingers, English biscuits, graham crackers, nougat, butterscotch, และอื่นๆ) บางครั้งอาจพบกลิ่นคั่วเล็กน้อย มี ester ในแบบ dark หรือ dried fruit ในระดับต่ำถึงปานกลางและแอลกอฮอล์ สามารถพบฮอปในแบบ earthy, floral, orange-citrus หรือ spicy ในแบบต่ำมากๆได้","Appearance":"สีทองแดงอ่อน (light copper) ถึงน้ำตาลเข้ม (dark brown) มักพบสีทับทิมเข้มเป็นไฮไลท์ ใส ฟองขนาดใหญ่ที่มักจะมีสีน้ำตาลอ่อน อาจจะเกาะแก้วไม่ดี อาจจะพบ leg ชัดเจนในรูปแบบที่แรงกว่า","Flavor":"มีรสมอลต์ที่เข้มข้นแบบ bready-toasty ที่มักจะเต็มอิ่มพร้อมสัมผัสหวานในปากพร้อมกับรส caramel และ toffee แต่สมดุลด้วยแอลกอฮอล์และกลิ่นคั่วในตอนจบ มอลต์มักจะมาในแบบ caramelized sugar และ toasty ที่มาในแบบเดียวกับอโรม่า มีแอลกอฮอล์และ ester (plums, raisins, dried fruit และอื่นๆ) ปานกลางถึงต่ำ ในความสมดุลจะพบความขมต่ำ ที่ทำให้จบรสแบบหวานไปจนถึงจบรสแบบ medium-dry สามารถพบรสฮอปในแบบปานกลางถึงต่ำได้ ที่มาในแบบเดียวกับอโรม่า","Mouthfeel":"เนื้อเบียร์หนาปานกลางจนถึงหนา บางครั้งก็ข้น เต็มปากเต็มคำ บางครั้งจะมีความ creamy, viscosity มักจะพบความอุ่นจากแอลกอฮอล์ที่นุ่มลื่นที่จะช่วยให้ความสมดุลในความหวานจากมอลต์ มีคาร์โบเนชั่นปานกลาง","Style Comparison":"ค่อนข้างคล้ายกับ English Barley Wine แต่มักจะสีเข้มกว่าและมีความ caramelly มากกว่า"},"tags":"high-strength, amber-color, top-fermented, british-isles, traditional-style, strong-ale-family, malty","ex":"Belhaven Wee Heavy, Broughton Old Jock, McEwan’s Scotch Ale, Orkney Skull Splitter, Traquair House Ale, The Duck-Rabbit Wee Heavy Scotch-Style Ale","OG":[1.07,1.13],"FG":[1.018,1.04],"IBU":[17.0,35.0],"SRM":[14.0,25.0],"ABV":[6.5,10.0]},{"c":"17D","n":"English Barley Wine","cat":"17","cn":"Strong British Ale","tier":"A","gen":false,"en":{"Overall Impression":"A strong and richly malty ale with a pleasant fruity or hoppy depth. A wintertime sipper with a full, chewy body and warming alcohol.","Aroma":"Very rich, strongly malty, often with a caramel-like aroma in darker versions or a light toffee character in paler versions. May have a rich character including bready, toasty, or toffee notes. May have moderate to strong fruitiness, often with a dark- or dried-fruit character, particularly in dark versions. The hop aroma may range from mild to assertive, and is typically floral, earthy, tea-like, or marmalade-like. Alcohol may be low to moderate, but are soft and rounded. Aromatic intensity subsides with age, and can develop a quality like sherry, wine, or port.","Appearance":"Color ranging from golden amber to dark brown, often with ruby highlights and significant depth of color. Should not be black or opaque. Low to moderate off- white head. May have low head retention. Brilliant clarity, particularly when aged, although younger versions can have a little haze. High alcohol and viscosity may be visible as legs.","Flavor":"Medium to high rich, malty sweetness, often complex and multi-layered, with bread, biscuit, and caramel malt flavors (more toffee-like in paler versions) and having a medium to high fruitiness (often with dark or dried fruit aspects). When aged, these fruity components come out more, and darker versions will have a higher level than paler ones. The hop aroma, flavor, and bitterness can vary wildly. Light to strong hops, with an English character (floral, earthy, tea, or marmalade-like) are common. Bitterness can be light to fairly strong, fading with time, so the balance can be malty to somewhat bitter. Stronger versions will have a little alcohol character. The finish and aftertaste can be moderately dry to moderately sweet, often depending on age. Some oxidative or vinous flavors may be present, and often complex alcohol flavors should be evident. Pale versions typically seem more bitter, better attenuated, and more hop- forward than darker versions.","Mouthfeel":"Full-bodied and chewy, with a velvety, luscious texture, declining with age. A smooth warmth from aged alcohol should be present, but shouldn’t burn. Carbonation may be low to moderate, depending on age and conditioning.","Style Comparison":"Less hoppy and bitter, maltier and fruitier than American Barleywine. Can overlap Old Ale on the lower end of the range, but without heavier signs of age. Not as caramelly and often not as sweet as a Wee Heavy."},"th":{"Overall Impression":"เบียร์ malty ale ที่แรงและเข้มข้นพร้อมกลิ่น fruity หรือ hoppy ที่น่าพึงพอใจ เครื่องดื่มสำหรับจิบในฤดูหนาวที่เนื้อแน่นหนึบหนับและมีความอุ่นจากแอลกอฮอล์","Aroma":"เข้มข้นมาก มีมอลต์เข้มข้น มักมีกลิ่นคล้าย caramel ในแบบสีเข้ม หรือคาแรคเตอร์กลิ่น toffee ในแบบสีอ่อน อาจมีคาแรคเตอร์ที่เข้มขนและหลากหลายจาก bready, toasty หรือ toffee อาจพบความ fruity ในแบบปานกลางจนถึงแรงที่มักจะเป็นแบบ dark หรือ dried-fruit โดยเฉพาะในแบบสีเข้ม กลิ่นของฮอปอาจมีตั้งแต่อ่อนจนถึงชัดเจน ที่มักจะเป็นแบบ floral, earthy, tea-like หรือ marmalade-like อาจพบแอลกอฮอล์แบบต่ำถึงปานกลางในแบบนุ่มและกลมกล่อม ความเข้มข้นของอโรม่าจะลดลงตามเวลาการบ่มและจะพัฒนาไปจนพบคาแรคเตอร์ sherry, wine หรือ port ได้","Appearance":"สีที่มีตั้งแต่สีเหลืองทอง (golden) ไปจนถึงสีน้ำตาลเข้ม (dark brown) มักมีไฮไลท์เป็นทับทิมและมีความลึกของสีมาก ไม่ควรเป็นสีดำหรือทึบแสง ฟองสีขาวนวลแบบต่ำถึงปานกลาง อาจมีการเกาะแก้วได้ไม่ดี น้ำเบียร์มีความชัดเจนสดใส โดยเฉพาะอย่างยิ่งเมื่อบ่มนานขึ้น แม้ว่าแบบที่บ่มน้อยกว่าอาจจะขุ่นเล็กน้อย มีแอลกอฮอล์และความหนืดสูงอาจมองเห็นเป็น leg","Flavor":"มีความหวานจากมอลต์ที่เข้มข้นแบบปานกลางถึงสูง มักซับซ้อนและมีหลายชั้น โดยมีรสชาติของ bread, biscuit และ caramel มอลต์ (คล้ายทอฟฟี่มากกว่าในแบบที่สีอ่อนกว่า) และมีความ fruity ในแบบปานกลางถึงสูง (มักเป็นแบบ dark หรือ dried fruit) เมื่อผ่านการบ่มส่วนประกอบของความ fruity จะชัดเจนขึ้น ในเบียร์แบบสีเข้มจะออกชัดเจนกว่าแบบสีอ่อน กลิ่น รส และความขมจากฮอปเป็นได้หลายแบบ จะพบบ่อยในแบบที่ใช้ฮอปสไตล์อังกฤษในระดับอ่อนถึงเข้ม (floral, earthy, tea หรือ marmalade-like) ความขมอาจเบาถึงรุนแรงพอสมควร ค่อยๆ จางหายไปตามกาลเวลา ดังนั้น ความสมดุลอาจเป็นรสมอลต์ถึงรสขมเล็กน้อย แบบที่แรงกว่าจะมีคาแรคเตอร์ของแอลกอฮอล์เล็กน้อย ตอนจบรสเป็นได้ทั้งแบบ dry ปานกลางหรือแบบหวานปานกลาง มักขึ้นอยู่กับการบ่มรูปแบบที่ผ่านการบ่ม อาจพัฒนารสชาติ oxidative หรือ vinous ที่ซับซ้อนได้ ในระดับที่เด่นชัดแต่ไม่โดดเด่นเกินไป แบบสีอ่อนมักจะดูขมกว่า ยีสต์จัดการน้ำตาลได้ดีกว่า และฮอปเด่นกว่ารูปแบบที่สีเข้มกว่า","Mouthfeel":"เนื้อแน่นและหนึบพร้อมเนื้อสัมผัสเนียนนุ่มน่ารับประทานที่ทุกอย่างจะลดลงตามการบ่ม ควรพบความอบอุ่นราบรื่นจากแอลกอฮอล์ที่มาจากการบ่ม แต่ไม่ควรแรงหรือชัด คาร์โบเนชั่นอาจต่ำถึงปานกลางขึ้นอยู่กับเวลาการบ่มและ conditioning","Style Comparison":"มีฮอปและความขมน้อยกว่า มีมอลต์ชัดกว่าและ fruity กว่า American Barleywine สามารถซ้อนทับกับ Old Ale ที่ขอบลางของช่วงได้ แต่ไม่มีคาแรคเตอร์จากการบ่ม ไม่มีคาแรคเตอร์ caramelly และไม่หวานเท่า Wee Heavy"},"tags":"very-high-strength, amber-color, top-fermented, british-isles, traditional-style, strong-ale-family, malty","ex":"Burton Bridge Thomas Sykes Old Ale, Coniston No. 9 Barley Wine, Fuller’s Golden Pride, Hogs Back A over T, J.W. Lee’s Vintage Harvest Ale, Robinson’s Old Tom","OG":[1.08,1.12],"FG":[1.018,1.03],"IBU":[35.0,70.0],"SRM":[8.0,22.0],"ABV":[8.0,12.0]},{"c":"18A","n":"Blonde Ale","cat":"18","cn":"Pale American Ale","tier":"A","gen":false,"en":{"Overall Impression":"Easy-drinking, approachable, malt- oriented American craft beer, often with interesting fruit, hop, or character malt notes. Well-balanced and clean, is a refreshing pint without aggressive flavors.","Aroma":"Light to moderate malty aroma, generally neutral or grainy, possibly with a light bread or caramel note. Low to moderate fruitiness is optional, but acceptable. May have a low to medium hop aroma, and can reflect almost any hop variety although citrusy, floral, fruity, and spicy notes are common. Clean fermentation profile.","Appearance":"Light yellow to deep gold in color. Clear to brilliant. Low to medium white head with fair to good retention.","Flavor":"Initial soft maltiness, but can also have light character malt flavor (e.g., bread, toast, biscuit, wheat). Caramel flavors usually absent; if present, they are typically low-color caramel or honey notes. Low to medium fruity esters optional, but are welcome. Light to moderate hop flavor (any variety), but shouldn’t be overly aggressive. Medium-low to medium bitterness, but the balance is normally towards the malt or even between malt and hops. Finishes medium-dry to slightly malty; an impression of sweetness is often an expression of lower bitterness than actual residual sweetness. Clean fermentation profile.","Mouthfeel":"Medium-light to medium body. Medium to high carbonation. Smooth without being heavy.","Style Comparison":"Typically has more flavor than American Lager and Cream Ale. Less bitterness than an American Pale Ale. Perhaps similar to some maltier examples of Kölsch."},"th":{"Overall Impression":"เป็นเบียร์ที่ดื่มง่ายเข้าถึงง่าย เป็นคราฟต์เบียร์สัญชาติอเมริกันที่เน้นด้านมอลต์ มักมีคาแรคเตอร์แนว fruity จากฮอปหรือมอลต์ เป็นเบียร์ที่คลีนและสมดุล เป็นเบียร์ที่สดชื่นโดยไม่มีรสชาติที่รุนแรง","Aroma":"มีกลิ่นมอลต์เล็กน้อยถึงปานกลาง โดยทั่วไปกลิ่นจะเป็นกลางๆหรือออก grainy อาจมีกลิ่น bread บางๆหรือ caramel ได้ สามารถมีกลิ่น fruity น้อยถึงปานกลางได้ อาจมีกลิ่นของฮอปแบบต่ำถึงปานกลางและสามารถสะท้อนถึงความหลากหลายของฮอปตั้งแต่ citrusy, floral, fruity หรือ spicy ได้ มีโปรไฟล์การหมักที่สะอาด","Appearance":"มีสีเหลืองอ่อน (light yellow) ถึงสีทองเข้ม (deep gold) มีความใสจนถึงใสที่สุด ฟองมีขนาดเล็กถึงขนาดกลางสีขาว ฟองเกาะขอบแก้วพอสมควร","Flavor":"ช่วงเริ่มต้นจะพบรสชาติของมอลต์ที่นุ่ม และพบลักษณะอ่อนๆจากมอลต์ เช่น bread, toast, biscuit, wheat ไม่ควรมีรสคาราเมล ถ้ามีควรเป็นคาราเมลบางๆหรือออกแนวน้ำผึ้ง สามารถมี esters แบบ fruity ในระดับต่ำถึงปานกลางได้ ถ้ามีจะถือว่าดี มีกลิ่นฮอปแบบอ่อนจนถึงปานกลาง (จากหลายสายพันธุ์) แต่ห้ามออกมารุนแรงเกินไป มีความขมปานกลางถึงต่ำปานกลาง ปกติจะเป็นเบียร์ที่มีความสมดุลจากมอลต์ แต่ก็สามารถมีความสมดุลระหว่างมอลต์และฮอปได้ จบรสแบบ medium-dry หรือจบไปทาง malty เล็กน้อยได้ โดยที่ความหวานที่ดีจะมาจากความขมที่ต่ำไม่ใช่จากน้ำตาลที่ตกค้าง มีโปรไฟล์การหมักที่สะอาด","Mouthfeel":"เนื้อเบียร์แบบกลางถึงบางปานกลาง มีคาร์โบเนชั่นปานกลางถึงสูง นุ่มลื่นไม่รุนแรง","Style Comparison":"โดยทั่วไปจะมีรสชาติมากกว่า American Lager และ Cream Ale มีความขมน้อยกว่า American Pale Ale และอาจคล้ายกับเบียร์ที่ malty กว่าแบบ Kölsch"},"tags":"standard-strength, pale-color, any-fermentation, north-america, craft-style, pale-ale-family, balanced","ex":"Firestone Walker 805, Kona Big Wave Golden Ale, Real Ale Firemans #4 Blonde Ale, Russian River Aud Blonde, Victory Summer Love, Widmer Citra Summer Blonde Brew","OG":[1.038,1.054],"FG":[1.008,1.013],"IBU":[15.0,28.0],"SRM":[3.0,6.0],"ABV":[3.8,5.5]},{"c":"18B","n":"American Pale Ale","cat":"18","cn":"Pale American Ale","tier":"A","gen":false,"en":{"Overall Impression":"An average-strength, hop-forward, pale American craft beer with sufficient supporting malt to make the beer balanced and drinkable. The clean hop presence can reflect classic or modern American or New World hop varieties with a wide range of characteristics.","Aroma":"Moderate to moderately-high hop aroma from American or New World hop varieties with a wide range of possible characteristics, including citrus, floral, pine, resin, spice, tropical fruit, stone fruit, berry, or melon. None of these specific characteristics are required, but a hoppy aroma should be apparent. Low to moderate neutral to grainy maltiness supports the hop presentation, and can show low amounts of specialty malt character (e.g., bread, toast, biscuit, caramel). Fruity esters optional, up to moderate in strength. Fresh dry- hop aroma optional.","Appearance":"Pale golden to amber. Moderately large white to off-white head with good retention. Generally quite clear.","Flavor":"Hop and malt character similar to aroma (same intensities and descriptors apply). Caramel flavors are often absent or fairly restrained, but are acceptable as long as they don’t clash with the hops. Moderate to high bitterness. Clean fermentation profile. Fruity yeast esters can be moderate to none, although many hop varieties are quite fruity. Medium to dry finish. The balance is typically towards the late hops and bitterness; the malt presence should be supportive, not distracting. Hop flavor and bitterness often linger into the finish, but the aftertaste should generally be clean and not harsh. Fresh dry-hop flavor optional.","Mouthfeel":"Medium-light to medium body. Moderate to high carbonation. Overall smooth finish without astringency or harshness.","Style Comparison":"Typically lighter in color, cleaner in fermentation profile, and having fewer caramel flavors than English counterparts. There can be some overlap in color between American Pale Ale and American Amber Ale. The American Pale Ale will generally be cleaner, have a less caramelly malt profile, less body, and often more finishing hops. Less bitterness in the balance and alcohol strength than an American IPA. Maltier, more balanced and drinkable, and less intensely hop-focused and bitter than session-strength  American IPAs (aka Session IPAs). More bitter and hoppy than a Blonde Ale."},"th":{"Overall Impression":"เบียร์ความแรงแบบมาตรฐาน มีฮอปเป็นตัวนำเป็นคราฟต์เบียร์สไตล์อเมริกันที่มีสีอ่อน มีมอลต์มาช่วยเสริมให้สมดุลและดื่มง่าย มากับคาแรคเตอร์ของฮอปที่สะอาดโดยใช้ฮอปคลาสสิกกับฮอปสายพันธุ์อเมริกันและฮอปโลกใหม่ โดยฮอปสามารถมีคาแรคเตอร์ได้หลากหลาย","Aroma":"กลิ่นฮอปปานกลางถึงสูงปานกลาง จากฮอปสายพันธุ์อเมริกันหรือฮอปโลกใหม่ มีคาแรคเตอร์ได้หลากหลาย เช่น citrus, floral, pine, resin, spice, tropical fruit, stone fruit, berry หรือ melon โดยไม่ได้เจาะจง แต่ควรให้กลิ่นหอมจากฮอปชัดเจน มีกลิ่นมอลต์แบบเป็นกลางในระดับต่ำถึงสูงปานกลางมาเสริมความเด่นจากฮอป อาจพบ special มอลต์ได้เล็กน้อย (เช่น bread, toast, biscuit, caramel) สามารถมี ester แบบ fruity ได้ในถึงระดับปานกลาง สามารถใช้ฮอปสดในการ dry-hop ได้","Appearance":"สีทองอ่อน (pale golden) ถึงสีเหลืองอำพัน (amber) ฟองขนาดใหญ่ปานกลาง ฟองสีขาวถึงขาวนวล ฟองคงอยู่กับแก้วได้ดีโดยทั่วไปจะค่อนข้างใส","Flavor":"มีคาแรคเตอร์ของฮอปและมอลต์คล้ายกับกลิ่นอโรม่า (ใช้ความเข้มข้นและคำอธิบายเดียวกัน) รสคาราเมลมักจะถูกควบคุมให้อยู่ในระดับพอเหมาะ แต่ก็ยอมรับได้ถ้าไม่ออกมาขัดแย้งกับฮอป มีความขมปานกลางถึงสูง มีโปรไฟล์การหมักที่สะอาด คาแรคเตอร์ fruity ที่มาจาก ester มีได้ปานกลางหรือไม่มีเลย เพราะฮอปหลายสายพันธุ์จะออก fruity อยู่แล้ว จบรสแบบปานกลางหรือ dry ความสมดุลมาจากการทำ late-hop และความขม โดยมีมอลต์มาเสริมแบบไม่รบกวน รสและความขมของฮอปจะคลอกันไปจนถึงตอนจบ แต่ aftertaste ต้องคลีนไม่กระด้าง สามารถใช้ฮอปสดในการ dry-hop ได้","Mouthfeel":"เนื้อเบียร์ปานกลางถึงบางปานกลาง คาร์โบเนชั่นปานกลางถึงสูง โดยรวมจะจบแบบนุ่มลื่น ไม่มีความฝาดหรือความกระด้าง","Style Comparison":"โดยทั่วไปแล้วจะมีสีอ่อนกว่า ผ่านการหมักที่สะอาดกว่า และมีรส caramel น้อยกว่า English Pale Ale สีของ American Pale Ale อาจจะดูคล้ายกับ American Amber Ale แต่ American Pale Ale จะดูคลีนกว่าและมีคาแรคเตอร์ของ caramel น้อยกว่าเนื้อเบียร์บางกว่า และมักจบเป็นรสฮอปมากกว่า ขมน้อยกว่าในความ สมดุล และแอลกอฮอล์ต่ำกว่า American IPA มีความ malty มากกว่าสมดุลและดื่มง่ายกว่า ฮอปเข้มข้นน้อยกว่า แต่ขมกว่า session-strength American IPA (ที่รู้จักในนาม Session IPA) รสขมและฮอปมากกว่า Blonde Ale"},"tags":"standard-strength, pale-color, top-fermented, north-america, craft-style, pale-ale-family, bitter, hoppy","ex":"Deschutes Mirror Pond Pale Ale, Half Acre Daisy Cutter Pale Ale, Great Lakes Burning River, La Cumbre Acclimated APA, Sierra Nevada Pale Ale, Stone Pale Ale 2.0","OG":[1.045,1.06],"FG":[1.01,1.015],"IBU":[30.0,50.0],"SRM":[5.0,10.0],"ABV":[4.5,6.2]},{"c":"19A","n":"American Amber Ale","cat":"19","cn":"Amber and Brown American Beer","tier":"A","gen":false,"en":{"Overall Impression":"An amber, hoppy, moderate-strength American craft beer with a malty caramel flavor. The balance can vary quite a bit, with some versions being fairly malty and others being aggressively hoppy. Hoppy and bitter versions should not have clashing flavors with the caramel malt profile.","Aroma":"Low to moderate hop aroma reflective of American or New World hop varieties (citrus, floral, pine, resin, spice, tropical fruit, stone fruit, berry, or melon). A citrusy hop character is common, but not required. Moderately-low to moderately-high maltiness, usually with a moderate caramel character, that can either support, balance, or sometimes mask the hop presentation. Esters vary from moderate to none.","Appearance":"Deep amber to coppery-brown in color, sometimes with a reddish hue. Moderately large off-white head with good retention. Generally quite clear.","Flavor":"Moderate to high hop flavor with similar characteristics as the aroma. Malt flavors are moderate to strong, and usually show an initial malty sweetness followed by a moderate caramel flavor and sometimes toasty or biscuity malt flavors in lesser amounts. Dark or roasted malt flavors absent. Moderate to moderately-high bitterness. Balance can vary from somewhat malty to somewhat bitter. Fruity esters can be moderate to none. Caramel sweetness, hop flavor, and bitterness can linger somewhat into the medium to full yet dry finish.","Mouthfeel":"Medium to medium-full body. Medium to high carbonation. Overall smooth finish without astringency. Stronger versions may have a slight alcohol warmth.","Style Comparison":"Darker, more caramelly, more body, and generally less bitter in the balance than American Pale Ales. Less alcohol, bitterness, and hop character than Red IPAs. Less strength, malt, and hop character than American Strong Ales. Less chocolate and dark caramel than an American Brown Ale."},"th":{"Overall Impression":"เบียร์สีอำพัน ฮอปชัด คราฟท์เบียร์อเมริกันที่มีความแรงมาตรฐานมากับความ malty จาก caramel ความสมดุลอาจจะมีหลายแบบ บางแบบจะ malty และบางแบบจะ hoppy หนักๆ โดยที่ความขมและฮอปห้ามเข้าไปทำลายรส malty จาก caramel","Aroma":"กลิ่นของฮอปอยู่ในระดับต่ำถึงปานกลาง ที่สะท้อนถึงฮอปสายพันธุ์อเมริกาหรือฮอปโลกใหม่ (เช่น citrus, floral, pine, resin, spice, tropical fruit, stone fruit, berry หรือ melon) จะพบความ citrus จากฮอปเป็นเรื่องปกติ แต่ก็ไม่ใช่สิ่งจำเป็น มีความ malty แบบต่ำปานกลางจนถึงสูงปานกลาง ปกติจะมาพร้อมคาแรคเตอร์ของ caramel แบบปานกลาง ที่ช่วยเสริมทำให้สมดุล ที่บางครั้งจะออกมาเด่นกว่าฮอป สามารถมี ester ได้ตั้งแต่ปานกลางจนถึงไม่มีเลย","Appearance":"สีอำพันเข้ม (deep amber) จนถึงน้ำตาลอมทองแดง (copper-brown) บางครั้งก็มีสีแดง ฟองมีขนาดใหญ่ปานกลางสีขาวนวลฟองเกาะกับขอบแก้วได้ดี โดยทั่วไปค่อนข้างใส","Flavor":"รสจากฮอปปานกลางถึงสูงที่มีลักษณะใกล้เคียงกับกลิ่นอโรมามอลต์มีรสปานกลางถึงเข้มข้น และมักจะแสดงความหวานของมอลต์ในตอนเริ่ม ตามด้วยรส caramel ระดับปานกลาง บางครั้งก็พบรส toasty หรือ biscuity แต่ไม่เด่นมาก ห้ามมีรสมอลต์ดำหรือมอลต์คั่ว มีรสขมปานกลางถึงสูงปานกลาง ความสมดุลอาจมีตั้งแต่แบบ malty ไปจนถึงค่อนข้างขม มีความ fruity จาก ester ได้ในระดับปานกลางถึงไม่มี ความหวานจาก caramel รสฮอปและความขมควรจะคลอกันไปจนจบในแบบ medium หรือ full แต่ dry","Mouthfeel":"เนื้อเบียร์ปานกลางถึงหนาปานกลาง คาร์โบเนชั่นสูงจนถึงปานกลาง โดยรวมจะจบแบบนุ่มลื่นโดยไม่มีความฝาด เบียร์แบบที่แรงขึ้นอาจจะพบความอุ่นจากแอลกอฮอล์","Style Comparison":"สีเข้มกว่า มีคาแรคเตอร์คาราเมลมากกว่า เนื้อเบียร์หนากว่า ปกติจะขมน้อยกว่าในความสมดุลเมื่อเทียบกับ American Pale Ale มีแอลกอฮอล์ ความขม และรสฮอปน้อยกว่า Red IPA มีความแรง มีมอลต์ และฮอปน้อยกว่า American Strong Ale มีคาแรคเตอร์ chocolate และ dark caramel น้อยกว่า American Brown Ale"},"tags":"standard-strength, amber-color, top-fermented, north-america, craft-style, amber-ale-family, balanced, hoppy","ex":"Anderson Valley Boont Amber Ale, Bell’s Amber Ale, Full Sail Amber, North Coast Red Seal Ale, Saint Arnold Amber Ale, Tröegs Hopback Amber Ale","OG":[1.045,1.06],"FG":[1.01,1.015],"IBU":[25.0,40.0],"SRM":[10.0,17.0],"ABV":[4.5,6.2]},{"c":"19B","n":"California Common","cat":"19","cn":"Amber and Brown American Beer","tier":"B","gen":false,"en":{"Overall Impression":"A toasty and caramelly, fairly bitter, standard-strength beer with an interesting fruitiness and rustic, woody hop character. Smooth and well carbonated.","Aroma":"Moderate to high herbal, resinous, floral, or minty hops. Light fruitiness acceptable. Low to moderate caramel or toasty malt supports the hops.","Appearance":"Medium amber to light copper color. Generally clear. Moderate off-white head with good retention.","Flavor":"Moderately malty with a pronounced hop bitterness. The malt character usually has toast (not roast) and caramel flavors. Low to moderately high hop flavor, usually showing rustic, traditional American hop qualities (often herbal, resinous, floral, minty). Finish fairly dry and crisp, with a lingering hop bitterness and a firm, grainy malt flavor. Light fruity esters are acceptable, but otherwise clean.","Mouthfeel":"Medium-bodied. Medium to medium-high carbonation.","Style Comparison":"Superficially similar to an American Amber Ale, but with specific choices for malt and hopping – the hop flavor and aroma is traditional (not modern) American hops, malt flavors are toastier, the hopping is always assertive, and a warm-fermented lager yeast is used. Less attenuated, less carbonated and less fruity than Australian Sparkling ale."},"th":{"Overall Impression":"เบียร์ที่มีความแรงมาตรฐานมีความ toasty, caramelly พร้อมความ fruity และ rustic ที่น่าสนใจ รสค่อนข้างขม มีคาแรคเตอร์จาก woody hop มีความนุ่มลื่นพร้อมคาร์โบเนชั่นที่ดี","Aroma":"มีกลิ่นฮอปแนว herbal, resin, floral หรือ minty แบบปานกลางจนถึงสูง สามารถมีความ fruity แบบอ่อนๆได้ มีความ caramel หรือ toasty จากมอลต์แบบต่ำถึงปานกลางที่ช่วยเสริมฮอป","Appearance":"สีอำพันปานกลาง (medium amber) จนถึงสีทองแดงอ่อน (light copper) โดยทั่วไปจะใส ฟองสีขาวนวลขนาดปานกลาง ฟองเกาะกับแก้วได้ดี","Flavor":"มีรสมอลต์ปานกลางพร้อมความขมจากฮอปที่เด่นชัด รสของมอลต์มักจะเป็น toast และ caramel (แต่ไม่คั่ว) รสฮอปต่ำถึงสูงปานกลางออกมาในแบบ rustic, ฮอปพันธุ์อเมริกาดั้งเดิม (herbal, resin, floral, minty) จบรสแบบ dry และ crisp คู่ไปกับรสฮอปที่ขมและแน่นกับรสมอลต์สามารถมี ester แบบ fruity ได้บางๆ แต่ต้องคลีน","Mouthfeel":"เนื้อเบียร์แบบปานกลาง มีคาร์โบเนชั่นปานกลางถึงสูงปานกลาง","Style Comparison":"อาจะดูคล้ายกับ American Amber Ale แต่จะต่างกันที่การเลือกใช้มอลต์และฮอป รสชาติและกลิ่นของฮอปจะเป็นฮอปอเมริกันแบบดั้งเดิม (ไม่ใช่สมัยใหม่) รสชาติมอลต์แบบ toasty จะเด่นกว่าฮอปเสมอ ใช้ lager ยีสต์แบบที่หมักในอุณหภูมิสูง ยีสต์จัดการกับน้ำตาลได้น้อย คาร์โบเนชั่นน้อยและมีรส fruity น้อยกว่า Australian Sparkling ale"},"tags":"standard-strength, amber-color, bottom-fermented, north-america, traditional-style, amber-lager-family, bitter, hoppy","ex":"Anchor Steam, Steamworks Steam Engine Lager","OG":[1.048,1.054],"FG":[1.011,1.014],"IBU":[30.0,45.0],"SRM":[9.0,14.0],"ABV":[4.5,5.5]},{"c":"19C","n":"American Brown Ale","cat":"19","cn":"Amber and Brown American Beer","tier":"A","gen":false,"en":{"Overall Impression":"A malty but hoppy standard-strength American ale frequently with chocolate and caramel flavors. The hop flavor and aroma complement and enhance the malt rather than clashing with it.","Aroma":"Moderate malty-sweet to malty-rich aroma with chocolate, caramel, nutty, or toasty qualities. Hop aroma is typically low to moderate, of almost any type that complements the malt. Some interpretations of the style may optionally feature a stronger hop aroma, an American or New World hop character (citrusy, fruity, tropical, etc.), or a dry-hopped aroma. Fruity esters are moderate to very low. The dark malt character is more robust than other brown ales, yet stops short of being overly Porter-like.","Appearance":"Light to very dark brown color. Clear. Low to moderate off-white to light tan head.","Flavor":"Medium to moderately-high malty-sweet or malty- rich flavor with chocolate, caramel, nutty, or toasty malt complexity, with medium to medium-high bitterness. Medium to medium-dry finish with an aftertaste of both malt and hops. Light to moderate hop flavor, sometimes citrusy, fruity, or tropical, although any hop flavor that complements the malt is acceptable. Very low to moderate fruity esters. The malt and hops are generally equal in intensity, but the balance can vary in either direction. Should not have a roasted character suggestive of a Porter or Stout.","Mouthfeel":"Medium to medium-full body. More bitter versions may have a dry, resiny impression. Moderate to moderately-high carbonation. Stronger versions may be lightly warming.","Style Comparison":"More chocolate and caramel flavors than American Pale or Amber Ales, typically with less prominent bitterness in the balance. Less bitterness, alcohol, and hop character than Brown IPAs. More bitter and generally hoppier than English Brown Ales, with a richer malt presence, usually higher alcohol, and American or New World hop character."},"th":{"Overall Impression":"เบียร์อเมริกันความแรงมาตรฐานที่มีรสมอลต์และฮอป ที่มักจะพบรสของ chocolate และ caramel มีกลิ่นและรสของฮอปที่ช่วยส่งเสริมคาแรคเตอร์มอลต์มากกว่าที่จะขัดกัน","Aroma":"กลิ่นหอมหวานจากมอลต์ปานกลางถึงเข้มข้นพร้อมด้วยกลิ่น chocolate, caramel, nutty หรือ toasty กลิ่นของฮอปมักจะอยู่ในระดับต่ำถึงปานกลาง และต้องส่งเสริมกลิ่นมอลต์ ในบางการตีความจากผู้ผลิตอาจจะมีอโรม่าจากฮอปที่แรงขึ้น ด้วยฮอปสายพันธุ์อเมริกาและฮอปโลกใหม่ (citrusy, fruity, tropical, etc.) หรืออโรม่าจากการ dry-hop มีกลิ่น ester แบบ fruity ได้ในระดับปานกลางจนถึงต่ำมาก ลักษณะเด่นของมอลต์สีเข้มนั้นแรงกว่า brown ale อื่นๆแต่ไม่เหมือนใน porter","Appearance":"สีอ่อน (light) จนถึงน้ำตาลเข้มมาก (very dark brown) เนื้อเบียร์ใส ฟองขนาดเล็กจนถึงปานกลางสีขาวนวลจนถึงสีน้ำตาลอ่อน","Flavor":"ความหวานจากรสมอลต์และความเข้มของมอลต์ปานกลางถึงสูงปานกลาง เข้มและซับซ้อนด้วยคาแรคเตอร์ chocolate, caramel, nutty หรือ toasty พร้อมความขมแบบปานกลางถึงสูง จบรสแบบ medium ถึง medium-dry คู่กับ aftertaste จากมอลต์และฮอป มีรสฮอปเล็กน้อยถึงปานกลาง บางครั้งจะพบแนว citrusy, fruity หรือ tropical สามารถใช้ฮอปคาแรคเตอร์อื่นที่ส่งเสริมกลิ่นมอลต์ได้ มี esters แบบ fruity น้อยถึงปานกลาง มอลต์และฮอปควรมีความเข้มข้นพอๆกัน ความสมดุลสามารถเป็นได้หลายแนว แต่ไม่ควรมีคาแรคเตอร์ของความคั่วที่สูงแบบใน Porter หรือ Stout","Mouthfeel":"เนื้อเบียร์ปานกลางถึงแน่น เวอร์ชันที่ขมมากขึ้นอาจมีความรู้สึกไม่เหลือความหวานและพบรส resin มีคาร์โบเนชั่นปานกลางถึงสูงปานกลาง เวอร์ชันที่แรงกว่านี้อาจให้ความรู้สึกอุ่นจากแอลกอฮอล์เล็กน้อย","Style Comparison":"มีรสชาติของ chocolate และ caramel มากกว่า American Pale Ale หรือ Amber Ale มีรสขมน้อยกว่าในความสมดุล มีความขม แอลกอฮอล์ และคาแรคเตอร์จากฮอปน้อยกว่า Brown IPA แต่มีรสขมและฮอปมากกว่า English Brown Ale มีมอลต์เข้มข้นกว่า มีแอลกอฮอล์สูงกว่า และใช้ฮอปแบบอเมริกันหรือฮอปโลกใหม่"},"tags":"standard-strength, dark-color, top-fermented, north-america, craft-style, brown-ale-family, balanced, hoppy","ex":"Avery Ellie’s Brown Ale, Big Sky Moose Drool Brown Ale, Brooklyn Brown Ale, Bell’s Best Brown, Smuttynose Old Brown Dog Ale, Telluride Face Down Brown","OG":[1.045,1.06],"FG":[1.01,1.016],"IBU":[20.0,30.0],"SRM":[18.0,35.0],"ABV":[4.3,6.2]},{"c":"20A","n":"American Porter","cat":"20","cn":"American Porter and Stout","tier":"A","gen":false,"en":{"Overall Impression":"A malty, bitter, and often somewhat hoppy dark beer with a balanced, roasted, and frequently chocolatey character.","Aroma":"Medium-light to medium-strong roast aroma, often with a chocolate, light coffee, or lightly burnt character, sometimes with a background caramel or toffee sweetness, or a malty richness. The resiny, earthy, or floral hop character can vary from low to high. Moderate fruity esters optional. Should not seem sharp, acrid, or acidic. The malt-hop balance can vary, but it should always have a roasted malt aroma.","Appearance":"Medium brown to very dark brown, often with ruby- or garnet-like highlights. Can approach black in color. Clear, if not opaque. Full, tan-colored head with moderately good head retention.","Flavor":"Moderately strong roasted flavor, often with a chocolate and lightly burnt character, sometimes with a sweet caramel or malty richness in support. Medium to high bitterness, and a dry to medium-sweet finish. Dark malts may sharpen this impression, but should not add an acrid, burnt, or harsh flavor. Low to high resiny, earthy, or floral hop flavor, which should not clash with the dark malt. Dry-hopped versions may have a fresh hop or resiny flavor. Moderate fruity esters optional. Should not have an acidic bite.","Mouthfeel":"Medium to medium-full body. Moderately low to moderately high carbonation. Stronger versions may have a slight alcohol warmth. May have a slight dark malt astringency, but this character should not be strong.","Style Comparison":"More bitter and often stronger with more dark malt qualities and dryness than English Porters or Pre- Prohibition Porters. Less strong and assertive than American Stouts."},"th":{"Overall Impression":"เบียร์ดำที่มีฮอปเด่น มีมอลต์ มีรสขมและมีความสมดุล มีความคั่ว และมักจะมีคาแรคเตอร์ของ chocolate","Aroma":"กลิ่นคั่วแบบอ่อนปานกลางถึงเข้มปานกลาง มักมีกลิ่น chocolate, coffee บางๆ, หรือ burnt อ่อนๆ บางครั้งก็มีรสหวานมาเสริมจาก caramel หรือ toffee หรือรสมอลต์เข้มข้น กลิ่นฮอปแบบ resiny, earthy หรือ floral อาจต่างกันไปตั้งแต่ต่ำจนถึงสูง สามารถมี esters แบบ fruity แบบปานกลางได้ แต่ห้ามมีกลิ่นคม ฉุน หรือกลิ่นกรด ความสมดุลของมอลต์และฮอปอาจแตกต่างกันได้ แต่ควรมีกลิ่นมอลต์คั่วอยู่เสมอ","Appearance":"สีน้ำตาลปานกลาง (medium brown) จนถึงสีน้ำตาลเข้มมาก (very dark brown) มักมีสีไฮไลท์คล้ายทับทิมหรือโกเมน สีสามารถเข้มจนเข้าใกล้สีดำได้ เนื้อเบียร์ต้องใสถ้าไม่ทึบแสง ฟองหนาสีน้ำตาล และฟองเกาะอยู่กับแก้วได้ดีปานกลาง","Flavor":"มีรสคั่วเข้มปานกลาง มักมีรสช็อกโกแลตและรสไหม้เล็กน้อยบางครั้งจะมีความหวานจากคาราเมลหรือมอลต์เข้มข้นคอยเสริม มีรสขมปานกลางถึงสูง จบแบบ dry หรือหวานปานกลาง มอลต์สีเข้มจะเพิ่มความรู้สึกคมแต่จะไม่เพิ่มกลิ่นฉุน กลิ่นกรดหรือความกระด้าง รสฮอปมีได้ตั้งแต่ต่ำถึงสูงในแบบ resiny, earthy หรือ floral แต่ต้องไม่ขัดกับกลิ่นมอลต์ดำ แบบที่ dry-hop อาจใช้ฮอปสด หรือฮอปแบบรส resiny สามารถมี esters แบบ fruity ได้ปานกลาง แต่ไม่ควรมีรสเป็นกรดที่กัดลิ้น","Mouthfeel":"เนื้อเบียร์ปานกลางถึงหนาปานกลาง คาร์โบเนชั่นต่ำถึงสูงปานกลาง ในแบบที่แรงกว่าอาจมีความอุ่นจากแอลกอฮอล์เล็กน้อย อาจมีความฝาดของมอลต์สีเข้มเล็กน้อย แต่คาแรคเตอร์นี้ไม่ควรชัด","Style Comparison":"มีรสขมและมักจะแรง มาพร้อมกับ dark มอลต์และการจบรส dry กว่า English Porter หรือ Pre-Prohibition Porter แต่ไม่รุนแรงแ
