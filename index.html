a base style of beer.","Aroma":"Variable by base style. The contribution of non-Sacch microbes should be noticeable to strong, and often contribute a sour and funky, wild note. The best examples will display a range of aromatics, rather than a single dominant character. The aroma should be inviting, not harsh or unpleasant.","Appearance":"Variable by base style. Clarity can be variable; some haze is not a fault. Head retention can be poor.","Flavor":"Variable by base style. Look for an agreeable balance between the base beer and the fermentation character. A range of results is possible from fairly high acidity and funk to a subtle, pleasant, harmonious beer. The best examples are pleasurable to drink with the esters and phenols complementing the malt or hops. The wild character can be prominent, but does not need to be dominating in a style with an otherwise strong malt or hop profile. Acidity should be firm yet enjoyable, and ranging from clean to complex, but should not be biting or vinegary; prominent, objectionable, or offensive acetic acid is a fault. Bitterness tends to be low, especially as sourness increases.","Mouthfeel":"Variable by base style. Generally has a light body, almost always lighter than what might be expected from the base style. Generally moderate to high carbonation, although often lower in higher alcohol examples.","Style Comparison":"A sour and funky version of a base style, but do not necessarily have to be as sour or as funky as some traditional European sour examples."},"th":{"Overall Impression":"รูปแบบของเบียร์ base style ในแบบที่เปรี้ยวและ funky","Aroma":"แปรผันตาม base style การทำงานร่วมของจุลินทรีย์ที่ไม่ใช่ Sacch ควรพบได้ชัดเจนจนถึงแรง และมักจะมีส่วนทำให้เกิดความเปรี้ยวความ funky และความ wild ตัวอย่างที่ดีที่สุดจะแสดงถึงระดับของอโรม่าที่มีมากกว่ามีกลิ่นโดดเด่นแบบเดียว กลิ่นหอมควรเชิญชวนให้ดื่ม ไม่กระด้างหรือไม่รื่นรมย์","Appearance":"แปรผันตาม base style ความใสมีได้หลายแบบ ความขุ่นเล็กน้อยไม่ถือว่าเป็นความผิดพลาด ฟองอาจจะเกาะแก้วได้ไม่ดี","Flavor":"แปรผันตาม base style ควรพบความสมดุลที่ลงตัวระหว่าง base style กับคาแรคเตอร์การหมัก ออกมาได้หลายแบบตั้งแต่มีความ acidity และความ funky ที่สูงจนถึงเป็นเบียร์ที่ละเอียดอ่อน รื่นรมย์ และกลมกลืนกัน ตัวอย่างที่ดีที่สุดคือเบียร์ที่ได้ความรื่นรมย์ในการดื่มด้วย ester และ phenol ที่ช่วยสนับสนุนมอลต์หรือฮอป คาแรคเตอร์ wild สามารถโดดเด่น แต่ไม่จำเป็นต้องโดดเด่นในเบียร์สไตล์ที่มอลต์หรือฮอปโดดเด่น acidity ควรจะแน่นแต่ก็น่าเพลิดเพลิน อยู่ในระดับที่คลีนจนถึงซับซ้อน แต่ไม่ควรเป็นแบบกัดหรือ vinegary การมี acetic acid ที่เด่นชัดน่ารังเกียจ หรือก้าวร้าวคือความผิดพลาด ความขมมีแนวโน้มต่ำโดยเฉพาะอย่างยิ่งเมื่อความเปรี้ยวเพิ่มขึ้น","Mouthfeel":"แปรผันตาม base style โดยทั่วไปแล้วจะมีเนื้อเบียร์ที่บางและบางกว่าที่คาดไว้จาก base style โดยทั่วไปจะมีคาร์โบเนชั่นในระดับปานกลางถึงสูง แม้ว่าคาร์โบเนชั่นมักจะต่ำกว่าในเบียร์ที่มีแอลกอฮอล์ที่สูง","Style Comparison":"base style ในแบบที่เปรี้ยวและ funky แต่ไม่จำเป็นต้องเปรี้ยวหรือ funky เหมือนกับ European sour ดั้งเดิม"},"tags":"wild-fermentation, north-america, craft-style, specialty-beer, sour","ex":"Boulevard Love Child, Jester King Le Petit Prince, Jolly Pumpkin Oro de Calabaza, Lost Abbey Ghosts in the Forest, New Belgium Le Terroir, Russian River Temptation"},{"c":"28C","n":"Wild Specialty Beer","cat":"28","cn":"American Wild Ale","tier":"C","gen":true,"en":{"Overall Impression":"An American Wild Ale with fruit, herbs, spices, or other Specialty-Type Ingredients.","Aroma":"Variable by base style. The Specialty-Type Ingredients should be evident, as well as the defining characteristics of a wild fermentation per the base style. The best examples will blend the aromatics from the fermentation with the special ingredients, creating an aroma that may be difficult to attribute precisely.","Appearance":"Variable by base style, generally showing a color, tint, or hue from any Specialty-Type Ingredient (especially if fruit is used) in both the beer and the head. Clarity can be variable; some haze is not a fault. Head retention is often poor.","Flavor":"Variable by base style. The Specialty-Type Ingredients should be evident, as well as the defining characteristics of a wild fermentation per the base style. If fruit was fermented, the sweetness is generally gone so that only the fruit esters typically remain. Fruit and other Specialty-Type Ingredients can add sourness of their own; if so, the sourness could be prominent, but should not be overwhelming. The acidity and tannin from any fruit or other Specialty-Type Ingredients can both enhance the dryness of the beer, so care must be taken with the balance. The acidity should enhance the perception of any fruit flavor, not detract from it. Wood notes, if present, add flavor but should be balanced.","Mouthfeel":"Variable by base style. Generally has a light body, lighter than what might be expected from the base style. Generally moderate to high carbonation; carbonation should balance the base style if one is declared. The presence of tannin from some Specialty-Type ingredients (often fruit or wood) can provide a slight astringency, enhance the body, or make the beer seem drier than it is.","Style Comparison":"Like a fruit, herb, spice, or wood beer, but sour or funky."},"th":{"Overall Impression":"American Wild Ale ที่ใส่ผลไม้ สมุนไพรเครื่องเทศ หรือส่วนผสมพิเศษอื่นๆ","Aroma":"แปรผันตาม base style ส่วนผสมพิเศษควรพบได้ชัดเจน แบบเดียวกับคาแรคเตอร์ wild จากการหมักใน base style ตัวอย่างที่ดีคือเบียร์ที่มีการผสมอโรม่าจากการหมักให้เข้ากับส่วนผสมพิเศษ และทำให้เกิดกลิ่นที่ยากจะระบุได้ชัด","Appearance":"แปรผันตาม base style โดยทั่วไปจะแสดง สี หรือเฉดสีจากส่วนผสมพิเศษ (โดยเฉพาะถ้าใช้ผลไม้) ทั้งในเบียร์และสีของฟองความชัดเจนมีได้หลายแบบ ความขุ่นไม่ใช้ข้อผิดพลาด การคงตัวของฟองมักไม่ค่อยดี","Flavor":"แปรผันตาม base style ส่วนผสมพิเศษควรพบได้ชัดเจน แบบเดียวกับคาแรคเตอร์ wild จากการหมักใน base style หากใช้ผลไม้ในการหมัก ความหวานจะหายไปโดยปกติเหลือเพียง fruit ester เท่านั้น ผลไม้และส่วนผสมพิเศษอื่นๆ สามารถเพิ่มความเปรี้ยวได้ และความเปรี้ยวต้องเด่นชัด แต่ไม่ควรมากจนเกินไป acidity และ tannin จากผลไม้หรือส่วนผสมพิเศษสามารถช่วยทำให้มีความ dry มากขึ้น ดังนั้นจึงต้องระวังเรื่องความสมดุลเป็นพิเศษ acidity ยังช่วยเพิ่มการรับรสจากผลไม้ โดยไม่ทำให้รสเบี่ยงเบน กลิ่นของ Wood ถ้าพบจะเพิ่มรสชาติ แต่ต้องสมดุล","Mouthfeel":"แปรผันตาม base style โดยทั่วไปแล้วจะมีเนื้อเบียร์ที่บางและบางกว่าที่คาดไว้จาก base style โดยทั่วไปจะมีคาร์โบเนชั่นในระดับปานกลางถึงสูง คาร์โบเนชั่นควรสมดุลกับ base style ถ้าได้ระบุสไตล์เอาไว้ การพบ tannin จากส่วนผสมพิเศษบางชนิด (มักเป็นผลไม้หรือไม้) สามารถให้ความฝาดเล็กน้อย มีผลต่อเนื้อเบียร์ หรือทำให้เบียร์รู้สึก dry กว่าที่เป็นอยู่","Style Comparison":"เหมือนผลไม้ สมุนไพร เครื่องเทศ หรือ wood beer แต่มีความเปรี้ยวหรือ funky"},"tags":"wild-fermentation, north-america, craft-style, specialty-beer, sour, fruit","ex":"Cascade Bourbonic Plague, Jester King Atrial Rubicite, New Belgium Dominga Mimosa Sour, New Glarus Wisconsin Belgian Red, Russian River Supplication, The Lost Abbey Cuvee de Tomme"},{"c":"28D","n":"Straight Sour Beer","cat":"28","cn":"American Wild Ale","tier":"C","gen":false,"en":{"Overall Impression":"A pale, refreshing, sour beer with a clean lactic sourness. A gentle, pale malt flavor supports the lemony sourness with moderate fruity esters.","Aroma":"A sharply sour character is dominant (moderately- high to high). Can have up to a moderately fruity character (often peach, apricot, lemon, or tart apple). No hop aroma. Pale malt dominates, usually biscuity or crackery. Clean fermentation.","Appearance":"Very pale in color. Clarity ranges from clear to somewhat hazy. Large, dense, white head with poor retention. Effervescent.","Flavor":"Clean lactic sourness dominates and can be quite strong. Some complementary, bready, biscuit, crackery, or grainy flavor is generally noticeable. Hop bitterness is undetectable. Never vinegary or bitingly acidic. Pale fruit character can be moderate including a citrusy-lemony or tart apple fruitiness may be detected. Finish is off-dry to dry. Balance dominated by sourness, but some malt and estery fruit flavor should be present. No hop flavor. Clean.","Mouthfeel":"Light body. Moderate to high carbonation. Never hot, although higher gravity examples can have a warming alcohol character. Crisp acidity.","Style Comparison":"Lower gravity examples can be very much like a Brett-free Berliner Weisse. Compared to a Lambic, is generally not as acidic and has a clean lactic sourness with restrained to below sensory threshold funk. Higher in alcohol content than both."},"th":{"Overall Impression":"เบียร์สีอ่อน สดชื่น เป็นเบียร์เปรี้ยวที่มาพร้อมกับความเปรี้ยวจาก lactic ที่สะอาด มีความอ่อนโยนจากรสของ pale มอลต์ ที่ช่วยเสริมรสเปรี้ยวจาก lemon พร้อมกับ fruity esters ระดับปานกลาง","Aroma":"มีคาแรคเตอร์ความเปรี้ยวที่คมและโดดเด่น (ในระดับสูงปานกลางถึงสูงที่สุด) สามารถมีคาแรคเตอร์ fruity ในระดับปานกลาง (มักเป็น peach, apricot, lemon หรือ tart apple) ไม่มีกลิ่นฮอป มี pale มอลต์มาคอยสนับสนุนที่มักจะเป็นแบบ biscuity หรือ crackery มีการหมักที่สะอาด","Appearance":"สีอ่อนมาก (very pale) ความชัดเจนมีตั้งแต่ใสไปจนถึงค่อนข้างขุ่น ฟองขนาดใหญ่ สีขาวหนาแน่น เกาะแก้วได้ไม่ดี ดูมีชีวิตชีวา","Flavor":"มีความเปรี้ยวจาก lactic ที่สะอาดชัดเจนและสามารถพบได้ค่อนข้างแรง มีรสชาติ bready, biscuit, crackery หรือ grainy ที่เข้ากันได้ดีไม่พบความขมจากฮอป ห้ามพบคาแรคเตอร์ vinegary หรือ acidic ที่กัด มีคาแรคเตอร์ fruity จากผลไม้สีอ่อนในระดับปานกลาง แบบ citrusy- lemony หรือ tart apple จบรสแบบ dry ถึง dry มาก มีความสมดุลจากความเปรี้ยว แต่ควรพบรสมอลต์และ fruit esters ไม่มีรสฮอป เบียร์ต้องสะอาด","Mouthfeel":"เนื้อเบียร์บาง คาร์โบเนชั่นปานกลางถึงสูง ไม่ควรพบความร้อนแรง แม้ว่าเบียร์ที่มี gravity สูงจะสามารถพบความอุ่นจากแอลกอฮอล์ได้ มีความ acidity ที่ crisp","Style Comparison":"ในตัวอย่างเบียร์ที่มี gravity ต่ำสามารถคล้าย Berliner Weisse แบบไม่ใช้ Brett เมื่อเทียบกับ Lambic จะไม่มีความเป็นกรดเท่า มีรสเปรี้ยวจาก Lactic ที่สะอาด และมีความ funky ในระดับที่ต่ำกว่า threshold และมีแอลกอฮอล์สูงกว่าทั้ง 2 อย่าง"},"tags":"pale-color, top-fermented, sour","ex":"Rarely found, as this style is typically the base for other Specialty-Type Beers.","OG":[1.048,1.065],"FG":[1.006,1.013],"IBU":[3.0,8.0],"SRM":[2.0,3.0],"ABV":[4.5,7.0]},{"c":"29A","n":"Fruit Beer","cat":"29","cn":"Fruit Beer","tier":"B","gen":true,"en":{"Overall Impression":"A pleasant integration of fruit with beer, but still recognizable as beer. The fruit character should be evident but in balance with the beer, not so forward as to suggest an artificial product.","Aroma":"Varies by base style. The fruit character should be noticeable in the aroma; however, some fruit (e.g., raspberries, cherries) have stronger aromas and are more distinctive than others (e.g., blueberries, strawberries) – allow for a range of fruit character and intensities from subtle to aggressive. Hop aroma may be lower than in the base style to better show the fruit character. The fruit should add an extra complexity, but not be so prominent as to unbalance the resulting presentation.","Appearance":"Varies by base style and special ingredients. Lighter-colored beer should show distinctive ingredient colors, including in the head. The color of fruit in beer is often lighter than the flesh of the fruit itself and may take on slightly different shades. Variable clarity, although haze is generally undesirable. Some ingredients may impact head retention.","Flavor":"Varies by base style. As with aroma, distinctive fruit flavors should be noticeable, and may range in intensity from subtle to aggressive, but the fruit character should not be so artificial or inappropriately overpowering as to suggest a ‘fruit juice drink.’ Bitterness, hop and malt flavors, alcohol content, and fermentation byproducts, such as esters, should be appropriate for the base style, but be harmonious and balanced with the distinctive fruit flavors present. Fruit generally adds flavor not sweetness, since fruit sugars usually fully ferment, thus lightening the flavor and drying out the finish. However, residual sweetness is not necessarily a negative characteristic unless it has a raw, unfermented quality. Some fruit may add sourness, bitterness, and tannins, which must be balanced in the resulting flavor profile.","Mouthfeel":"Varies by base style. Fruit often decreases body, and makes the beer seem lighter on the palate. Some smaller and darker fruits may add a tannic depth, but this astringency should not overwhelm the base beer.","Style Comparison":""},"th":{"Overall Impression":"การผสมผสานที่ลงตัวระหว่างผลไม้กับเบียร์แต่ยังคงเป็นที่รู้จักในฐานะเบียร์ คาแรคเตอร์ของผลไม้ควรมีความเด่นชัดแต่ต้องสมดุลไปกับเบียร์ ไม่โดดเด่นเกินไปจนเหมือนของสังเคราะห์","Aroma":"แตกต่างกันไปตาม base style คาแรคเตอร์ผลไม้ควรชัดเจนในอโรม่า อย่างไรก็ตาม ผลไม้บางชนิด (เช่น ราสเบอร์รี่ เชอร์รี่) มีกลิ่นที่แรงกว่าและมีความโดดเด่นกว่าผลไม้ชนิดอื่น (เช่น บลูเบอร์รี่ สตรอว์เบอร์รี) คาแรคเตอร์ผลไม้มีได้ตั้งแต่ละเอียดอ่อนจนไปถึงรุนแรง มีกลิ่นฮอปในระดับที่ต่ำกว่า base style เพื่อให้เห็นคาแรคเตอร์ของผลไม้ ผลไม้ควรช่วยเพิ่มความซับซ้อน แต่ไม่โดดเด่นจนทำให้เบียร์ไม่สมดุล","Appearance":"แตกต่างกันไปตาม base style และส่วนผสมพิเศษ เบียร์สีอ่อนควรแสดงสีที่โดดเด่นจากส่วนผสม รวมทั้งในฟองด้วย สีของผลไม้ในเบียร์มักจะสว่างกว่าสีจากผลไม้จริงและอาจให้เฉดสีที่ต่างกันเล็กน้อย มีความชัดเจนหลากหลาย แม้ว่าโดยทั่วไปแล้วความขุ่นจะไม่พึงปรารถนาส่วนผสมบางอย่างอาจส่งผลต่อการเกาะแก้วของฟอง","Flavor":"แตกต่างกันไปตาม base style เช่นเดียวกับกลิ่น รสชาติผลไม้ที่โดดเด่นควรพบได้ชัดเจน และอาจมีระดับตั้งแต่ละเอียดอ่อนไปจนถึงก้าวร้าว แต่คาแรคเตอร์ของผลไม้ไม่ควรเป็นแบบสังเคราะห์หรือแรงเกินไปจนกลายเป็น ‘fruit juice drink.’ ความขม ฮอป รสมอลต์ ปริมาณแอลกอฮอล์และผลพลอยได้จากการหมัก เช่น ester ควรเหมาะสมกับ base style แต่ต้องมีความกลมกลืนและสมดุลกับความเด่นชัดของผลไม้ผลไม้มักช่วยเพิ่มรสชาติแต่ไม่เพิ่มความหวาน เนื่องจากน้ำตาลในผลไม้มักจะหายไปทั้งหมดในขั้นตอนการหมัก จึงทำให้รสอ่อนลงและจบด้วยความ dry อย่างไรก็ตาม ความหวานที่เหลือไม่จำเป็นต้องเป็นลักษณะเชิงลบ เว้นแต่จะออกมาในแบบ raw หรือ unferment ผลไม้บางชนิดอาจเพิ่มความเปรี้ยว ความขม และแทนนิน ซึ่งจะต้องสมดุลในรสชาติที่ได้","Mouthfeel":"แตกต่างกันไปตาม base style ผลไม้มักจะทำให้เนื้อเบียร์บางลง และทำให้รู้สึกบางขึ้นตอนรับรส ผลไม้ที่มีขนาดเล็กและสีเข้มบางชนิดอาจเพิ่มความลึกของ tannic แต่ความฝาดที่เกิดนี้ไม่ควรอยู่เหนือ base เบียร์","Style Comparison":""},"tags":"specialty-beer, fruit","ex":"21st Amendment Watermelon Wheat, Anderson Valley Blood Orange Gose, Avery Liliko’i Kepolo, Ballast Point Grapefruit Sculpin, Bell’s Cherry Stout, Founders Rübæus"},{"c":"29B","n":"Fruit and Spice Beer","cat":"29","cn":"Fruit Beer","tier":"C","gen":true,"en":{"Overall Impression":"A tasteful union of fruit, spice, and beer, but still recognizable as beer. The fruit and spice character should each be evident but in balance with the beer, not so forward as to suggest an artificial product.","Aroma":"Varies by base style. The fruit and spice character should be noticeable in the aroma; however, note that some fruit and spices (e.g., raspberries, cherries, cinnamon, ginger) have stronger aromas and are more distinctive than others (e.g., blueberries, strawberries) – allow for a range of fruit and spice character and intensity from subtle to aggressive. Hop aroma may be lower than in the base style to better show the specialty character. The specialty ingredients should add an extra complexity, but not be so prominent as to unbalance the resulting presentation.","Appearance":"Varies by base style and special ingredients. Lighter-colored beer should show distinctive ingredient colors, including in the head. The color of fruit in beer is often lighter than the flesh of the fruit itself and may take on slightly different shades. Variable clarity, although haze is generally undesirable. Some ingredients may impact head retention.","Flavor":"Varies by base style. As with aroma, distinctive fruit and spice flavors should be noticeable, and may range in intensity from subtle to aggressive. The fruit character should not be so artificial or inappropriately overpowering as to suggest a spiced fruit juice drink. Hop bitterness, flavor, malt flavors, alcohol content, and fermentation byproducts, such as esters, should be appropriate to the base style, but be harmonious and balanced with the distinctive fruit and spice flavors present. Fruit generally add flavor not sweetness, since fruit sugars usually fully ferment, thus lightening the flavor and drying out the finish. However, residual sweetness is not necessarily a negative characteristic unless it has a raw, unfermented quality. Some ingredients may add sourness, bitterness, and tannins, which must be balanced in the resulting flavor profile.","Mouthfeel":"Varies by base style. Fruit often decreases body, and makes the beer seem lighter on the palate. Some smaller and darker fruits may add a tannic depth, but this astringency should not overwhelm the base beer. SHVs may increase or decrease body. Some SHVs may add a bit of astringency, although a “raw” spice character is undesirable.","Style Comparison":""},"th":{"Overall Impression":"การผสมผสานอย่างมีรสนิยมของผลไม้เครื่องเทศ และเบียร์ แต่ยังคงเป็นที่รู้จักในฐานะเบียร์ คาแรคเตอร์ของผลไม้และเครื่องเทศแต่ละอย่างควรมีความชัดเจน แต่ให้สมดุลกับเบียร์ ไม่โดดเด่นเกินไปจนเหมือนของสังเคราะห์","Aroma":"แตกต่างกันไปตาม base style ควรพบคาแรคเตอร์จากผลไม้และเครื่องเทศในอโรม่า อย่างไรก็ตาม ผลไม้และเครื่องเทศบางชนิด (เช่น raspberries, cherries, cinnamon, ginger) มีกลิ่นที่แรงและมีความโดดเด่นกว่าผลไม้ชนิดอื่น (เช่น blueberries, strawberries) – ยอมรับคาแรคเตอร์ผลไม้และเครื่องเทศมีได้ตั้งแต่ละเอียดอ่อนจนไปถึงรุนแรง มีกลิ่นฮอปในระดับที่ต่ำกว่า base style เพื่อให้เห็นคาแรคเตอร์เฉพาะจากวัตถุดิบพิเศษ คาแรคเตอร์จากวัตถุดิบพิเศษควรช่วยเพิ่มความซับซ้อน แต่ไม่โดดเด่นจนทำให้เบียร์ไม่สมดุล","Appearance":"แตกต่างกันไปตาม base style และส่วนผสมพิเศษ เบียร์สีอ่อนควรแสดงสีที่โดดเด่นจากส่วนผสม รวมทั้งในฟองด้วย สีของผลไม้ในเบียร์มักจะสว่างกว่าสีจากผลไม้จริงและอาจให้เฉดสีที่ต่างกันเล็กน้อย มีความชัดเจนหลากหลาย แม้ว่าโดยทั่วไปแล้วความขุ่นจะไม่พึงปรารถนาส่วนผสมบางอย่างอาจส่งผลต่อการเกาะแก้วของฟอง","Flavor":"แตกต่างกันไปตาม base style เช่นเดียวกับกลิ่น รสชาติผลไม้และเครื่องเทศที่โดดเด่นควรพบได้ชัดเจน และอาจมีระดับตั้งแต่ละเอียดอ่อนไปจนถึงก้าวร้าว แต่คาแรคเตอร์ของผลไม้ไม่ควรเป็นแบบสังเคราะห์หรือแรงเกินไปจนกลายเป็น ‘spice fruit juice drink.’ ความขมฮอป รสมอลต์ ปริมาณแอลกอฮอล์และผลพลอยได้จากการหมัก เช่น ester ควรเหมาะสมกับ base style แต่ต้องมีความกลมกลืนและสมดุลกับความเด่นชัดของผลไม้และเครื่องเทศผลไม้มักช่วยเพิ่มรสชาติแต่ไม่เพิ่มความหวาน เนื่องจากน้ำตาลในผลไม้มักจะหายไปทั้งหมดในขั้นตอนการหมัก จึงทำให้รสอ่อนลงและจบด้วยความ dry อย่างไรก็ตาม ความหวานที่เหลือไม่จำเป็นต้องเป็นลักษณะเชิงลบ เว้นแต่จะออกมาในแบบ raw หรือ unferment วัตถุดิบบางชนิดอาจเพิ่มความเปรี้ยว ความขม และแทนนิน ซึ่งจะต้องสมดุลในรสชาติที่ได้","Mouthfeel":"แตกต่างกันไปตาม base style ผลไม้มักจะทำให้เนื้อเบียร์บางลง และทำให้รู้สึกเนื้อเบียร์บางขึ้นตอนรับรส ผลไม้ที่มีขนาดเล็กและสีเข้มบางชนิดอาจเพิ่มความลึกของ tannic แต่ความฝาดที่เกิดนี้ไม่ควรอยู่เหนือ base เบียร์ SHV (Spices, Herbs and Vegetables) อาจสงผลให้เนื้อเบียร์หนาขึ้นหรือบางลง บางอย่างอาจเพิ่มความฝาดเล็กน้อยคาแรคเตอร์ “raw” ของเครื่องเทศไม่พึงปรารถนา","Style Comparison":""},"tags":"specialty-beer, fruit, spice","ex":"Cigar City Margarita Gose, Firestone Walker Chocolate Cherry Stout, Golden Road Spicy Mango Cart, Kona Island Colada Cream Ale, New Glarus Blueberry Cocoa Stout, Sun King Orange Vanilla Sunlight"},{"c":"29C","n":"Specialty Fruit Beer","cat":"29","cn":"Fruit Beer","tier":"C","gen":true,"en":{"Overall Impression":"A appealing combination of fruit, sugar, and beer, but still recognizable as a beer. The fruit and sugar character should both be evident but in balance with the beer, not so forward as to suggest an artificial product.","Aroma":"Same as Fruit Beer, except that some additional fermentables (e.g., honey, molasses) may add an aroma component. Whatever additional aroma component is present should be in balance with the fruit and the beer components, and be a pleasant combination.","Appearance":"Same as Fruit Beer.","Flavor":"Same as Fruit Beer, except that some additional fermentables (e.g., honey, molasses) may add a flavor component. Whatever additional flavor component is present should be in balance with the fruit and the beer components, and be a pleasant combination. Added sugars should not have a raw, unfermented flavor. Some added sugars will have unfermentable elements that may provide a fuller and sweeter finish; fully fermentable sugars may thin out the finish.","Mouthfeel":"Same as Fruit Beer, although depending on the type of sugar added, could increase or decrease the body.","Style Comparison":""},"th":{"Overall Impression":"ส่วนผสมที่ลงตัวระหว่างผลไม้ น้ำตาล และเบียร์ แต่ยังคงเป็นที่รู้จักในฐานะเบียร์ คาแรคเตอร์ของผลไม้และน้ำตาลแต่ละอย่างควรมีความชัดเจน แต่ให้สมดุลกับเบียร์ ไม่โดดเด่นเกินไปจนเหมือนของสังเคราะห์","Aroma":"เช่นเดียวกับ Fruit Beer แต่มีสิ่งที่ใส่เข้าไปหมักเพิ่มเติมบางชนิด (เช่น น้ำผึ้ง กากน้ำตาล) ที่อาจเพิ่มคาแรคเตอร์ในอโรม่า สิ่งที่ใส่เข้าไปควรจะสมดุลกับคาแรคเตอร์ของผลไม้และเบียร์ ที่รวมแล้วให้กลิ่นที่รื่นรมย์","Appearance":"แบบเดียวกับ Fruit Beer","Flavor":"แบบเดียวกับ Fruit Beer แต่มีสิ่งที่ใส่เข้าไปหมักเพิ่มเติมบางชนิด (เช่น น้ำผึ้ง กากน้ำตาล) ที่อาจให้รสชาติเพิ่มเติม รสชาติที่เพิ่มขึ้นจากวัตถุดิบที่ใส่เข้าไปควรมีความสมดุลกับรสของผลไม้และเบียร์ และควรให้ความรู้สึกที่รื่นรมย์ น้ำตาลที่ใส่เข้าไปเพิ่มต้องไม่ให้รส “raw” หรือรสคล้ายน้ำตาลที่ไม่ผ่านการหมัก น้ำตาลที่ใส่เข้าไปบางชนิดจะมีบางส่วนที่หมักไม่ได้ที่จะทำให้เนื้อเบียร์เพิ่มขึ้นและหวานในตอนจบ แต่น้ำตาลที่สามารถหมักได้จะทำให้เนื้อเบียร์บาง","Mouthfeel":"แบบเดียวกับ Fruit Beer ขึ้นอยู่กับชนิดของน้ำตาลที่เติมเข้าไป สามารถเพิ่มหรือลดเนื้อเบียร์ได้","Style Comparison":""},"tags":"specialty-beer, fruit","ex":"The Bruery Goses are Red, New Planet Raspberry Ale, Tired Hands Strawberry Milkshake IPA, WeldWerks Piña Colada IPA"},{"c":"29D","n":"Grape Ale","cat":"29","cn":"Fruit Beer","tier":"C","gen":false,"en":{"Overall Impression":"Combines the profile of a sparkling wine and a relatively neutral base beer allowing the aromatic qualities of the grape to blend pleasantly with hop and yeast aromatics. Can be in a range from refreshing to complex.","Aroma":"Aromatic characteristics of the varietal grape are noticeable but should not dominate. The grape character should meld well with the underlying base malt character. While hop aroma is usually restrained, it can range from medium-low to entirely absent. Fermentation is usually quite clean but can have delicate spice and fruity esters. Banana, bubblegum, and the like are considered faults.","Appearance":"Color can range from pale golden to ruby but those using red grapes tend towards burgundy. These darker colors may also come from using cooked or concentrated grape products, never from specialty dark grains. White to reddish head with generally a medium-low retention. Clarity is generally good. Never hazy.","Flavor":"As with the aroma, grape character may range from subtle to medium-high intensity, and be most prominent. Fruit flavors (stone, tropical, berries, etc.) as appropriate for the variety of grape. Darker red grapes can contribute more rustic flavors (e.g., earthy, tobacco, leather). The malt character is supportive, not robust and usually of the pale, lightly kilned varieties. Very low levels of pale crystal malts are allowed but roasted or strong chocolate character is always inappropriate. Bitterness is generally low and hop flavors can be low to non- existent. Mild tart notes, due to variety and amount of grape used, is common and may help to improve the digestibility but should not near ‘sour’ threshold. Complementary oak is optional but a funky Brett character should not be present. Clean fermentation.","Mouthfeel":"Medium-high to high carbonation improves the perception of aroma. Body is generally from low to medium and some acidity can contribute to increased perception of dryness. Finish is exceedingly dry and crisp. Strong examples may show some warming.","Style Comparison":"Similar base as several Belgian styles, like Belgian Blonde, Saison, and Belgian Single, but with grapes. Higher strength examples are similar to Belgian Tripel or Belgian Golden Strong Ale, but with grapes. Not funky like Fruit Lambic."},"th":{"Overall Impression":"ผสมผสานรายละเอียดของ sparkling wine และ base beer ที่ค่อนข้างเป็นกลาง ทำให้กลิ่นหอมขององุ่นผสมผสานกับอโรม่าจากฮอปและยีสต์ได้อย่างลงตัว สามารถมีได้ตั้งแต่ให้ความสดชื่นไปจนถึงซับซ้อน","Aroma":"คาแรคเตอร์จากกลิ่นขององุ่นพันธุ์ต่างๆจะสังเกตได้ชัดเจน แต่ไม่ควรเด่นเกินไป คาแรคเตอร์ขององุ่นควรเข้ากันได้ดีกับคาแรคเตอร์ของ base มอลต์ แม้ว่ากลิ่นของฮอปมักจะถูกควบคุมเอาไว้ แต่ก็อาจพบได้ตั้งแต่ระดับต่ำปานกลางไปจนถึงไม่พบเลย มีการหมักที่ค่อนข้างสะอาด แต่อาจพบ spicy และ fruity ester ที่ละเอียดอ่อน คาแรคเตอร์ในแบบ กล้วยหมากฝรั่ง ถือว่าถือว่าเป็นความผิดพลาด","Appearance":"สีอาจมีตั้งแต่สีทองอ่อน (pale gold) ไปจนถึงทับทิม (ruby) แต่สีที่ใช้องุ่นแดงมักจะเป็นสีเบอร์กันดี (burgundy) สีที่เข้มอาจมาจากการใช้ผลิตภัณฑ์องุ่นที่ผ่านกระบวนการมาหรือองุ่นแบบเข้มข้น ไม่ควรมาจาก specialty dark grain มีฟองสีขาวถึงสีแดงโดยทั่วไปจะเกาะแก้วได้ในระดับต่ำปานกลาง ความชัดเจนโดยทั่วไปดี ไม่ควรขุ่น","Flavor":"เช่นเดียวกับอโรม่า คาแรคเตอร์ขององุ่นอาจมีตั้งแต่กลิ่นหอมอ่อนๆ ไปจนถึงความเข้มข้นปานกลางถึงสูงและอาจมีในแบบโดดเด่นที่สุดรสชาติผลไม้ (stone, tropical, berries ฯลฯ) มีตามความเหมาะสมกับองุ่นแต่ละชนิด องุ่นแดงที่เข้มอาจให้รสชาติแบบ rustic มากขึ้น (เช่น earthy, tobacco, leather) มีคาแรคเตอร์ของมอลต์ที่คอยสนับสนุน ไม่รุนแรง และมักจะเป็นเป็นแบบสีอ่อนหรืออาจจะอบเล็กน้อย ยอมให้ใช้ Pale Crystal มอลต์ในระดับที่ต่ำมาก แต่คาแรคเตอร์ในแบบความคั่วหรือช็อกโกแลตที่รุนแรงนั้นไม่เหมาะสม โดยทั่วไปความขมจะต่ำและรสชาติของฮอปอาจต่ำถึงไม่มีเลย มีคาแรคเตอร์ tart อ่อนๆ จากความหลากหลายและปริมาณขององุ่นที่ใช้ พบได้เป็นเรื่องปกติและอาจช่วยสนับสนุนการย่อยอาหารได้แต่ต้องไม่เปรี้ยว สามารถพบคาแรคเตอร์ oak ได้ แต่ไม่ควรพบ Brett แบบ funky มีโปรไฟล์การหมักที่สะอาด","Mouthfeel":"คาร์โบเนชั่นสูงปานกลางถึงสูงที่ช่วยเพิ่มการรับรู้ในอโรม่าเนื้อเบียร์มีตั้งแต่บางไปจนถึงปานกลาง และความเป็นกรดบางอย่างสามารถช่วยเพิ่มการรับรู้ถึงความ dry จบรสด้วยความ dry และ crisp ในตัวอย่างที่แอลกอฮอล์สูงอาจพบความอุ่นจากแอลกอฮอล์","Style Comparison":"ใช้ base เบียร์ที่คล้ายกับสไตล์เบลเยียม เช่น Belgian Blonde, Saison และ Belgian Single แต่เพิ่มองุ่น ตัวอย่างที่มีความแรงสูงนั้นคล้ายกับ Belgian Tripel หรือ Belgian Golden Strong Ale แบบมีองุ่น ไม่ funky เหมือน Fruit Lambic"},"tags":"specialty-beer, fruit","ex":"Montegioco Open Mind, Birrificio del Forte Il Tralcio, Luppolajo Mons Rubus, Firestone Walker Feral Vinifera, pFriem Family Brewers Druif, 4 Árvores Abbondanza","OG":[1.059,1.075],"FG":[1.004,1.013],"IBU":[10.0,30.0],"SRM":[4.0,8.0],"ABV":[6.0,8.5]},{"c":"30A","n":"Spice, Herb, or Vegetable Beer","cat":"30","cn":"Spiced Beer","tier":"B","gen":true,"en":{"Overall Impression":"An appealing fusion of spices, herbs, or vegetables (SHVs) and beer, but still recognizable as beer. The SHV character should be evident but in balance with the beer, not so forward as to suggest an artificial product.","Aroma":"Varies by base style. The SHV character should be noticeable in the aroma; however, some SHVs (e.g., ginger, cinnamon, rosemary) have stronger aromas and are more distinctive than others (e.g., most vegetables) – allow for a range of SHV character and intensity from subtle to aggressive. Hop aroma may be lower than in the base style to better show the SHV character. The SHVs should add an extra complexity, but not be so prominent as to unbalance the resulting presentation.","Appearance":"Varies by base style and special ingredients. Lighter-colored beer may show distinctive ingredient colors, including in the head. Variable clarity, although haze is generally undesirable. Some ingredients may impact head retention.","Flavor":"Varies by base style. As with aroma, distinctive SHV flavors should be noticeable, and may range in intensity from subtle to aggressive. Some SHVs are inherently bitter and may result in a beer more bitter than the declared base style. Bitterness, hop and malt flavors, alcohol content, and fermentation byproducts, such as esters, should be appropriate for the base style, but be harmonious and balanced with the distinctive SHV flavors present.","Mouthfeel":"Varies by base style. SHVs may increase or decrease body. Some SHVs may add a bit of astringency, although a “raw” spice character is undesirable.","Style Comparison":""},"th":{"Overall Impression":"การผสมผสานที่น่าดึงดูดของ spice, herb หรือ vegetable (SHV) และเบียร์ แต่ยังคงเป็นที่รู้จักในฐานะเบียร์คาแรคเตอร์ของ SHV ควรมีความชัดเจน แต่ให้สมดุลกับเบียร์ ไม่โดดเด่นเกินไปจนเหมือนของสังเคราะห์","Aroma":"แตกต่างกันไปตาม base style คาแรคเตอร์ของ SHV ควรพบได้ชัดเจนในอโรม่า อย่างไรก็ตาม SHV บางชนิด (เช่น ginger, cinnamon, rosemary) มีกลิ่นที่แรงและมีความโดดเด่นกว่าผลไม้ชนิดอื่น (เช่น ในผักส่วนใหญ่) – ยอมให้คาแรคเตอร์ของ SHV มีได้ตั้งแต่ละเอียดอ่อนจนไปถึงรุนแรง มีกลิ่นฮอปในระดับที่ต่ำกว่า base style เพื่อให้เห็นคาแรคเตอร์เฉพาะจาก SHV คาแรคเตอร์จาก SHV ควรช่วยเพิ่มความซับซ้อน แต่ไม่โดดเด่นจนทำให้เบียร์ไม่สมดุล","Appearance":"แตกต่างกันไปตาม base style และส่วนผสมพิเศษ เบียร์สีอ่อนควรแสดงสีที่โดดเด่นจากส่วนผสม รวมทั้งในฟองด้วย มีความชัดเจนหลากหลาย แม้ว่าโดยทั่วไปแล้วความขุ่นจะไม่พึงปรารถนาส่วนผสมบางอย่างอาจส่งผลต่อการเกาะแก้วของฟอง","Flavor":"แตกต่างกันไปตาม base style เช่นเดียวกับในอโรม่า รสชาติ SHV ที่โดดเด่นควรพบได้ชัดเจน และอาจมีระดับตั้งแต่ละเอียดอ่อนไปจนถึงก้าวร้าว SHV บางชนิดจะขมโดยพื้นฐานและอาจจะทำให้เบียร์มีความขมมากกว่าที่พบใน base style ความขม ฮอป รสมอลต์ ปริมาณแอลกอฮอล์และผลพลอยได้จากการหมัก เช่น ester ควรเหมาะสมกับ base style แต่ต้องมีความกลมกลืนและสมดุลกับความเด่นชัดจากรสชาติของ SHV","Mouthfeel":"แตกต่างกันไปตาม base style คาแรคเตอร์จาก SHV อาจช่วยเพิ่มหรือลดเนื้อเบียร์ SHV บางอย่างอาจเพิ่มความฝาดเล็กน้อย แต่คาแรคเตอร์ “raw” แบบเครื่องเทศจะไม่พึงปรารถนา","Style Comparison":""},"tags":"specialty-beer, spice","ex":"Alesmith Speedway Stout, Elysian Avatar Jasmine IPA, Founders Breakfast Stout, Rogue Yellow Snow Pilsner, Traquair Jacobite Ale, Young’s Double Chocolate Stout"},{"c":"30B","n":"Autumn Seasonal Beer","cat":"30","cn":"Spiced Beer","tier":"C","gen":true,"en":{"Overall Impression":"A malty, spiced beer that often has a moderately rich body and slightly warming finish suggesting a good accompaniment for the cool fall season, and often evocative of harvest or Thanksgiving traditions.","Aroma":"Malty, spicy, and balanced. A wide range is possible, as long as it evokes the harvest theme. The declared ingredients and concept set the expectation. Hops are often subtle. Alcohol is often present, but smooth and supportive. The components should be well-integrated, and create a coherent presentation. See Flavor section for spice, malt, sugar, and vegetable character.","Appearance":"Medium amber to coppery-brown; lighter versions are more common. Clear, if not opaque. Well-formed, persistent, off-white to tan head. Some versions with squashes will take on an unusual hue for beer, with orange-like hints.","Flavor":"Malty, spicy, and balanced. Allow for brewer creativity in meeting the theme objective. Warming or sweet spices common. Rich, toasty malty flavors are common, and may include caramel, toasted bread or pie crust, biscuit, or nut flavors. May include distinctive sugar flavors, like molasses, honey, or brown sugar. Flavor derived from squash-based vegetables are often elusive, often only providing a richer sweetness. The special ingredients should be supportive and balanced, not overshadowing the base beer. Bitterness and hop flavor are usually restrained to not interfere with the special character. Usually finishes somewhat full and satisfying, occasionally with a light alcohol flavor. Roasted malt characteristics are typically absent.","Mouthfeel":"Body is usually medium to full, and may be chewy. Moderately low to moderately high carbonation. Age character allowable. Warming alcohol allowable.","Style Comparison":""},"th":{"Overall Impression":"เบียร์รสมอลต์ผสมเครื่องเทศที่มักมีรสชาติเข้มข้นปานกลางและให้ความอบอุ่นในตอนจบ ที่เข้ากันได้ดีกับความหนาวเย็นในฤดูใบไม้ร่วง และมักจะชวนให้นึกถึงประเพณีการเก็บเกี่ยวหรือวันขอบคุณพระเจ้า","Aroma":"มีความ Malty, Spicy และความสมดุล ออกมาได้หลายแบบตราบใดที่ยังออกมาเกี่ยวข้องกับ Theme การเก็บเกี่ยว ส่วนผสมและแนวคิดเป็นการกำหนดแนวทาง ฮอปมักจะอ่อนโยน มักพบแอลกอฮอล์ในแบบนุ่มนวลและคอยสนับสนุน วัตถุดิบควรเข้ากันได้อย่างดี และสร้างการนำเสนอที่สอดคล้องกันดูที่ Flavor สำหรับลักษณะของเครื่องเทศ ข้าวมอลต์ น้ำตาล และผัก","Appearance":"มีสีอำพันปานกลาง (medium amber) ถึงน้ำตาลทองแดง (coppery-brown) รูปแบบปกติคือเบียร์ในแบบที่บางเบา ใส ถ้าไม่ทึบแสง ฟองขึ้นตัวได้ดี เกาะแก้วได้ยาวนาน ฟองสีขาวนวลถึงสีน้ำตาลอ่อนเบียร์ในแบบที่ใส่ Squash จะทำให้สีของเบียร์เปลี่ยนไป และมีกลิ่นคล้ายส้ม","Flavor":"มีความ malty, spicy และความสมดุล ผู้ผลิตเบียร์สามารถใช้ความคิดสร้างสรรค์ในการผลิตให้ได้ตาม Theme คาแรคเตอร์อุ่นจากแอลกอฮอล์หรือความหวานจาก spice พบได้ทั่วไป รสชาติมอลต์ที่เข้มข้นและ toasty เป็นเรื่องปกติ และอาจรวมถึงรสในแบบ caramel, toasted bread หรือ pie crust, biscuit หรือ nut อาจรวมถึงน้ำตาลที่มีรสชาติที่โดดเด่น เช่น molasses, honey หรือ brown sugar รสชาติที่ได้จากผักแบบ Squash-based จะเข้าใจยาก ทั่วไปจะผสมเพื่อให้ความหวานที่เข้มข้นเท่านั้นส่วนผสมพิเศษควรให้การสนับสนุนและสมดุล ไม่บดบัง base beer รสขมและกลิ่นฮอปมักจะถูกควบคุมไม่ให้รบกวนคาแรคเตอร์พิเศษ มักจะจบรสค่อนข้างเต็มอิ่มและพึงพอใจ บางครั้งอาจพบรสแอลกอฮอล์เล็กน้อยโดยทั่วไปแล้วจะไม่มีคาแรคเตอร์ของมอลต์คั่ว","Mouthfeel":"เนื้อเบียร์มักจะเป็นแบบปานกลางถึงหนาและอาจเต็มปากเต็มคำ คาร์โบเนชั่นต่ำปานกลางจนถึงสูงปานกลาง มีคาแรคเตอร์จากการบ่มได้ สามารถพบความอุ่นจากแอลกอฮอล์ได้","Style Comparison":""},"tags":"specialty-beer, spice","ex":"Dogfish Head Punkin Ale, Elysian Punkuccino, Rogue Pumpkin Patch Ale, Schlafly Pumpkin Ale, UFO Pumpkin, Weyerbacher Imperial Pumpkin"},{"c":"30C","n":"Winter Seasonal Beer","cat":"30","cn":"Spiced Beer","tier":"C","gen":true,"en":{"Overall Impression":"A stronger, darker, spiced beer that often has a rich body and warming finish suggesting a good accompaniment for the cold winter season.","Aroma":"Malty, spicy, fruity, and balanced. A wide range is possible, as long as it evokes the holiday theme. The declared ingredients and concept set the expectation. Fruit is often dark or dried in character. Hops are often subtle. Alcohol is often present, but smooth and supportive. Malty and sugary aromas tend to be greater in the balance, and support the spices. The components should be well-integrated, and create a coherent presentation. See Flavor section for spice, malt, sugar, and fruit character.","Appearance":"Medium amber to very dark brown; darker versions are more common. Clear, if not opaque. Usually clear, although darker versions may be virtually opaque. Well- formed, persistent, off-white to tan head.","Flavor":"Malty, spicy, fruity, and balanced. Allow for brewer creativity in meeting the theme objective. Warming or sweet spices common. Rich, sweet malty flavors are common, and may include caramel, toast, nutty, or chocolate flavors. May include dried fruit or dried fruit peel flavors such as raisin, plum, fig, cherry, orange peel, or lemon peel. May include distinctive sugar flavors, like molasses, honey, or brown sugar. The special ingredients should be supportive and balanced, not overshadowing the base beer. Bitterness and hop flavor are usually restrained to not interfere with special character. Usually finishes rather full and satisfying, often with a light alcohol flavor. Roasted malt characteristics are rare, and not usually stronger than chocolate.","Mouthfeel":"Body is usually medium to full, often with a malty chewiness. Moderately low to moderately high carbonation. Age character allowable. Warming alcohol allowable.","Style Comparison":""},"th":{"Overall Impression":"เบียร์เครื่องเทศ ที่มีความแรง มีสีเข้ม เนื้อเบียร์เข้มข้น และจบแบบอบอุ่น เข้ากันได้ดีสำหรับฤดูหนาว","Aroma":"มีความ malty, spicy, fruity และสมดุล ทำออกมาได้หลายแบบตราบใดที่ยังออกมาเกี่ยวข้องกับ Theme วันหยุด ส่วนผสมและแนวคิดเป็นการกำหนดแนวทาง คาแรคเตอร์ผลไม้จะเป็นแบบ dark หรือ dried ฮอปมักจะอ่อนโยน มักพบแอลกอฮอล์ในแบบนุ่มนวลและคอยสนับสนุน อโรม่าจาก malty และ sugary ออกมาสมดุลกันและสนับสนุนเครื่องเทศ วัตถุดิบควรเข้ากันได้อย่างดี และสร้างการนำเสนอที่สอดคล้องกันดูที่ Flavor สำหรับลักษณะของเครื่องเทศ มอลต์ น้ำตาล และผลไม้","Appearance":"มีสีอำพันปานกลาง (medium amber) ถึงสีน้ำตาลเข้มมาก (very dark brown) เบียร์สีเข้มคือรูปแบบปกติ มีความใส ถ้าไม่ทึบแสงปกติจะใส แม้แบบที่สีเข้มอาจมองดูเหมือนทึบแสง ฟองขึ้นตัวได้ดี เกาะแก้วได้ยาวนาน ฟองสีขาวนวลถึงสีน้ำตาลอ่อน","Flavor":"มีความ malty, spicy, fruity และสมดุล ผู้ผลิตเบียร์สามารถใช้ความคิดสร้างสรรค์ในการผลิตให้ได้ตามแนวคิด คาแรคเตอร์อุ่นจากแอลกอฮอล์หรือความหวานจาก spice พบได้ทั่วไป รสชาติมอลต์ที่เข้มข้นและหวานเป็นเรื่องปกติ และอาจรวมถึงรสในแบบ caramel, toast, nutty หรือ chocolate อาจมีรสชาติจากผลไม้แห้งหรือเปลือกผลไม้แห้ง เช่น raisin, plum, fig, cherry, orange peel หรือ lemon peel และอาจรวมถึงรสน้ำตาลที่โดดเด่น เช่น molasses, honey หรือ brown sugar ส่วนผสมพิเศษควรให้การสนับสนุนและสมดุล ไม่บดบัง base beer รสขมและกลิ่นฮอปมักจะถูกควบคุมไม่ให้รบกวนคาแรคเตอร์พิเศษ มักจะจบรสค่อนข้างเต็มอิ่มและพึงพอใจ อาจพบรสแอลกอฮอล์เล็กน้อยได้บ่อยๆคาแรคเตอร์ของมอลต์คั่วพบได้น้อย และไม่ควรรุนแรงกว่า chocolate","Mouthfeel":"เนื้อเบียร์ปานกลางถึงหนา มักมีความ malty ที่เต็มปากเต็มคำ มีคาร์โบเนชั่นต่ำปานกลางถึงสูงปานกลาง มีคาแรคเตอร์จากการบ่มได้สามารถพบความอุ่นจากแอลกอฮอล์ได้","Style Comparison":""},"tags":"specialty-beer, spice","ex":"Anchor Christmas Ale, Great Lakes Christmas Ale, Harpoon Winter Warmer, Rogue Santa’s Private Reserve, Schlafly Christmas Ale, Troeg’s The Mad Elf"},{"c":"30D","n":"Specialty Spice Beer","cat":"30","cn":"Spiced Beer","tier":"C","gen":true,"en":{"Overall Impression":"An appealing combination of spices, herbs, or vegetables (SHVs), sugars, and beer, but still recognizable as beer. The SHV and sugar character should both be evident but in balance with the beer, not so forward as to suggest an artificial product.","Aroma":"Same as SHV Beer, except that some additional fermentables (e.g., honey, molasses) may add an aroma component. Whatever additional aroma component is present should be in balance with the SHV and the beer components, and be a pleasant combination.","Appearance":"Same as Spice, Herb, or Vegetable Beer.","Flavor":"Same as SHV Beer, except that some additional fermentables (e.g., honey, molasses) may add a flavor component. Whatever additional flavor component is present should be in balance with the SHV and the beer components, and be a pleasant combination. Added sugars should not have a raw, unfermented flavor. Some added sugars will have unfermentable elements that may provide a fuller and sweeter finish; fully fermentable sugars may thin out the finish.","Mouthfeel":"Same as SHV Beer, although depending on the type of sugar added, could increase or decrease the body.","Style Comparison":""},"th":{"Overall Impression":"การผสมผสานที่น่าดึงดูดของ spice, herb หรือ vegetable (SHV) กับน้ำตาลและเบียร์ แต่ยังคงเป็นที่รู้จักในฐานะเบียร์ คาแรคเตอร์ของ SHV และน้ำตาลควรมีความชัดเจน แต่ให้สมดุลกับเบียร์ ไม่โดดเด่นเกินไปจนเหมือนของสังเคราะห์","Aroma":"เช่นเดียวกับเบียร์ SHV แต่มีสิ่งที่ใส่เข้าไปหมักเพิ่มเติมบางชนิด (เช่น น้ำผึ้ง กากน้ำตาล) ที่อาจเพิ่มคาแรคเตอร์ในอโรม่า สิ่งที่ใส่เข้าไปควรจะสมดุลกับคาแรคเตอร์ SHV และเบียร์ ที่รวมแล้วให้กลิ่นที่รื่นรมย์","Appearance":"แบบเดียวกับ Spice, Herb หรือ Vegetable Beer","Flavor":"แบบเดียวกับเบียร์ SHV แต่มีสิ่งที่ใส่เข้าไปหมักเพิ่มเติมบางชนิด (เช่น น้ำผึ้ง กากน้ำตาล) ที่อาจให้รสชาติเพิ่มเติม รสชาติที่เพิ่มขึ้นจากวัตถุดิบที่ใส่เข้าไปควรมีความสมดุลกับรสของ SHV และเบียร์ และควรให้ความรู้สึกที่รื่นรมย์ น้ำตาลที่ใส่เข้าไปเพิ่มต้องไม่ให้รส “raw” หรือรสคล้ายน้ำตาลที่ไม่ผ่านการหมัก น้ำตาลที่ใส่เข้าไปบางชนิดจะมีบางส่วนที่หมักไม่ได้ที่จะทำให้เนื้อเบียร์เพิ่มขึ้นและหวานในตอนจบ แต่น้ำตาลบางชนิดที่สามารถหมักได้จะทำให้เนื้อเบียร์บาง","Mouthfeel":"แบบเดียวกับเบียร์ SHV ขึ้นอยู่กับชนิดของน้ำตาลที่เติมเข้าไป ที่สามารถเพิ่มหรือลดเนื้อเบียร์ได้","Style Comparison":""},"tags":"specialty-beer, spice","ex":"New Belgium Honey Orange Tripel, Westbrook It’s Tiki Time"},{"c":"31A","n":"Alternative Grain Beer","cat":"31","cn":"Alternative Fermentables Beer","tier":"C","gen":true,"en":{"Overall Impression":"A base beer enhanced by or featuring the character of additional grains. The specific character depends greatly on the added grains.","Aroma":"Same as base beer style. The added grain will lend a particular character, although with some grains the beer will simply seem a bit more grainy or nutty, and some may have a relatively neutral character.","Appearance":"Same as base beer style, although some additional haze may be noticeable.","Flavor":"Same as base beer style. The additional grain should be noticeable in flavor, although it may not be necessarily identifiable. Some grains add an additional grainy, bready, or nutty flavor, while others simply enhance the flavor of the base beer. Some grains add a dryness to the finish.","Mouthfeel":"Same as the base beer, although many additional grains (e.g., oats, rye) increase body and viscosity, while some (e.g., GF grains) create a thinner beer.","Style Comparison":""},"th":{"Overall Impression":"base beer ที่ถูกยกระดับด้วยคาแรคเตอร์เฉพาะของ grain ที่ใส่เพิ่มเข้าไป คาแรคเตอร์เฉพาะมีผลอย่างมากต่อ grain ที่เพิ่มเข้ามา","Aroma":"แบบเดียวกับสไตล์ของ base beer การเพิ่ม grain จะเป็นการเพิ่มคาแรคเตอร์เฉพาะ แม้ว่า grain บางชนิดจะทำให้เบียร์เพิ่มความ grainy หรือ nutty และบางชนิดอาจให้คาแรคเตอร์ที่ค่อนข้างเป็นกลาง","Appearance":"แบบเดียวกับสไตล์ของ base beer อาจมีความขุ่นที่เกิดจากวัตถุดิบที่ใส่เข้าไป","Flavor":"แบบเดียวกับสไตล์ของ base beer การเพิ่ม grain เข้าไปควรมีผลต่อรสชาติ และไม่จำเป็นที่จะต้องระบุวัตถุดิบได้ grain บางชนิดจะให้รส grainy, bready หรือ nutty ขณะที่บางชนิดจะช่วยเพิ่มเฉพาะรสชาติของ base beer เท่านั้น grain บางชนิดทำให้เบียร์ dry ขึ้นในตอนจบ","Mouthfeel":"เช่นเดียวกับ base beer แม้ว่า grain ที่ใส่เข้าไปจะช่วยเพิ่มเนื้อเบียร์และความหนืด (เช่น oat, rye) ในขณะที่บางชนิด (เช่น GF grain) จะทำให้เนื้อเบียร์บางลง","Style Comparison":""},"tags":"specialty-beer","ex":"Blue/Point Rastafarye Ale, Green’s India Pale Ale, Lakefront New Grist, New Planet Pale Ale, Rogue Morimoto Soba Ale, Voodoo Swimming Jeans"},{"c":"31B","n":"Alternative Sugar Beer","cat":"31","cn":"Alternative Fermentables Beer","tier":"C","gen":true,"en":{"Overall Impression":"A tasteful integration of sugar and beer, but still recognizable as beer. The sugar character should both be evident and in balance with the beer, not so forward as to suggest an artificial product.","Aroma":"Same as the base beer, except that some additional fermentables (e.g., honey, molasses) may add an aroma, which should be a pleasant, balanced combination with the beer.","Appearance":"Same as the base beer, although some sugars will bring additional, usually darker, colors.","Flavor":"Same as the base beer, except that some additional fermentables (e.g., honey, molasses) may add a flavor, which should be a pleasant, balanced combination with the beer. Added sugars should not have a raw, unfermented flavor. Some unfermentable sugars provide a fuller finish, while fully fermentable sugars can thin out the finish.","Mouthfeel":"Same as the base beer, although depending on the type of sugar added, could increase or decrease the body.","Style Comparison":""},"th":{"Overall Impression":"การผสมผสานอย่างมีรสนิยมของน้ำตาล และเบียร์ แต่ยังคงเป็นที่รู้จักในฐานะเบียร์ คาแรคเตอร์ของน้ำตาลแต่ละอย่างควรมีความชัดเจน แต่ให้สมดุลกับเบียร์ ไม่โดดเด่นเกินไปจนเหมือนของสังเคราะห์","Aroma":"เช่นเดียวกับ base beer แต่มีสิ่งที่ใส่เข้าไปหมักเพิ่มเติมบางชนิด (เช่น น้ำผึ้ง กากน้ำตาล) ที่อาจเพิ่มคาแรคเตอร์ในอโรม่า ซึ่งควรเป็นส่วนผสมที่ลงตัวและน่าพึงพอใจกับเบียร์","Appearance":"เช่นเดียวกับ base beer แม้ว่าน้ำตาลบางชนิดจะให้สีที่เข้มขึ้น","Flavor":"เช่นเดียวกับ base beer แต่มีสิ่งที่ใส่เข้าไปหมักเพิ่มเติมบางชนิด (เช่น น้ำผึ้ง กากน้ำตาล) ที่อาจเพิ่มคาแรคเตอร์ในรสชาติ ซึ่งควรเป็นส่วนผสมที่ลงตัวและน่าพึงพอใจกับเบียร์ น้ำตาลที่ใส่เข้าไปเพิ่มต้องไม่ให้รส “raw” หรือรสคล้ายน้ำตาลที่ไม่ผ่านการหมัก น้ำตาลที่ใส่เข้าไปบางชนิดจะมีบางส่วนที่หมักไม่ได้ที่จะทำให้เนื้อเบียร์เพิ่มขึ้นในตอนจบ แต่น้ำตาลบางชนิดที่สามารถหมักได้จะทำให้เนื้อเบียร์บาง","Mouthfeel":"เช่นเดียวกับ base beer ขึ้นอยู่กับชนิดของน้ำตาลที่เพิ่มเข้าไป ที่อาจเพิ่มหรือลดเนื้อเบียร์","Style Comparison":""},"tags":"specialty-beer","ex":"Bell’s Hopslam, Cervejaria Colorado Appia, Fifth Hammer Break of Jawn, Groundswell Piloncillo, Long Trail Harvest, New Glarus Cabin Fever"},{"c":"32A","n":"Classic Style Smoked Beer","cat":"32","cn":"Smoked Beer","tier":"B","gen":true,"en":{"Overall Impression":"A well-balanced fusion of the malt and hops of the base beer style with a pleasant and agreeable smoke character.","Aroma":"A pleasant balance between the expected aroma of the base beer and smoked malt. The smoke character ranges from low to assertive, and may show varietal wood smoke character (e.g., alder, oak, beechwood). The balance between the smoke and beer can vary – they do not need to be equal in intensity. However, the resulting mix should be appealing. Sharp, phenolic, harsh, rubbery, or burnt smoke-derived aromatics are inappropriate.","Appearance":"Variable. The appearance should reflect the base beer style, although the color is often a bit darker than expected for the plain base style.","Flavor":"Similar to the aroma, with a balance between the base beer and low to assertive smoked malt. Varietal woods can produce different flavor profiles. The balance between smoke and beer can vary, but the resulting blend should be enjoyable. Smoke can add some additional dryness to the finish. Harsh, bitter, burnt, charred, rubbery, sulfury, medicinal, or phenolic smoke-derived flavors are inappropriate.","Mouthfeel":"Varies with the base beer style. Significant astringent, phenolic, smoke-derived harshness is a fault.","Style Comparison":""},"th":{"Overall Impression":"การผสมผสานที่ลงตัวระหว่างมอลต์และฮอปจาก base beer กับกลิ่นรมควันที่ผสมผสานและรื่นรมย์","Aroma":"มีความสมดุลระหว่างกลิ่นหอมของ base beer และ smoked มอลต์ คาแรคเตอร์รมควันมีตั้งแต่ต่ำไปจนถึงเข้ม และอาจแสดงคาแรคเตอร์จากควันไม้แบบต่างๆ (เช่น alder, oak, beechwood) ความสมดุลระหว่างควันไม้และเบียร์อาจแตกต่างกันไป ไม่จำเป็นต้องมีความเข้มข้นเท่ากัน อย่างไรก็ตาม ผลลัพธ์ที่ได้ควรมีความน่าดึงดูดใจ กลิ่นในแบบ sharp, phenolic, harsh, rubbery หรือ burnt smoke ไม่เหมาะสม","Appearance":"ออกมาได้หลายรูปแบบ รูปลักษณ์ควรสะท้อนถึงสไตล์ของ base beer แม้ว่าสีมักจะเข้มกว่าสไตล์ของ base beer ปกติเล็กน้อย","Flavor":"คล้ายกับอโรม่า ที่มีความสมดุลระหว่าง base beer และ smoked มอลต์ที่มีความเข้มข้นในระดับต่ำถึงสูง ไม้แต่ละสายพันธุ์จะให้โปรไฟล์รสชาติที่แตกต่างกัน ความสมดุลระหว่างควันไม้กับเบียร์อาจแตกต่างกันไป แต่การผสมผสานที่ลงตัวนั้นต้องน่าเพลิดเพลิน คาแรคเตอร์ควันไม้สามารถเพิ่มความ dry ในตอนจบได้ แต่รสชาติ harsh, bitter, burnt, charred, rubbery, sulfury, medicinal หรือ phenolic smoke- derived นั้นไม่เหมาะสม","Mouthfeel":"ออกมาได้หลายรูปแบบตาม base style แต่ความฝาดแบบ phenol หรือลักษณะจากการรมควันที่ออกกระด้างคือความผิดพลาด","Style Comparison":""},"tags":"specialty-beer, smoke","ex":"Alaskan Smoked Porter, Schlenkerla Oak Smoke Doppelbock, Schlenkerla Rauchbier Weizen, Schlenkerla Rauchbier Ur-Bock, O’Fallon Smoked Porter, Spezial Rauchbier Lagerbier"},{"c":"32B","n":"Specialty Smoked Beer","cat":"32","cn":"Smoked Beer","tier":"C","gen":true,"en":{"Overall Impression":"A well-balanced fusion of the malt and hops of the base specialty beer style with a pleasant and agreeable smoke character.","Aroma":"A pleasant balance between the expected aroma of the base beer, smoked malt, and any specialty ingredients. The smoke character ranges from low to assertive, and may show varietal wood smoke character (e.g., alder, oak, beechwood). The balance between the smoke, the beer, and any specialty ingredients can vary – they do not need to be equal in intensity. However, the resulting mix should be appealing. Sharp, phenolic, harsh, rubbery, or burnt smoke-derived aromatics are inappropriate.","Appearance":"Variable. The appearance should reflect the base beer style, although the color is often a bit darker than expected for the plain base style. The use of certain fruits and spices may affect the color and hue of the beer as well.","Flavor":"Similar to the aroma, with a balance between the base beer, any specialty ingredients, and low to assertive smoked malt. Varietal woods can produce different flavor profiles. The balance between smoke, beer, and any specialty ingredients can vary, but the resulting blend should be enjoyable. Smoke can add some additional dryness to the finish. Harsh, bitter, burnt, charred, rubbery, sulfury, medicinal, or phenolic smoke- derived flavors are inappropriate.","Mouthfeel":"Varies with the base beer style. Significant astringent, phenolic, smoke-derived harshness is a fault.","Style Comparison":""},"th":{"Overall Impression":"การผสมผสานที่ลงตัวระหว่างมอลต์และฮอปจาก base beer แบบพิเศษกับกลิ่นรมควันที่ผสมผสานและรื่นรมย์","Aroma":"ความสมดุลระหว่างกลิ่นหอมของ base beer, smoked มอลต์และวัตถุดิบพิเศษ คาแรคเตอร์รมควันมีตั้งแต่ต่ำไปจนถึงสูง และอาจแสดงคาแรคเตอร์จากควันไม้แบบต่างๆ (เช่น alder, oak, beechwood) ความสมดุลระหว่างควันไม้ เบียร์ และวัตถุดิบพิเศษอาจแตกต่างกันไป ไม่จำเป็นต้องมีความเข้มข้นเท่ากัน อย่างไรก็ตาม ผลลัพธ์ที่ได้ควรมีความน่าดึงดูดใจ กลิ่นในแบบ sharp, phenolic, harsh, rubbery หรือ burnt smoke ไม่เหมาะสม","Appearance":"ออกมาได้หลายรูปแบบ รูปลักษณ์ควรสะท้อนถึงสไตล์ของ base beer แม้ว่าสีมักจะเข้มกว่าสไตล์ของ base beer ปกติเล็กน้อยการใช้ผลไม้และเครื่องเทศบางชนิดอาจส่งผลต่อสีของเบียร์เช่นกัน","Flavor":"คล้ายกับอโรม่า ที่มีความสมดุลระหว่าง base beer วัตถุดิบพิเศษและ smoked มอลต์ที่มีความเข้มข้นในระดับต่ำถึงสูง ไม้แต่ละสายพันธุ์จะให้โปรไฟล์รสชาติที่แตกต่างกัน ความสมดุลระหว่างควันไม้วัตถุดิบพิเศษและเบียร์อาจแตกต่างกันไป แต่การผสมผสานที่ลงตัวนั้นต้องน่าเพลิดเพลิน คาแรคเตอร์ควันไม้สามารถเพิ่มความ dry ในตอนจบได้ แต่รสชาติ harsh, bitter, burnt, charred, rubbery, sulfury, medicinal หรือ phenolic smoke-derived นั้นไม่เหมาะสม","Mouthfeel":"ออกมาได้หลายรูปแบบตาม base style แต่ความฝาดแบบ phenol หรือลักษณะจากการรมควันที่ออกกระด้างคือความผิดพลาด","Style Comparison":""},"tags":"specialty-beer, smoke","ex":"Fat Head’s Up in Smoke, Ommegang Bourbon Barrel Vanilla Smoked Porter"},{"c":"33A","n":"Wood-Aged Beer","cat":"33","cn":"Wood Beer","tier":"B","gen":true,"en":{"Overall Impression":"A pleasant enhancement of the base beer style with the characteristics from aging in contact with wood. The best examples will be smooth, flavorful, well- balanced, and well-aged.","Aroma":"Varies with base style. A low to moderate woody aroma is usually present; some varietals may have a stronger, or distinctive character. Fresh wood can occasionally impart raw, fresh-cut wood smell, although this character should never be too strong. If the wood is toasted or charred, there may be low to moderate vanilla, caramel, toffee, toast, or cocoa character present.","Appearance":"Varies with base style. Often darker than the unadulterated base beer style, particularly if toasted or charred barrels are used.","Flavor":"Varies with base style. Wood usually contributes a woody flavor, and possibly a distinctive varietal character. New wood may add a raw, fresh-cut wood impression. Toasted or charred wood can add vanilla, caramel, butterscotch, toasted bread, toasted nuts, coffee, chocolate, or cocoa, depending on the wood varietal and level of toast or char. Wood-derived flavors should be balanced, supportive, and noticeable, while not overpowering the base beer style.","Mouthfeel":"Varies with base style. Tannins from the wood may increase the perception of body, as well as enhancing the dryness of the finish; some astringency from wood tannins is allowable. Tart or acidic characteristics should be low to none, and never distracting.","Style Comparison":""},"th":{"Overall Impression":"การยกระดับ base beer ให้น่ารื่นรมย์ด้วยคาแรคเตอร์จากการบ่มในถังไม้ ตัวอย่างที่ดีต้องมีความนุ่มนวล มีรสชาติมีความสมดุล และบ่มมาอย่างดี","Aroma":"แตกต่างกันไปตาม base style มักจะมีกลิ่นจากไม้ในระดับต่ำถึงปานกลาง ไม้บางสายพันธุ์อาจมีคาแรคเตอร์ที่รุนแรงหรือโดดเด่นกว่าไม้สดควรพบกลิ่นไม้สดและตัดใหม่ได้ในบางครั้ง แต่คาแรคเตอร์นี้ไม่ควรรุนแรงเกินไป ถ้าไม้ผ่านการอบหรือเผา อาจพบคาแรคเตอร์ vanilla, caramel, toffee, toast หรือ cocoa ในระดับต่ำถึงปานกลาง","Appearance":"แตกต่างกันไปตาม base style มักจะมีสีเข้มกว่า base style ที่ไม่มีสิ่งเจือปน แม้ว่าจะใช้ถังที่อบหรือเผาจนเกรียม","Flavor":"แตกต่างกันไปตาม base style ไม้ทำให้เกิดรสชาติจากไม้ และอาจเป็นลักษณะเฉพาะของไม้สายพันธุ์ต่างๆ ไม้สดควรพบกลิ่นไม้สดและตัดใหม่ได้ ไม้ที่ผ่านการอบหรือเผาสามารถให้คาแรคเตอร์ vanilla, caramel, butterscotch, toasted bread, toasted nuts, coffee, chocolate หรือ cocoa ขึ้นอยู่กับสายพันธุ์ไม้และระดับการอบหรือเผารสชาติที่มาจากไม้ควรมีความสมดุล สนับสนุน และสังเกตได้ชัดเจน และไม่ควรมีคาแรคเตอร์ที่เด่นเกินกว่าสไตล์ของ base beer","Mouthfeel":"แตกต่างกันไปตาม base style แทนนินจากไม้อาจเพิ่มการรับรู้ในเนื้อเบียร์รวมทั้งเพิ่มความ dry ในตอนจบ ความฝาดบางอย่างจากแทนนินในไม้ยอมรับได้ คาแรคเตอร์ในแบบ tart หรือ acidic ควรจะต่ำถึงไม่มีเลย และไม่รบกวน","Style Comparison":""},"tags":"specialty-beer, wood","ex":"Bush Prestige, Cigar City Spanish Cedar Jai Alai, Firestone Walker Double Barrel Ale, Midnight Sun Arctic Devil, Petrus Aged Pale, Samuel Smith Yorkshire Stingo"},{"c":"33B","n":"Specialty Wood-Aged Beer","cat":"33","cn":"Wood Beer","tier":"C","gen":true,"en":{"Overall Impression":"An elevation of the base beer style with characteristics from aging in contact with wood, including alcoholic products previously in contact with the wood. The best examples will be smooth, flavorful, well-balanced, and well-aged.","Aroma":"Varies with base style. A low to moderate woody aroma is usually present; some varietals may have a stronger, or distinctive character. If the wood is toasted or charred, there may be low to moderate vanilla, caramel, toffee, toast, or cocoa character present. Aromatics associated with alcohol (e.g., distilled spirits, wine) previously stored in the wood should be noticeable, but balanced.","Appearance":"Varies with base style. Often darker than the unadulterated base beer style, particularly if charred barrels are used. Beers aged in wine barrels or other products with distinctive colors may also impart a color to the finished beer.","Flavor":"Varies with base style. Wood usually contributes a woody flavor, and possibly a distinctive varietal character. Toasted or charred wood can add vanilla, caramel, butterscotch, toasted bread, toasted nuts, coffee, chocolate, or cocoa, depending on the wood varietal and level of toast or char. Wood-derived flavors and added alcohol flavors should be balanced, mutually supportive, and noticeable, while not overpowering the base beer style or each other.","Mouthfeel":"Varies with base style. Tannins from the wood may increase the perception of body, as well as enhancing the dryness of the finish; some astringency from wood tannins is allowable. Usually exhibits additional alcohol warming, but should not be hot or harsh. Tart or acidic characteristics should be low to none, and never distracting.","Style Comparison":""},"th":{"Overall Impression":"การยกระดับของ base beer ด้วยคาแรคเตอร์จากการบ่มด้วยไม้ รวมถึงคาแรคเตอร์ของแอลกอฮอล์เพิ่มเติมจากการสัมผัสกับไม้ในการใช้งานของถังก่อนหน้า ตัวอย่างที่ดีต้องนุ่มนวล มีรสชาติมีความสมดุล และบ่มมาอย่างดี","Aroma":"แตกต่างกันไปตาม base style มักจะมีกลิ่นไม้ในระดับต่ำถึงปานกลาง ไม้บางสายพันธุ์อาจมีคาแรคเตอร์ที่รุนแรงหรือโดดเด่นกว่า ถ้าไม้ผ่านการอบหรือเผา อาจพบคาแรคเตอร์ vanilla, caramel, toffee, toast หรือ cocoa ในระดับต่ำถึงปานกลาง อโรม่าที่เกี่ยวข้องกับแอลกอฮอล์ (เช่น สุรากลั่น ไวน์) ที่เคยผ่านการใช้งานของถังควรสังเกตุได้ชัดเจน แต่มีความสมดุล","Appearance":"แตกต่างกันไปตาม base style มักจะมีสีเข้มกว่า base style ที่ไม่มีสิ่งเจือปนแม้ว่าจะใช้ถังที่อบหรือเผาจนเกรียม เบียร์ที่บ่มใน wine barrel หรือผลิตภัณฑ์อื่นๆ ที่มีสีโดดเด่นอาจทำให้มีผลต่อสีของเบียร์ที่สำเร็จ","Flavor":"แตกต่างกันไปตาม base style ไม้ทำให้เกิดรสชาติของไม้ และอาจเป็นลักษณะเฉพาะของไม้พันธุ์ต่างๆ ไม้ที่ผ่านการอบหรือเผาสามารถให้คาแรคเตอร์ vanilla, caramel, butterscotch, toasted bread, toasted nuts, coffee, chocolate หรือ cocoa ขึ้นอยู่กับสายพันธุ์ไม้และระดับการอบหรือเผา รสชาติที่มาจากไม้และแอลกอฮอล์ที่เพิ่มขึ้นควรมีความสมดุลสนับสนุน และสังเกตได้ชัดเจน และไม่ควรมีคาแรคเตอร์ที่เด่นเกินกว่าสไตล์ของ base beer หรืออย่างอื่น","Mouthfeel":"แตกต่างกันไปตาม base style แทนนินจากไม้อาจเพิ่มการรับรู้ในเนื้อเบียร์รวมทั้งเพิ่มความ dry ในตอนจบ ความฝาดบางอย่างจากแทนนินในไม้ยอมรับได้ โดยปกติจะทำให้รู้สึกถึงความอุ่นจากแอลกอฮอล์มากขึ้น แต่ไม่ควรร้อนหรือรุนแรง คาแรคเตอร์จาก tart หรือ acidic ควรจะต่ำถึงไม่มีเลย และไม่รบกวน","Style Comparison":""},"tags":"specialty-beer, wood","ex":"AleSmith Barrel-Aged Old Numbskull, Founders Kentucky Breakfast Stout, Firestone Walker Parabola, Goose Island Bourbon County Stout, Great Divide Barrel Aged Yeti, The Lost Abbey Angel’s Share Ale"},{"c":"34A","n":"Commercial Specialty Beer","cat":"34","cn":"Specialty Beer","tier":"C","gen":true,"en":{"Overall Impression":"Based on declared beer.","Aroma":"Based on declared beer.","Appearance":"Based on declared beer.","Flavor":"Based on declared beer.","Mouthfeel":"Based on declared beer.","Style Comparison":""},"th":{"Overall Impression":"ขึ้นอยู่กับเบียร์ที่แจ้งไว้","Aroma":"ขึ้นอยู่กับเบียร์ที่แจ้งไว้","Appearance":"ขึ้นอยู่กับเบียร์ที่แจ้งไว้","Flavor":"ขึ้นอยู่กับเบียร์ที่แจ้งไว้","Mouthfeel":"ขึ้นอยู่กับเบียร์ที่แจ้งไว้","Style Comparison":""},"tags":"specialty-beer","ex":"Orval, La Chouffe"},{"c":"34B","n":"Mixed-Style Beer","cat":"34","cn":"Specialty Beer","tier":"C","gen":true,"en":{"Overall Impression":"Based on the declared Base Styles, methods, and ingredients. As with all Specialty-Type Beers, the resulting combination of beer styles needs to be harmonious and balanced, and be pleasant to drink.","Aroma":"Based on the declared Base Styles.","Appearance":"Based on the declared Base Styles.","Flavor":"Based on the declared Base Styles.","Mouthfeel":"Based on the declared Base Styles.","Style Comparison":""},"th":{"Overall Impression":"ขึ้นอยู่กับ base style ที่แจ้งไว้ วิธีการและส่วนผสมที่แจ้งไว้ เช่นเดียวกับ Specialty-Type Beer ทั้งหมด การผสมผสานของสไตล์เบียร์ที่ได้จะต้องมีความกลมกลืนและสมดุล และน่าดื่ม","Aroma":"ขึ้นอยู่กับเบียร์พื้นฐานที่แจ้งไว้","Appearance":"ขึ้นอยู่กับเบียร์พื้นฐานที่แจ้งไว้","Flavor":"ขึ้นอยู่กับเบียร์พื้นฐานที่แจ้งไว้","Mouthfeel":"ขึ้นอยู่กับเบียร์พื้นฐานที่แจ้งไว้","Style Comparison":""},"tags":"specialty-beer","ex":"Birrificio Italiano Tipopils, Firestone Walker Pivo Pils, Jack’s Abby Hoponius Union, Ommegang Helles Superior"},{"c":"34C","n":"Experimental Beer","cat":"34","cn":"Specialty Beer","tier":"C","gen":true,"en":{"Overall Impression":"Varies, but should be a unique experience.","Aroma":"Varies.","Appearance":"Varies.","Flavor":"Varies.","Mouthfeel":"Varies.","Style Comparison":""},"th":{"Overall Impression":"แตกต่างกันไป แต่ควรให้ประสบการณ์ที่ไม่เหมือนใคร","Aroma":"แตกต่างกันไป","Appearance":"แตกต่างกันไป","Flavor":"แตกต่างกันไป","Mouthfeel":"แตกต่างกันไป","Style Comparison":""},"tags":"specialty-beer","ex":"None"},{"c":"X3","n":"Italian Grape Ale","cat":"X","cn":"Local Styles (Appendix B)","tier":"C","gen":false,"en":{"Overall Impression":"A sometimes refreshing, sometimes more complex Italian ale characterized by different varieties of grapes.","Aroma":"Aromatic characteristics of a particular grape have to be noticeable but do should not overpower the other aromas. The grape character should be pleasant and should not have defects such as oxidation. Malt character is usually restrained and should not exhibit a roasty, stout like, profile. Hop aroma (floral, earthy) can range from medium-low to absent. Some examples can have a low wild character described as barnyard, earthy, goaty but should not be as intense as in a lambic/fruit lambic. No diacetyl.","Appearance":"Color can range from light gold to copper but some examples can be brown. Reddish/ruby color is usually due to the use of red grape varieties. White to reddish head with generally a medium low retention. Clarity is generally good but some cloudiness may be present.","Flavor":"As with aroma, grape character (must or wine-like) must be present and may range from medium-low to medium- high intensity. Varieties of grape can contribute differently on the flavor profile: in general stone/tropical fruit flavors (peach, pear, apricot, pineapple) can come from white grapes and red fruit flavors (e.g., cherry, strawberry) from red grape varieties. Further fruity character of fermentative origin is also common. Different kinds of special malts can be used but should be supportive and balanced, not so prominent as to overshadow the base beer. Strong roasted and/or chocolate character is inappropriate. Light sour notes, due to the use of grape, are common and may help to improve the drinkability but should not be prominent as in Sour ale/Lambic or similar. Oak flavors, along with some barnyard, earthy, goaty notes can be present but should not be predominant. Bitterness and hop flavors are low. Diacetyl is absent","Mouthfeel":"Medium-high carbonation improves the perception of aroma. Body is generally from low to medium and some acidity can contribute to increase the perception of dryness. Strong examples can show some warming but without being hot or solventy.","Style Comparison":"Similar to Fruit Beer but evolved as a standalone style due to the abundance of grapes varieties in Italy."},"th":{"Overall Impression":"เบียร์เอลจากอิตาลีที่บางครั้งให้ความสดชื่นบางครั้งก็มีความซับซ้อน ซึ่งมีลักษณะเฉพาะด้วยการใช้องุ่นหลากหลายสายพันธุ์","Aroma":"ความหอมจากกลิ่นองุ่นต้องเด่นชัด แต่ไม่ควรกลบกลิ่นอื่นๆกลิ่นขององุ่นควรเป็นไปในทางที่น่าพอใจและไม่มีข้อบกพร่อง เช่น การเกิด oxidation มอลต์มักจะมีความละเอียดอ่อนและไม่ควรมีลักษณะแบบคั่วหรือคล้ายกับ stout สามารถมีกลิ่นฮอปแบบ (floral, earthy) ในระดับต่ำปานกลางหรือไม่มีก็ได้ บางตัวอย่างอาจมีคาแรคเตอร์ wild ที่ทำให้รู้สึกถึง barnyard, earthy, goaty แต่ไม่ควรเข้มข้นเท่ากับใน lambic หรือ fruit lambic ไม่มี diacetyl","Appearance":"สีสามารถมีได้ตั้งแต่ทองอ่อน (light gold) ถึงทองแดง (copper) แต่บางตัวอย่างอาจมีสีน้ำตาล (brown) สีแดงหรือสีรูบี้มักเกิดจากการใช้พันธุ์องุ่นสีแดง ฟองมีตั้งแต่สีขาวจนถึงสีแดง มีฟองในระดับต่ำปานกลาง ทั่วไปจะใส แต่บางครั้งอาจมีความขุ่นเล็กน้อย","Flavor":"ลักษณะขององุ่นต้องมีอยู่และสามารถมีความเข้มข้นตั้งแต่ต่ำปานกลางจนถึงสูงปานกลาง พันธุ์องุ่นต่างๆ สามารถส่งผลต่อโปรไฟล์รสชาติ: โดยทั่วไป รสชาติของ stone fruit หรือ tropical fruit (เช่น พีช, ลูกแพร์, แอปริคอท, สับปะรด) จะมาจากองุ่นขาว ขณะที่รสชาติ red fruit (เช่น เชอร์รี่, สตรอว์เบอร์รี่) จะมาจากพันธุ์องุ่นแดง รสชาติ fruity เพิ่มเติมจากการหมักก็เป็นเรื่องปกติ สามารถใช้ special มอลต์ได้หลากหลาย แต่ควรเป็นการสนับสนุนและมีความสมดุล ไม่ควรโดดเด่นจนทำให้ base beer ถูกบดบัง การมีรสชาติที่เข้มข้นจากการคั่วหรือช็อกโกแลตไม่เหมาะสม ความเปรี้ยวเล็กน้อยจากการใช้องุ่นเป็นเรื่องปกติและอาจช่วยเพิ่มความสามารถในการดื่ม แต่ไม่ควรเด่นชัดเหมือนใน sour ale/lambic หรือจากประเภทที่คล้ายกัน รสชาติจากโอ๊กรวมถึงความรู้สึกในแบบ barnyard, earthy, goaty สามารถพบได้ แต่ไม่ควรมีความเด่นชัด ความขมและรสชาติของฮอปควรมีในระดับต่ำ ไม่ควรมี diacetyl","Mouthfeel":"มีคาร์โบเนชั่นในระดับสูงปานกลาง ช่วยเพิ่มการรับรู้ด้านกลิ่น โดยทั่วไปแล้วเนื้อเบียร์จะอยู่ในระดับบางจนถึงปานกลาง และมีความ acidity เล็กน้อยที่สามารถช่วยเพิ่มการรับรู้แบบ dry ตัวอย่างที่มีความแรงอาจพบความรู้สึกอุ่นได้ แต่ไม่ควรมีความรู้สึกร้อนหรือแบบ solventy","Style Comparison":"คล้ายกับเบียร์ผลไม้ แต่พัฒนาขึ้นมาเป็นสไตล์ที่เป็นอิสระเนื่องจากมีความหลากหลายของพันธุ์องุ่นในอิตาลี"},"tags":"","ex":"Montegioco Open Mind, Birrificio Barley BB5-10, Birrificio del Forte Il Tralcio, Viess Beer al mosto di gewurtztraminer, CRAK IGA Cabernet, Birrificio Apuano Ninkasi, Luppolajo Mons Rubus","OG":[1.045,1.1],"FG":[1.005,1.015],"IBU":[6.0,30.0],"SRM":[4.0,25.0],"ABV":[4.5,12.0]},{"c":"X5","n":"New Zealand Pilsner","cat":"X","cn":"Local Styles (Appendix B)","tier":"B","gen":false,"en":{"Overall Impression":"A pale, dry, golden-colored, cleanly- fermented beer showcasing the characteristic tropical, citrusy, fruity, grassy New Zealand-type hops. Medium body, soft mouthfeel, and smooth palate and finish, with a neutral to bready malt base provide the support for this very drinkable, refreshing, hop-forward beer.","Aroma":"Medium to high hop aroma reflective of modern New World hop varieties, often showcasing tropical fruit, citrus (lime, white grapefruit), gooseberry, honeydew melon, with a light green bell pepper or grassy aspect. Medium-low to medium malt in support, with a neutral to bready-crackery quality. Very low DMS acceptable but not required. Neutral, clean yeast character, optionally with a very light sulfury quality. The hop character should be most prominent in the balance, but some malt character must be evident.","Appearance":"Straw to deep gold in color, but most examples are yellow-gold. Generally quite clear to brilliant clarity; haziness is a fault. Creamy, long-lasting white head.","Flavor":"Medium to high hop bitterness, cleanly bitter not harsh, most prominent in the balance and lasting into the aftertaste. Medium to high hop flavor with similar characteristics as the aroma (tropical, citrus, gooseberry, melon, grass). Medium to medium-low malt flavor, grainy- sweet, bready, or crackery. Clean fermentation profile (fermentation esters are a fault). Dry to off-dry with a clean, smooth finish and bitter but not harsh aftertaste. The malt may suggest an impression of sweetness but the beer should not be literally sweet. The finish may be dry but not seem crisp or biting. The balance should always be bitter, but the malt flavor must be noticeable.","Mouthfeel":"Medium to medium-light body. Medium to medium-high carbonation. Smoothness is the most prominent impression. Never harsh nor astringent.","Style Comparison":"Compared to a German Pils, not as crisp and dry in the finish with a softer, maltier presentation and a fuller body. Compared to a Czech Premium Pale Lager, less malt complexity, a cleaner fermentation. Similar in balance to a Kolsch or British Golden Ale, but with a hoppier aroma. Compared to any of these German styles, showcasing New Zealand hop varieties with tropical, citrusy, fruity, grassy characteristics, often with a white wine-like character. Should not be as hoppy or bitter in balance as an IPA."},"th":{"Overall Impression":"เบียร์สีทองอ่อน มีความ dry และหมักอย่างสะอาด โดยเน้นการใช้ฮอปจากนิวซีแลนด์ที่ให้คาแรคเตอร์ในแบบ tropical, citrusy, fruity, grassy มีเนื้อเบียร์ปานกลาง มีสัมผัสนุ่มนวลและรสชาติที่ราบเรียบและจบรสอย่างเรียบง่าย โดยมีมอลต์ที่เป็นกลางถึงจนมีรส bready เพื่อสนับสนุนความสดชื่นและความเข้มข้นของฮอปในเบียร์ ทำให้ดื่มได้ง่ายและสดชื่นมาก","Aroma":"มีกลิ่นฮอปในระดับปานกลางถึงสูงที่สะท้อนถึงฮอปสมัยใหม่จากโลกใหม่ ที่มักจะเป็นแบบ tropical fruit, citrus (lime, white grapefruit), gooseberry, honeydew melon, with a light green bell pepper หรือ grassy มีมอลต์ในระดับปานกลางถึงต่ำปานกลาง ที่คอยสนับสนุน ด้วยคุณสมบัติที่เป็นกลางถึง bready-crackery มี DMS ต่ำมากซึ่งอาจมีหรือไม่มีก็ได้ ยีสต์มีลักษณะสะอาดและเป็นกลาง โดยอาจพบ sulfur ในระดับต่ำ ฮอปจะต้องมีความโดดเด่นที่สุดในความสมดุล แต่ก็ต้องมีมอลต์ที่เห็นได้ชัดเจนด้วย","Appearance":"สีมีได้ตั้งแต่สีฟาง (straw) ไปจนถึงทองเข้ม (deep gold) แต่ส่วนใหญ่จะเป็นเหลืองสีทอง (yellow gold) โดยทั่วไปจะมีความใสที่ชัดเจนถึงใสที่สุด ความขุ่นถือเป็นข้อบกพร่อง มีฟองสีขาวมีความครีมมี่และคงทนยาวนาน","Flavor":"มีความขมของฮอประดับปานกลางถึงสูง ซึ่งมีความขมที่ชัดเจนแต่ไม่กระด้าง และเป็นส่วนที่โดดเด่นที่สุดในความสมดุล และยาวไปถึงใน aftertaste มีรสฮอปในระดับปานกลางถึงสูงมีลักษณะในทางเดียวกับกลิ่น (tropical, citrus, gooseberry, melon, grass) มีรสมอลต์ในระดับต่ำถึงต่ำปานกลาง ในแบบ grainy-sweet, bready หรือ crackery มีโปรไฟล์การหมักที่สะอาด (ester จากการหมักถือเป็นความผิดพลาด) จบรสในแบบ dry ถึง dry-off พร้อมความสะอาด นุ่มลื่นในตอนจบพร้อมความขมที่ไม่กระด้างใน aftertaste มีมอลต์ที่อาจให้ความรู้สึกหวานแต่เบียร์ไม่ควรมีรสหวานโดยตรง จบรสในแบบ dry แต่ไม่ crisp หรือกัดลิ้น ความสมดุลควรไปทางด้างความขมเสมอแต่ก็ต้องพบคาแรคเตอร์จากมอลต์อยู่บ้าง","Mouthfeel":"มีเนื้อเบียร์ระดับปานกลางถึงบางปานกลาง มีคาร์โบเนชั่นในระดับปานกลางถึงสูงปานกลาง มีความนุ่มนวลที่เด่นชัด ไม่ควรรู้สึกกระด้างหรือฝาดจนเกินไป","Style Comparison":"เมื่อเปรียบเทียบกับ German Pils จะไม่ crisp และ dry เท่าในตอนจบ โดยมีความนุ่มนวลและมอลต์มากกว่า และมีเนื้อเบียร์ที่หนากว่า เมื่อเทียบกับ Czech Premium Pale Lager จะมีความซับซ้อนของมอลต์น้อยกว่าและการหมักที่สะอาดกว่า มีความสมดุลคล้ายกับ Kölsch หรือ British Golden Ale แต่จะมีกลิ่นฮอปที่เด่นกว่า เมื่อเปรียบเทียบกับสไตล์เยอรมัน จะเน้นไปที่สายพันธุ์ฮอปจากนิวซีแลนด์ที่มีลักษณะเป็น tropical, citrusy, fruity, grassy และมักจะมีลักษณะคล้ายไวน์ขาว ไม่ควรมีความขมมากหรือมีความสมดุลที่ฮอปเทียบเท่า IPA"},"tags":"bitter, pale-color, standard-strength, bottom-fermented, hoppy, pilsner-family, lagered, craft-style, pacific","ex":"Croucher New Zealand Pilsner, Emerson’s Pilsner, Liberty Halo Pilsner, Panhead Port Road Pilsner, Sawmill Pilsner, Tuatara Mot Eureka","OG":[1.044,1.056],"FG":[1.009,1.014],"SRM":[2.0,6.0],"ABV":[4.5,5.8]}];
