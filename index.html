tional-style, wheat-beer-family, sour, fruit","ex":"3 Fonteinen Schaerbeekse Kriek, Cantillon Fou’ Foune, Cantillon Lou Pepe Framboise, Cantillon Vigneronne, Hanssens Oude Kriek, Oude Kriek Boon","OG":[1.04,1.06],"FG":[1.0,1.01],"IBU":[0.0,10.0],"SRM":[3.0,7.0],"ABV":[5.0,7.0]},{"c":"23G","n":"Gose","cat":"23","cn":"European Sour Ale","tier":"B","gen":false,"en":{"Overall Impression":"A tart, lightly-bittered historical central European wheat beer with a distinctive but restrained salt and coriander character. Very refreshing, with a dry finish, high carbonation, and bright flavors.","Aroma":"Light to moderately fruity aroma of pome fruit. Light sourness, slightly sharp. Noticeable coriander, which can have an aromatic lemony quality, and an intensity up to moderate. Light bready, doughy, yeasty character like uncooked sourdough bread. The acidity and coriander can give a bright, lively impression. The salt may be perceived as a very light, clean sea breeze character or just a general freshness, if noticeable at all.","Appearance":"Unfiltered, with a moderate to full haze. Moderate to tall white head with tight bubbles and good retention. Effervescent. Yellow color.","Flavor":"Noticeable sourness, medium-low to medium-high. Moderate bready or doughy malt flavor. Light to moderate fruity character of pome fruit, stone fruit, or lemons. Light to moderate salt character, up to the threshold of taste; the salt should be noticeable (particularly in the initial taste) but not taste overtly salty. Very low bitterness. No hop flavor. Dry, fully-attenuated finish, with acidity not hops balancing the malt. Acidity can be more noticeable in the finish, and enhance the refreshing quality of the beer. The acidity should be balanced, not forward (although historical versions could be very sour). No THP.","Mouthfeel":"High to very high carbonation. Effervescent. Medium-light to medium-full body. Salt may give a slightly tingly, mouthwatering quality and a rounder, thicker mouthfeel. Yeast and wheat can also add a little body, but shouldn’t feel heavy due to the thinning effects of acidity.","Style Comparison":"Perceived acidity is not as intense as Berliner Weisse or Gueuze. Restrained use of salt, coriander, and Lacto – should not taste overtly salty. Coriander aroma can be similar to a Witbier. Haziness similar to a Weissbier."},"th":{"Overall Impression":"เบียร์ข้าวสาลีที่เปรี้ยว tart มีความขมบางเบาที่มีประวัติศาสตร์จากยุโรปตอนกลาง มีความชัดเจนด้านคาแรคเตอร์เกลือและ coriander ที่ถูกควบคุมไว้ มีความสดชื่นสูง จบแบบ dry มีคาร์โบเนชั่นสูง และมีรสชาติที่สดใส","Aroma":"มีกลิ่น fruity แบบ pome fruit ในระดับต่ำถึงปานกลาง มีความเปรี้ยวต่ำที่ค่อนข้างคม มีกลิ่น coriander ที่รู้สึกได้ สามารถมีกลิ่นหอมของมะนาวที่ความเข้มข้นได้ถึงปานกลาง มีคาแรคเตอร์ bready, doughy, yeasty แบบอ่อนที่เหมือนขนมปัง sourdough ที่ยังไม่ได้อบ กลิ่น acidity และ coriander จะให้ความรู้สึกสว่างสดใส รสของเกลืออาจรับรู้ได้ในระดับต่ำ เหมือนลมทะเลที่สะอาด หรือเป็นเพียงความสดชื่นโดยทั่วไป หากสังเกตุพบ","Appearance":"ไม่ผ่านการกรอง มีความขุ่นปานกลางถึงมาก มีฟองสีขาวแบบปานกลางถึงสูง ฟองจะแน่นเกาะแก้วได้ดี มีชีวิตชีวา สีเหลือง","Flavor":"มีความเปรี้ยวที่สังเกตได้ ในระดับต่ำปานกลางถึงสูงปานกลางมีรสมอลต์ในแบบ bready หรือ doughy ในระดับปานกลาง มีความ fruity จาก pome fruit, stone fruit หรือ lemon ในแบบต่ำจนถึงปานกลาง มีคาแรคเตอร์ของเกลือต่ำจนถึงปานกลาง จนถึงระดับการับรู้ในรสชาติ รสจากเกลือควรสังเกตุได้ชัดเจน (โดยเฉพาะในรสชาติเริ่มต้น) แต่ไม่ควรชัดเจนเกินไป มีความขมต่ำมาก ไม่มีรสจากฮอป ไม่เหลือความหวานจากการที่ยีสต์จัดการน้ำตาลได้หมด พร้อมกับ acidity ที่มาให้ความสมดุลกับมอลต์ สามารถพบคาแรคเตอร์จาก acidity ที่ชัดเจนได้ตอนจบ และช่วยเพิ่มความสดชื่นให้กับเบียร์ แต่ acidity ควรจะสมดุลไม่ใช่โดดเด่น (แม้ว่าบางรูปแบบในอดีตอาจจะเปรี้ยวมาก) ไม่มี THP","Mouthfeel":"มีคาร์โบเนชั่นสูงถึงสูงมาก มีชีวิตชีวา มีเนื้อเบียร์บางปานกลางถึงหนาปานกลาง เกลืออาจให้รสซาบซ่า ให้ความชุ่มชื้นและกลมกล่อม เพิ่มความหนาในรสสัมผัส ยีสต์และ wheat อาจช่วยเพิ่มเนื้อเบียร์แต่ต้องไม่รู้สึกหนัก เนื่องจาก acidity จะทำให้รู้สึกบาง","Style Comparison":"การรับรู้รส acidity ไม่เข้มข้นเท่า Berliner Weisse หรือ Gueuze คุมปริมาณการใช้เกลือ, เมล็ด coriander และ Lacto ในปริมาณจำกัด – ไม่ควรให้รสเค็มมากเกินไป กลิ่นหอมจาก coriander จะคล้ายกับ Witbier แต่ความขุ่นจะคล้ายกับ Weissbier"},"tags":"standard-strength, pale-color, top-fermented, central-europe, historical-style, wheat-beer-family, sour, spice","ex":"Anderson Valley Gose, Bayerisch Bahnhof Leipziger Gose, Original Ritterguts Gose, Westbrook Gose","OG":[1.036,1.056],"FG":[1.006,1.01],"IBU":[5.0,12.0],"SRM":[3.0,4.0],"ABV":[4.2,4.8]},{"c":"24A","n":"Witbier","cat":"24","cn":"Belgian Ale","tier":"A","gen":false,"en":{"Overall Impression":"A pale, hazy Belgian wheat beer with spices accentuating the yeast character. A delicate, lightly spiced, moderate-strength ale that is a refreshing summer drink with its high carbonation, dry finish, and light hopping.","Aroma":"Moderate bready maltiness, often with light notes of honey or vanilla. Light grainy, spicy wheat aromatics. Moderate perfumy-lemony coriander, often with a complex herbal, spicy, or peppery note in the background. Moderate zesty, citrusy- orangey fruitiness. A low spicy-herbal hop aroma is optional, but typically absent. Spices should blend in with fruity, floral, and sweet aromas and should not be overly strong.","Appearance":"Very pale straw to deep yellow in color. The beer will be very cloudy from starch haze or yeast, which gives it a milky, whitish-yellow shine. Dense, white, moussy head. Head retention should be quite good.","Flavor":"Pleasant bready, grainy malt flavor, often with a honey or vanilla character. Moderate zesty, orange-citrusy fruitiness. Herbal-spicy flavors, which may include lemony coriander and other spices, are common should be subtle and balanced, not overpowering. A spicy-earthy hop flavor can be low to none, and never overshadows the spices. Hop bitterness is low to medium-low, and supports the refreshing flavors of fruit and spice. Refreshingly crisp with a dry finish, and no bitter or harsh aftertaste.","Mouthfeel":"Medium-light to medium body, often having a smoothness and light creaminess. Effervescent character from high carbonation. Refreshing, from carbonation, dryness, and lack of bitterness in finish. No harshness or astringency. Should not be overly dry and thin, nor should it be thick and heavy.","Style Comparison":"Low bitterness level with a balance similar to a Weissbier, but with spice and citrus character coming from additions more so than the yeast."},"th":{"Overall Impression":"เบียร์ข้าวสาลีสไตล์เบลเยี่ยม มีสีอ่อน ขุ่น มีกลิ่นเครื่องเทศช่วยเน้นคาแรคเตอร์จากยีสต์ เบียร์เอลที่ละเอียดอ่อนมีความแรงปานกลาง พร้อมกลิ่นเครื่องเทศบางๆ เป็นเครื่องดื่มที่มีคาร์โบเนชั่นสูงที่ช่วยเติมความสดชื่นในฤดูร้อน จบรสแบบ dry และมีกลิ่นฮอปบางๆ","Aroma":"มีกลิ่นมอลต์ปานกลางในแบบ bready มักมีกลิ่นอ่อนๆ จากน้ำผึ้งหรือวานิลลา มีกลิ่น grain อ่อนๆพร้อม spicy wheat มีกลิ่น lemon, coriander ปานกลาง ที่มักพบในแบบ herbal, spicy หรือ peppery ที่ซับซ้อนอยู่เบื้องหลัง มีกลิ่น fruity ที่รื่นรมย์ในแบบ citrusy- orangey สามารถพบกลิ่นฮอปแบบ spicy-herbal บางๆได้แต่โดยทั่วไปจะไม่พบคาแรคเตอร์จากเครื่องเทศควรผสมกันกับ fruity, floral และกลิ่นหอมหวานที่ไม่ควรเข้มข้นเกินไป","Appearance":"สีฟางแบบอ่อนมาก (very pale straw) จนถึงสีเหลืองเข้ม (deep yellow) เบียร์จะขุ่นมากจากความขุ่นของ starch หรือจากยีสต์ ที่ให้สี milky, whitish-yellow มีฟองแน่นสีขาวเหมือนมูส ฟองเกาะแก้วได้ค่อนข้างดี","Flavor":"มีรสมอลต์ในแบบ bready grainy มักมีคาแรคเตอร์จากน้ำผึ้งหรือวานิลลา มีกลิ่น fruity ที่รื่นรมย์ในแบบ citrusy-orangey ปานกลางพบรส herbal-spicy ที่รวมไปถึง lemon, coriander และเครื่องเทศอื่นๆได้ตามปกติ แต่น้องนุ่มนวล สมดุลและไม่แรงเกินไป อาจพบรสฮอปแบบ spicy-earthy ในระดับต่ำจนถึงไม่มีเลยแต่ไม่ควรชัดเจนกว่าเครื่องเทศความขมของฮอปอยู่ในระดับต่ำถึงต่ำปานกลาง ที่ต้องคอยสนับสนุนรสชาติที่สดชื่นของผลไม้และเครื่องเทศ ให้ความสดชื่น crisp จบรสแบบ dry และต้องไม่มีความขมหรือความกระด้างใน aftertaste","Mouthfeel":"เนื้อเบียร์ปานกลางถึงบางปานกลาง มักมีความเนียนนุ่มและความครีมมี่ที่บางเบา มีชีวิตชีวาด้วยคาร์โบเนชั้นที่สูง ให้ความสดชื่นจากความซ่า ความ dry และการไม่มีความขมในตอนจบ ห้ามมีความกระด้างหรือความฝาด แต่ไม่ควร dry จนบางเกินไปหรือหนาและหนักเกินไป","Style Comparison":"ระดับความขมต่ำที่มีความสมดุลคล้ายกับ Weissbier แต่มากับเครื่องเทศและคาแรคเตอร์ citrus ที่มาจากการเติมแต่งมากกว่าจากยีสต์"},"tags":"standard-strength, pale-color, top-fermented, western-europe, traditional-style, wheat-beer-family, spice","ex":"Allagash White, Blanche de Bruxelles, Celis White, Hoegaarden White, Ommegang Witte, St. Bernardus Wit","OG":[1.044,1.052],"FG":[1.008,1.012],"IBU":[8.0,20.0],"SRM":[2.0,4.0],"ABV":[4.5,5.5]},{"c":"24B","n":"Belgian Pale Ale","cat":"24","cn":"Belgian Ale","tier":"B","gen":false,"en":{"Overall Impression":"A top-fermented, all malt, average strength Belgian ale that is moderately bitter, not dry-hopped, and without strong flavors. The copper-colored beer lacks the aggressive yeast character or sourness of many Belgian beers, but has a well-balanced, malty, fruity, and often bready and toasty profile.","Aroma":"Moderate bready malt aroma, which can include toasty, biscuity, or nutty notes, possibly with a touch of light caramel or honey. Moderate to moderately high fruitiness complements the malt, and is suggestive of pear, orange, apple, or lemon, and sometimes of darker stone fruit like plums. Low to moderate spicy, herbal, or floral hop character. Low peppery, spicy phenols optional. The hop character is lower in balance than the malt and fruitiness.","Appearance":"Amber to copper in color. Clarity is very good. Creamy, rocky, white head. Well carbonated.","Flavor":"Has an initial soft, smooth, moderately malty flavor with a variable profile of toasty, biscuity, nutty, light caramel, or honey notes. Moderate to moderately high fruitiness, with a pear, orange, apple, or lemon character. Medium-low to low spicy, herbal, or floral hop character. Medium-high to medium- low bitterness, enhanced by optional low to very low peppery phenols. Dry to balanced finish, with hops becoming more pronounced in the aftertaste of those with a drier finish. Fairly well balanced overall, with no single component being high in intensity; malt and fruitiness are more forward initially with a supportive bitterness and drying character coming on late.","Mouthfeel":"Medium to medium-light body. Smooth palate. Alcohol level is restrained, and any warming character should be low if present. Medium to medium-high carbonation.","Style Comparison":"Fairly similar to pale ales from England (11C Strong Bitter), typically with a slightly different yeast character and a more varied malt profile. Less yeast character than many other Belgian beers, though."},"th":{"Overall Impression":"เบียร์เอลที่มีความแรงมาตรฐานจากเบลเยี่ยมเป็นเบียร์แบบ all-malt และใช้ยีสต์ top-ferment มีความขมปานกลาง ไม่มีการ dry-hop และไม่มีรสที่รุนแรง เบียร์สีทองแดงที่ไม่มีคาแรคเตอร์ของยีสต์ที่ก้าวร้าวหรือรสเปรี้ยวแบบเบียร์เบลเยียมชนิดอื่น แต่มีรสชาติที่สมดุลมีโปรไฟล์ malty, fruity หรือ bready และ toasty ที่พบบ่อย","Aroma":"มีกลิ่นมอลต์แบบ bready ปานกลาง อาจพบ toasty, biscuity หรือ nutty ที่อาจพบ light caramel หรือ honey มีความ fruity ปานกลางถึงสูงปานกลางช่วยเติมเต็มมอลต์ ที่มาในแบบ pear, orange, apple หรือ lemon และบางครั้งมาในแบบ darker stone fruit คล้าย plum สามารถพบฮอปในแบบ spicy, herbal หรือ floral ได้ สามารถมี phenol ในระดับต่ำในแบบ peppery, spicy ได้ ในความสมดุลคาแรคเตอร์ของฮอปจะต้องจะต้องน้อยกว่ามอลต์และความ fruity","Appearance":"สีเหลืองอำพัน (amber) ถึงทองแดง (copper) มีความใสมาก มีความครีมมี่ ฟองสีขาว มีคาร์โบเนชั่นที่ดี","Flavor":"พบรสชาติที่นุ่มเนียนในตอนเริ่ม แล้วจะพบมอลต์ที่มีรสชาติหลากหลายในแบบ toasty, biscuity, nutty, light caramel หรือ honey ในระดับปานกลาง มีรส fruity ในระดับปานกลางจนถึงสูงปานกลางในแบบ pear, orange, apple หรือ lemon มีคาแรคเตอร์ฮอปในระดับต่ำจนถึงต่ำปานกลางในแบบ spicy, herbal หรือ floral มีความขมต่ำปานกลางจนถึงสูงปานกลางที่เสริมด้วยรส peppery phenol แบบที่สามารถพบได้ มีการจบรสแบบ dry ไปจนถึงแบบสมดุล โดยฮอปจะเด่นชัดขึ้นใน aftertaste เบียร์ต้องมีความสมดุลค่อนข้างดี ไม่มีส่วนใดที่มีความเข้มข้นสูง มอลต์และความ fruity จะชัดเจนในตอนแรกโดยที่จะมีความขมและความ dry ตามมาสนับสนุนในตอนท้าย","Mouthfeel":"เนื้อเบียร์ปานกลางจนถึงบางปานกลาง รับรสอย่างนุ่มนวลระดับแอลกอฮอล์ถูกจำกัดไว้ ถ้าพบความอุ่นจากแอลกอฮอล์ต้องมีในแบบต่ำ มีคาร์โบเนชั่นปานกลางจนถึงสูงปานกลาง","Style Comparison":"คล้ายกับ Pale Ale จากอังกฤษ (11C Strong Bitter) โดยทั่วไปแล้วจะมีลักษณะของยีสต์ที่แตกต่างกันเล็กน้อยและมีรูปแบบมอลต์ที่หลากหลายกว่า มีคาแรคเตอร์จากยีสต์น้อยกว่าเบียร์เบลเยี่ยมอื่น ๆ"},"tags":"standard-strength, amber-color, top-fermented, western-europe, traditional-style, pale-ale-family, balanced","ex":"De Koninck Bolleke, De Ryck Special, Palm, Palm Dobble","OG":[1.048,1.054],"FG":[1.01,1.014],"IBU":[20.0,30.0],"SRM":[8.0,14.0],"ABV":[4.8,5.5]},{"c":"24C","n":"Bière de Garde","cat":"24","cn":"Belgian Ale","tier":"B","gen":false,"en":{"Overall Impression":"A family of smooth, fairly strong, malty, lagered artisanal French beer with a range of malt flavors appropriate for the blond, amber, or brown color. All are malty yet dry, with clean flavors. Darker versions have more malt character, while paler versions can have more hops while still remaining malt-focused beers.","Aroma":"Prominent malty richness, often with a complex, light-to-moderate intensity, toasty and bready character. Low to moderate esters. Low spicy, peppery, or herbal hops optional. Generally quite clean, although stronger versions may have a light, spicy alcohol note as it warms. Paler versions are still malty but lack richer, deeper aromatics and may have a bit more hops.","Appearance":"Blond, amber, and brown variations exist, with the color varying accordingly: golden-blonde to reddish-bronze to chestnut brown. Clarity is brilliant to fair, but some haze is allowable. Well-formed head, generally white to off-white (varying with beer color), average persistence.","Flavor":"Medium to high malty richness, often with a toasty, biscuity, toffee, or light caramel character. Low to moderate esters and alcohol flavors. Medium-low hop bitterness, giving a malty balance to the palate and aftertaste. Medium-dry to dry finish, not sweet, cloying, or heavy. Low spicy, peppery, or herbal hop flavor optional. Malt flavor, depth, richness, intensity, and complexity increases with beer color. Darker versions will have more of an initial rich malty impression than paler versions but should not seem roasted. Paler versions can have slightly greater hop flavor.","Mouthfeel":"Medium to medium-light body, often with a smooth, creamy-silky character. Moderate to high carbonation. Moderate alcohol warming, but should never be hot.","Style Comparison":"Calling this a farmhouse beer invites comparisons to Saison, which has a completely different balance – Bière de Garde is malty and smooth, while Saison is hoppy and bitter. Actually has more of a similarity in malt profile to a Bock."},"th":{"Overall Impression":"ตระกูลของเบียร์ลาเกอร์จากฝรั่งเศสที่มีความกลมกล่อม มีความแรงพอเหมาะ malty ที่มีรสชาติมอลต์ไปได้หลายแนวทาง ที่เหมาะกับเบียร์สี blond, amber หรือ brown ทั้งหมดจะ malty แต่ dry และมีรสชาติที่สะอาด แบบที่สีเข้มกว่าจะมีคาแรคเตอร์ของมอลต์มากกว่า ในขณะที่แบบที่สีอ่อนกว่าจะพบฮอปมากกว่าแม้จะเป็นเบียร์เด่นด้านมอลต์","Aroma":"มีความเข้มข้นของมอลต์ที่โดดเด่นและมักมีความซับซ้อน มีคาแรคเตอร์ toasty และ bready ที่บางจนถึงปานกลาง มี ester ในแบบต่ำถึงปานกลาง สามารถพบฮอปในแบบ spicy, peppery หรือ herbal ในระดับต่ำได้ โดยทั่วไปจะคลีน แม้ว่าแบบที่แรงกว่าอาจมีกลิ่น spicy และคาแรคเตอร์แอลกอฮอล์บางๆเมื่ออุ่นรุ่นที่สีอ่อนกว่ายังคงความ malty แต่ไม่เข้มข้น ไม่มีอโรม่าที่ลึก และอาจพบฮอปมากกว่า","Appearance":"มีทั้งแบบ blond, amber และ brown โดยสีจะแตกต่างกันไป : สีบลอนด์ทอง (golden-blonde) ถึงบรอนซ์แดง (reddish-bronze) ไปจนถึงสีน้ำตาลแก่ (chestnut brown) มีความใสชัดเจนจนถึงพอประมาณแต่ก็ยอมให้มีความขุ่นเล็กน้อยได้ ฟองขึ้นรูปได้ดี ปกติฟองจะมีสีขาวหรือขาวนวล (ขึ้นอยู่กับสีเบียร์) เกาะแก้วได้ปานกลาง","Flavor":"มีรสมอลต์ที่เข้มข้นปานกลางถึงสูง ในแบบ toasty, biscuity, toffee หรือ caramel อ่อนๆ มี ester และคาแรคเตอร์ของแอลกอฮอล์ในแบบต่ำจนถึงปานกลาง มีความขมจากฮอปต่ำปานกลางที่ช่วยทำให้มอลต์สมดุลใน aftertaste จบรสในแบบ medium-dry จนถึง dry ไม่หวาน ไม่หนาหรือหนัก สามารถพบรสฮอปในแบบ spicy, peppery, หรือ herbal ได้รสชาติมอลต์ ความลึก ความเข้มข้น และความซับซ้อนเพิ่มขึ้นตามสีของเบียร์ แบบที่สีเข้มกว่าจะมีกลิ่นมอลต์เข้มข้นในช่วงเริ่มต้นมากกว่าแบบที่สีอ่อนกว่า แต่ไม่ควรเป็นแบบคั่ว แบบที่สีอ่อนกว่า สามารถมีรสชาติของฮอปที่มากกว่าเล็กน้อย","Mouthfeel":"เนื้อเบียร์ปานกลางจนถึงบางปานกลาง ส่วนมากจะนุ่มลื่นครีมมี่ มีคาร์โบเนชั่นปานกลางจนถึงสูง พบความอุ่นจากแอลกอฮอล์ได้ปานกลาง แต่ไม่ควรร้อนแรงเกินไป","Style Comparison":"การเรียกเบียร์ตัวนี้ว่า farmhouse beer เป็นการเปรียบเทียบกับ Saison ซึ่งมีความสมดุลที่แตกต่างกันโดยสิ้นเชิง Bière de Garde คือเบียร์รสมอลต์ที่นุ่มนวล ขณะที่ Saison มีรสฮอปและขม อันที่จริงมีความคล้ายคลึงกับ Bock มากกว่าในด้านโปรไฟล์มอลต์"},"tags":"high-strength, pale-color, amber-color, any-fermentation, lagered, western-europe, traditional-style, amber-ale-family, malty","ex":"Ch’Ti Blonde, Jenlain Ambrée, La Choulette Brune, Russian River Perdition, Saint Sylvestre 3 Monts Blonde, Two Brothers Domaine Dupage","OG":[1.06,1.08],"FG":[1.008,1.016],"IBU":[18.0,28.0],"SRM":[6.0,19.0],"ABV":[6.0,8.5]},{"c":"25A","n":"Belgian Blond Ale","cat":"25","cn":"Strong Belgian Ale","tier":"B","gen":false,"en":{"Overall Impression":"A golden, moderately-strong Belgian ale with a pleasantly subtle citrusy-spicy yeast complexity, smooth malty palate, and dry, soft finish.","Aroma":"Light to moderate grainy-sweet, slightly toasty, or crackery malt. Subtle to moderate yeast profile featuring fruity- citrusy esters (like oranges or lemons), and background spicy- peppery phenols. Light earthy or spicy hop notes optional. Light perfumy alcohol and suggestions of a light malty sweetness can give a slight honey- or sugar-like character. Subtle yet complex.","Appearance":"Deep yellow to deep gold color. Generally very clear. Large, dense, and creamy white to off-white head. Good head retention with Belgian lace.","Flavor":"Similar to the aroma, with the light to moderate grainy-sweet malt flavor being perceived first. Faint, lightly caramelized sugar or honey-like sweetness on palate. Medium bitterness, with the malt slightly more prominent in the balance. Moderate to low yeast profile with orange or lemon esters, and slight spicy-peppery phenols. Can have a light perfumy character. Light hop flavor, can be spicy or earthy, complementing yeast. Finishes medium-dry to dry, smooth, and soft, with light alcohol and malt in the aftertaste.","Mouthfeel":"Medium-high to high carbonation, can give mouth-filling bubbly sensation. Medium body. Light to moderate alcohol warmth, but smooth. Can be somewhat creamy.","Style Comparison":"Similar strength and balance as a Belgian Dubbel but gold in color and without the darker malt flavors. Similar character as a Belgian Strong Golden Ale or Belgian Tripel, although a bit maltier, not as bitter, and lower in alcohol."},"th":{"Overall Impression":"เบียร์เอลจากเบลเยียม สีทองที่มีความแรงปานกลาง พร้อมด้วยความรื่นรมย์ ความซับซ้อนจาก citrusy-spicy มีมอลต์ที่นุ่มนวล dry จบรสแบบนุ่ม","Aroma":"มีความหวานแบบ grainy เล็กน้อยถึงปานกลาง มีมอลต์แบบ toasty หรือ crackery เล็กน้อย มีโปรไฟล์ของยีสต์ที่ละเอียดอ่อนถึงปานกลางประกอบด้วย fruity-citrusy esters (เช่น orange หรือ lemon) พร้อม phenol ในแบบ spicy-peppery ที่อยู่เบื้องหลัง สามารถพบฮอปในแบบ earthy หรือ spicy มีกลิ่นหอมอ่อนๆจากแอลกอฮอล์และจากมอลต์ ที่ให้คาแรคเตอร์คล้าย honey หรือ sugar อ่อนๆ ละเอียดแต่ซับซ้อน","Appearance":"สีเหลืองเข้ม (deep yellow) ถึงสีทองเข้ม (deep gold) โดยทั่วไปจะใสมาก ฟองขนาดใหญ่ หนาแน่น และครีมมี่ ฟองสีขาวจนถึงสีขาวนวล ฟองคงตัวได้ดีและมี lace แบบเบียร์เบลเยี่ยม","Flavor":"คล้ายกับอโรม่า จะพบรสมอลต์ที่มีความหวานแบบ grainy เล็กน้อยถึงปานกลางในตอนแรก พบน้ำตาลคาราเมลหรือความหวานเหมือนน้ำผึ้งที่บางเบา มีความขมปานกลาง ในความสมดุลจะมีมอลต์ที่โดดเด่นเล็กน้อย มีโปรไฟล์ของยีสต์ในระดับต่ำถึงปานกลางมี ester ในแบบ orange หรือ lemon และความ spicy-peppery อ่อนจาก phenol สามารถมีลักษณะคล้ายน้ำหอมที่บางเบา มีรสฮอปบางเบาในแบบ spicy หรือ earthy โดยต้องส่งเสริมคาแรคเตอร์ยีสต์ จบรสแบบ medium-dry จนถึง dry เรียบเนี่ยน นุ่ม พร้อมด้วยแอลกอฮอล์บางๆและมอลต์ใน aftertaste","Mouthfeel":"มีคาร์โบเนชั่นสูงปานกลางถึงสูง ให้ความรู้สึกถึงฟองที่เต็มปาก มีเนื้อเบียร์ปานกลาง พบความอุ่นจากแอลกอฮอล์เล็กน้อยถึงปานกลางแต่นุ่มนวล สามารถมีความครีมมี่ได้","Style Comparison":"มีความแรงและความสมดุลที่คล้ายคลึงกันกับ Belgian Dubbel แต่มีสีทองและไม่มีรสมอลต์สีเข้ม คาแรคเตอร์คล้าย Belgian Strong Golden Ale หรือ Belgian Tripel แม้จะมีรสมอลต์มากกว่าเล็กน้อย แต่ไม่ขมเท่า และมีแอลกอฮอล์ต่ำกว่า"},"tags":"high-strength, pale-color, top-fermented, western-europe, traditional-style, balanced","ex":"Affligem Blond, Corsendonk Blond, Grimbergen Blonde, La Trappe Blond, Leffe Blond, Val-Dieu Blonde","OG":[1.062,1.075],"FG":[1.008,1.018],"IBU":[15.0,30.0],"SRM":[4.0,6.0],"ABV":[6.0,7.5]},{"c":"25B","n":"Saison","cat":"25","cn":"Strong Belgian Ale","tier":"A","gen":false,"en":{"Overall Impression":"A family of refreshing, highly attenuated, hoppy, and fairly bitter Belgian ales with a very dry finish and high carbonation. Characterized by a fruity, spicy, sometimes phenolic fermentation profile, and the use of cereal grains and sometimes spices for complexity. Several variations in strength and color exist.","Aroma":"A pleasantly aromatic mix of fruity-spicy yeast and hops. The fruity esters are moderate to high, and often have a citrus fruit, pome fruit, or stone fruit character. Low to moderately-high spicy notes are often like black pepper, not clove. Hops are low to moderate and have a continental character (spicy, floral, earthy, or fruity). The malt is often overshadowed, but if detected is lightly grainy. Spices and herbs optional, but must not dominate. Sourness optional (see Comments). Strong versions have more aromatic intensity, and can add a light alcohol and moderate malt character. Table versions have less intensity and not have an alcohol character. Darker versions add malt character associated with darker grains.","Appearance":"Pale gold to deep amber in color, sometimes pale orange. Long-lasting, dense, rocky white to ivory head. Belgian lace. Unfiltered, so clarity is variable (poor to good) and may be hazy. Effervescent. Darker versions can be copper to dark brown. Stronger versions may be a little deeper in color.","Flavor":"A balance of fruity and spicy yeast, hoppy bitterness, and grainy malt with moderate to high bitterness, and a very dry finish. The fruity and spicy aspects are medium-low to medium-high, and hop flavor is low to medium, both with similar character as in the aroma (same descriptors apply). Malt is low to medium, with a soft, grainy palate. Very high attenuation, never with a sweet or heavy finish. Bitter, spicy aftertaste. Spices and herbs optional, but if used must be in harmony with the yeast. Sourness optional (see Comments). Darker versions will have more malt character, including flavors from the darker malts. Stronger versions will have greater malt intensity, and a light alcohol note.","Mouthfeel":"Light to medium-low body. Very high carbonation. Effervescent. Light warming alcohol optional. Sourness rare but optional (see Comments). Stronger versions can have up to medium body and be somewhat warming. Table versions have no warmth.","Style Comparison":"The pale, standard strength versions is like a more highly-attenuated, hoppy, and bitter Belgian Blond Ale with a stronger yeast character. At super strength and pale color, similar to a Belgian Tripel, but often with more of a grainy, rustic quality and sometimes with a spicier yeast character."},"th":{"Overall Impression":"หนึ่งในครอบครัวของเบียร์เอลจากเบลเยี่ยมที่สดชื่น ยีสต์จัดการน้ำตาลได้สูง มีฮอปชัด และขมพอสมควร จบรสแบบ dry มากและคาร์โบเนชั่นสูงมาก มีคาแรคเตอร์เป็นแบบ fruity, spicy, และบางครั้งจะพบ phenolic ที่มาจากการหมัก มีการใช้เมล็ดธัญพืชและเครื่องเทศในบางครั้งเพื่อความซับซ้อน มีหลายรูปแบบทั้งในด้านสีและความแรง","Aroma":"มีกลิ่นที่รื่นรมย์ที่มาจากการผสมกันของ fruity-spicy จากยีสต์และฮอป มี fruity esters ในระดับปานกลางจนถึงสูงในคาแรคเตอร์แบบ citrus fruit, pome fruit หรือ stone fruit มีความ spicy ต่ำจนถึงสูงปานกลางในแบบ black pepper แต่ไม่ใช่แบบ clove มีคาแรคเตอร์จากฮอปต่ำจนถึงปานกลางจาก continental ฮอป (spicy, floral, earthy หรือ fruity) มอลต์มักจะถูกบดบัง ถ้าสัมผัสได้จะพบในแบบ lightly grainy สามารถพบเครื่องเทศและสมุนไพรได้แต่ต้องไม่เด่น สามารถมีความเปรี้ยวได้ (ดูในความคิดเห็น) แบบที่เข้มข้นจะมีกลิ่นที่เข้มข้นกว่า และสามารถเพิ่มคาแรคเตอร์แอลกอฮอล์บางๆและมีกลิ่นของมอลต์ในระดับปานกลาง แบบที่เสิร์ฟพร้อมมื้ออาหารจะมีความเข้มข้นน้อยกว่าและไม่มีคาแรคเตอร์แอลกอฮอล์แบบที่สีเข้มกว่าจะเพิ่มคาแรคเตอร์มอลต์ที่เกี่ยวข้องกับ darker grain","Appearance":"สีทองอ่อน (pale gold) จนถึงสีเหลืองอำพันเข้ม (deep amber) บางครั้งก็เป็นสีส้มอ่อน (pale orange) ฟองเกาะแก้วได้นานหนาแน่น ฟองสีขาวถึงสีงาช้างดูคล้ายหิน มี lace ตามสไตล์เบลเยี่ยม ไม่ผ่านการกรอง มีความใสที่แปรผัน (ขุ่นหรือใส) และอาจขุ่นได้ ดูมีชีวิตชีวาแบบที่เข้มกว่าสามารถเป็นสีทองแดง (copper) ถึงน้ำตาลเข้ม (dark brown) แบบที่แรงกว่าอาจมีสีที่เข้มกว่าเล็กน้อย","Flavor":"มีความสมดุลของยีสต์แบบ fruity และ spicy ความขมจากฮอปและ grainy มอลต์ ที่มีความขมปานกลางถึงสูงและปิดท้ายแบบ dry มากๆรส fruity และ spicy อยู่ในระดับต่ำปานกลางถึงสูงปานกลาง และรสของฮอปอยู่ในระดับต่ำถึงปานกลาง ทั้งคู่มีลักษณะที่คล้ายคลึงกับในอโรม่า (ใช้คำอธิบายเดียวกัน) มีรสมอลต์ต่ำถึงปานกลาง มีเนื้อสัมผัสที่นุ่มและ grainy ยีสต์จัดการน้ำตาลได้สูงมาก ไม่ควรจบแบบหวานหรือหนักหน่วง มีความขม มีความ spicy ใน aftertaste สามารถพบเครื่องเทศ และสมุนไพรได้แต่ต้องเข้ากันกับยีสต์ สามารถมีความเปรี้ยวได้ (ดูในความคิดเห็น) แบบที่เข้มกว่าจะมีคาแรคเตอร์ของมอลต์มากกว่า รวมถึงรสชาติจากมอลต์ที่เข้มกว่า แบบที่แรงกว่าจะมีความเข้มข้นของมอลต์มากขึ้นและมีกลิ่นแอลกอฮอล์เล็กน้อย","Mouthfeel":"เนื้อเบียร์บางถึงบางปานกลาง มีคาร์โบเนชั่นสูงมาก มีชีวิตชีวา สามารถมีความอุ่นจากแอลกอฮอล์บางๆได้ แบบเปรี้ยวหายากแต่มีได้ (ดูในความคิดเห็น) แบบที่แรงกว่าสามารถมีเนื้อเบียร์ปานกลาง และพบความอุ่นได้ แบบที่เสิร์ฟพร้อมมื้ออาหารต้องไม่พบความอุ่นจากแอลกอฮอล์","Style Comparison":"แบบที่มีความแรงมาตรฐานและสีอ่อนนั้นเปรียบเสมือนเบียร์ Belgian Blond Ale ที่ยีสต์มีการจัดการน้ำตาลสูง มีฮอปและขมมากขึ้นโดยมีคาแรคเตอร์ของยีสต์ที่แรงกว่า แบบที่มีความแรงพิเศษและมีสีอ่อนจะคล้ายกับ Belgian Tripel แต่มักจะมีคาแรคเตอร์ grainy, rustic มากกว่า บางครั้งก็มีลักษณะของยีสต์ที่ spicy มากกว่า"},"tags":"standard-strength, pale-color, top-fermented, western-europe, traditional-style, bitter","ex":"Ellezelloise Saison 2000, Lefebvre Saison 1900, Saison Dupont, Saison de Pipaix, Saison Voisin, Boulevard Tank 7","OG":[1.048,1.065],"FG":[1.002,1.008],"IBU":[20.0,35.0],"SRM":[5.0,14.0],"ABV":[3.5,5.0]},{"c":"25C","n":"Belgian Golden Strong Ale","cat":"25","cn":"Strong Belgian Ale","tier":"A","gen":false,"en":{"Overall Impression":"A very pale, highly attenuated, strong Belgian ale that is more fruity and hoppy than spicy. Complex and delicate, the dry finish, light body, and high carbonation accentuate the yeast and hop character. Sparkling carbonation and effervescent, forming a rocky white head.","Aroma":"A complex bouquet of fruity esters, herbal hops, and peppery alcohol over a nearly neutral malt base. The esters are moderate to high, often pome fruit, especially pear. Hops are herbal, floral, or spicy, low to moderate. Alcohol and phenols often have a peppery or perfumy quality, low to moderate. Alcohol perception should be soft, not hot or solventy. Nearly neutral malt, possibly slightly grainy-sweet.","Appearance":"Pale yellow to gold in color. Good clarity. Effervescent. Massive, long-lasting, rocky, white head resulting in characteristic Belgian lace on the glass as it fades.","Flavor":"Flavor profile similar to aroma (same descriptors and intensities apply) for esters, hops, malt, phenols, and alcohol. The pear-like esters, peppery alcohol, herbal hops, and soft malt flavors carry through the palate into the long, dry finish and aftertaste. Medium to high bitterness, accentuated by the dry finish and high carbonation, lasts into the aftertaste.","Mouthfeel":"Very highly carbonated. Effervescent. Light to medium body, lighter than the substantial gravity would suggest. Carbonation accentuates the perception of lightness. Smooth but noticeable alcohol warmth, not hot or solventy.","Style Comparison":"Often confused with Belgian Tripel, but is usually paler, lighter-bodied, crisper, and drier. Tends to use yeast that favor ester development (particularly pome fruit) over spiciness in the balance, and has more of a late hop character."},"th":{"Overall Impression":"เบียร์เอลจากเบลเยี่ยมที่แรง ยีสต์จัดการน้ำตาลได้ดี มีสีอ่อนมากๆ มีความ fruity และ hoppy มากกว่าความ spicy มีความซับซ้อนและละเอียดอ่อน มีความ dry เนื้อเบียร์บาง มีคาร์โบเนชั่นสูงที่ช่วยเน้นคาแรคเตอร์จากยีสต์และฮอป มีความซ่าแบบมีชีวิตชีวา มีฟองแน่นคล้ายหิน","Aroma":"เหมือนช่อดอกไม้ที่ซับซ้อนของ fruity ester, herbal hop และแอลกอฮอล์ในแบบ peppery บนเนื้อเบียร์ที่มีมอลต์แบบเป็นกลาง มี ester ปานกลางจนถึงสูงในแบบ pome fruit โดยเฉพาะ pear มีฮอปต่ำจนถึงปานกลางในแบบ herbal, floral หรือ spicy มักพบแอลกอฮอล์หรือ phenol ในแบบ peppery หรือ perfumy สัมผัสถึงแอลกอฮอล์ต้องต่ำจนถึงปานกลางและควรจะนุ่มนวล ไม่ใช่ร้อนแรงแบบ solventy มีมอลต์ในแบบเกือบเป็นกลาง อาจออกไปทาง grainy-sweet เล็กน้อย","Appearance":"มีสีเหลืองอ่อน (pale yellow) ถึงสีทอง (gold) มีความใสมีชีวิตชีวา ฟองสีขาวขนาดใหญ่ เกาะติดแก้วทนนาน คล้ายหิน และจะเห็น Belgian lace เมื่อเบียร์ยุบตัวหรือถูกดื่ม","Flavor":"มีโปรไฟล์รสชาติคล้ายกับอโรมา (ใช้คำอธิบายและความเข้มข้นเดียวกัน) สำหรับ ester ฮอป มอลต์ phenol และแอลกอฮอล์ มี ester ในแบบ pear, peppery alcohol, herbal จากฮอป มีรสมอลต์ที่นุ่มนวลคลอเคลียจนถึงในตอนจบในแบบ dry ที่อยู่ใน aftertaste มีความขมปานกลางจนถึงสูงที่ถูกชูให้เด่นจากความ dry ตอนจบและคาร์โบเนชั่นที่สูง ที่อยู่ไปจนถึง aftertaste","Mouthfeel":"มีคาร์โบเนชั่นสูงมาก มีชีวิตชีวา เนื้อเบียร์บางถึงปานกลางบางกว่า gravity พอสมควร มีคาร์โบเนชั่นที่ช่วยทำให้เบียร์รู้สึกบาง มีความนุ่มลื่นที่อาจพบความอุ่นจากแอลกอฮอล์ได้ แต่ต้องไม่ร้อนแรงหรือออกมาในแบบ solventy","Style Comparison":"มักสับสนกับ Belgian Tripel แต่จะมีสีที่อ่อนกว่าเนื้อเบียร์บางกว่า crisp และ dry กว่า มีแนวโน้มที่จะใช้ยีสต์ที่สนับสนุนการสร้าง ester (โดยเฉพาะคาแรคเตอร์ pome fruit) มากกว่า spicy ในความสมดุล มีคาแรคเตอร์จาก late-hop มากกว่า"},"tags":"very-high-strength, pale-color, top-fermented, western-europe, traditional-style, bitter","ex":"Brigand, Delirium Tremens, Duvel, Judas, Lucifer, Russian River Damnation","OG":[1.07,1.095],"FG":[1.005,1.016],"IBU":[22.0,35.0],"SRM":[3.0,6.0],"ABV":[7.5,10.5]},{"c":"26A","n":"Belgian Single","cat":"26","cn":"Monastic Ale","tier":"B","gen":false,"en":{"Overall Impression":"A blond, bitter, hoppy table beer that is very dry and highly carbonated. The aggressive fruity-spicy Belgian yeast character and high bitterness is forward in the balance, with a soft, supportive grainy-sweet malt palate, and a spicy-floral hop profile.","Aroma":"Medium-low to medium-high Belgian yeast character, showing a fruity-spicy character along with medium-low to medium spicy or floral hops, rarely enhanced by light herbal or citrusy spice additions. Low to medium-low malt backdrop, with bready, crackery, grainy, or light honey notes. Fruit expression can vary widely (apple, pear, grapefruit, lemon, orange, peach, apricot). Phenols are typically like black pepper or clove. Bubblegum inappropriate.","Appearance":"Pale yellow to medium gold color. Generally good clarity, with a moderate-sized, persistent, billowy white head with characteristic lacing.","Flavor":"Initial malty flavor is light and has a honeyed biscuit, bready, or cracker character. Grainy but soft malt palate, and a crisp, dry, hoppy-bitter finish. Moderate spicy or floral hop flavor on the palate. Moderate esters similar in character to aroma. Light to moderate spicy phenols as found in the aroma. Medium to high bitterness, accentuated by dryness. The yeast and hop character lasts into the aftertaste.","Mouthfeel":"Medium-light to medium body. Smooth. Medium-high to high carbonation, can be somewhat prickly. Should not have noticeable alcohol warmth.","Style Comparison":"Like a top-fermented Belgian interpretation of a German Pils – pale, hoppy, and well- attenuated, but with a strong Belgian yeast character. Has less sweetness, higher attenuation, less character malt, and is more hop-centered than a Belgian Pale Ale. More like a much smaller, more highly-hopped Belgian Tripel (with its bitterness and dryness) than a smaller Belgian Blond Ale."},"th":{"Overall Impression":"เบียร์สี Blonde รสขม มีฮอปชัด เบียร์สำหรับโต๊ะอาหารที่มีความ dry และคาร์โบเนชั่นสูงมาก มีคาแรคเตอร์ fruity- spicy ที่รุนแรงจากยีสต์สายพันธุ์เบลเยี่ยม มีความขมที่สูงที่ส่งไปถึงในความสมดุล ตามมาด้วยมอลต์ที่ให้ความนุ่ม หอมหวานแบบ grainy-sweet และฮอปในแบบ spicy-floral","Aroma":"มีคาแรคเตอร์จากยีสต์สายพันธุ์เบลเยี่ยมในระดับต่ำปานกลางจนถึงสูงปานกลาง ในแบบ fruity-spicy ที่มาพร้อมกับกลิ่นฮอปในระดับปานกลางจนถึงต่ำปานกลางในแบบ spicy หรือ floral แต่ไม่ค่อยพบฮอปในแบบ herbal หรือ citrusy spice มีมอลต์ในระดับต่ำปานกลางจนถึงต่ำซ่อนอยู่ด้านหลังในแบบ bready, crackery, grainy หรือ light honey คาแรคเตอร์ของผลไม้มีได้หลายแบบ (apple, pear, grapefruit, lemon, orange, peach, apricot) มี phenol ในแบบ black pepper หรือ clove คาแรคเตอร์ bubblegum ไม่เหมาะสม","Appearance":"สีเหลืองอ่อน (pale yellow) ถึงสีทองปานกลาง (medium gold) มักมีความชัดเจน มีฟองสีขาวขนาดปานกลางแบบลอนคลื่น เกาะแก้วได้ดี มี lacing","Flavor":"เริ่มต้นด้วยรสมอลต์ที่บางเบาในแบบ honey biscuit, bready หรือ cracker มีลักษณะ grainy ในแบบนุ่ม crisp, dry, hoppy-bitter ในตอนจบ มีรส spicy หรือ floral จากฮอปในระดับปานกลาง มี ester ปานกลางในทางเดียวกับอโรม่า มี spicy phenol บางจนถึงปานกลางในแบบที่พบในอโรม่า มีความขมปานกลางจนถึงสูง ที่ชัดเจนเพราะความ dry คาแรคเตอร์ของยีสต์และฮอปลากยาวไปจนถึง aftertaste","Mouthfeel":"เนื้อเบียร์ปานกลางถึงบางปานกลาง นุ่มนวล คาร์โบเนชั่นสูงปานกลางถึงสูง อาจพบความทิ่มแทง ไม่ควรพบคาแรคเตอร์ความอุ่นจากแอลกอฮอล์","Style Comparison":"เป็นการตีความของชาวเบลเยี่ยมต่อ German Pils ที่ใช้ top-ferment ยีสต์ - มีสีอ่อน ฮอปเด่น ยีสต์จัดการน้ำตาลดี แต่มีคาแรคเตอร์จากยีสต์สายพันธุ์เบลเยี่ยมที่เข้มข้น มีความหวานน้อย ยีสต์จัดการน้ำตาลได้สูง มีคาแรคเตอร์จากมอลต์ต่ำ โดยมีฮอปเป็นศูนย์กลางมากกว่า Belgian Pale Ale เหมือน Belgian Tripel (ที่มีความขมและความ dry) ที่อ่อนกว่ามีฮอปหนักกว่า มากกว่าจะเหมือน Belgian Blond Ale ที่อ่อนกว่า"},"tags":"standard-strength, pale-color, top-fermented, western-europe, craft-style, bitter, hoppy","ex":"Chimay Gold, La Trappe Puur, Russian River Redemption, St. Bernardus Extra 4, Westmalle Extra, Westvleteren Blond","OG":[1.044,1.054],"FG":[1.004,1.01],"IBU":[25.0,45.0],"SRM":[3.0,5.0],"ABV":[4.8,6.0]},{"c":"26B","n":"Belgian Dubbel","cat":"26","cn":"Monastic Ale","tier":"A","gen":false,"en":{"Overall Impression":"A deep reddish-copper, moderately strong, malty, complex Belgian ale with rich malty flavors, dark or dried fruit esters, and light alcohol blended together in a malty presentation that still finishes fairly dry.","Aroma":"Moderate to moderately strong, rich malty aroma, with hints of chocolate, caramelized sugar, or toast. Never roasted or burnt. Moderate fruity esters, often dark or dried fruit, especially raisins and plums, sometimes pome fruit or banana. Low to moderate spicy, peppery phenols. Hops typically absent, but can have a low spicy, herbal, or floral character. The malt is strongest in the balance, with esters and spice adding complexity. Low soft, perfumy alcohol optional.","Appearance":"Dark amber to copper in color, with an attractive reddish depth of color. Generally clear. Large, dense, and long-lasting creamy off-white head.","Flavor":"Flavor profile similar to aroma (same descriptors and intensities apply) for malt, esters, phenols, alcohol, and hops. Medium-low to medium bitterness, but malt is always most prominent in the balance. The esters and phenols add complexity and interest to the malt, alcohol not typically tasted. Malty-rich, sometimes sweet flavor, that finishes moderately dry with a malty aftertaste accented by yeast esters and phenols.","Mouthfeel":"Smooth, medium to medium-full body. Medium- high carbonation, which can influence the perception of body. Low alcohol warmth optional, never hot or solventy.","Style Comparison":"Perhaps similar to a Dunkles Bock but with a Belgian yeast and sugar character. Similar in strength and balance to a Belgian Blond Ale, but with a richer malt and ester profile. Less strong and intense than a Belgian Dark Strong Ale."},"th":{"Overall Impression":"เบียร์เอลจากเบลเยี่ยมที่มีสีทองแดงถึงแดงเข้มมีความแรงปานกลาง มีความ malty และซับซ้อน มีรสมอลต์เข้มข้น มี ester ในแบบ dark หรือ dried fruit มีคาแรคเตอร์แอลกอฮอล์อ่อนๆที่ผสมไปกับคาแรคเตอร์มอลต์ แต่จบในแบบค่อนข้าง dry","Aroma":"มีกลิ่นมอลต์เข้มข้นในระดับปานกลางถึงแรงปานกลาง พร้อมด้วย chocolate caramelized sugar หรือ toast แต่ห้ามคั่วหรือไหม้ มี fruity esters ปานกลาง มักเป็น dark หรือ dried fruit โดยเฉพาะ raisin และ plum บางครั้ง pome fruit หรือ banana; มีความ spicy จาก peppery phenol ในระดับน้อยถึงปานกลาง โดยทั่วไปแล้วจะไม่พบฮอปแต่อาจพบในแบบ spicy, herbal หรือ floral ในระดับต่ำถึงปานกลาง ในความสมดุลกลิ่นมอลต์จะโดดเด่นที่สุดแล้วตามมาด้วย ester และเครื่องเทศ เพื่อเพิ่มความซับซ้อน สามารถพบ perfumy alcohol แบบอ่อนๆได้","Appearance":"อำพันเข้ม (dark amber) ถึงทองแดง (copper) มีความลึกของสีแดงที่น่าดึงดูดใจ โดยทั่วไปจะใส มีฟองสีขาวนวลขนาดใหญ่หนาแน่น เกาะแก้วได้นาน","Flavor":"โปรไฟล์รสชาติคล้ายกับอโรม่า (ใช้คำอธิบายและความเข้มข้นเดียวกัน) สำหรับ malt, ester, phenol, แอลกอฮอล์ และฮอป มีความขมต่ำปานกลางถึงปานกลาง ในความสมดุลมอลต์จะโดดเด่นที่สุด มี esters และ phenols เพื่อเพิ่มความน่าสนใจและความซับซ้อนของมอลต์ มักจะไม่พบรสแอลกอฮอล์ มีมอลต์ที่เข้มข้น บางครั้งจะรู้สึกหวาน จบรสแบบ dry ปานกลางที่มีมอลต์ใน aftertaste ที่ถูกทำให้เด่นออกมาด้วย ester และ phenol","Mouthfeel":"มีความนุ่มลื่น มีเนื้อเบียร์ในแบบปานกลางถึงหนาปานกลาง มีคาร์โบเนชั่นสูงปานกลาง ที่ส่งผลต่อการรับรู้ในเนื้อเบียร์ สามารถพบคาแรคเตอร์แอลกอฮอล์ตอนอุ่นได้เล็กน้อย แต่ต้องไม่ร้อนแรงหรือออกมาในแบบ solventy","Style Comparison":"อาจคล้ายกับ Dunkles Bock แต่ใช้ Belgian yeast และมีคาแรคเตอร์จากน้ำตาล มีความแรงและความสมดุลคล้ายกับ Belgian Blond Ale แต่มีมอลต์และ ester เข้มข้นกว่า แรงและเข้มข้นน้อยกว่า Belgian Dark Strong Ale"},"tags":"high-strength, amber-color, top-fermented, western-europe, traditional-style, malty","ex":"Chimay Red, Corsendonk Bruin, La Trappe Dubbel, Rochefort 6, St. Bernardus Pater 6, Westmalle Dubbel","OG":[1.062,1.075],"FG":[1.008,1.018],"IBU":[15.0,25.0],"SRM":[10.0,17.0],"ABV":[6.0,7.6]},{"c":"26C","n":"Belgian Tripel","cat":"26","cn":"Monastic Ale","tier":"A","gen":false,"en":{"Overall Impression":"A strong, pale, somewhat spicy Belgian ale with a pleasant rounded malt flavor, firm bitterness, and dry finish. Quite aromatic, with spicy, fruity, and light alcohol notes combining with the supportive clean malt character to produce a surprisingly drinkable beverage considering the high alcohol content.","Aroma":"Complex but seamless bouquet of moderate to significant spiciness, moderate fruity esters, low alcohol, low hops, and light malt. Generous spicy, peppery, sometimes clove-like phenols. Esters often reminiscent of citrus fruit, like oranges or lemons, but may sometimes have a slight ripe banana character. A low yet distinctive spicy, floral, sometimes perfumy hop character is optional. Alcohols are soft, spicy, and low in intensity. The malt character is light, with a soft, slightly grainy-sweet, or slightly honey-like impression.","Appearance":"Deep yellow to pale amber in color. Good clarity. Effervescent. Long-lasting, creamy, rocky, white head resulting in characteristic Belgian lace on the glass as it fades.","Flavor":"Flavor profile similar to aroma (same descriptors apply) for malt, esters, phenols, alcohol, and hops. Esters low to moderate, phenols low to moderate, hops low to moderate, alcohol low, all well combined in a coherent presentation. Medium to high bitterness, accentuated by a dry finish. Moderate bitterness in the aftertaste with substantial spicy- fruity yeast character. Should not be sweet.","Mouthfeel":"Medium-light to medium body, although lighter than the substantial gravity would suggest. Highly carbonated. The alcohol content is deceptive, and has little to no obvious warming sensation. Effervescent. Should not be heavy.","Style Comparison":"May resemble a Belgian Golden Strong Ale but slightly darker and a bit fuller-bodied, with more emphasis on phenols and less on esters, and fewer late hops. Should not seem like a blond Barleywine."},"th":{"Overall Impression":"เบียร์เอลจากเบลเยี่ยม ที่แรง สีอ่อน มีความ spicy และรสมอลต์ที่กลมกล่อม มีความขมที่แน่น และจบด้วยความ dry ค่อนข้างมีกลิ่นหอมแบบ spicy, fruity และแอลกอฮอล์อ่อนๆที่ผสมกับกลิ่นมอลต์แบบสะอาดรวมกันเป็นเครื่องดื่มที่ดื่มง่ายและมีแอลกอฮอล์สูง","Aroma":"เหมือนช่อดอกไม้ที่มีความซับซ้อนแบบไร้รอยต่อ มีความ spicy ปานกลางถึงสูง มี fruity ester ปานกลาง แอลกอฮอล์ต่ำ ฮอปต่ำ และมอลต์บางๆ มี phenol ในแบบ spicy, peppery ที่บางทีคล้าย clove มี ester ที่ทำให้คิดถึง citrus fruit เช่น orange หรือ lemon แต่บางครั้งก็อาจพบคาแรคเตอร์ของกล้วยตอนสุกเล็กน้อย สามารถมีฮอปในแบบ spicy, floral หรือบางครั้ง perfumy ได้ แอลกอฮอล์มีความนุ่มนวล spicy มีความเข้มข้นต่ำ มีคาแรคเตอร์ของมอลต์เบาบาง นุ่มนวล มีความหวานแบบ grainy-sweet เล็กน้อยหรืออาจคล้ายน้ำผึ้งเล็กน้อย","Appearance":"มีสีเหลืองเข้ม (deep yellow) ถึงอำพันอ่อน (pale amber) มีความใส มีชีวิตชีวา ฟองสีขาว แบบครีมมี่หรือคล้ายหิน เกาะแก้วยาวนาน มี Belgian lace","Flavor":"โปรไฟล์รสชาติคล้ายกับอโรม่า (ใช้คำอธิบายเดียวกัน) สำหรับมอลต์ ester phenol แอลกอฮอล์ และฮอป มี ester, phenol และฮอปในระดับต่ำถึงปานกลาง มีแอลกอฮอล์ต่ำ ที่รวมกันและนำเสนอออกมาอย่างดี มีความขมปานกลางถึงสูง ที่ชัดเจนออกมาเพราะความ dry ตอนจบ มีความขมปานกลางใน aftertaste พร้อมด้วยความ spicy-fruity จากยีสต์ไม่ควรหวาน","Mouthfeel":"เนื้อเบียร์บางปานกลางถึงปานกลาง บางกว่า gravity พอสมควร มีคาร์โบเนชั่นที่สูง มีปริมาณแอลกอฮอล์ที่กะไม่ได้ แทบไม่มีความรู้สึกอุ่นจากแอลกอฮอล์หรือรู้สึกได้เลย มีชีวิตชีวา ไม่ควรหนัก","Style Comparison":"อาจคล้ายกับ Golden Strong Ale ของเบลเยี่ยมแต่สีเข้มกว่าและเนื้อเบียร์หนากว่าเล็กน้อย เน้นคาแรคเตอร์จาก phenol มากกว่าและ ester น้อยกว่า ใส่ฮอปช่วง late-hop น้อยลง ไม่ควรดูเหมือน Blond Barleywine"},"tags":"high-strength, pale-color, top-fermented, western-europe, traditional-style, bitter","ex":"Chimay Tripel, La Rulles Tripel, La Trappe Tripel, St. Bernardus Tripel, Val-Dieu Triple, Westmalle Tripel","OG":[1.075,1.085],"FG":[1.008,1.014],"IBU":[20.0,40.0],"SRM":[4.5,7.0],"ABV":[7.5,9.5]},{"c":"26D","n":"Belgian Dark Strong Ale","cat":"26","cn":"Monastic Ale","tier":"A","gen":false,"en":{"Overall Impression":"A dark, complex, very strong Belgian ale with a delicious blend of malt richness, dark fruit flavors, and spicy notes. Complex, rich, smooth, and dangerous.","Aroma":"A complex and fairly intense mix of rich maltiness and deep fruit, accentuated by spicy phenols and alcohol. The malt character is moderately-high to high and has a deep, bready-toasty base with dark caramel notes, but no impression of dark or roasted malt. Esters are strong to moderately low, and reminiscent of raisins, plums, dried cherries, figs, dates, or prunes. Spicy phenols like black pepper or vanilla, not clove, may be present as a low to moderate background character. A soft, spicy, perfumy, or rose-like alcohol is low to moderate, but never hot or solvent-like. Hops are usually not noticeable, but if present can add a light spicy, floral, or herbal character.","Appearance":"Deep amber to deep coppery-brown in color (dark in the style name implies more deeply colored than golden, not black). Huge, dense, moussy, persistent cream- to light tan-colored head. Usually clear.","Flavor":"Rich and complex maltiness, but not heavy in the finish. The flavor character is similar to the aroma (same malt, ester, phenol, alcohol, and hop comments apply here as well). Moderately malty-rich on the palate, which can have a sweet impression if bitterness is low. Usually moderately dry to dry finish, although may be up to moderately sweet. Medium-low to moderate bitterness; alcohol provides some of the balance to the malt. Generally malty-rich balance, but can be fairly even with bitterness. The complex and varied flavors should blend smoothly and harmoniously, and often benefit from age. The finish should not be heavy or syrupy.","Mouthfeel":"High carbonation but not sharp. Smooth but noticeable alcohol warmth. Body can range from medium-light to medium-full and creamy. Most are medium-bodied.","Style Comparison":"Like a larger Belgian Dubbel, with a fuller body and increased malt richness. Not as bitter or hoppy as a Belgian Tripel, but of similar strength."},"th":{"Overall Impression":"เบียร์เอลจากเบลเยี่ยม ที่สีเข้ม ซับซ้อน และแรงมาก ผสมผสานด้วยมอลต์ที่เข้มข้น รส dark fruit และกลิ่น spicy มีความซับซ้อน เข้มข้น เนียนนุ่ม และอันตราย","Aroma":"มีกลิ่นที่เข้มขนและซับซ้อนจากการผสมกันมอลต์ที่เข้มข้นและ deep fruit ที่ถูกดันออกมาโดย spicy phenol และแอลกอฮอล์ มีคาแรคเตอร์ของมอลต์สูงปานกลางจนถึงสูงในแบบ bready-toasty และ dark caramel แต่ต้องไม่พบ dark หรือ roasted มอลต์ มี ester ต่ำปานกลางจนถึงแรงในแบบ raisin, plum, dried cherry, fig, date หรือ prune มี spicy phenol ในแบบ black pepper หรือ vanilla แต่ห้ามมี clove ที่แสดงออกบนพื้นหลัง มีคาแรคเตอร์ของแอลกอฮอล์ต่ำจนถึงปานกลางในแบบ soft, spicy, perfumy หรือคล้าย rose แต่ห้ามร้อนแรงหรือเป็นแบบคล้าย solvent ปกติจะไม่พบคาแรคเตอร์ฮอป ถ้ามีควรเป็น spicy, floral หรือ herbal แบบบางๆ","Appearance":"สีอำพันเข้ม (deep amber) ถึงน้ำตาลอมทองแดงเข้ม (deep coppery-brown) (ชื่อ dark ในสไตล์สื่อถึงสีที่เข้มกว่าสีทอง แต่ไม่ใช่สีดำ) มีฟองขนาดใหญ่ หนาแน่น เหมือนมูส เกาะแก้วยาวนาน สีครีมถึงสีน้ำตาลอ่อน ปกติมักจะใส","Flavor":"มีรสมอลต์ที่เข้มข้นและซับซ้อน แต่ไม่หนักในตอนท้ายคาแรคเตอร์ของรสชาติจะคล้ายกับอโรม่า (ความคิดเห็นเกี่ยวกับ malt, ester, phenol, alcohol และ hop แบบเดียวกัน) รสมอลต์เข้มข้นปานกลางในการรับรู้ ที่สามารถให้ความรู้สึกหวานได้หากความขมต่ำ มักจะ dry ปานกลางถึง dry ในตอนจบ แม้ว่าอาจมีความหวานถึงปานกลาง มีความขมแบบต่ำปานกลางจนถึงปานกลาง มีแอลกอฮอล์ให้ความสมดุลแก่มอลต์โดยทั่วไปจะมีความสมดุลจากมอลต์ที่เข้มข้นแต่ก็สามารถมีความขมเสมอกันได้ ความซับซ้อนของรสชาติควรผสมกันอย่างลงตัว การบ่มจะทำให้เบียร์ดีขึ้น ตอนจบไม่ควรหนักหรือเหมือน syrupy","Mouthfeel":"คาร์โบเนชั่นสูงแต่ไม่คม นุ่มนวลแต่สัมผัสถึงแอลกอฮอล์ตอนอุ่นได้ เนื้อเบียร์เป็นได้ตั้งแต่บางปานกลางจนถึงหนาปานกลางและมีความครีมมี่ แต่ส่วนใหญ่จะเนื้อเบียร์ปานกลาง","Style Comparison":"คล้ายกับ Belgian Dubbel ที่หนักกว่า เนื้อเบียร์แน่นกว่า มีมอลต์ที่เข้มข้นมากขึ้น ไม่ขมหรือ hoppy แบบ Belgian Tripel แต่มีความแรงใกล้เคียงกัน"},"tags":"very-high-strength, amber-color, top-fermented, western-europe, traditional-style, malty","ex":"Achel Extra Bruin, Boulevard The Sixth Glass, Chimay Blue, Rochefort 10, St. Bernardus Abt 12, Westvleteren 12","OG":[1.075,1.11],"FG":[1.01,1.024],"IBU":[20.0,35.0],"SRM":[12.0,22.0],"ABV":[8.0,12.0]},{"c":"27:Kellerbier","n":"Kellerbier","cat":"27","cn":"Historical Beer","tier":"C","gen":true,"en":{"Overall Impression":"An unfiltered, unpasteurized, fully- attenuated German lager traditionally served from lagering vessels. May be a little richer, more robust, and rustic than the base styles. A fresh beer without fermentation defects associated with young, green (unfinished) beer.","Aroma":"Reflects base style. May have an added bready, yeasty character from the yeast. Clean. Pale versions can have a more robust hop character. Dark versions can have a richer malt profile.","Appearance":"Reflects base style. Can be somewhat hazy or cloudy, but never murky. Likely a little darker in appearance than the base style.","Flavor":"Reflects base style. May have an added bready, yeasty character from the yeast. Pale versions can have a more robust hop character. Dark versions can have a richer malt profile, but should never be roasty. May be slightly more bitter than the base style, and be a little heavier in the finish. Fully fermented with a clean fermentation profile; should not have eggy, buttery, apple-like, or similar flaws.","Mouthfeel":"Reflects base style. May have a bit more body and a creamier texture than the base style. Carbonation typical of the base style, but may be lower.","Style Comparison":"Richer or more robust than the base style, possibly with a bit more body and mouthfeel. Can be slightly cloudier than base beer."},"th":{"Overall Impression":"เบียร์ลาเกอร์เยอรมัน แบบ unfiltered, unpasteurized ยีสต์จัดการน้ำตาลได้เต็มที่ แบบดั้งเดิมจะเสริฟจาก lagering vessel ดูเข้มข้นและรสแรงกว่าปกติเล็กน้อย มีความ rustic มากกว่าสไตล์ต้นแบบ เป็นเบียร์สดที่ไม่มีข้อผิดพลาดจากการหมัก ในแบบที่ยังไม่สมบูรณ์ (young, green beer)","Aroma":"แสดงออกถึงสไตล์พื้นฐาน อาจพบคาแรคเตอร์ bready, yeasty ที่มากขึ้นจากยีสต์ มีความคลีน แบบที่สีอ่อนจะมีฮอปชัดเจนกว่าแบบสีเข้มซึ่งจะมีมอลต์ในแบบเข้มข้น","Appearance":"แสดงออกถึงสไตล์พื้นฐาน สามารถมีความขุ่นได้แต่ไม่ควรออกแบบขมุกขมัว คล้ายกับสไตล์พื้นฐานที่มีสีเข้มกว่าเล็กน้อย","Flavor":"แสดงออกถึงสไตล์พื้นฐาน อาจพบคาแรคเตอร์ bready, yeasty ที่มากขึ้นจากยีสต์ แบบที่สีอ่อนจะมีฮอปชัดเจนกว่าแบบสีเข้มซึ่งจะมีมอลต์ในแบบเข้มข้น แต่ไม่ควรเป็นแบบคั่ว อาจจะมีความขมมากกว่าสไตล์พื้นฐานเล็กน้อย และจบแบบแรงมากขึ้นเล็กน้อย ผ่านการหมักที่สมบูรณ์ มีโปรไฟล์การหมักที่สะอาด ไม่ควรมีคาแรคเตอร์ที่ผิดพลาดแบบ eggy, buttery, apple หรือความผิดพลาดที่คล้ายกัน","Mouthfeel":"แสดงออกถึงสไตล์พื้นฐาน อาจมีเนื้อเบียร์และความครีมมี่ที่มากกว่าสไตล์พื้นฐาน มีคาร์โบเนชั่นระดับเดียวกับสไตล์พื้นฐานหรืออาจจะต่ำกว่า","Style Comparison":"เข้มข้นและหนักแน่นกว่าสไตล์พื้นฐาน อาจมีเนื้อเบียร์และ mouthfeel มากกว่า สามารถขุ่นกว่าสไตล์พื้นฐานได้เล็กน้อย"},"tags":"standard-strength, bottom-fermented, central-europe, traditional-style, balanced","ex":"Märzen – Faust Kräusen Naturtrüb, Mahrs Bräu aU Ungespundet Kellerbier; Dunkel – Engel Kellerbier Dunkel, Paulaner Ur-Dunkel Naturtrüb; Helles – ABK Kellerbier Naturtrüb, Löwenbräu 1747 Original; Pils – Giesinger Feines Pilschen, Ketterer Zwickel-Pils"},{"c":"27:Kentucky Common","n":"Kentucky Common","cat":"27","cn":"Historical Beer","tier":"C","gen":false,"en":{"Overall Impression":"A clean, dry, refreshing, slightly malty dark beer with high carbonation. Mild-tasting, with light toast and caramel flavors, served very fresh as a sessionable saloon beer.","Aroma":"Low to medium grainy, corn-like, or sweet maltiness with a low toast, biscuity-grainy, bready, or caramel malt accent. Medium to moderately-low hop aroma, usually floral or spicy in character. Clean fermentation profile, with possible faint berry ester. Low levels of DMS optional. No sourness. Malt-forward in the balance.","Appearance":"Amber-orange to brown in color. Typically clear, but may have some light haze. Foam stand may not be long lasting, and is usually white to beige in color.","Flavor":"Moderate grainy-sweet maltiness with low to medium-low caramel, toffee, bready, or biscuity notes. Generally light palate flavors typical of adjunct beers; a low grainy, corn-like sweetness is common. Medium to low floral or spicy hop flavor. Medium to low bitterness, no coarse or harsh aftertaste. May exhibit light fruitiness. Balance in the finish is towards the malt, possibly with a lightly flinty or minerally- sulfate flavor. The finish is fairly dry. No sourness.","Mouthfeel":"Medium to medium-light body with a relatively soft mouthfeel. Highly carbonated. Can have a creamy texture.","Style Comparison":"Like a darker-colored Cream Ale emphasizing corn, but with some light character malt flavor. Malt flavors and balance are probably closest to modern adjunct-driven International Amber or Dark Lagers, Irish Red Ales, or Belgian Pale Ales."},"th":{"Overall Impression":"เบียร์ดำที่สะอาด dry ให้ความสดชื่น มีมอลต์เล็กน้อยและมีคาร์โบเนชั่นสูง มีรสชาตินุ่มนวล ด้วยคาแรคเตอร์ toast และ caramel อ่อนๆ เสิร์ฟแบบสดๆ เป็น session beer","Aroma":"มีมอลต์แบบ grainy แบบคล้ายข้าวโพดหรือหอมหวานในระดับต่ำถึงปานกลาง ที่มาพร้อม toast, biscuity-grainy, bready หรือ caramel มีฮอปอโรม่าในระดับต่ำปานกลางถึงปานกลาง ในแบบ floral หรือ spicy มีโปรไฟล์การหมักที่สะอาด อาจพบ ester แบบ berry บางๆ สามารถมี DMS ในระดับต่ำได้ ห้ามมีความเปรี้ยว มีมอลต์นำในความสมดุล","Appearance":"สีเหลืองอำพัน (amber-orange) ถึงน้ำตาล (brown) ปกติจะใสแต่อาจพบความขุ่นอยู่บ้าง ฟองอาจไม่ติดทนนาน ฟองมักจะเป็นสีขาวถึงสีเบจ","Flavor":"รสมอลต์แบบ grainy ที่มีรสหวาน มากับ caramel, toffee, bready หรือ biscuity ในระดับต่ำจนถึงต่ำปานกลาง ปกติจะมีรสแบบอ่อนในแบบ adjunct เบียร์ อาจพบรส grainy และข้าวโพดแบบต่ำได้ทั้วไป มีฮอปต่ำจนถึงปานกลางในแบบ floral หรือ spicy มีความขมต่ำถึงปานกลางไม่มีรสค้างในคอหรือความกระด้างใน aftertaste อาจพบความ fruity ในแบบต่ำ มีมอลต์นำในความสมดุล แต่อาจพบรส flinty หรือ minerally จาก sulfate ได้ จบแบบคอนข้าง dry ห้ามมีความเปรี้ยว","Mouthfeel":"เนื้อเบียร์บางปานกลางถึงปานกลาง ให้สัมผัสที่ค่อนข้างนุ่มมีคาร์โบเนชั่นสูง สามารถมีรสสัมผัสแบบครีมมี่ได้","Style Comparison":"เหมือน Cream Ale ที่มีสีเข้มที่เน้นข้าวโพด มีรสมอลต์แบบบางเบา รสชาติและความสมดุลของมอลต์น่าจะใกล้เคียงที่สุดกับเบียร์ที่มี adjunct เป็นตัวขับเคลื่อนอย่าง International Amber หรือ Dark Lagers, Irish Red Ales หรือ Belgian Pale Ales"},"tags":"standard-strength, amber-color, top-fermented, north-america, historical-style, balanced","ex":"Apocalypse Brew Works 1912","OG":[1.044,1.055],"FG":[1.01,1.018],"IBU":[15.0,30.0],"SRM":[11.0,20.0],"ABV":[4.0,5.5]},{"c":"27:Lichtenhainer","n":"Lichtenhainer","cat":"27","cn":"Historical Beer","tier":"C","gen":false,"en":{"Overall Impression":"A sour, smoked, lower-gravity historical central European wheat beer. Complex yet refreshing character due to high attenuation and carbonation, along with low bitterness and moderate sourness.","Aroma":"Moderately strong fresh smoky aroma. Light hints of sourness. Medium-low fruity esters, possibly apples or lemons. Moderate bready, grainy malt. The smoke character is stronger than the bready notes, and the smoke has a ‘dry’ character, like the remnants of an old fire, not a ‘greasy’ smoke. No hops.","Appearance":"Tall off-white head, rocky and persistent. Yellow to gold color. Fair clarity, may be somewhat hazy.","Flavor":"Moderately strong fruity flavor, possibly lemons or apples. Moderate intensity, clean lactic tartness without any funkiness. Similar dry wood smoke character as aroma, medium strength. Dry finish, with acidity and smoke in the aftertaste. Low bitterness; acidity is providing the balance, not hops. Fresh, clean palate, and slightly puckery aftertaste. The wheat character is on the low side; the smoke and acidity are more prominent in the balance. The tart, lemony, or green apple flavor is strongest in the finish, with smoke a close second. No hops.","Mouthfeel":"Tingly acidity. High carbonation. Medium to medium-light body.","Style Comparison":"In the same general historical lower- alcohol central European wheat beer family as Gose, Grodziskie, and Berliner Weisse; has elements of all of them but with its own unique balance – sour and smoke is not found in any of the other styles. Not as acidic as Berliner Weisse, probably more like a smoked Gose without coriander and salt, or a Grodziskie with Gose-like acidity."},"th":{"Overall Impression":"เบียร์ข้าวสาลีที่เปรี้ยว มีคาแรคเตอร์รมควัน มี gravity ต่ำมีประวัติศาสตร์จากใจกลางยุโรป มีความซับซ้อนและสดชื่นจากคาร์โบเนชั่นที่สูงและจากยีสต์ที่จัดการน้ำตาลได้สูง คู่ไปกับความขมต่ำและความเปรี้ยวปานกลาง","Aroma":"มีกลิ่นรมควันที่สดใหม่ปานกลาง มีความเปรี้ยวอ่อนๆ มี fruity ester แบบต่ำปานกลางในแบบ apple หรือ lemon มีมอลต์ในแบบ bready, grainy ปานกลาง คาแรคเตอร์รมควันแรงกว่ากลิ่น bready และในความรมควันยังให้ความรู้สึก dry เหมือนกับกลิ่นหลงเหลือจากกองไฟเก่า ไม่ใช่ควันแบบ ‘greasy’ ไม่มีฮอป","Appearance":"ฟองหนาคล้ายหิน สีขาวนวล เกาะแก้วได้ดี มีสีเหลือง (yellow) จนถึงสีทอง (gold) ใสปานกลาง อาจมีความขุ่นบ้าง","Flavor":"มีรส fruity เข้มแรงปานกลาง อาจเป็น lemon หรือ apple มีความเข้มข้นปานกลาง มีความ tartness ที่สะอาดจาก lactic ที่คลีนโดยไม่มีความ funky มีอโรม่าคล้ายควันจากไม้แห้งที่แรงปานกลาง จบรสในแบบ dry ที่มีความ acidity และ smoke ใน aftertaste มีความขมต่ำ acidity ช่วยทำให้สมดุลไม่ใช่จากฮอป สดใหม่ สะอาด และฝาดเล็กน้อยใน aftertaste คาแรคเตอร์จากข้าวสาลีจะอยู่ในแบบต่ำ โดยที่การรมควันและความเป็นกรดจะโดดเด่นในความสมดุล รส tart, lemony หรือ green apple จะแรงที่สุดในตอนจบรสโดยมีควันอยู่ข้างๆ ไม่มีฮอป","Mouthfeel":"ความ acidity ที่ซาบซ่า มีคาร์โบเนชั่นสูง เนื้อเบียร์บางปานกลางถึงปานกลาง","Style Comparison":"เบียร์ข้าวสาลีจากยุโรปกลางที่มีแอลกอฮอล์ต่ำ มีประวัติศาสตร์และอยู่ในตระกูลเดียวกับ Gose, Grodziskie และ Berliner Weisse มีองค์ประกอบจากทั้งสามสไตล์ แต่มีความสมดุลที่เป็นเอกลักษณ์คาแรคเตอร์ความเปรี้ยวและควันไม่พบในรูปแบบอื่นใด ไม่มี acidity เท่า Berliner Weisse คล้ายกับ Gose ในแบบรมควันที่ไม่มี coriander และ salt หรือเป็น Grodziskie แบบที่มีความเป็นกรดคล้าย Gose"},"tags":"standard-strength, pale-color, top-fermented, central-europe, historical-style, wheat-beer-family, sour, smoke","ex":"Live Oak Lichtenhainer, Wöllnitzer Weissbier","OG":[1.032,1.04],"FG":[1.004,1.008],"IBU":[5.0,12.0],"SRM":[3.0,6.0],"ABV":[3.5,4.7]},{"c":"27:London Brown Ale","n":"London Brown Ale","cat":"27","cn":"Historical Beer","tier":"C","gen":false,"en":{"Overall Impression":"A luscious, sweet, malty, low-alcohol dark brown ale, with caramel and toffee malt complexity and a sweet-tasting finish.","Aroma":"Moderate malty-sweet aroma, often with a rich, caramel, or toffee-like character. Low to medium fruity esters, often dark fruit like plums. Very low earthy or floral hop aroma optional.","Appearance":"Medium to very dark brown color, but can be almost black. Nearly opaque, although should be relatively clear if visible. Low to moderate off-white to tan head.","Flavor":"Deep, caramel or toffee sweet malty flavor on the palate, lasting into the finish, often with hints of biscuit and coffee. Some dark fruit esters can be present; relatively clean fermentation profile for an English ale. Low bitterness. Low earthy or floral hop flavor optional, but rare. Moderately-low roasty or bitter black malt flavor optional. Moderately sweet finish with a smooth, malty aftertaste. May have a sugary-sweet flavor.","Mouthfeel":"Medium body, but the residual sweetness may give a heavier impression. Medium-low to medium carbonation. Quite creamy and smooth in texture, particularly for its gravity.","Style Comparison":"May seem somewhat like a less roasty version of a Sweet Stout (and lower-gravity, at least for US sweet stout examples) or a sweet version of a Dark Mild."},"th":{"Overall Impression":"เบียร์ Dark Brown Ale ที่สดใส มีความหวานมีมอลต์ชัด มีแอลกอฮอล์ต่ำ พร้อมความซับซ้อนจากมอลต์ในแบบ caramel และ toffee และจบด้วยรสหวาน","Aroma":"มีกลิ่นหวานจากมอลต์แบบปานกลาง มักมีกลิ่นเข้มข้นในแบบ caramel หรือคล้าย toffee มี fruity ester ในระดับต่ำถึงปานกลาง มักออกเป็น dark fruit เช่น plum สามารถพบฮอปในระดับต่ำมากในแบบ earthy หรือ floral ได้","Appearance":"สีน้ำตาลปานกลาง (medium brown) ถึงเข้มมาก (very dark brown) เกือบเป็นสีดำได้ เกือบจะทึบแสง แม้ว่าควรจะค่อนข้างใสหากมองเห็นได้ มีฟองต่ำถึงปานกลาง สีขาวนวลถึงถึงสีน้ำตาลอ่อน","Flavor":"มีรสหวานจากมอลต์ในแบบ caramel หรือ toffee ที่ลึกและติดทนถึงตอนจบ มักมีกลิ่นของ biscuit และ coffee บาทีอาจพบ ester ในแบบ dark fruit มีโปรไฟล์การหมักที่สะอาดในแบบ English ale มีความขมต่ำ สามารถพบฮอปในแบบ earthy หรือ floral ได้ แต่หายาก สามารถพบรสขมจากมอลต์คั่วหรือ black มอลต์แบบปานกลางได้ จบรสแบบหวานปานกลาง พร้อมความนุ่มนวล และมีมอลต์ใน aftertaste อาจพบรสหวานแบบน้ำตาลได้","Mouthfeel":"เนื้อเบียร์ปานกลาง แต่ความหวานที่หลงเหลืออยู่อาจทำให้รู้สึกหนา มีคาร์โบเนชั้นต่ำปานกลางถึงปานกลาง เนื้อเบียร์ครีมมี่และเนียนนุ่มเพราะ gravity","Style Comparison":"อาจดูเหมือน Sweet Stout ในแบบคั่วต่ำ (และ gravity ต่ำกว่า อย่างน้อยสำหรับตัวอย่าง sweet stout ของสหรัฐฯ) หรือแบบที่หวานของ Dark Mild"},"tags":"session-strength, dark-color, top-fermented, british-isles, historical-style, brown-ale-family, malty, sweet","ex":"Harveys Bloomsbury Brown Ale, Mann's Brown Ale","OG":[1.033,1.038],"FG":[1.012,1.015],"IBU":[15.0,20.0],"SRM":[22.0,35.0],"ABV":[2.8,3.6]},{"c":"27:Piwo Grodziskie","n":"Piwo Grodziskie","cat":"27","cn":"Historical Beer","tier":"C","gen":false,"en":{"Overall Impression":"A low-gravity, bitter, oak-smoked historical central European wheat beer with a clean fermentation profile and no sourness. Highly carbonated, dry, crisp, and refreshing.","Aroma":"Low to moderate oak wood smoke is the most prominent aroma component, but can be subtle and hard to detect. A low spicy, herbal, or floral hop aroma is typically present, and should be lower than or equal to the smoke in intensity. Hints of grainy wheat are also detected in the best examples. The aroma is otherwise clean, although light pome fruit esters (especially ripe red apple or pear) are welcome. No acidity. Light sulfur optional.","Appearance":"Pale yellow to gold in color with excellent clarity. A tall, billowy, white, tightly-knit head with excellent retention is distinctive. Murkiness is a fault.","Flavor":"Moderately-low to medium oak smoke flavor up front which carries into the finish; the smoke can be stronger in flavor than in aroma. The smoke character is gentle, should not be acrid, and can lend an impression of sweetness. A moderate to strong bitterness is readily evident which lingers through the finish. The overall balance is toward bitterness. Low but perceptible spicy, herbal, or floral hop flavor. Low grainy wheat character in the background. Light pome fruit esters (red apple or pear) may be present. Dry, crisp finish. No sourness.","Mouthfeel":"Light in body, with a crisp and dry finish. Carbonation is quite high and can add a slight carbonic bite or prickly sensation. No alcohol warmth.","Style Comparison":"Similar in strength to a Berliner Weisse, but never sour and much more bitter. Has a smoked character but less intense than in a Rauchbier. Lower gravity than a Lichtenhainer, but more bitter and not sour. More bitter than a Gose, but no salt and spices."},"th":{"Overall Impression":"เบียร์ข้าวสาลีในประวัติศาสตร์จากยุโรปตอนกลาง ที่มี gravity ต่ำ มีความขม มีการรมควันด้วยไม้โอ๊ค มีโปรไฟล์การหมักที่สะอาดและไม่เปรี้ยว มีคาร์โบเนชั่นที่สูง dry crisp และให้ความสดชื่น","Aroma":"มีกลิ่นควันจากไม้โอ๊คในระดับต่ำถึงปานกลาง เป็นกลิ่นที่โดดเด่นที่สุด แต่บางทีอาจมาอย่างนุ่มนวลและรับรู้ได้ยาก มีฮอปในระดับต่ำในแบบ spicy, herbal หรือ floral แต่จะมีอโรม่าน้อยกว่าหรือเท่ากับกลิ่นรมควัน ในเบียร์ตัวอย่างที่ดีอาจพบกลิ่น grainy wheat เล็กน้อย มีกลิ่นหอมที่สะอาด ถ้าพบ ester ในแบบ pome fruit อ่อนๆ (โดยเฉพาะ ripe red apple หรือ pear) จะเป็นสิ่งดี ไม่มี acidity สามารถพบ sulfur แบบบางๆได้","Appearance":"สีเหลืองอ่อน (pale yellow) ถึงสีทอง (gold) ที่มีความชัดเจนดีเยี่ยม ฟองสูงเป็นลูกคลื่น สีขาว แน่นกระชับ เกาะแก้วได้ดีเป็นพิเศษ ความขุ่นคือความผิดพลาด","Flavor":"มีรสควันจากไม้โอ๊คในระดับต่ำปานกลางถึงปานกลาง ที่พบเป็นอย่างแรกและอยู่ยาวไปจนจบ คาแรคเตอร์ควันในรสชาติอาจแรงกว่าในอโรม่า ลักษณะการรมควันนั้นอ่อนโยน ไม่ควรรุนแรง และให้ความรู้สึกถึงความหวาน มีความขมปานกลางจนถึงสูงที่เด่นชัดและอยู่ไปจนจบ ความสมดุลมาจากความขม มีรสฮอปต่ำในแบบ spicy, herbal หรือ floral มีคาแรคเตอร์ grainy wheat เป็นพื้นหลัง มี ester ต่ำในแบบ pome fruit (red apple หรือ pear) มีความ dry และ crisp ในตอนจบ ไม่มีรสเปรี้ยว","Mouthfeel":"เนื้อเบียร์บางพร้อมความ crisp และ dry ในตอนจบ มีคาร์โบเนชั่นค่อนข้างสูงและสามารถพบการกัดลิ้นจากความซ่าได้ ไม่พบความอุ่นจากแอลกอฮอล์","Style Comparison":"มีความแรงคล้ายกับ Berliner Weisse แต่ไม่เปรี้ยวและมีความขมกว่ามาก มีลักษณะแบบรมควันแต่เข้มข้นน้อยกว่าใน Rauchbier มี gravity น้อยกว่า Lichtenhainer แต่ขมกว่าและไม่เปรี้ยว ขมกว่า Gose แต่ไม่มีเกลือและเครื่องเทศ"},"tags":"session-strength, pale-color, top-fermented, central-europe, historical-style, wheat-beer-family, bitter, smoke","ex":"Live Oak Grodziskie","OG":[1.028,1.032],"FG":[1.006,1.012],"IBU":[20.0,35.0],"SRM":[3.0,6.0],"ABV":[2.5,3.3]},{"c":"27:Pre-Prohibition Lager","n":"Pre-Prohibition Lager","cat":"27","cn":"Historical Beer","tier":"C","gen":false,"en":{"Overall Impression":"A bitter and hoppy pale American adjunct lager, often with a robust, corny flavor profile, although more crisp and neutral-tasting versions exist.","Aroma":"Low to medium grainy maltiness. Low to moderate corn-like sweetness optional. Medium to moderately-high rustic, floral, herbal, or spicy hop aroma, not modern fruity or citrusy varieties. Clean fermentation profile. May show some yeast character, similar to modern American Lager. Low DMS acceptable.","Appearance":"Yellow to deep gold color. Substantial, long lasting white head. Bright clarity.","Flavor":"Medium to medium-high maltiness with a grainy flavor. Optional corn-like roundness and impression of sweetness. Substantial hop bitterness stands up to the malt and lingers through the dry, soft to crisp finish. Medium to high rustic, floral, herbal, or spicy hop flavor. Medium to high bitterness that is clean not coarse. No harsh aftertaste. Generally neutral fermentation profile, but some yeast character similar to American Lager is allowable.","Mouthfeel":"Medium to medium-full body with a moderately rich and creamy mouthfeel. Smooth and well-lagered. Medium to high carbonation levels.","Style Comparison":"Similar balance and bitterness as modern Czech Premium Pale Lagers, but exhibiting native American grains and hops from the era before US Prohibition. More robust, bitter, and flavorful than modern pale American Lagers, often with higher alcohol."},"th":{"Overall Impression":"เบียร์ Pale American adjunct lager ที่ขมและ hoppy มักมีรสชาติ corny ที่เข้มข้น แต่ก็มีในรูปแบบที่มีรสกลางมากกว่าและ crisp มากกว่า","Aroma":"มีมอลต์ในแบบ grainy ในระดับต่ำถึงปานกลาง สามารถมีความหวานคล้ายข้าวโพดในระดับต่ำถึงปานกลางได้ มีกลิ่นฮอปปานกลางจนถึงสูงปานกลางในแบบ rustic, floral, herbal หรือ spicy โดยไม่ใช้ฮอปสมัยใหม่ในแบบ fruity หรือ citrusy มีโปรไฟล์การหมักที่สะอาด อาจพบคาแรคเตอร์จากยีสต์ได้ คล้าย American Lager สมัยใหม่ ยอมรับการมี DMS ได้","Appearance":"สีเหลือง (yellow) ถึงสีทองเข้ม (deep gold) มีฟองสีขาวชัดเจน เกาะติดแก้วยาวนาน ใสสว่าง","Flavor":"มีรสมอลต์ในระดับปานกลางถึงสูงปานกลางในแบบ grainy สามารถเลือกให้มีความกลมกล่อมของข้าวโพดหรือความหวานที่ชัดเจนได้มีความขมจากฮอปที่เด่นชัดที่คู่ไปกับมอลต์และอยู่ไปถึงตอนจบที่ dry หรือนุ่มจนถึง crisp มีฮอปปานกลางจนถึงสูงในแบบ rustic, floral, herbal หรือ spicy มีความขมปานกลางจนถึงสูงที่ไม่ค้างในคอหรือกระด้างใน aftertaste ทั่วไปจะมีโปรไฟล์การหมักเป็นกลาง แต่อนุญาตให้ใช้ยีสต์บางตัวที่ให้คาแรคเตอร์คล้ายกับ American Lager ได้","Mouthfeel":"เนื้อเบียร์ปานกลางถึงหนาปานกลาง ให้ความรู้สึกในปากที่เข้มข้นและกลมกล่อม นุ่มนวลและผ่านการ lagering ที่ดี มีคาร์โบเนชั่นในระดับปานกลางถึงสูง","Style Comparison":"ความสมดุลและความขมคล้าย Czech Premium Pale Lager สมัยใหม่ แต่มีการแสดง American grains และ hop จากยุคก่อน Prohibition แรงกว่า มีความขมมากกว่า และเต็มรสชาติมากกว่า pale American Lager สมัยใหม่ และมักจะมีแอลกอฮอล์สูงกว่า"},"tags":"standard-strength, pale-color, bottom-fermented, lagered, north-america, historical-style, pilsner-family, bitter, hoppy","ex":"Capital Supper Club, Coors Batch 19, Little Harpeth Chicken Scratch, Schell Deer Brand, Urban Chestnut Forest Park Pilsner","OG":[1.044,1.06],"FG":[1.01,1.015],"IBU":[25.0,40.0],"SRM":[3.0,6.0],"ABV":[4.5,6.0]},{"c":"27:Pre-Prohibition Porter","n":"Pre-Prohibition Porter","cat":"27","cn":"Historical Beer","tier":"C","gen":false,"en":{"Overall Impression":"A historical American adaptation of English Porter by German immigrants using American ingredients, including adjuncts.","Aroma":"Grainy malt aroma with low levels of chocolate, caramel, biscuit, burnt sugar, licorice, or slightly burnt malt. Low hop aroma. Low to moderate low levels of corn or DMS acceptable. No to very low esters. Diacetyl low to none. Clean lager fermentation profile acceptable.","Appearance":"Medium to dark brown, though some examples can be nearly black in color, with ruby or mahogany highlights. Relatively clear. Light to medium tan head, persistent.","Flavor":"Moderate grainy-bready malt flavor, with low levels of chocolate, burnt malt, burnt sugar, caramel, biscuit, licorice, molasses, or toast. Corn or DMS flavor acceptable at low to moderate levels. Medium-low to moderate bitterness. Low floral, spicy, or earthy hop flavor optional. Balance is typically even between malt and hops, with a moderately dry finish. Clean fermentation profile, but faint esters are allowable.","Mouthfeel":"Medium-light to medium body. Moderate carbonation. Low to moderate creaminess. May have a slight dark malt astringency.","Style Comparison":"Smoother and less hoppy-bitter than a (modern) American Porter. Less caramelly and smoother than an English Porter with more of an adjunct or lager character. More bitterness and roast than an International Dark Lager."},"th":{"Overall Impression":"เป็นการดัดแปลง English Porter ในประวัติศาสตร์ของอเมริกาโดยผู้ผลิตเบียร์ชาวเยอรมันผู้อพยพ โดยใช้ส่วนผสมของอเมริกา รวมถึง adjunct","Aroma":"มีกลิ่น grainy จากมอลต์พร้อม chocolate, caramel, biscuit, burnt sugar, licorice หรือมอลต์ที่ให้คาแรคเตอร์ความไหม้เล็กน้อยในระดับต่ำ มีกลิ่นฮอปในระดับต่ำ ยอมรับ corn และ DMS ได้ในระดับต่ำถึงปานกลางได้ มี ester ในระดับต่ำที่สุดจนถึงไม่มี มี diacetyl ต่ำจนถึงไม่มีมีโปรไฟล์การหมัก lager ที่สะอาดยอมรับได้","Appearance":"สีน้ำตาลปานกลาง (medium brown) ถึงสีน้ำตาลเข้ม (dark brown) แม้ว่าบางตัวอย่างอาจมีสีเกือบดำ โดยมีไฮไลท์เป็นทับทิมหรือมะฮอกกานี ค่อนข้างใส ฟองสีน้ำตาลอ่อนถึงปานกลาง เกาะแก้วได้ดี","Flavor":"รสมอลต์ในแบบ grainy-bready ปานกลางพร้อม chocolate, burnt malt, burnt sugar, caramel, biscuit, licorice, molasses หรือ toast ในระดับต่ำ ยอมรับ corn และ DMS ในระดับต่ำถึงปานกลางได้ มีความขมต่ำปานกลางถึงปานกลาง สามารถมีฮอปแบบ floral, spicy หรือ earthy ในระดับต่ำได้ ความสมดุลจะเท่ากันระหว่างมอลต์และฮอป มีความ dry ปานกลางในตอนจบ มีโปรไฟล์การหมักที่สะอาด แต่ยอมรับการมี ester อ่อนๆได้","Mouthfeel":"เนื้อเบียร์บางปานกลางถึงปานกลาง มีคาร์โบเนชั่นปานกลาง มีความครีมมี่ต่ำถึงปานกลาง อาจมีความฝาดจาก dark มอลต์เล็กน้อย","Style Comparison":"นุ่มนวลและมีรสขมน้อยกว่า American Porter (สมัยใหม่) คาราเมลน้อยกว่าและนุ่มนวลกว่า English Porter ที่มี adjunct หรือคาแรคเตอร์แบบลาเกอร์มากกว่า ความขมและการคั่วมากกว่า International Dark Lager"},"tags":"standard-strength, dark-color, any-fermentation, north-america, historical-style, porter-family, malty","ex":"Stegmaier Porter, Yuengling Porter","OG":[1.046,1.06],"FG":[1.01,1.016],"IBU":[20.0,30.0],"SRM":[20.0,30.0],"ABV":[4.5,6.0]},{"c":"27:Roggenbier","n":"Roggenbier","cat":"27","cn":"Historical Beer","tier":"C","gen":false,"en":{"Overall Impression":"A Dunkles Weissbier made with rye rather than wheat, but with a greater body and light finishing hops. The rye gives a bready and peppery flavor, a creamy body, and a dry, grainy finish that blends with the distinctive banana-and-clove weizen yeast character.","Aroma":"Light to moderate spicy rye aroma (like black pepper) intermingled with light to moderate weizen yeast aromatics (spicy clove and fruity esters, either banana or citrus). Light spicy, floral, or herbal hops are acceptable.","Appearance":"Light coppery-orange to very dark reddish or coppery-brown color. Large creamy off-white to tan head, quite dense and persistent, often thick and rocky. Cloudy, hazy appearance.","Flavor":"Grainy, moderately-low to moderately-strong spicy- peppery rye flavor, often having a hearty flavor reminiscent of rye or pumpernickel bread. Medium to medium-low bitterness allows an initial malt sweetness (sometimes with a bit of caramel) to be tasted before yeast and peppery rye character takes over. Low to moderate banana-and-clove weizen yeast character, although the balance can vary. Medium-dry, grainy finish with a lightly bitter (from rye) aftertaste. Low to moderate spicy, herbal, or floral hop flavor acceptable, and can persist into aftertaste.","Mouthfeel":"Medium to medium-full body. High carbonation. Moderately creamy.","Style Comparison":"A more distinctive variant of a Dunkles Weissbier using malted rye instead of malted wheat. American Rye Beers will not have the weizen yeast character, and likely more hops."},"th":{"Overall Impression":"Dunkles Weissbier ที่ทำจาก rye แทนที่จะเป็น wheat แต่มีเนื้อเบียร์มากกว่าและฮอปตอนจบที่เบากว่า rye ให้รส bready และ peppery พร้อมเนื้อเบียร์ที่ครีมมี่ และ dry จบแบบ grainy ที่ผสมไปกับคาแรคเตอร์ banana-and-clove จาก Weizen ยีสต์","Aroma":"มีกลิ่น spicy rye แบบต่ำถึงปานกลาง (คล้าย black pepper) ผสมกับอโรม่าจากยีสต์ Weizen เล็กน้อยถึงปานกลาง (spicy clove และ fruity ester ไม่ว่าจะเป็น banana หรือ citrus) สามารถมีฮอปต่ำในแบบ spicy, floral หรือ herbal ได้","Appearance":"สีทองแดงอ่อน (light coppery-orange) จนถึงสีแดงเข้มมาก (dark reddish) หรือสีน้ำตาลอมทองแดง (coppery-brown) ฟองสีขาวนวลถึงสีน้ำตาลอ่อน ขนาดใหญ่ ค่อนข้างหนาแน่นเกาะแก้วได้ดี และมักจะหนา ดูคล้ายหิน มีความขุ่น","Flavor":"รสมอลต์แบบ Grainy มีรส spicy-peppery rye ในแบบต่ำปานกลางจนถึงสูงปานกลาง มักพบรสที่ชวนให้นึกถึงขนมปังข้าวไรย์หรือขนมปังฟักทอง มีความขมปานกลางถึงต่ำปานกลางที่อาจพบรสหวานจากมอลต์ในตอนเริ่มต้น (บางครั้งจะมีคาราเมลเล็กน้อย) ก่อนที่จะถูกรสจากยีสต์และ peppery rye เข้ามาแทนที่ มีคาแรคเตอร์ banana-and-clove จากยีสต์ Weizen ในระดับต่ำจนถึงปานกลาง แม้ว่าความสมดุลอาจแตกต่างกันไปมีความ dry ปานกลาง จบแบบ grainy พร้อมความขม (จาก Rye) ใน aftertaste มีรสฮอปต่ำจนถึงปานกลางในแบบ spicy, herbal หรือ floral ที่สามารถอยู่จนถึง aftertaste","Mouthfeel":"เนื้อเบียร์ปานกลางจนถึงหนาปานกลาง มีคาร์โบเนชั่นสูง มีความครีมมี่ปานกลาง","Style Comparison":"ความแตกต่างที่โดดเด่นกว่าของ Dunkles Weissbier โดยใช้ rye มอลต์แทน wheat มอลต์ ; American Rye Beers จะไม่มีลักษณะของยีสต์ weizen และมีแนวโน้มว่าจะมีฮอปมากกว่า"},"tags":"standard-strength, amber-color, top-fermented, central-europe, historical-style, wheat-beer-family","ex":"Thurn und Taxis Roggen","OG":[1.046,1.056],"FG":[1.01,1.014],"IBU":[10.0,20.0],"SRM":[14.0,19.0],"ABV":[4.5,6.0]},{"c":"27:Sahti","n":"Sahti","cat":"27","cn":"Historical Beer","tier":"C","gen":false,"en":{"Overall Impression":"A sweet, heavy, strong traditional Finnish farmhouse beer usually with rye and juniper, and a banana-clove yeast character.","Aroma":"Sweet, worty malt impression. Grainy malt, caramel, and rye in background. Light alcohol aroma. High banana esters with moderate to moderately-high clove-like phenols. May have a low to moderate woody juniper character. Not sour. No hops.","Appearance":"Yellow to dark brown color; most are medium to dark amber. Generally quite cloudy and turbid. Little head, due to low carbonation.","Flavor":"Fairly sweet and often worty raw malt flavor, grainy with some caramel and toffee. Low bitterness. No hop flavor. Light woody or piney character acceptable. Moderate to strong banana and fruitiness, moderate clove and spiciness. Fairly sweet finish. Fresh, not sour.","Mouthfeel":"Thick, viscous, and heavy with protein (no boil means no hot break). Nearly still to medium-low carbonation, similar to English cask ale. Warming from the alcohol level and young age, but this is often masked by sweetness.","Style Comparison":"Passing resemblance to Weizenbocks, but sweet and thick with a rye and juniper character."},"th":{"Overall Impression":"เบียร์ farmhouse แบบดั้งเดิมของฟินแลนด์ที่มีรสหวาน หนัก และแรง มักประกอบด้วย rye และ juniper และมีคาแรคเตอร์ banana-clove จากยีสต์","Aroma":"กลิ่นมอลต์ที่หอมหวานในแบบ wort พร้อม Grainy, caramel และ rye ในพื้นหลัง กลิ่นแอลกอฮอล์อ่อนๆ มี ester แบบ banana สูง มี phenol ที่คล้าย clove สูงปานกลาง อาจพบคาแรคเตอร์ woody juniper แบบต่ำจนถึงปานกลาง ไม่เปรี้ยว ไม่มีฮอป","Appearance":"สีเหลือง (yellow) ถึงสีน้ำตาลเข้ม (dark brown) ส่วนใหญ่เป็นอำพันปานกลางถึงเข้ม (medium to dark amber) โดยทั่วไปจะขุ่นและหมองหม่น มีฟองน้อย เพราะคาร์โบเนชั่นต่ำ","Flavor":"มีรสมอลต์ที่หวาน ปกติจะเป็นแบบมอลต์ดิบคล้าย wort มีรส grain พร้อมกับ caramel และ toffee มีความขมต่ำ ไม่มีรสฮอป สามารถพบคาแรคเตอร์ woody หรือ piney แบบต่ำได้ มีรส banana และ fruity ปานกลางถึงสูง มีรส clove และ spicy ปานกลาง จบแบบหวาน สดใหม่ไม่เปรี้ยว","Mouthfeel":"ข้น หนืด และหนักด้วยโปรตีน (ไม่ต้มแปลว่าไม่ผ่าน hot break) แทบไม่มีคาร์โบเนชั่นหรือมีในระดับต่ำปานกลาง คล้ายกับ English cask ale สามารถพบความอุ่นจากระดับแอลกอฮอล์และความใหม่ (young) ของเบียร์ แต่สิ่งนี้มักถูกปิดบังด้วยความหวาน","Style Comparison":"มีความคล้ายคลึงกับ Weizenbock แต่มีความหวานและหนาจากคาแรคเตอร์ของ rye และ juniper"},"tags":"high-strength, amber-color, top-fermented, central-europe, historical-style, spice","ex":"","OG":[1.076,1.12],"FG":[1.016,1.038],"IBU":[0.0,15.0],"SRM":[4.0,22.0],"ABV":[7.0,11.0]},{"c":"28A","n":"Brett Beer","cat":"28","cn":"American Wild Ale","tier":"B","gen":false,"en":{"Overall Impression":"Most often drier and fruitier than the base style suggests. Fruity or funky notes range from low to high, depending on the age of the beer and strains of Brett used. May possess a light non-lactic acidity.","Aroma":"Variable by base style. Young Brett beers will possess more fruity notes (e.g., tropical fruit, stone fruit, or citrus), but this is variable by the strains of Brett used. Older Brett beers may start to develop a little funk (e.g., barnyard, wet hay, or slightly earthy or smoky notes), but this character should not dominate.","Appearance":"Variable by base style. Clarity can be variable, and depends on the base style and ingredients used. Some haze is not necessarily a fault.","Flavor":"Variable by base style. Brett character may range from minimal to aggressive. Can be quite fruity (e.g., tropical fruit, berry, stone fruit, citrus), or have some smoky, earthy, or barnyard character. Should not be unpleasantly funky, such as Band-Aid, fetid, nail polish remover, cheese, etc. Always fruitier when young, gaining more funk with age. May not be lactic. Malt flavors are often less pronounced than in the base style, leaving a beer most often dry and crisp due to high attenuation by the Brett.","Mouthfeel":"Variable by base style. Generally has a light body, lighter than what might be expected from the base style but an overly thin body is a fault. Generally moderate to high carbonation. Head retention is variable, but often less than the base style.","Style Comparison":"Compared to the same beer style without Brett, a Brett Beer will be drier, more highly attenuated, fruitier, lighter in body, and slightly funkier as it ages. Less sourness and depth than Belgian ‘wild’ ales."},"th":{"Overall Impression":"ส่วนใหญ่มักจะ dry และมีความ fruity มากกว่า base style กลิ่น fruity หรือกลิ่น funky มีตั้งแต่ในระดับต่ำไปถึงสูง ขึ้นอยู่กับอายุของเบียร์และสายพันธุ์ของ Brett ที่ใช้ อาจมีความเป็นกรดแบบที่ไม่ใช่แลคติกเล็กน้อย","Aroma":"แปรผันตาม base style เบียร์ Brett ที่มีอายุน้อยจะมีกลิ่น fruity มากกว่า (เช่น tropical fruit, stone fruit หรือ citrus) แต่สิ่งนี้จะแปรผันตามสายพันธุ์ของ Brett ที่ใช้ เบียร์ Brett ที่มีอายุอาจเริ่มมีกลิ่น funky เล็กน้อย (เช่น barnyard, wet hay, earthy บางๆ หรือ smoky) แต่คาแรคเตอร์นี้ไม่ควรโดดเด่น","Appearance":"แปรผันตาม base style ความชัดเจนมีได้หลายแบบและขึ้นอยู่กับ base style และส่วนผสมที่ใช้ การมีความขุ่นเล็กน้อยไม่ถือเป็นข้อผิดพลาด","Flavor":"แปรผันตาม base style คาแรคเตอร์จาก Brett อาจมีตั้งแต่ในระดับต่ำที่สุดไปจนถึงก้าวร้าว สามารถมีความ fruity ได้ค่อนข้างมาก (เช่น tropical fruit, berry, stone fruit, citrus) หรือมีคาแรคเตอร์ในแบบ smoky, earthy หรือ barnyard ไม่ควรมีความ funky ในแบบไม่ที่รื่นรมย์เช่น band-aid, fetid, nail polish remover, cheese และอื่นๆ มักมีความ fruity ในตอนที่เบียร์ยังสดใหม่แต่ความ funky จะเพิ่มขึ้นตามอายุ บางทีอาจไม่ใช่แบบ lactic รสชาติจากมอลต์มักจะเด่นชัดน้อยกว่าใน base style ทำให้เบียร์ส่วนใหญ่จะ dry และ crisp เนื่องจาก Brett จัดการน้ำตาลได้สูง","Mouthfeel":"แปรผันตาม base style โดยทั่วไปแล้วจะมีเนื้อเบียร์ที่บางบางกว่าที่คาดไว้จาก base style แต่ถ้าเนื้อเบียร์บางเกินไปถือเป็นข้อผิดพลาด ทั่วไปจะมีคาร์โบเนชั่นในระดับปานกลางถึงสูง การคงตัวของฟองมีหลายรูปแบบ แต่มักจะมีฟองน้อยกว่าใน base style","Style Comparison":"เมื่อเทียบกับเบียร์สไตล์เดียวกันที่ไม่มี Brett เบียร์ Brett จะ dry กว่า ยีสต์จัดการน้ำตาลได้มากกว่า มีความ fruity มากกว่าเนื้อเบียร์บางกว่า และมีความ funky เล็กน้อยเมื่อเบียร์อายุมากขึ้น ความเปรี้ยวและความลึกน้อยกว่า Belgian ‘wild’ ale"},"tags":"wild-fermentation, north-america, craft-style, specialty-beer","ex":"Boulevard Saison Brett, Hill Farmstead Arthur, Logsdon Seizoen Bretta, Lost Abbey Brett Devo, Russian River Sanctification, The Bruery Saison Rue"},{"c":"28B","n":"Mixed-Fermentation Sour Beer","cat":"28","cn":"American Wild Ale","tier":"B","gen":false,"en":{"Overall Impression":"A sour and funky version of
