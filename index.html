rtaste that is never cloying or heavy.","Aroma":"Moderate malty aroma, typically rich, bready, somewhat toasty, with light bread crust notes. Clean lager fermentation character. Very low floral, herbal, or spicy hop aroma optional. Caramel-sweet, biscuity-dry, or roasted malt aromas are inappropriate. Very light alcohol might be detected, but should never be sharp. Clean, elegant malt richness should be the primary aroma.","Appearance":"Amber-orange to deep reddish-copper color; should not be golden. Bright clarity, with persistent, off-white foam stand.","Flavor":"Moderate to high rich malt flavor often initially suggests sweetness, but the finish is moderately-dry to dry. Distinctive and complex maltiness often includes a bready, toasty aspect. Hop bitterness is moderate, and the floral, herbal, or spicy hop flavor is low to none. Hops provide sufficient balance that the malty palate and finish do not seem sweet. The aftertaste is malty, with the same elegant, rich malt flavors lingering. Noticeable sweet caramel, dry biscuit, or roasted flavors are inappropriate. Clean fermentation profile.","Mouthfeel":"Medium body, with a smooth, creamy texture that often suggests a fuller mouthfeel. Medium carbonation. Fully attenuated, without a sweet or cloying impression. May be slightly warming, but the strength should be relatively hidden.","Style Comparison":"Not as strong and rich as a Dunkles Bock. More malt depth and richness than a Festbier, with a heavier body and slightly less hops. Less hoppy but equally malty as a Czech Amber Lager, but with a different malt profile."},"th":{"Overall Impression":"เบียร์ German lager สีอำพันที่มีความ clean, rich, toasty, bready จากมอลต์ มีความขมที่ถูกกำหนดมา และผ่านการหมักมาอย่างดี มีคาแรคเตอร์มอลต์ที่นุ่มนวล สง่างาม ซับซ้อน และมี aftertaste เป็นรสมอลต์ที่เข้มข้นแต่ไม่หนัก ไม่เหลือความหวานตกค้าง","Aroma":"มีกลิ่นมอลต์ในระดับปานกลาง โดยทั่วไปจะเข้มข้นแบบ bready, toasty และมีคาแรคเตอร์ bread crust แบบบางๆ มีคาแรคเตอร์แบบ Lager ที่หมักมาอย่างสะอาด สามารถมีฮอปแบบ floral, herbal หรือ spicy แบบบางๆได้ การมีกลิ่นหวานแบบ caramel, biscuit-dry หรือ roast มอลต์ไม่เหมาะสม ควรจะสัมผัสถึงแอลกอฮอล์ได้น้อยมากและห้ามมีความคมหรือทิ่มแทง กลิ่นหลักควรมาจากกลิ่นมอลต์ที่เข้มข้น","Appearance":"สีอำพัน-ส้ม (amber-orange) ถึงแดง-ทองแดงเข้ม (deep reddish-copper) ไม่ควรเป็นสีทอง น้ำเบียร์มีความใสและคมชัด ฟองสีขาวนวล เกาะกับแก้วได้ดี","Flavor":"มีรสชาติมอลต์แบบเข้มข้นในระดับปานกลางถึงสูง มักจะเริ่มต้นด้วยความหวานแต่จบในแบบ dry ถึง dry ปานกลาง รสมอลต์มีลักษณะเฉพาะและซับซ้อนแบบ bready, toasty มีความขมจากฮอปปานกลาง สามารถมีคาแรคเตอร์ floral, herbal หรือ spicy ในระดับต่ำได้ ฮอปช่วยทำให้มอลต์ไม่ออกหวานเกินไป สมดุลทั้งในรสชาติและในตอนจบ ใน aftertaste จะมีรสมอลต์ที่เข้มข้น สง่างาม การมีรสแบบ sweet caramel, dry biscuit หรือ roasted flavors ไม่เหมาะสม มีโปรไฟล์การหมักที่สะอาด","Mouthfeel":"มีเนื้อเบียร์ปานกลาง เนียนนุ่มครีมมี่ ที่ทำให้รู้สึกเต็มปากเต็มคำ มีคาร์โบเนชั่นปานกลาง หมักมาอย่างสมบูรณ์โดยที่ไม่มีความหวานหลงเหลือ อาจพบความอุ่นจากแอลกอฮอล์ได้เล็กน้อย แต่ความแรงควรถูกซ่อนเอาไว้","Style Comparison":"ไม่แรงและเข้มข้นเท่า Dunkles Bock มีความลึกและความเข้มข้นของมอลต์มากกว่า Festbier โดยมีเนื้อเบียร์หนากว่าและมีฮอปน้อยกว่าเล็กน้อย มีฮอปน้อยกว่าแต่มีมอลต์พอๆกับ Czech Amber Lager แต่มีรูปแบบมอลต์ที่แตกต่างกัน"},"tags":"standard-strength, amber-color, bottom-fermented, lagered, central-europe, traditional-style, amber-lager-family, malty","ex":"Hacker-Pschorr Oktoberfest Märzen, Hofmark Märzen, Paulaner Oktoberfest, Saalfelder Ur-Saalfelder, Weltenburger Kloster Anno 1050","OG":[1.054,1.06],"FG":[1.01,1.014],"IBU":[18.0,24.0],"SRM":[8.0,17.0],"ABV":[5.6,6.3]},{"c":"6B","n":"Rauchbier","cat":"6","cn":"Amber Malty European Lager","tier":"B","gen":false,"en":{"Overall Impression":"A beechwood-smoked, malty, amber German lager. The expected Märzen profile of toasty-rich malt, restrained bitterness, clean fermentation, and a relatively dry finish is enhanced by a noticeable to intense smoke character.","Aroma":"Blend of smoke and malt, varying in balance and intensity. The beechwood smoke character can range from subtle to fairly strong, and can seem smoky, woody, or bacon- like. The malt character can be low to moderate, and be somewhat rich, toasty, or malty-sweet. The malt and smoke components are often inversely proportional (i.e., when smoke increases, malt decreases, and vice versa). Low floral or spicy hop aroma optional. Clean fermentation profile.","Appearance":"Very clear, with a large, creamy, rich, tan- to cream-colored head. Deep amber to coppery-brown in color, often a little darker than the underlying Märzen style.","Flavor":"Generally follows the aroma profile, with a blend of smoke and malt in varying balance and intensity, yet always mutually supportive. Märzen-like qualities should be evident, particularly a malty, toasty richness, but the beechwood smoke flavor can be low to high. The palate can be somewhat malty, rich, and sweet, yet the finish tends to be medium-dry to dry with the smoke character sometimes enhancing the dryness of the finish. The aftertaste can reflect both malt richness and smoke flavors, with a balanced presentation desirable. Moderate, balanced, hop bitterness. Can have up to a moderate hop flavor with spicy, floral, or herbal notes. Clean lager fermentation character. The quality and character of the smoke is important; it should be cleanly smoky. At higher levels, the smoke can take on a ham- or bacon-like character, which is acceptable as long as it doesn’t veer into the greasy range. Harsh, bitter, burnt, acrid, charred, rubbery, sulfury, or creosote-like smoky-phenolic flavors are inappropriate.","Mouthfeel":"Medium body. Medium to medium-high carbonation. Smooth lager character. Significant astringent, phenolic harshness is inappropriate.","Style Comparison":"Like a Märzen with but with a balanced, sweet, smoky aroma and flavor and a somewhat darker color."},"th":{"Overall Impression":"เบียร์ German lager ที่มีกลิ่นรมควันจากไม้ beechwood มีความ malty และมีสีอำพัน มีโปรไฟล์มอลต์แบบ toasty เข้มข้นในแบบ Märzen, มีความขมที่ถูกควบคุมมา มีการหมักที่สะอาดและจบรสแบบค่อนข้าง dry ที่ช่วยเน้นการสัมผัสของกลิ่นรมควันที่เข้มข้น","Aroma":"มีคาแรคเตอร์จากการรมควันผสมกับมอลต์ อาจจะพบความสมดุลและความเข้มข้นต่างกัน คาแรคเตอร์รมควันจากไม้ beechwood อาจมีตั้งแต่นุ่มนวลไปจนถึงเข้มพอสมควร และอาจพบความ smoky, woody หรือ bacon-like สามารถมีคาแรคเตอร์จากมอลต์ในระดับต่ำถึงปานกลาง แบบ rich, toasty หรือ malty-sweet องค์ประกอบของมอลต์และคาแรคเตอร์รมควันมักเป็นสัดส่วนผกผัน (เช่น เมื่อควันเพิ่มขึ้น มอลต์จะลดลง) อาจมีกลิ่นฮอปแบบ floral, spicy ต่ำ มีโปรไฟล์การหมักที่สะอาด","Appearance":"ใสมาก มีฟองขนาดใหญ่ ครีมมี่ เข้มข้น ฟองมีสีน้ำตาลอ่อนถึงสีครีม เบียร์มีสีอำพันเข้ม (deep amber) ถึงน้ำตาลอมทองแดง (copper-brown) มักจะมีสีเข้มกว่าสไตล์ Märzen เล็กน้อย","Flavor":"โดยทั่วไปแล้วจะไปในทางเดียวกับอโรม่า มาพร้อมกับการผสมกันระหว่างกลิ่นรมควันและมอลต์ในความสมดุลและความเข้มข้นที่แตกต่างกัน แต่ก็สนับสนุนซึ่งกันและกันเสมอ มีคุณสมบัติที่คล้าย Märzen อย่างชัดเจน โดยเฉพาะอย่างยิ่งรสมอลต์และรส toasty ที่เข้มข้น แต่กลิ่นรมควันของไม้ beechwood อาจมีได้ในระดับต่ำจนถึงสูง การรับรสจะเป็นในแบบรสมอลต์เข้มข้นและความหวาน แต่ตอนจบจะ dry ปานกลางจนถึง dry ที่บางทีมาพร้อมคาแรคเตอร์รมควัน ที่ช่วยทำให้รู้สึก dry ในตอนจบ รสใน aftertaste อาจพบได้ทั้งรสมอลต์เข้มข้นและคาแรคเตอร์รมควันที่มาพร้อมกับความสมดุล ความขมจากฮอปปานกลางและสมดุล สามารถมีรสฮอปในแบบ spicy, floral หรือ herbal ได้ มีคาแรคเตอร์ของการหมักที่สะอาดคุณภาพและคาแรคเตอร์จากการรมควันเป็นสิ่งสำคัญ ควรจะเป็นการรมควันที่ให้กลิ่นสะอาด ถ้าคาแรคเตอร์รมควันมีความเข้มข้นสูงอาจพบคาแรคเตอร์ของแฮมหรือเบคอน ซึ่งเป็นที่ยอมรับได้ถ้าไม่ออกเลี่ยนจนเกินไป รสที่รุนแรง, ความขม, กลิ่นไหม้, กลิ่นฉุน, กลิ่นยาง, sulfury หรือ creosote-like smoky-phenolic นั้นไม่เหมาะสม","Mouthfeel":"เนื้อเบียร์ปานกลาง มีคาร์โบเนชั่นในระดับปานกลางถึงสูงปานกลาง มีคาแรคเตอร์แบบลาเกอร์ที่นุ่มลื่น ความฝาดและความกระด้างจาก phenolic ไม่เหมาะสม","Style Comparison":"เหมือน Märzen แต่มีความหอมหวาน และรสชาติที่สมดุลจากกลิ่นรมควัน และมีสีเข้มกว่าเล็กน้อย"},"tags":"standard-strength, amber-color, bottom-fermented, lagered, central-europe, traditional-style, amber-lager-family, malty, smoke","ex":"Cervejaria Bamberg Rauchbier, Göller Rauchbier, Rittmayer Rauchbier, Schlenkerla Rauchbier Märzen, Spezial Rauchbier Märzen","OG":[1.05,1.057],"FG":[1.012,1.016],"IBU":[20.0,30.0],"SRM":[12.0,22.0],"ABV":[4.8,6.0]},{"c":"6C","n":"Dunkles Bock","cat":"6","cn":"Amber Malty European Lager","tier":"B","gen":false,"en":{"Overall Impression":"A strong, dark, malty German lager beer that emphasizes the malty-rich and somewhat toasty qualities of continental malts without being sweet in the finish.","Aroma":"Medium to medium-high rich bready-malty aroma, often with moderate amounts of rich Maillard products or toasty overtones. Virtually no hop aroma. Some alcohol may be noticeable. Clean lager character, although a slight dark fruit character is allowable.","Appearance":"Light copper to brown color, often with attractive garnet highlights. Good clarity despite the dark color. Large, creamy, persistent, off-white head.","Flavor":"Medium to medium-high complex, rich maltiness is dominated by toasty-rich Maillard products. Some dark caramel notes may be present. Hop bitterness is generally only high enough to support the malt flavors, allowing a bit of malty sweetness to linger into the finish. Well-attenuated, not cloying. Clean fermentation profile, although the malt can provide a slight dark fruit character. No hop flavor. No roasted, burnt, or dry biscuity character.","Mouthfeel":"Medium to medium-full bodied. Moderate to moderately low carbonation. Some alcohol warmth may be found, but should never be hot. Smooth, without harshness or astringency.","Style Comparison":"Darker, with a richer malty flavor and less apparent bitterness than a Helles Bock. Less alcohol and malty richness than a Doppelbock. Stronger malt flavors and higher alcohol than a Märzen. Richer, less attenuated, and less hoppy than a Czech Amber Lager."},"th":{"Overall Impression":"เบียร์ German lager ที่แรงมีสีเข้ม มีมอลต์เข้มข้นพร้อม toasty จาก continental มอลต์โดยที่ไม่รู้สึกหวานในตอนจบ","Aroma":"กลิ่นมอลต์แบบ bready-malty ที่เข้มข้นปานกลางถึงสูงปานกลาง มักมีคาแรคเตอร์จากปฏิกิริยา Maillard ที่เข้มข้นหรือ toasty แทบไม่มีกลิ่นฮอป อาจพบคาแรคเตอร์แอลกอฮอล์ได้ มีลักษณะของลาเกอร์ที่สะอาด อาจจะมีคาแรคเตอร์ของ dark fruit ได้","Appearance":"สีทองแดงอ่อน (light copper) ถึงน้ำตาล (brown) มักมีสีโกเมน (garnet) เป็นไฮไลท์ มีความใสที่ดีแม้จะสีเข้ม ฟองขนาดใหญ่ ครีมมี่สีขาวนวล เกาะแก้วได้ดี","Flavor":"มอลต์ที่เข้มข้นปานกลางจนถึงสูงปานกลาง ซับซ้อน เด่นด้วย toasty ที่เข้มข้นและคาแรคเตอร์จากปฏิกิริยา Maillard อาจพบสัมผัสจาก dark caramel ความขมจากฮอปสูงเพียงพอที่จะช่วยสนับสนุนรสมอลต์และช่วยให้ความหวานลากไปจนจบ ยีสต์ทำงานมาอย่างดี มีโปรไฟล์การหมักที่สะอาด มอลต์สามารถให้รส dark fruit ได้ ไม่มีรสฮอป ไม่มีความคั่วไหม้ หรือ dry biscuity","Mouthfeel":"เนื้อเบียร์ปานกลางถึงหนาปานกลาง คาร์โบเนชั่นปานกลางถึงต่ำปานกลาง เมื่ออุ่นอาจพบคาแรคเตอร์แอลกอฮอล์ แต่ไม่ควรร้อนแรงเนื้อเบียร์เรียบเนียนไม่มีความหยาบกระด้างหรือฝาด","Style Comparison":"สีเข้มกว่า มากับรสมอลต์ที่เข้มข้นและความขมน้อยกว่า Helles Bock ความเข้มข้นของแอลกอฮอล์และมอลต์น้อยกว่า Doppelbock มีรสชาติของมอลต์ที่เข้มข้นกว่าและแอลกอฮอล์ที่สูงกว่า Märzen เข้มข้นกว่า ยีสต์ทำงานน้อยกว่า และมีฮอปน้อยกว่า Czech Amber Lager"},"tags":"high-strength, amber-color, bottom-fermented, lagered, central-europe, traditional-style, bock-family, malty","ex":"Aass Bock, Einbecker Ur-Bock Dunkel, Kneitinger Bock, Lindeboom Bock, Schell’s Bock, Penn Brewery St. Nikolaus Bock","OG":[1.064,1.072],"FG":[1.013,1.019],"IBU":[20.0,27.0],"SRM":[14.0,22.0],"ABV":[6.3,7.2]},{"c":"7A","n":"Vienna Lager","cat":"7","cn":"Amber Bitter European Beer","tier":"A","gen":false,"en":{"Overall Impression":"A moderate-strength continental amber lager with a soft, smooth maltiness and a balanced, moderate bitterness, yet finishing relatively dry. The malt flavor is clean, bready-rich, and somewhat toasty, with an elegant impression derived from quality base malts and process, not specialty malts or adjuncts.","Aroma":"Moderately-intense malt aroma, with toasty and malty-rich accents. Floral, spicy hop aroma may be low to none. Clean lager character. A significant caramel, biscuity, or roasted aroma is inappropriate.","Appearance":"Light reddish amber to copper color. Bright clarity. Large, off-white, persistent head.","Flavor":"Soft, elegant malt complexity is in the forefront, with a firm enough hop bitterness to provide a balanced finish. The malt flavor tends towards a rich, toasty character, without significant caramel, biscuity, or roast flavors. Fairly dry, soft finish, with both rich malt and hop bitterness present in the aftertaste. Floral, spicy, or herbal hop flavor may be low to none. Clean fermentation profile.","Mouthfeel":"Medium-light to medium body, with a gentle creaminess. Moderate carbonation. Smooth.","Style Comparison":"Similar malt flavor as a Märzen, but lighter in intensity, and body, with a touch more bitterness and dryness in the balance. Lower in alcohol than Märzen or Festbier. Less rich, malty, and hoppy than Czech Amber Lager."},"th":{"Overall Impression":"continental amber lager ที่มีความแรงปานกลาง มาพร้อมความนุ่มลื่นจากมอลต์ ความสมดุล ความขมปานกลาง จบรสแบบใกล้ dry มีรสชาติจากมอลต์ที่สะอาด เข้มด้วย bready และ toasty มากับความสง่างามจากวิธีการผลิตและการใช้ base มอลต์ ไม่ใช่จาก special มอลต์หรือ adjunct","Aroma":"มีกลิ่นมอลต์ที่เข้มข้นปานกลาง มีกลิ่น toasty และมอลต์เข้มข้นสามารถพบกลิ่นฮอปแบบ floral และ spicy ในระดับต่ำได้ มีลักษณะแบบเบียร์ลาเกอร์ที่สะอาด แต่การมีกลิ่น caramel, biscuity หรือกลิ่นคั่วนั้นไม่เหมาะสม","Appearance":"สีอำพันแดงแบบอ่อน (light reddish amber) ถึงสีทองแดง (copper) มีความใสและคมชัด ฟองขนาดใหญ่ สีขาวนวล ฟองเกาะแก้วได้ดี","Flavor":"ความซับซ้อนของมอลต์ที่นุ่มนวล สง่างามเมื่อสัมผัส โดยมีความขมของฮอปที่แน่นพอที่จะทำให้เบียร์สมดุลในตอนจบ รสของมอลต์จะเข้มข้นในแบบ toasty โดยไม่มีรส caramel, biscuity หรือ roast ที่เห็นได้ชัด จบรสแบบ dry เล็กน้อยจบนุ่มโดยมีมอลต์ที่เข้มขนผสมกับความขมใน aftertaste สามารถมีฮอปในแบบ floral, spicy หรือ herbal ในระดับต่ำ มีโปรไฟล์การหมักที่สะอาด","Mouthfeel":"เนื้อเบียร์ปานกลางถึงบางปานกลาง มีความครีมมี่ที่อ่อนโยน มีคาร์โบเนชั่นปานกลาง เนื้อเบียร์นุ่มลื่น","Style Comparison":"มีรสมอลต์ที่คล้ายกับ Märzen แต่มีความเข้มข้นและเนื้อเบียร์บางกว่า พร้อมความสมดุลจากความขมและรสที่ dry มีแอลกอฮอล์ต่ำกว่า Märzen หรือ Festbier ; เข้มข้นน้อยกว่า มีมอลต์น้อยกว่า แต่มีฮอปมากกว่า Czech Amber Lager"},"tags":"standard-strength, amber-color, bottom-fermented, lagered, central-europe, traditional-style, amber-lager-family, balanced","ex":"Chuckanut Vienna Lager, Devils Backbone Vienna Lager, Figueroa Mountain Red Lager, Heavy Seas Cutlass, Ottakringer Wiener Original, Schell’s Firebrick, Theresianer Vienna","OG":[1.048,1.055],"FG":[1.01,1.014],"IBU":[18.0,30.0],"SRM":[9.0,15.0],"ABV":[4.7,5.5]},{"c":"7B","n":"Altbier","cat":"7","cn":"Amber Bitter European Beer","tier":"B","gen":false,"en":{"Overall Impression":"A moderately colored, well-attenuated, bitter beer with a rich maltiness balancing a strong bitterness. Light and spicy hop character complements the malt. A dry beer with a firm body and smooth palate.","Aroma":"Malty and rich with grainy characteristics like baked bread or nutty, toasted bread crusts. Should not have darker roasted or chocolate notes. Malt intensity is moderate to moderately-high. Moderate to low hops complement but do not dominate the malt, and often have a spicy, peppery, or floral character. Fermentation character is very clean. Low to medium-low esters optional.","Appearance":"The color ranges from amber to deep copper, stopping short of brown; bronze-orange is most common. Brilliant clarity. Thick, creamy, long-lasting off-white head.","Flavor":"Malt profile similar to the aroma, with an assertive, medium to high hop bitterness balancing the rich malty flavors. The beer finishes medium-dry to dry with a grainy, bitter, malty-rich aftertaste. The finish is long-lasting, sometimes with a nutty or bittersweet impression. The apparent bitterness level is sometimes masked by the malt character if the beer is not very dry, but the bitterness tends to scale with the malt richness to maintain balance. No roast. No harshness. Clean fermentation profile. Light fruity esters, especially dark fruit, may be present. Medium to low spicy, peppery, or floral hop flavor. Light minerally character optional.","Mouthfeel":"Medium body. Smooth. Medium to medium-high carbonation. Astringency low to none.","Style Comparison":"More bitter and malty than International Amber Lagers. Somewhat similar to California Common, both in production technique and finished flavor and color, though not in ingredients. Less alcohol, less malty richness, and more bitterness than a Dunkles Bock. Drier, richer, and more bitter than a Vienna Lager."},"th":{"Overall Impression":"เบียร์รสขมที่มีสีปานกลาง มีความสมดุลระหว่างมอลต์เข้มข้นและความขมเข้มข้น ยีสต์ทำงานได้ดี มีรสฮอปแบบ spicy อ่อนๆที่ส่งเสริมมอลต์ เบียร์ที่จบแบบ dry ที่มาพร้อมเนื้อเบียร์แน่นและนุ่มลื่น","Aroma":"มีรสมอลต์และรสเข้มข้นด้วยลักษณะ grainy แบบ bake bread, nutty, toast bread crust ไม่ควรพบกลิ่น darker roasted หรือ chocolate มีความเข้มข้นของมอลต์ในระดับปานกลางถึงสูงปานกลาง มีฮอประดับปานกลางถึงต่ำที่ไม่เด่นกว่ามอลต์ในแบบ spicy, peppery หรือ floral มีการหมักแบบสะอาดมากๆ มี ester แบบต่ำถึงปานกลางได้","Appearance":"สีมีตั้งแต่สีอำพัน (amber) ไปจนถึงทองแดงเข้ม (deep copper) ไม่ควรมีสีน้ำตาล สีบรอนซ์ส้ม (bronze-orange) คือสีปกติ มีความใสและคมชัดที่ยอดเยี่ยม เนื้อหนา ครีมมี่ ฟองสีขาวนวลเกาะติดแก้วนาน","Flavor":"มีลักษณะมอลต์แบบเดียวกับอโรม่า โดยมีความขมปานกลางถึงสูงที่สมดุลกับรสชาติมอลต์ที่เข้มข้น จบรสแบบ medium-dry จนถึง dry พร้อมกับรส grain ความขม และรสมอลต์ที่เข้มข้นใน aftertaste รสตอนจบจะลากยาว บางทีจะพบรส nutty หรือรสขมอมหวาน ระดับความขมบางทีจะถูกซ่อนโดยคาแรคเตอร์จากมอลต์ถ้าเบียร์ไม่ dry เกินไป แต่ความขมจะขึ้นลงได้คู่กับมอลต์เพื่อให้เบียร์สมดุล ห้ามมีรสคั่ว ห้ามกระด้าง มีโปรไฟล์การหมักที่สะอาด มี ester แบบ fruity บางๆในแบบ dark fruit มีรสฮอปแบบ spicy, peppery หรือ floral ปานกลางถึงต่ำ อาจจะพบคาแรคเตอร์จากแร่ธาตุบางๆได้","Mouthfeel":"เนื้อเบียร์แบบกลาง นุ่มลื่น คาร์โบเนชั่นปานกลางจนถึงสูงปานกลาง มีความฝาดต่ำจนถึงไม่มี","Style Comparison":"มีรสขมและมอลต์มากกว่า International Amber Lager ค่อนข้างคล้ายกับ California Common ทั้งในเทคนิคการผลิตและรสชาติและสีตอนเสร็จ มีแอลกอฮอล์ต่ำกว่า มอลต์เข้มข้นน้อยกว่า และขมมากว่า Dunkles Bock แต่ dry กว่า เข้มข้นกว่าและขมมากว่า Vienna Lager"},"tags":"standard-strength, amber-color, top-fermented, lagered, central-europe, traditional-style, amber-ale-family, bitter","ex":"Bolten Alt, Diebels Alt, Füchschen Alt, Original Schlüssel Alt, Schlösser Alt, Schumacher Alt, Uerige Altbier","OG":[1.044,1.052],"FG":[1.008,1.014],"IBU":[25.0,50.0],"SRM":[9.0,17.0],"ABV":[4.3,5.5]},{"c":"8A","n":"Munich Dunkel","cat":"8","cn":"Dark European Lager","tier":"A","gen":false,"en":{"Overall Impression":"A traditional malty brown lager from Bavaria. Deeply toasted, bready malt flavors without any roasty or burnt flavors. Smooth and rich, with a restrained bitterness and a relatively dry finish that allows for drinking in quantity.","Aroma":"Moderate to high malt richness, like toasted bread crusts with hints of chocolate, nuts, caramel, or toffee. Fresh traditional versions often show higher levels of chocolate. The malt character is more malty-rich than sugary or caramelly sweet. Clean fermentation profile. A light spicy, floral, or herbal hop aroma is optional.","Appearance":"Deep copper to dark brown, often with a red or garnet tint. Creamy, light to medium tan head. Usually clear.","Flavor":"Rich malt flavors similar to aroma (same malt descriptors apply), medium to high. Restrained bitterness, medium-low to medium, giving an overall malty balance. Malty and soft on the palate without being overly sweet, and medium- dry in the finish with a malty aftertaste. No roast, burnt, or bitter malt flavors, toasted flavors shouldn’t have a harsh grainy dryness, and caramel flavors should not be sweet. Low spicy, herbal, or floral hop flavor optional. Clean fermentation profile.","Mouthfeel":"Medium to medium-full body, providing a soft and dextrinous mouthfeel without being heavy or cloying. Moderate carbonation. Smooth lager character. No harsh or biting astringency. Not warming.","Style Comparison":"Not as intense in maltiness or as strong as a Dunkles Bock. Lacking the more roasted flavors and often the hop bitterness of a Schwarzbier. Richer, more malt-centric, and less hoppy than a Czech Dark Lager."},"th":{"Overall Impression":"ลาเกอร์ที่มีมอลต์ชัดสีน้ำตาลแบบดั้งเดิมจากบาวาเรีย มีรส deeply toasted, bready ที่ไม่มีรส roasty หรือ burnt นุ่มนวลและเข้มข้น ด้วยความขมที่ออกแบบมาและการจบแบบ dry ที่ทำให้ดื่มได้มาก","Aroma":"มีความเข้มข้นของมอลต์ปานกลางถึงสูงในแบบ toasted bread crusts และมีกลิ่น chocolate, nuts, caramel หรือ toffee คลอมาบางๆเบียร์แบบดั้งเดิมที่สดใหม่จะพบคาแรคเตอร์ chocolate สูง มีความเข้มข้นด้วยมอลต์มากว่าด้วยน้ำตาลหรือคาราเมล มีโปรไฟล์การหมักที่สะอาดสามารถพบฮอปในแบบ spicy, floral หรือ herbal ได้","Appearance":"สีทองแดงเข้ม (deep copper) ถึงน้ำตาลเข้ม (dark brown) มักมีโทนสีแดงหรือโกเมน ครีมมี่ ฟองสีอ่อนถึงน้ำตาลอ่อน มักใส","Flavor":"รสมอลต์เข้มข้นปานกลางถึงสูง มีรสชาติแบบเดียวกับอโรม่า (ใช้มอลต์คาแรคเตอร์เดียวกัน) มีความขมที่ถูกออกแบบมาปานกลางถึงต่ำ ที่ช่วยทำให้มอลต์สมดุล มีรสนุ่มจากมอลต์แบบไม่หวานเกินไปและ dry เล็กน้อยใน aftertaste ห้ามมีรสมอลต์แบบ roast, burnt หรือ bitter รส toasty ห้ามออกกระด้างแบบ grainy รสคาราเมลไม่ควรหวาน มีฮอปแบบ spicy, herbal หรือ floral บางๆได้ และมีโปรไฟล์การหมักที่สะอาด","Mouthfeel":"เนื้อเบียร์ปานกลางถึงหนาปานกลาง ให้สัมผัสนุ่มสบายโดยไม่หนักหรือหวาน คาร์โบเนชั่นปานกลาง มีคาแรคเตอร์แบบลาเกอร์นุ่มๆไม่มีอาการฝาดรุนแรงหรือกัด ไม่พบความอุ่นจากแอลกอฮอล์","Style Comparison":"ไม่เข้มข้นในรสมอลต์หรือแรงเท่า Dunkles Bock รสชาติที่คั่วและความขมจากฮอปไม่เท่า Schwarzbier เข้มข้นกว่า มีมอลต์เป็นหลักและมีฮอปน้อยกว่า Czech Dark Lager"},"tags":"standard-strength, dark-color, bottom-fermented, lagered, central-europe, traditional-style, malty, dark-lager-family","ex":"Ayinger Altbairisch Dunkel, Ettaler Kloster-Dunkel, Eittinger Urtyp Dunkel, Hacker-Pschorr Münchner Dunkel, Hofbräuhaus Dunkel, Weltenburger Kloster Barock-Dunkel","OG":[1.048,1.056],"FG":[1.01,1.016],"IBU":[18.0,28.0],"SRM":[17.0,28.0],"ABV":[4.5,5.6]},{"c":"8B","n":"Schwarzbier","cat":"8","cn":"Dark European Lager","tier":"B","gen":false,"en":{"Overall Impression":"A dark German lager that balances roasted yet smooth malt flavors with moderate hop bitterness. The lighter body, dryness, and lack of a harsh, burnt, or heavy aftertaste helps make this beer quite drinkable.","Aroma":"Low to moderate malt, with low aromatic malty sweetness and hints of roast malt often apparent. The malt can be clean and neutral or moderately rich and bready, and may have a hint of dark caramel. The roast character can be somewhat dark chocolate- or coffee-like but should never be burnt. A moderately low spicy, floral, or herbal hop aroma is optional. Clean lager yeast character.","Appearance":"Medium to very dark brown in color, often with deep ruby to garnet highlights, yet almost never truly black. Very clear. Large, persistent, tan-colored head.","Flavor":"Light to moderate malt flavor, which can have a clean, neutral character to a moderately rich, bread-malty quality. Light to moderate roasted malt flavors can give a bitter- chocolate palate that is never burnt. Medium-low to medium bitterness. Light to moderate spicy, floral, or herbal hop flavor. Clean lager character. Dry finish. Some residual sweetness is acceptable but not traditional. Aftertaste of hop bitterness with a complementary but subtle roastiness in the background.","Mouthfeel":"Medium-light to medium body. Moderate to moderately-high carbonation. Smooth. No harshness or astringency, despite the use of dark, roasted malts.","Style Comparison":"In comparison with a Munich Dunkel, usually darker in color, drier on the palate, lighter in body, and with a noticeable (but not high) roasted malt edge to balance the malt base. Should not taste like an American Porter made with lager yeast. Drier, less malty, with less hop character than a Czech Dark Lager."},"th":{"Overall Impression":"เบียร์เยอรมันลาเกอร์สีเข้ม ที่มีความสมดุลในรสชาติมอลต์คั่วที่นุ่มนวลกับความขมจากฮอปในระดับปานกลาง มีเนื้อเบียร์ที่บางกว่า มีความ dry และไม่มีรสชาติที่กระด้าง, ไหม้, หรือรสหนักใน aftertaste ทำให้เบียร์ดื่มได้ค่อนข้างง่าย","Aroma":"กลิ่นมอลต์ต่ำถึงปานกลาง มีกลิ่นหอมหวานจากมอลต์ต่ำ แต่มีกลิ่นอายของมอลต์คั่วอยู่ให้เห็นเสมอๆ มอลต์อาจเป็นแบบกลางที่คลีนไม่มีคาแรคเตอร์จนถึงมอลต์เข้มปานกลางพร้อมกลิ่น bready หรืออาจจะพบกลิ่น dark caramel คาแรคเตอร์คั่วสามารถเป็นได้ในแบบ dark chocolate หรือ coffee แต่ไม่ควรเป็นแบบไหม้ สามารถมีกลิ่นฮอปแบบ spicy, floral หรือ herbal ได้ในระดับต่ำ ใช้ยีสต์ลาเกอร์ที่สะอาด","Appearance":"มีสีน้ำตาลปานกลาง (medium dark) ถึงเข้มมาก (very dark brown) มักมีไฮไลท์สีแดงทับทิมถึงโกเมน ไม่เคยพบแบบสีดำ น้ำเบียร์ใสมาก ฟองขนาดใหญ่สีน้ำตาลอ่อน ฟองเกาะแก้วได้ดี","Flavor":"รสมอลต์อ่อนถึงปานกลาง ซึ่งอาจจะมีลักษณะที่สะอาด รสแบบกลางถึงเข้มข้นในแบบ bread-malty รสมอลต์คั่วแบบปานกลางถึงน้อย อาจพบรสแบบช็อกโกแล็ตที่ขมแต่ไม่ควรมีรสไหม้ มีความขมปานกลางจนถึงต่ำปานกลาง รสฮอปในแบบ spicy, floral หรือ herbal แบบปานกลางจนถึงต่ำ มีรสแบบลาเกอร์ที่สะอาด จบแบบ dry อาจจะพบความหวานเหลือบ้างแต่ไม่ใช่แบบดั้งเดิม aftertaste จะพบความขมจากฮอปที่เสริมด้วยรสคั่ว","Mouthfeel":"เนื้อเบียร์ปานกลางถึงบางปานกลาง คาร์โบเนชั่นปานกลางถึงสูงปานกลาง นุ่มลื่น ไม่มีความหยาบกระด้างหรือฝาดแม้จะใช้มอลต์ที่คั่วเข้มก็ตาม","Style Comparison":"เมื่อเปรียบเทียบกับ Munich Dunkel มักจะมีสีเข้มกว่า รสจะ dry มากกว่า เนื้อเบียร์บางกว่า และจะพบมอลต์คั่วชัดเจนที่มาช่วยให้ความสมดุลกับรสมอลต์ ไม่ควรรสเหมือน American Porter ที่ทำด้วยลาเกอร์ยีสต์; มีความ dry กว่า รสมอลต์น้อยกว่า คาแรคเตอร์ฮอปน้อยกว่า Czech Dark Lager"},"tags":"standard-strength, dark-color, bottom-fermented, lagered, central-europe, traditional-style, balanced, dark-lager-family","ex":"Chuckanut Schwarz Lager, Devils Backbone Schwartz Bier, Köstritzer Schwarzbier, Kulmbacher Mönchshof Schwarzbier, Nuezeller Original Badebier, pFriem Schwarzbier","OG":[1.046,1.052],"FG":[1.01,1.016],"IBU":[20.0,35.0],"SRM":[19.0,30.0],"ABV":[4.4,5.4]},{"c":"9A","n":"Doppelbock","cat":"9","cn":"Strong European Beer","tier":"A","gen":false,"en":{"Overall Impression":"A strong, rich, and very malty German lager that can have both pale and dark variants. The darker versions have more richly-developed, deeper malt flavors, while the paler versions have slightly more hops and dryness.","Aroma":"Very strong maltiness, possibly with light caramel notes, and up to a moderate alcohol aroma. Virtually no hop aroma. Dark versions have significant, rich Maillard products, deeply toasted malt, and possibly a slight chocolate-like aroma that should never be roasted or burnt. Moderately-low dark fruit, like plums, dark grapes, or fruit leather, is allowable. Pale versions have a rich and strong, often toasty, malt presence, possibly with a light floral, spicy, or herbal hop accent.","Appearance":"Good clarity, with a large, creamy, persistent head. Dark versions are copper to dark brown in color, often with ruby highlights, and an off-white head. Pale versions are deep gold to light amber in color, with a white head.","Flavor":"Very rich and malty. Hop bitterness varies from moderate to moderately low but always allows malt to dominate the flavor. Faint hop flavor optional. Most examples are fairly malty-sweet on the palate, but should have an impression of attenuation in the finish. The impression of sweetness comes from low hopping, not from incomplete fermentation. Clean fermentation profile. Dark versions have malt and ester flavors similar to the aroma (same descriptors and intensities). Pale versions have a strong bready and toasty malt flavor, a light floral, spicy, or herbal hop flavor, and a drier finish.","Mouthfeel":"Medium-full to full body. Moderate to moderately-low carbonation. Very smooth without harshness, astringency. A light alcohol warmth may be noted, but it should never burn.","Style Comparison":"A stronger, richer, more full-bodied version of either a Dunkles Bock or a Helles Bock. Pale versions will show higher attenuation and less dark fruity character than the darker versions."},"th":{"Overall Impression":"เบียร์เยอรมันลาเกอร์ที่แรง เข้มข้น และมอลต์เด่น มีทั้งแบบสีอ่อนและสีเข้ม แบบที่สีเข้มจะมีรสชาติจากมอลต์ที่เข้มข้นกว่าและลึกกว่า ในขณะที่แบบที่สีอ่อนกว่าจะมีฮอปและมีความ dry มากกว่าเล็กน้อย","Aroma":"กลิ่นมอลต์ที่เข้มข้นมาก อาจพบกลิ่นคาราเมลอ่อนๆ และกลิ่นแอลกอฮอล์แบบปานกลาง แทบไม่พบกลิ่นฮอปแบบสีเข้มมีผลผลิตจากปฏิกิริยา Maillard ที่เข้มข้น มอลต์แบบ toasty ที่เข้มข้น และอาจพบอโรม่าของ chocolate แต่ไม่ควรพบกลิ่นคั่วหรือกลิ่นไหม้ สามารถพบกลิ่น dark fruit, plums, dark grapes หรือ fruit leather แบบปานกลางหรือต่ำได้แบบสีอ่อนมีรสมอลต์เข้มข้นและแรง มักพบ toasty อาจพบกลิ่นฮอปแบบ floral, spicy หรือ herbal","Appearance":"เนื้อเบียร์ใส ฟองขนาดใหญ่ ครีมมี่ เกาะขอบแก้วได้ดีแบบสีเข้มเป็นสีทองแดง (copper) ถึงน้ำตาลเข้ม (dark brown) มักมีไฮไลท์สีทับทิม และฟองสีขาวนวลแบบสีอ่อนเป็นสีทองเข้ม (deep gold) ถึงสีเหลืองอำพันอ่อน (light amber) มีฟองสีขาว","Flavor":"เข้มข้นและมีมอลต์ชัดมาก ความขมของฮอปแตกต่างกันไปตั้งแต่ปานกลางถึงต่ำปานกลาง แต่มอลต์ยังเป็นแกนหลักเสมอ อาจจะพบ ฮอปแบบบางๆได้ ส่วนใหญ่จะพบความหวานจากมอลต์ในรส แต่ต้องให้ความรู้สึกถึงการทำงานของยีสต์ที่ดีในตอนท้าย ความรู้สึกหวานมาจากการมีรสฮอปต่ำ ไม่ใช่มาจากการหมักที่ไม่จบ มีโปรไฟล์การหมักที่สะอาดแบบสีเข้มมีรสมอลต์และ ester คล้ายกับอโรม่า (คำอธิบายและความเข้มข้นแบบเดียวกัน) แบบสีอ่อนมีรสมอลต์แบบ bready และ toasty ที่รุนแรง มีรสฮอปแบบ light floral, spicy หรือ herbal และจบแบบ dry มากกว่า","Mouthfeel":"เนื้อเบียร์แน่นปานกลางถึงแน่น คาร์โบเนชั่นปานกลางถึงต่ำปานกลาง เนียนนุ่มมาก ไม่กระด้างและไม่ฝาด พบแอลกอฮอล์ตอนอุ่นได้ แต่ไม่ควรรุนแรง","Style Comparison":"เป็นรูปแบบที่แรงกว่า เข้มข้นกว่า เนื้อเบียร์เต็มกว่าของ Dunkles Bock หรือ Helles Bock แบบสีอ่อนจะแสดงการการทำงานของยีสต์ที่สูงกว่าและมีลักษณะของผลไม้สีเข้มน้อยกว่าแบบที่เข้มกว่า"},"tags":"high-strength, amber-color, pale-color, bottom-fermented, lagered, central-europe, traditional-style, bock-family, malty","ex":"Dark Versions – Andechs Doppelbock Dunkel, Ayinger Celebrator, Paulaner Salvator, Spaten Optimator, Tröegs Troegenator, Weihenstephaner Korbinian; Pale Versions – Eggenberg Urbock 23º, Meinel Doppelbock Hell, Plank Bavarian Heller Doppelbock, Riegele Auris 19, Schönbuch Doppelbock Hell, Staffelberg-Bräu Zwergator","OG":[1.072,1.112],"FG":[1.016,1.024],"IBU":[16.0,26.0],"SRM":[6.0,25.0],"ABV":[7.0,10.0]},{"c":"9B","n":"Eisbock","cat":"9","cn":"Strong European Beer","tier":"B","gen":false,"en":{"Overall Impression":"A strong, full-bodied, rich, and malty dark German lager often with a viscous quality and strong flavors. Even though flavors are concentrated, the alcohol should be smooth and warming, not burning.","Aroma":"Dominated by rich, intense malt and a definite alcohol presence. The malt can have bready, toasty, qualities, with some caramel or faint chocolate, often with dark fruit notes like plums or grapes. No hop aroma. Alcohol aromas should not be harsh or solventy. Clean fermentation profile.","Appearance":"Deep copper to dark brown in color, often with attractive ruby highlights. Good clarity. Head retention may be moderate to poor. Off-white to deep ivory colored head. Pronounced legs are often evident.","Flavor":"Rich, sweet malt balanced by a significant alcohol presence. The malt can have Maillard products, toasty qualities, some caramel, and occasionally a slight chocolate flavor. May have significant malt-derived dark fruit esters. Hop bitterness just offsets the malt sweetness enough to avoid a cloying character. No hop flavor. Alcohol helps balance the strong malt presence. The finish should be of rich malt with a certain dryness from the alcohol. It should not be sticky, syrupy, or cloyingly sweet. Clean fermentation profile.","Mouthfeel":"Full to very full-bodied. Low carbonation. Significant alcohol warmth without sharp hotness. Very smooth and silky without harsh edges from alcohol, bitterness, fusels, or other concentrated flavors.","Style Comparison":"Eisbocks are not simply stronger Doppelbocks; the name refers to the process of freezing and concentrating the beer, and is not a statement on alcohol; some Doppelbocks are stronger than Eisbocks. Not as thick, rich, or sweet as a Wheatwine."},"th":{"Overall Impression":"เบียร์เยอรมันลาเกอร์สีเข้ม ที่แรง เนื้อเบียร์แน่น เข้มข้น มอลต์ชัด ที่หนืดและรสชาติรุนแรง แม้รสชาติจะเข้มข้น แต่แอลกอฮอล์ก็ควรมีความนุ่มนวลและอุ่นสบาย","Aroma":"โดดเด่นด้วยมอลต์เข้มข้นและแอลกอฮอล์ที่ชัดเจน มอลต์สามารถมีรสชาติในแบบ bready, toasty และมี caramel หรือ chocolate บางๆ และมักจะพบกลิ่น dark fruit เช่น plums หรือ grape ไม่มีกลิ่นฮอป กลิ่นแอลกอฮอล์ไม่ควรรุนแรงหรือเป็นแบบ solvent มีโปรไฟล์การหมักที่สะอาด.","Appearance":"สีทองแดงเข้ม (deep copper) ถึงน้ำตาลเข้ม (dark brown) มักมีไฮไลท์ทับทิมที่น่าดึงดูด มีความใสคมชัด ฟองเกาะแก้วได้ปานกลางหรืออาจจะเกาะได้ไม่ดี ฟองสีขาวนวลถึงสีงาช้างเข้ม พบ leg ได้เด่นชัดเป็นปกติ","Flavor":"รสมอลต์ที่เข้มข้นและหวาน สมดุลด้วยรสแอลกอฮอล์ มอลต์สามารถมีผลผลิตจากปฏิกิริยา Maillard พร้อมความ toasty, caramel หรือ chocolate บางๆ อาจมี ester แนวผลไม้สีเข้มที่ได้จากมอลต์ ความขมของฮอปช่วยชดเชยความหวานของมอลต์ ไม่มีรสฮอป แอลกอฮอล์ช่วยทำให้รสมอลต์ที่เข้มข้นสมดุล จบรสในแบบรสมอลต์เข้มข้นและเหลือความหวานต่ำจากแอลกอฮอล์ ไม่ควรเหนียวเหนอะหนะหรือหวานมาก มีโปรไฟล์การหมักที่สะอาด","Mouthfeel":"เนื้อเบียร์แน่นจนถึงแน่นมากๆ คาร์โบเนชั่นต่ำ พบแอลกอฮอล์ชัดเจนโดยไม่ร้อนแรงเกินไป นุ่มลื่นโดยไม่มีความกระด้างจากแอลกอฮอล์ ความขม กลิ่นแอลกอฮอล์ หรือรสที่เข้มข้นอื่นๆ","Style Comparison":"Eisbock ไม่ใช่แค่ Doppelbock ที่แรงขึ้นเท่านั้นชื่อหมายถึงกระบวนการแช่แข็งและเพิ่มความเข้มข้นของเบียร์ และไม่ใช่การแจ้งเกี่ยวกับแอลกอฮอล์; Doppelbock บางตัวแรงกว่า Eisbock ไม่หนาเข้มข้น หรือหวานเหมือน Wheatwine"},"tags":"very-high-strength, amber-color, bottom-fermented, lagered, central-europe, traditional-style, bock-family, malty","ex":"Kulmbacher Eisbock","OG":[1.078,1.12],"FG":[1.02,1.035],"IBU":[25.0,35.0],"SRM":[17.0,30.0],"ABV":[9.0,14.0]},{"c":"9C","n":"Baltic Porter","cat":"9","cn":"Strong European Beer","tier":"A","gen":false,"en":{"Overall Impression":"A strong, dark, malty beer with different interpretations within the Baltic region. Smooth, warming, and richly malty, with complex dark fruit flavors and a roasted flavor without burnt notes.","Aroma":"Rich maltiness often containing caramel, toffee, nuts, deep toast, or licorice notes. Complex alcohol and ester profile of moderate strength, and reminiscent of plums, prunes, raisins, cherries, or currants, occasionally with a vinous Port- like quality. Deep malt accents of dark chocolate, coffee, or molasses, but never burnt. No hops. No sourness. Smooth, not sharp, impression.","Appearance":"Dark reddish-copper to opaque dark brown color, but not black. Thick, persistent tan-colored head. Clear, although darker versions can be opaque.","Flavor":"As with aroma, has a rich maltiness with a complex blend of deep malt, dried fruit esters, and alcohol. The malt can have a caramel, toffee, nutty, molasses, or licorice complexity. Prominent yet smooth Schwarzbier-like roasted flavor that stops short of burnt. Light hints of black currants and dark dried fruits. Smooth palate and full finish. Starts malty-sweet but darker malt flavors quickly dominate and persist through the dryish finish, leaving a hint of roast coffee or licorice and dried fruit in the aftertaste. Medium-low to medium bitterness, just to provide balance and prevent it from seeming cloying. Hop flavor from slightly spicy hops ranges from none to medium-low. Clean fermentation profile.","Mouthfeel":"Generally quite full-bodied and smooth, with a well-aged alcohol warmth that can be deceptive. Medium to medium-high carbonation, making it seem even more mouth- filling. Not heavy on the tongue due to carbonation level.","Style Comparison":"Combines the body, maltiness, richness, and smoothness of a Doppelbock, the darker malt character of an English Porter, the roast flavors of a Schwarzbier, and alcohol and fruitiness of and Old Ale. Much less roasted and often lower in alcohol than an Imperial Stout."},"th":{"Overall Impression":"เบียร์ที่แรง สีเข้ม มีมอลต์เข้มข้น ที่สไตล์มีการตีความใหม่ในภูมิภาค Baltic มีรสชาติที่กลมกล่อม อบอุ่น และเข้มข้นด้วยมอลต์ พร้อมด้วยความซับซ้อนจากรส dark fruit และรสคั่วโดยที่ไม่มีรสไหม้","Aroma":"กลิ่นมอลต์ที่เข้มข้นที่มักพบกลิ่น caramel, toffee, nut, deep toast หรือ licorice มีโปรไฟล์แอลกอฮอล์และ ester ที่ซับซ้อนในความเข้มข้นปานกลางที่ชวนให้นึกถึง lum, prunes, raisin, cherries หรือ currant บางครั้งคล้าย port wine มีกลิ่นมอลต์เข้มข้นของ dark chocolate, coffee หรือ molasse แต่ไม่มีกลิ่นไหม้ ไม่มีฮอป ไม่เปรี้ยว เนียนนุ่ม ไม่คมและประทับใจ","Appearance":"สีทองแดงแดงเข้ม (dark reddish-copper) ถึงน้ำตาลเข้มทึบแสง (opaque dark brown) แต่ไม่ดำ ฟองสีน้ำตาลเข้ม ฟองแน่นและเกาะแก้วได้ดี ใส แต่แบบสีเข้มสามารถทึบแสงได้","Flavor":"รสชาติมาในแบบเดียวกับกลิ่น มีรสมอลต์ที่เข้มข้นพร้อมการผสมผสานที่ซับซ้อนของ deep malt, dried fruit ester และ alcohol มอลต์สามารถมีความซับซ้อนในรูป caramel, toffee, nutty, molasse หรือ licorice มีรสคั่วที่โดดเด่นแบบ Schwarzbier ที่ไม่มีรสไหม้ มีรส black currants และ dark dried fruit ที่เข้ามาเสริม นุ่มในปากและเต็มปากเต็มคำ เริ่มต้นด้วยความหวานจากมอลต์คั่วที่รวดเร็วและค้างอยู่ตลอดจนถึงตอนจบแบบ dry และทิ้งไว้ซึ่งรส roast coffee หรือ licorice และ dried fruit ใน aftertaste มีรสขมต่ำปานกลางถึงปานกลางเพียงเพื่อให้สมดุลและไม่เหลือความหวาน รสฮอปแบบ spicy มีได้ในระดับต่ำปานกลางจนถึงไม่มี มีโปรไฟล์การหมักที่สะอาด","Mouthfeel":"โดยทั่วไปแล้วเนื้อเบียร์จะแน่นและนุ่มลื่น พร้อมความอุ่นจากแอลกอฮอล์ที่ถูกบ่มมาและซ่อนได้ดี มีคาร์โบเนชั่นปานกลางถึงสูงปานกลาง ที่เพิ่มความรู้สึกเต็มปาก ไม่รู้สึกหนักที่ลิ้นจากระดับคาร์โบเนชั่น","Style Comparison":"ผสมผสานเนื้อเบียร์ รสมอลต์ ความเข้มข้น และความนุ่มนวลของ Doppelbock กับคาแรคเตอร์ของมอลต์สีเข้มจาก English Porter รสชาติคั่วของ Schwarzbier แอลกอฮอล์และรสชาติของ Old Ale คั่วน้อยกว่าและมักมีแอลกอฮอล์น้อยกว่า Imperial Stout"},"tags":"high-strength, dark-color, any-fermentation, lagered, eastern-europe, traditional-style, porter-family, malty","ex":"Aldaris Mežpils Porteris, Baltika 6 Porter, Devils Backbone Danzig, Okocim Mistrzowski Porter, Sinebrychoff Porter, Zywiec Porter","OG":[1.06,1.09],"FG":[1.016,1.024],"IBU":[20.0,40.0],"SRM":[17.0,30.0],"ABV":[6.5,9.5]},{"c":"10A","n":"Weissbier","cat":"10","cn":"German Wheat Beer","tier":"A","gen":false,"en":{"Overall Impression":"A pale, refreshing, lightly-hopped German wheat beer with high carbonation, dry finish, fluffy mouthfeel, and a distinctive banana-and-clove weizen yeast fermentation profile.","Aroma":"Moderate to strong esters and phenols, typically banana and clove, often well balanced and typically stronger than the malt. Light to moderate bready, doughy, or grainy wheat aroma. Light vanilla optional. Light floral, spicy, or herbal hops optional. Bubblegum (strawberry with banana), sourness, or smoke are faults.","Appearance":"Pale straw to gold in color. Very thick, moussy, long-lasting white head. Can be hazy and have a shine from wheat and yeast, although this can settle out in bottles.","Flavor":"Low to moderately strong banana and clove flavor, often well balanced. Low to moderate soft, somewhat bready, doughy, or grainy wheat flavor supported by the slight Pils malt grainy sweetness. Very low to moderately low bitterness. Well- rounded, flavorful palate with a relatively dry finish. Light vanilla optional. Very low floral, spicy, or herbal hop flavor optional. Any impression of sweetness is due more to low bitterness than any residual sweetness; a sweet or heavy finish impairs drinkability. Bubblegum, sourness, or smoke are faults. While the banana-and-clove profile is important, it should not be so strong as to be extreme and unbalanced.","Mouthfeel":"Medium-light to medium body; never heavy. Fluffy, creamy fullness progressing to a light, spritzy finish aided by high to very high carbonation. Effervescent.","Style Comparison":"Compared to American Wheat, has a banana and clove yeast character and less bitterness. Compared to a Dunkles Weissbier, has a paler color and less malt richness and flavor."},"th":{"Overall Impression":"เบียร์ข้าวสาลีจากเยอรมันที่มีสีอ่อน สดชื่น มีฮอปบางๆ มีคาร์โบเนชั่นสูงและจบแบบ dry ให้รสชาติเต็มปาก มีความโดดเด่นของ banana-clove ใช้ยีสต์และการหมักแบบ Weizen","Aroma":"มีกลิ่น ester และ phenol ปานกลางถึงเข้มข้น โดยทั่วไปแล้วจะเป็น banana และ clove ที่สมดุลและเด่นกว่ามอลต์ กลิ่นข้าวสาลีแบบ bready, doughy หรือ grainy ต่ำถึงปานกลาง อาจพบกลิ่นวานิลลาบางๆได้ อาจพบกลิ่นฮอปแบบ floral, spicy หรือ herbal ได้ แต่กลิ่น Bubblegum (strawberry ผสม banana), sourness หรือ smoke คือข้อผิดพลาด","Appearance":"สีฟางอ่อน (pale straw) ถึงสีทอง (gold) ฟองสีขาวหนาหนึบ เกาะติดแก้วทนนาน อาจมีความขุ่นและมีความเงางามจากข้าวสาลีและยีสต์ ที่จะค่อยๆตกตะกอนลงไปก้นขวดตามกาลเวลา","Flavor":"รส banana และ clove ที่เข้มข้นแบบต่ำถึงปานกลางที่มักจะสมดุล มีรสข้าวสาลีในแบบ bready, doughy หรือ grainy ต่ำถึงปานกลางที่มีความหวานจาก pils มอลต์บางๆมาเสริม ความขมต่ำมากถึงปานกลางรสชาติกลมกล่อม รสจัดจ้านที่มาพร้อมกับตอนจบที่ค่อนข้างไม่เหลือความหวาน อาจพบวานิลลาบางๆได้ อาจพบรสฮอปแบบ floral, spicy หรือ herbal ได้แบบต่ำมากๆ ความรู้สึกถึงรสหวานมาจากความขมที่ต่ำไม่ใช่ความหวานที่หลงเหลือ รสหวานหรือเข้มข้นจะลดความสามารถในการดื่มคาแรคเตอร์ bubblegum (strawberry ผสม banana), sourness หรือ smoke คือข้อผิดพลาด แม้คาแรคเตอร์ของ banana และ clove จะสำคัญแต่ต้องไม่แรงเกินไปจนสูญเสียความสมดุล","Mouthfeel":"เนื้อเบียร์บางปานกลางจนถึงปานกลาง ห้ามหนัก แต่ต้องนุ่มฟู ครีมมี่ เต็มปาก บางเบา มีคาร์โบเนชั่นสูงถึงสูงมาก ดูมีชีวิตชีวา","Style Comparison":"เมื่อเทียบกับ American Wheat จะมีคาแรคเตอร์ banana และ clove จากยีสต์และมีรสขมน้อยกว่า เมื่อเปรียบเทียบกับ Dunkel Weissbier แล้ว สีจะอ่อนกว่าและมีความเข้มข้นและรสชาติของมอลต์น้อยกว่า"},"tags":"standard-strength, pale-color, top-fermented, central-europe, traditional-style, wheat-beer-family, malty","ex":"Ayinger Bräuweisse, Distelhäuser Hell Weizen, Hacker-Pschorr Hefeweißbier, Hofbräuhaus Münchner Weisse, Schneider Weisse Original Weissbier, Weihenstephaner Hefeweißbier","OG":[1.044,1.053],"FG":[1.008,1.014],"IBU":[8.0,15.0],"SRM":[2.0,6.0],"ABV":[4.3,5.6]},{"c":"10B","n":"Dunkles Weissbier","cat":"10","cn":"German Wheat Beer","tier":"B","gen":false,"en":{"Overall Impression":"A moderately dark German wheat beer with a distinctive banana-and-clove weizen yeast fermentation profile, supported by a toasted bread or caramel malt flavor. Highly carbonated and refreshing, with a creamy, fluffy texture and light finish.","Aroma":"Moderate esters and phenols, typically banana and clove, often well balanced with each other and with the malt. Light to moderate bready, doughy, or grainy wheat aroma, often accompanied by caramel, bread crust, or richer malt notes. Low to moderate vanilla optional. Light floral, spicy, or herbal hops optional. Bubblegum (strawberry with banana), sourness, or smoke are faults.","Appearance":"Light copper to dark, mahogany brown in color. Very thick, moussy, long-lasting off-white head. Can be hazy and have a shine from wheat and yeast, although this can settle out in bottled versions.","Flavor":"Low to moderately strong banana and clove flavor, often well balanced with each other and with the malt, although the malt may sometimes mask the clove impression. Low to medium-high soft, somewhat bready, doughy, or grainy wheat flavor with richer caramel, toast, or bread crust flavors. No strongly roasted flavors, but a touch of roasty dryness is allowable. Very low to low bitterness. Well-rounded, flavorful, often somewhat malty palate with a relatively dry finish. Very light to moderate vanilla optional. Low spicy, herbal, or floral hop flavor optional. Bubblegum, sourness, or smoke are faults.","Mouthfeel":"Medium-light to medium-full body. Fluffy, creamy fullness progressing to a lighter finish, aided by moderate to high carbonation. Effervescent.","Style Comparison":"Combines the yeast and wheat character of Weissbier with the malty richness of a Munich Dunkel. The banana-and-clove character is often less apparent than in a Weissbier due to the increased maltiness. Has a similar yeast character as Roggenbier, but without the rye flavor and increased body."},"th":{"Overall Impression":"เบียร์ข้าวสาลีจากเยอรมัน สีเข้มปานกลางที่มีคาแรคเตอร์ banana-and-clove จากการหมักด้วย Weizen ยีสต์ และมีรส toasted bread หรือ caramel มอลต์มาสนับสนุน มีคาร์โบเนชั่นสูงและสดชื่น ด้วยรสสัมผัส ครีมมี่ นุ่มเต็มปาก จบรสแบบบาง","Aroma":"มี ester และ phenol ปานกลาง โดยทั่วไปแล้วจะเป็น banana และ clove มักจะมีความสมดุลระหว่างทั้ง 2 อย่างและกับมอลต์ กลิ่นมอลต์ข้าวสาลีต่ำถึงปานกลางในแบบ bready, doughy หรือ grainy มักจะมาพร้อมกับ caramel, bread crust หรือ กลิ่นมอลต์ที่เข้มข้น สามารถมีกลิ่น vanilla ปานกลางถึงต่ำได้ มีฮอปแบบ Light floral, spicy หรือ herbal ได้ กลิ่น Bubblegum (strawberry ผสม banana), sourness หรือ smoke คือข้อผิดพลาด","Appearance":"สีทองแดงอ่อน (light copper) ถึงเข้ม (dark) สีน้ำตาลมะฮอกกานี (mahogany brown) เนื้อเบียร์หนามาก เหมือนมูส ฟองขาวนวล เกาะแก้วได้นาน อาจจะขุ่นหรือมีประกายจากข้าวสาลีและยีสต์ ที่จะค่อยๆตกตะกอนลงไปตามเวลา แม้ว่าจะอยู่ในขวดก็ตาม","Flavor":"รส banana และ clove ที่มีความเข้มข้นต่ำถึงปานกลาง มักจะมีความสมดุลระหว่างทั้ง 2 อย่างและกับมอลต์ แม้ว่ามอลต์ในบางครั้งอาจบดบังกลิ่น clove มีรสข้าวสาลีแบบ bready, doughy หรือ grainy พร้อมกับรส richer caramel, toast หรือ bread crust ไม่มีรสคั่วที่เข้มข้น แต่อนุญาตให้สัมผัสรสคั่วแบบไร้ความหวานหลงเหลือได้ ความขมต่ำถึงต่ำมาก รสชาติกลมกล่อม เต็มรสด้วยรสมอลต์ที่จบแบบ dry อาจจะพบคาแรคเตอร์ vanilla แบบอ่อนถึงปานกลางได้ สามารถมีรสฮอปแบบ spicy, herbal หรือ floral แบบต่ำได้ คาแรคเตอร์ bubblegum (strawberry ผสม banana), sourness หรือ smoke คือข้อผิดพลาด","Mouthfeel":"เนื้อเบียร์เบาปานกลางถึงหนาปานกลาง มีเนื้อครีมมี่ ฟูเต็มปาก ที่จบด้วยความเบาบาง มีคาร์โบเนชั่นปานกลางถึงสูงมาช่วยเสริม","Style Comparison":"ผสมผสานเอกลักษณ์ของยีสต์และข้าวสาลีจาก Weissbier เข้ากับความเข้มข้นของกลิ่นมอลต์ของ Munich Dunkel ลักษณะของ banana และ clove มักจะมีความชัดเจนน้อยกว่าใน Weissbier เนื่องจากมีคาแรคเตอร์มอลต์ที่เพิ่มขึ้น มีลักษณะของยีสต์คล้ายกับ Roggenbier แต่ไม่มีรสข้าว rye และเนื้อเบียร์ที่เพิ่มขึ้น"},"tags":"standard-strength, amber-color, top-fermented, central-europe, traditional-style, wheat-beer-family, malty","ex":"Ayinger Urweisse, Ettaler Benediktiner Weißbier Dunkel, Franziskaner Hefe-Weisse Dunkel, Hirsch Dunkel Weisse, Tucher Dunkles Hefe Weizen, Weihenstephaner Hefeweißbier Dunkel","OG":[1.044,1.057],"FG":[1.008,1.014],"IBU":[10.0,18.0],"SRM":[14.0,23.0],"ABV":[4.3,5.6]},{"c":"10C","n":"Weizenbock","cat":"10","cn":"German Wheat Beer","tier":"B","gen":false,"en":{"Overall Impression":"A strong and malty German wheat beer combining the best wheat and yeast flavors of a Weissbier with the rich maltiness, strength, and body of a Bock. The style range includes Bock and Doppelbock strength, with variations for pale and dark color.","Aroma":"Medium-high to high malty richness with a significant bready, grainy wheat character. Medium-low to medium-high weizen yeast character, typically banana and clove. Vanilla accents optional. No hops. Low to moderate alcohol, not hot or solventy. The malt, yeast, and alcohol are well balanced, complex, and inviting. Bubblegum (strawberry with banana), sourness, or smoke are faults. Dark versions have a deeper, highly toasted, bready malt richness with significant Maillard products, similar to a Dunkles Bock or dark Doppelbock. They can also have caramel and dark fruit esters, like plums, prunes, dark grapes, fruit leather, and raisins, particularly as they age. Pale versions have a grainy-sweet, bready, toasty malty richness, similar to a Helles Bock or pale Doppelbock.","Appearance":"Very thick, moussy, long-lasting head. Can be hazy and have a shine from wheat and yeast, although this can settle out with age. Dark versions are dark amber to dark ruby-brown in color, with a light tan head. Pale versions are gold to amber in color, with a very white to off-white head.","Flavor":"Medium-high to high malty richness with significant bready, grainy wheat flavor. Low to moderate banana and spice (clove, vanilla) yeast character. No hop flavor. Low to medium- low bitterness can give a slightly sweet palate impression, but the beer typically finishes dry. Light alcohol can enhance this character. The interplay between the malt, yeast, and alcohol adds complexity and interest, which is often enhanced with age. Bubblegum, sourness, or smoke are faults. Dark versions have deeper, richly bready or toasty malt flavors with significant Maillard products, optionally with caramel or light chocolate but not roast. Can have some dark fruit esters like plums, prunes, dark grapes, fruit leather, or raisins, particularly as they age. Pale versions have a bready, toasty, grainy-sweet malt richness.","Mouthfeel":"Medium-full to full body. Soft, smooth, fluffy or creamy texture. Mild alcohol warmth. Moderate to high carbonation.","Style Comparison":"Stronger and richer than a Weissbier or Dunkles Weissbier, but with similar yeast character. More directly comparable to the Doppelbock style, with the pale and dark variations. Can vary widely in strength, but most are in the Bock to Doppelbock range."},"th":{"Overall Impression":"เบียร์ข้าวสาลีจากเยอรมัน ที่มีความเข้มข้นและมีมอลต์ที่เข้มข้นผสมผสานรสชาติข้าวสาลีและยีสต์ที่ดีที่สุดของ Weissbier เข้ากับมอลต์ที่เข้มข้น แข็งแกร่ง และเนื้อเบียร์แบบ Bock สไตล์เบียร์จะประกอบด้วยความแรงของ Bock และ Doppelbock โดยมีทั้งสีอ่อนและสีเข้ม","Aroma":"ความเข้มข้นของมอลต์ปานกลางถึงสูง ในแบบ bready, grainy wheat มีคาแรคเตอร์ของ Weizen ยีสต์ต่ำปานกลางถึงสูงปานกลางในแบบ banana และ clove สามารถพบรสบางๆของ Vanilla ได้ ไม่มีฮอป พบแอลกอฮอล์แบบต่ำถึงปานกลางได้แต่ต้องไม่ร้อนแรงหรือออกเป็น solventy มอลต์ ยีสต์ และแอลกอฮอล์ต้องมีความสมดุล ซับซ้อน และน่าดึงดูดใจคาแรคเตอร์ Bubblegum (strawberry ผสม banana), sourness หรือ smoke คือข้อผิดพลาดแบบสีเข้มมีคาแรคเตอร์มอลต์ที่เข้มข้นทั้ง toasty, bready และผลผลิตจากปฏิกิริยา Maillard ที่ชัดเจนซึ่งคล้ายกับ Dunkel Bock หรือ Doppelbock สีเข้ม และยังสามารถพบคาแรคเตอร์ caramel และ dark fruit ester จำพวก plums, prunes, dark grapes, fruit leather และ raisins โดยเฉพาะเมื่อบ่มต่อแบบสีอ่อนจะมีความหวานจากมอลต์แบบ bready, toasty ที่เข้มข้นซึ่งคล้ายกับ Helles Bock หรือ Doppelbock สีอ่อน","Appearance":"ฟองหนามาก เหมือนมูส เกาะติดแก้วทนนาน อาจมีความขุ่นและมีความเงางามจากข้าวสาลีและยีสต์ ที่จะค่อยๆตกตะกอนลงไปตามเวลาเมื่อเอาเบียร์ไปบ่มแบบสีเข้มเป็นสีอำพันเข้ม (dark amber) ถึงน้ำตาลทับทิมเข้ม (dark ruby- brown) มีฟองสีน้ำตาลอ่อนแบบสีอ่อนมีสีทอง (gold) ถึงสีเหลืองอำพัน (amber) โดยมีฟองสีขาวมากจนถึงสีขาวนวล","Flavor":"รสมอลต์เข้มข้นปานกลางถึงสูง มีกลิ่น bready, grainy wheat มียีสต์คาแรคเตอร์แบบ banana และ spice (clove, vanilla) ต่ำถึงปานกลางไม่มีรสฮอป ความขมต่ำถึงต่ำปานกลาง ที่สามารถพบรสชาติหวานได้เล็กน้อย แต่โดยทั่วไปเบียร์จะให้รสแบบ dry แอลกอฮอล์บางๆจะช่วยดันคาแรคเตอร์ การทำงานร่วมกันระหว่างมอลต์ ยีสต์ และแอลกอฮอล์ช่วยเพิ่มความซับซ้อนและความน่าสนใจ ซึ่งมักจะเพิ่มขึ้นตามอายุการบ่มคาแรคเตอร์ bubblegum (strawberry ผสม banana), sourness หรือ smoke คือข้อผิดพลาดแบบสีเข้มมีคาแรคเตอร์มอลต์ที่เข้มข้นทั้ง toasty, bready และผลผลิตจากปฏิกิริยา Maillard ที่ชัดเจน ที่สามารถเลือกให้มีคาแรคเตอร์ของ caramel หรือ light chocolate ห้ามมีความคั่ว สามารถมี ester แบบ dark fruit ได้เช่น plums, prunes, dark grapes, fruit leather หรือ raisins โดยเฉพาะอย่างยิ่งเมื่อผ่านการบ่มแบบสีอ่อนจะมีความหวานจากมอลต์แบบ bready, toasty ที่เข้มข้น","Mouthfeel":"เนื้อเบียร์แบบแน่นปานกลางถึงแน่น เนื้อสัมผัสนุ่ม เนียน ฟูหรือเนื้อครีมมี่ สามารถพบความอุ่นจากแอลกอฮอล์ มีคาร์โบเนชั่นปานกลางถึงสูง","Style Comparison":"แรงและเข้มข้นกว่า Weissbier หรือ Dunkle Weissbier แต่มีคาแรคเตอร์ยีสต์คล้ายคลึงกัน เทียบได้กับสไตล์ Doppelbock โดยมีทั้งแบบสีอ่อนและสีเข้ม แต่ละชนิดอาจะมีความแรงแตกต่างกันอย่างมาก แต่ส่วนใหญ่อยู่ในช่วง Bock ถึง Doppelbock"},"tags":"high-strength, amber-color, pale-color, top-fermented, central-europe, traditional-style, wheat-beer-family, malty","ex":"Dark – Plank Bavarian Dunkler Weizenbock, Penn Weizenbock, Schalchner Weisser Bock, Schneider Weisse Aventinus; Pale –Ayinger Weizenbock, Distelhäuser Weizen Bock, Ladenburger Weizenbock Hell, Weihenstephaner Vitus","OG":[1.064,1.09],"FG":[1.015,1.022],"IBU":[15.0,30.0],"SRM":[6.0,25.0],"ABV":[6.5,9.0]},{"c":"11A","n":"Ordinary Bitter","cat":"11","cn":"British Bitter","tier":"B","gen":false,"en":{"Overall Impression":"Low gravity, alcohol, and carbonation make this an easy-drinking session beer. The malt profile can vary in flavor and intensity, but should never override the overall bitter impression. Drinkability is a critical component of the style.","Aroma":"Low to moderate malt aroma, often (but not always) with a light caramel quality. Bready, biscuity, or lightly toasty malt complexity is common. Mild to moderate fruitiness. Hop aroma can range from moderate to none, typically with a floral, earthy, resiny, or fruity character. Generally no diacetyl, although very low levels are allowed.","Appearance":"Pale amber to light copper color. Good to brilliant clarity. Low to moderate white to off-white head. May have very little head due to low carbonation.","Flavor":"Medium to moderately high bitterness. Moderately low to moderately high fruity esters. Moderate to low hop flavor, typically with an earthy, resiny, fruity, or floral character. Low to medium maltiness with a dry finish. The malt profile is typically bready, biscuity, or lightly toasty. Low to moderate caramel or toffee flavors are optional. Balance is often decidedly bitter, although the bitterness should not completely overpower the malt flavor, esters, and hop flavor. Generally no diacetyl, although very low levels are allowed.","Mouthfeel":"Light to medium-light body. Low carbonation, although bottled examples can have moderate carbonation.","Style Comparison":"Some modern variants are brewed exclusively with pale malt and are known as golden ales, summer ales, or golden bitters. Emphasis is on the bittering hop addition as opposed to the aggressive middle and late hopping seen in American ales."},"th":{"Overall Impression":"มี gravity แอลกอฮอล์ และคาร์โบเนชั่นต่ำทำให้เป็น session beer ที่ดื่มง่าย รายละเอียดของมอลต์อาจแตกต่างกันไปตามรสชาติและความเข้มข้น แต่ไม่ควรเหนือกว่าความรู้สึกขม การเป็นเบียร์ที่ดื่มง่าย เป็นองค์ประกอบสำคัญของสไตล์","Aroma":"กลิ่นมอลต์แบบต่ำถึงปานกลาง มักมีกลิ่นคาราเมลอ่อนๆ (แต่ไม่เสมอไป) พบความซับซ้อนของมอลต์ในแบบ bready, biscuity หรือ lightly toasty เป็นเรื่องปกติ มีความ fruity แบบนุ่มนวลจนถึงปานกลางกลิ่นหอมของฮอปมีตั้งแต่ปานกลางจนถึงไม่มีเลย โดยทั่วไปแล้วจะมีกลิ่น floral, earthy, resiny หรือ fruity โดยทั่วไปจะไม่พบ diacetyl แม้ในสไตล์จะยอมรับได้ในระดับต่ำ","Appearance":"อำพันอ่อน (pale amber) ถึงสีทองแดงอ่อน (light copper) เบียร์ใสถึงใสมาก ฟองสีขาวหรือขาวนวลขนาดเล็กจนถึงปานกลางอาจจะพบได้ตั้งแต่ฟองน้อยขึ้นอยู่กับคาร์โบเนชั่น","Flavor":"รสขมปานกลางถึงสูงปานกลาง มี ester แบบ fruity ต่ำปานกลางถึงสูงปานกลาง มีรสฮอปต่ำถึงสูง ทั่วไปในแบบ earthy, resiny, fruity หรือ floral มีรสมอลต์ต่ำถึงปานกลางจบรสแบบ dry จะพบโปรไฟล์มอลต์ในแบบ bready, biscuity หรือ lightly toasty สามารถพบคาแรคเตอร์ caramel หรือ toffee ในแบบต่ำได้ ความสมดุลจะมาในทางควมขมที่ออกแบบมา โดยที่ความขมจะต้องไม่กลบรสมอลต์, ester และรสฮอป ทั่วไปจะไม่มี diacetyl หรือยอมให้พบได้ในระดับต่ำ","Mouthfeel":"เนื้อเบียร์บางถึงบางปานกลาง คาร์โบเนชั่นต่ำ ในแบบขวดอาจจะมีคาร์โบเนชั่นปานกลาง","Style Comparison":"เบียร์ยุคใหม่บางประเภทผลิตด้วยมอลต์สีอ่อนโดยเฉพาะ และเรียกว่า golden ale, summer ale หรือ golden bitter เน้นไปที่การเพิ่มฮอปเพื่อความขม (ช่วงเริ่มการต้ม) ตรงกันข้ามกับที่ใส่ช่วงกลางหรือช่วงท้ายแบบ American ale"},"tags":"session-strength, amber-color, top-fermented, british-isles, traditional-style, amber-ale-family, bitter","ex":"Bateman’s XB, Brains Bitter, Brakspear Gravity, Fuller's Chiswick Bitter, Greene King IPA, Tetley’s Original Bitter","OG":[1.03,1.039],"FG":[1.007,1.011],"IBU":[25.0,35.0],"SRM":[8.0,14.0],"ABV":[3.2,3.8]},{"c":"11B","n":"Best Bitter","cat":"11","cn":"British Bitter","tier":"A","gen":false,"en":{"Overall Impression":"A flavorful, yet refreshing, session beer. Some examples can be more malt balanced, but this should not override the overall bitter impression. Drinkability is a critical component of the style.","Aroma":"Low to moderate malt aroma, often (but not always) with a low to medium-low caramel quality. Bready, biscuit, or lightly toasty malt complexity is common. Mild to moderate fruitiness. Hop aroma can range from moderate to none, typically with a floral, earthy, resiny, or fruity character. Generally no diacetyl, although very low levels are allowed.","Appearance":"Pale amber to medium copper color. Good to brilliant clarity. Low to moderate white to off-white head. May have very little head due to low carbonation.","Flavor":"Medium to moderately high bitterness. Moderately low to moderately high fruity esters. Moderate to low hop flavor, typically with an earthy, resiny, fruity, or floral character. Low to medium maltiness with a dry finish. The malt profile is typically bready, biscuity, or lightly toasty. Low to moderate caramel or toffee flavors are optional. Balance is often decidedly bitter, although the bitterness should not completely overpower the malt flavor, esters and hop flavor. Generally no diacetyl, although very low levels are allowed.","Mouthfeel":"Medium-light to medium body. Low carbonation, although bottled examples can have moderate carbonation.","Style Comparison":"More alcohol than an ordinary bitter, and often using higher-quality ingredients. Less alcohol than a strong bitter. More caramel or base malt character and color than a British Golden Ale. Emphasis is on the bittering hop addition as opposed to the aggressive middle and late hopping seen in American ales."},"th":{"Overall Impression":"เป็น session beer ที่เต็มรสชาติและสดชื่นบางตัวอย่างอาจมีความสมดุลของมอลต์มากกว่า แต่สิ่งนี้ไม่ควรแทนที่ความรู้สึกขมโดยรวม ความสามารถในการดื่มเป็นองค์ประกอบสำคัญของสไตล์","Aroma":"กลิ่นมอลต์ต่ำถึงปานกลาง มักจะมีคาแรคเตอร์ของคาราเมลแบบต่ำถึงต่ำปานกลาง (แต่ไม่เสมอไป) พบกลิ่นมอลต์ที่ซับซ้อนในแบบ bready, biscuit หรือ lightly toasty เป็นเรื่องปกติ มีกลิ่น fruity แบบอ่อนจนถึงปานกลาง กลิ่นฮอปอาจมีตั้งแต่ปานกลางจนถึงไม่มีเลย โดยทั่วไปแล้วจะเป็นกลิ่น floral, earthy, resiny หรือ fruity โดยทั่วไปจะไม่พบ diacetyl หรือยอมให้พบได้ในระดับต่ำ","Appearance":"สีอำพันอ่อน (pale amber) ถึงทองแดงปานกลาง (medium copper) เบียร์ใสถึงใสมาก ฟองสีขาวหรือขาวนวลต่ำจนถึงปานกลาง อาจจะเกาะแก้วได้ไม่ดีเพราะมีคาร์โบเนชั่นต่ำ","Flavor":"มีรสขมปานกลางถึงสูงปานกลาง มี ester แบบ fruity ต่ำปานกลางถึงสูงปานกลาง กลิ่นฮอปต่ำถึงปานกลาง โดยทั่วไปแล้วจะมีคาแรคเตอร์ของ earthy, resiny, fruity หรือ floral มีรสมอลต์ต่ำถึงปานกลางและจบรสแบบไม่เหลือความหวาน มอลต์โปรไฟล์เป็นแบบ bready, biscuity หรือ lightly toasty อาจพบรส caramel หรือ toffee แบบต่ำถึงปานกลางได้ ความสมดุลของเบียร์วัดได้จากความขมแต่ความขมก็ไม่ควรไปบัง รสมอลต์, ester หรือรสฮอป โดยทั่วไปจะไม่พบ diacetyl หรือยอมให้พบได้ในระดับต่ำ","Mouthfeel":"เนื้อเบียร์บางปานกลางถึงปานกลาง คาร์โบเนชั่นต่ำ ในแบบขวดอาจจะมีคาร์โบเนชั่นปานกลาง","Style Comparison":"มีแอลกอฮอล์มากกว่า ordinary bitter และมักใช้ส่วนผสมที่มีคุณภาพสูงกว่า แอลกอฮอล์น้อยกว่า strong bitter มีคาแรคเตอร์ caramel หรือ base มอลต์และสีมากกว่า British Golden Ale เน้นไปที่การเพิ่มฮอปเพื่อความขม (ช่วงเริ่มการต้ม) ตรงกันข้ามกับที่ใส่ช่วงกลางหรือช่วงท้ายแบบ American ale"},"tags":"standard-strength, amber-color, top-fermented, british-isles, traditional-style, amber-ale-family, bitter","ex":"Adnams Southwold Bitter, Fuller's London Pride, Harvey’s Sussex Best Bitter, Salopian Darwin’s Origin, Surrey Hills Shere Drop, Timothy Taylor Landlord","OG":[1.04,1.048],"FG":[1.008,1.012],"IBU":[25.0,40.0],"SRM":[8.0,16.0],"ABV":[3.8,4.6]},{"c":"11C","n":"Strong Bitter","cat":"11","cn":"British Bitter","tier":"B","gen":false,"en":{"Overall Impression":"An average-strength to moderately- strong British bitter ale. The balance may vary between fairly even between malt and hops to somewhat bitter. Drinkability is a critical component of the style. A rather broad style that allows for considerable interpretation by the brewer.","Aroma":"Hop aroma moderately-high to moderately-low, typically with a floral, earthy, resiny, or fruity character. Medium to medium-high malt aroma, optionally with a low to moderate caramel component. Medium-low to medium-high fruity esters. Generally no diacetyl, although very low levels are allowed.","Appearance":"Light amber to deep copper color. Good to brilliant clarity. Low to moderate white to off-white head. A low head is acceptable when carbonation is also low.","Flavor":"Medium to medium-high bitterness with supporting malt flavors evident. The malt profile is typically bready, biscuity, nutty, or lightly toasty, and optionally has a moderately low to moderate caramel or toffee flavor. Hop flavor moderate to moderately high, typically with a floral, earthy, resiny, or fruity character. Hop bitterness and flavor should be noticeable, but should not totally dominate malt flavors. Moderately-low to high fruity esters. Optionally may have low amounts of alcohol. Medium-dry to dry finish. Generally no diacetyl, although very low levels are allowed.","Mouthfeel":"Medium-light to medium-full body. Low to moderate carbonation, although bottled versions will be higher. Stronger versions may have a slight alcohol warmth but this character should not be too high.","Style Comparison":"More evident malt and hop flavors than in a special or best bitter, as well as more alcohol. Stronger versions may overlap somewhat with British Strong Ales, although Strong Bitters will tend to be paler and more bitter. More malt flavor (particularly caramel) and esters than an American Pale Ale, with different finishing hop character."},"th":{"Overall Impression":"เบียร์ Bitter ale ของอังกฤษที่มีความแรงปานกลางถึงสูงปานกลาง ความสมดุลอาจแตกต่างกันไประหว่างมอลต์กับฮอปจนถึงรสขมเล็กน้อย ความสามารถในการดื่มเป็นองค์ประกอบสำคัญของสไตล์ มีรูปแบบที่กว้างช่วยให้ผู้ผลิตเบียร์สามารถตีความได้","Aroma":"กลิ่นฮอประดับสูงปานกลางถึงต่ำปานกลาง โดยทั่วไปแล้วจะเป็นแนว floral, earthy, resiny หรือ fruity กลิ่นมอลต์ปานกลางถึงสูงปานกลาง สามารถมีคาแรคเตอร์ caramel แบบต่ำถึงปานกลางได้ มี ester ในแบบ fruity แบบสูงปานกลางถึงต่ำปานกลาง โดยทั่วไปจะไม่พบ diacetyl หรือยอมให้พบได้ในระดับต่ำ","Appearance":"สีอำพันอ่อน (light amber) ถึงทองแดงเข้ม (deep copper) มีความใสจนถึงใสมาก มีฟองสีขาวหรือขาวนวลแบบต่ำถึงปานกลาง การมีฟองต่ำเป็นที่ยอมรับได้เมื่อคาร์โบเนชั่นต่ำ","Flavor":"มีความขมปานกลางถึงสูงปานกลางและมีรสมอลต์มาสนับสนุนที่เด่นชัด ลักษณะของมอลต์นั้นโดยทั่วไปจะมีลักษณะเหมือน bready, biscuity, nutty หรือ lightly toasty และอาจพบรส caramel หรือ toffee ในระดับต่ำถึงปานกลาง มีรสฮอปปานกลางถึงสูงปานกลาง โดยทั่วไปจะมีกลิ่น floral, earthy, resiny หรือ fruity ความขมและรสชาติของฮอปมีในระดับปานกลางถึงสูงปานกลาง ต้องชัดเจนแต่ไม่กลบรสมอลต์ มี ester แบบ fruity ต่ำปานกลางถึงสูง อาจพบคาแรคเตอร์ของแอลกอฮอล์ได้ในปริมาณต่ำ จบรสแบบ dry ปานกลางถึง dry โดยทั่วไปจะไม่พบ diacetyl หรือยอมให้พบได้ในระดับต่ำ","Mouthfeel":"เนื้อเบียร์บางปานกลางถึงหนาปานกลาง คาร์โบเนชั่นต่ำถึงปานกลางแม้ว่าในแบบบรรจุขวดจะสูงกว่า ในแบบที่แรงอาจจะพบความอุ่นจากแอลกอฮอล์เล็กน้อย แต่คาแรคเตอร์นี้ไม่ควรแรงไป","Style Comparison":"รสชาติของมอลต์และฮอปที่ชัดเจนกว่า special หรือ best bitter รวมทั้งแอลกอฮอล์ที่มากขึ้น แบบที่แรงกว่าอาจมีคาแรคเตอร์ทับซ้อนกับ British Strong Ale บ้างแม้ว่า Strong Bitter จะสีอ่อนกว่าและขมกว่า มีรสมอลต์ (โดยเฉพาะคาราเมล) และ ester มากกว่า American Pale Ale ที่มีลักษณะการใช้ฮอปตอนจบที่แตกต่างกัน"},"tags":"standard-strength, amber-color, top-fermented, british-isles, traditional-style, amber-ale-family, bitter","ex":"Bass Ale, Bateman’s Triple XB, Robinsons Trooper, Samuel Smith’s Organic Pale Ale, Shepherd Neame Bishop's Finger, Summit Extra Pale Ale","OG":[1.048,1.06],"FG":[1.01,1.016],"IBU":[30.0,50.0],"SRM":[8.0,18.0],"ABV":[4.6,6.2]},{"c":"12A","n":"British Golden Ale","cat":"12","cn":"Pale Commonwealth Beer","tier":"B","gen":false,"en":{"Overall Impression":"A hop-forward, average-strength to moderately-strong pale bitter. Drinkability and a refreshing quality are critical components of the style, as it was initially a summer seasonal beer.","Aroma":"Hop aroma is moderately low to moderately high, and can use any variety of hops – floral, herbal, or earthy English hops and citrusy American hops are most common. Frequently a single hop varietal will be showcased. Low bready malt aroma with no caramel. Medium-low to low fruity aroma from the hops rather than esters. Low diacetyl optional.","Appearance":"Straw to golden in color. Good to brilliant clarity. Low to moderate white head. A low head is acceptable when carbonation is also low.","Flavor":"Medium to medium-high bitterness. Hop flavor is moderate to moderately high of any hop variety, although citrus flavors are increasingly common. Medium-low to low malt character, generally bready with perhaps a little biscuity flavor. Caramel flavors are typically absent. Hop bitterness and flavor should be pronounced. Moderately-low to low esters. Medium-dry to dry finish. Bitterness increases with alcohol level, but is always balanced. Low diacetyl optional.","Mouthfeel":"Light to medium body. Low to moderate carbonation on draught, although bottled commercial versions will be higher. Stronger versions may have a slight alcohol warmth, but this character should not be too high.","Style Comparison":"More similar to an American Pale Ale than anything else, although it is often lower in alcohol and usually features British ingredients. Has no caramel and fewer esters compared to British Bitters and pale ales. Dry as Bitters but with less malt character to support the hops, giving a different balance. Often uses (and features) American hops, more so than most other modern British styles. Balance of hoppiness between a Blonde Ale and an American Pale Ale."},"th":{"Overall Impression":"เบียร์ที่ฮอปนำ ความแรงปานกลางถึงสูงปานกลาง ความดื่มได้ง่ายและความสามารถในการให้ความสดชื่นคือสิ่งจำเป็นของสไตล์ เนื่องจากเป็นเบียร์ตามฤดูกาลในฤดูร้อน","Aroma":"กลิ่นของฮอปในระดับต่ำปานกลางถึงสูงปานกลาง และสามารถใช้ฮอปได้หลากหลาย – floral, herbal หรือ earthy แบบอังกฤษ หรือ citrusy แบบฮอปอเมริกันก็เป็นเรื่องปกติ บ่อยครั้งจะพบในแบบ single hop มีกลิ่นมอลต์แบบ bready ต่ำไม่มี caramel มีกลิ่น fruity แบบต่ำถึงต่ำปานกลางที่มาจากฮอปมากกว่าจาก ester อาจจะพบ diacetyl ต่ำได้","Appearance":"สีฟาง (straw) จนถึงสีทอง (gold) มีความใสจนถึงใสมาก มีฟองสีขาวในระดับต่ำถึงปานกลาง การมีฟองต่ำเป็นที่ยอมรับได้เมื่อคาร์โบเนชั่นต่ำ","Flavor":"มีความขมปานกลางถึงสูงปานกลาง รสชาติของฮอปอยู่ในระดับปานกลางถึงสูงปานกลางจากฮอปทุกชนิด แม้จะพบแบบ citrus มากขึ้นเรื่อยๆ มีคาแรคเตอร์มอลต์แบบต่ำถึงต่ำปานกลาง ทั่วไปในแบบ bready และอาจพบ biscuity เล็กน้อย ไม่ควรมีรส caramel ความขมและรสของฮอปควรเด่นชัด มี ester ปานกลางถึงต่ำ จบรสแบบ dry ปานกลางจนถึง dry ความขมจะเพิ่มขึ้นตามระดับแอลกอฮอล์ แต่ต้องสมดุล อาจจะพบ diacetyl ต่ำได้","Mouthfeel":"เนื้อเบียร์บางถึงปานกลาง คาร์โบเนชั่นต่ำถึงปานกลางในแบบเบียร์สด แม้ว่าในแบบบรรจุขวดในท้องตลาดจะสูงกว่า ในแบบที่แรงอาจจะพบความอุ่นจากแอลกอฮอล์เล็กน้อย แต่คาแรคเตอร์นี้ไม่ควรแรงไป","Style Comparison":"คล้ายกับ American Pale Ale มากกว่าอย่างอื่นแต่มักจะมีแอลกอฮอล์ต่ำกว่าและมีส่วนผสมจากฝั่งอังกฤษ ต้องไม่มี caramel และมี ester ต่ำกว่าเมื่อเทียบกับ British Bitter และ Pale ale จะ dry แบบ Bitter แต่ด้วยคาแรคเตอร์มอลต์ที่น้อยกว่าที่ช่วยส่งเสริมฮอป ทำให้ความสมดุลนั้นต่างไป มักใช้ (และใช้คุณสมบัติ) ของ ฮอปแบบอเมริกันมากกว่าสไตล์อังกฤษสมัยใหม่ส่วนใหญ่ มีความสมดุลจากฮอปอยู่ระหว่าง Blonde Ale และ American Pale Ale"},"tags":"standard-strength, pale-color, top-fermented, british-isles, craft-style, pale-ale-family, bitter, hoppy","ex":"Adnams Explorer, Crouch Vale Brewers Gold, Golden Hill Exmoor Gold, Hop Back Summer Lightning, Oakham JHB, Spitfire Golden Ale","OG":[1.038,1.053],"FG":[1.006,1.012],"IBU":[20.0,45.0],"SRM":[2.0,5.0],"ABV":[3.8,5.0]},{"c":"12B","n":"Australian Sparkling Ale","cat":"12","cn":"Pale Commonwealth Beer","tier":"C","gen":false,"en":{"Overall Impression":"A well-balanced, pale, highly- carbonated, and refreshing ale suitable for drinking in a hot climate. Fairly bitter, with a moderate herbal-spicy hop and pome fruit ester profile. Smooth, neutral malt flavors with a fuller body but a crisp, highly-attenuated finish.","Aroma":"Fairly soft, clean aroma with a balanced mix of esters, hops, malt, and yeast – all moderate to low in intensity. The esters are frequently pears and apples, optionally with a very light touch of banana. The hops are earthy, herbaceous, or might show the characteristic iron-like Pride of Ringwood nose. The malt can range from neutral grainy to moderately sweet to lightly bready; no caramel should be evident. Very fresh examples can have a lightly yeasty, sulfury nose.","Appearance":"Deep yellow to light amber in color, often medium gold. Tall, frothy, persistent white head with tiny bubbles. Noticeable effervescence due to high carbonation. Brilliant clarity if decanted, but typically poured with yeast to have a cloudy appearance. Not typically cloudy unless yeast roused during the pour.","Flavor":"Medium to low rounded, grainy to bready malt flavor, initially mild to malty-sweet but a medium to medium-high bitterness rises mid-palate to balance the malt. Caramel flavors typically absent. Highly attenuated, giving a dry, crisp finish with lingering bitterness, although the body gives an impression of fullness. Medium to medium-high hop flavor, somewhat earthy and possibly herbal, resinous, peppery, or iron-like but not floral, lasting into aftertaste. Medium-high to medium-low esters, often pears and apples. Banana is optional, but should never dominate. May be lightly minerally or sulfury, especially if yeast is present. Should not be bland.","Mouthfeel":"High to very high carbonation, giving mouth- filling bubbles and a crisp, spritzy carbonic bite. Medium to medium-full body, tending to the higher side if poured with yeast. Smooth but gassy. Stronger versions may have a light alcohol warmth, but lower alcohol versions will not. Very well- attenuated; should not have any residual sweetness.","Style Comparison":"Superficially similar to English Pale Ales, although much more highly carbonated, with less caramel, less late hops, and showcasing the signature yeast strain and hop variety. More bitter than IBUs might suggest due to high attenuation, low final gravity, and somewhat coarse hops."},"th":{"Overall Impression":"เบียร์เอลที่มีความสมดุล สีอ่อน คาร์โบเนชั่นสูงและสดชื่น เหมาะสำหรับดื่มในสภาพอากาศร้อน ค่อนข้างขมด้วยฮอปปานกลางในแบบ herbal-spicy และ ester แบบ pome fruit นุ่มลื่น ให้รสมอลต์ในระดับปานกลางพร้อมเนื้อเบียร์ที่แน่นแต่ crisp จบด้วยการทำงานของยีสต์ที่ดีเยี่ยม","Aroma":"กลิ่นหอมที่นุ่มนวล สะอาด พร้อมด้วยส่วนผสมที่สมดุลของ esters, hops, malt, และ yeast ที่มีความเข้มข้นปานกลางถึงต่ำ มี ester ในแบบ pears หรือ apples และสามารถมีรสสัมผัสอ่อนๆแบบ banana ได้ มีฮอปในแนว earthy, herbaceous หรือมีลักษณะคล้ายเหล็กจากฮอป Pride of Ringwood มอลต์มีได้ตั้งแต่แบบ grainy ปานกลางไปจนถึงหอมหวาน หรือแบบ bready อ่อนๆ ไม่ควรพบ caramel เบียร์ที่สดใหม่สามารถพบคาแรคเตอร์ yeasty และ sulfury ได้","Appearance":"สีเหลืองเข้ม (deep yellow) ถึงสีเหลืองอำพันอ่อน (light amber) มักเป็นสีทองปานกลาง มีฟองสูงเกาะแก้วได้ดีสีขาวพร้อมฟองขนาดเล็ก สังเกตุเห็นชัดเพราะคาร์โบเนชั่นสูง มีความใสมากๆ แต่โดยทั่วไปแล้วจะเสิร์ฟพร้อมกับยีสต์เพื่อให้ดูขุ่น โดยทั่วไปแล้วจะไม่ขุ่นความขุ่นที่เห็นเป็นเพราะการเสิร์ฟพร้อมยีสต์","Flavor":"รสชาติมอลต์กลมกล่อมปานกลางถึงต่ำ มีรสมอลต์แบบ grainy ถึง bready จะพบรสมอลต์แบบนุ่มนวลจนถึงหวานในตอนแรก แล้วความขมแบบปานกลางจนถึงสูงปานกลางจะตามเข้ามาทำให้รสสมดุล ไม่ควรพบรส caramel ยีสต์จัดการกับน้ำตาลได้ดีทำให้ dry พร้อมให้ความ crisp ที่ลากไปจนจบพร้อมความขม แม้ว่าเนื้อเบียร์จะรู้สึกแน่น กลิ่นฮอปปานกลางถึงสูงปานกลางแบบ earthy และอาจจะมี herbal, resinous, peppery หรือลักษณะคล้ายเหล็กแต่ไม่ควรมี floral ที่อยู่คู่ไปใน aftertaste มี ester แบบต่ำปานกลางถึงสูงปานกลางออกแนว pears และ apples อาจจะพบคาแรคเตอร์ banana ได้แต่ไม่ควรโดดเด่น อาจพบคาแรคเตอร์ minerally หรือ sulfury โดยเฉพาะเวลาที่มียีสต์ ไม่ควรจืดชืด","Mouthfeel":"คาร์โบเนชั่นสูงไปจนถึงสูงมาก ให้ความรู้สึกเต็มปากที่เกิดจากความซ่า crisp และกัดลิ้น เนื้อเบียร์ปานกลางถึงหนาปานกลาง เนื้อเบียร์จะไปทางหนาถ้าเสิร์ฟพร้อมด้วยยีสต์ นุ่มเรียบแต่ซ่า ในแบบที่แรงกว่าอาจพบความอุ่นจากแอลกอฮอล์เล็กน้อย ที่ไม่ควรจะพบในแบบแอลกอฮอล์ต่ำ ยีสต์จัดการน้ำตาลได้ดีมาก; ไม่ควรมีความหวานหลงเหลือ","Style Comparison":"มีความคล้ายคลึงกันกับ English Pale Ale แม้ว่าจะมีคาร์โบเนชั่น มากกว่ามาก โดยมี caramel น้อยกว่า ใช้ฮอปในช่วง late hop น้อยกว่า และแสดงให้เห็นถึงสายพันธุ์ยีสต์ที่เป็นเอกลักษณ์และพันธุ์ฮอปที่หลากหลาย อาจมีรสขมมากกว่า IBU ที่เห็น เนื่องจากยีสต์จัดการน้ำตาลได้มาก FG ต่ำ และฮอปที่ค่อนข้างไม่ละเอียดอ่อน"},"tags":"standard-strength, pale-color, top-fermented, pacific, traditional-style, pale-ale-family, bitter","ex":"Coopers Sparkling Ale","OG":[1.038,1.05],"FG":[1.004,1.006],"IBU":[20.0,35.0],"SRM":[4.0,7.0],"ABV":[4.5,6.0]},{"c":"12C","n":"English IPA","cat":"12","cn":"Pale Commonwealth Beer","tier":"A","gen":false,"en":{"Overall Impression":"A bitter, moderately-strong, very well- attenuated pale British ale with a dry finish and a hoppy aroma and flavor. Classic British ingredients provide the most authentic flavor profile.","Aroma":"A moderate to moderately-high hop aroma, typically floral, spicy-peppery, or citrus-orange in nature. A slight dry- hop aroma is acceptable, but not required. Medium-low to medium bready or biscuity malt, optionally with a moderately- low caramel-like or toasty malt presence. Low to moderate fruitiness is acceptable. Optional light sulfury note.","Appearance":"Color ranges from golden to deep amber, but most are fairly pale. Should be clear, although unfiltered dry- hopped versions may be a bit hazy. Moderate-sized, persistent head stand with off-white color.","Flavor":"Hop flavor is medium to high, with a moderate to assertive hop bitterness. The hop flavor should be similar to the aroma (floral, spicy-peppery, or citrus-orange). Malt flavor should be medium-low to medium, and be somewhat bready, optionally with light to medium-light biscuit, toast, toffee, or caramel aspects. Medium-low to medium fruitiness. Finish is medium-dry to very dry, and the bitterness may linger into the aftertaste but should not be harsh. The balance is toward the hops, but the malt should still be noticeable in support. If high sulfate water is used, a distinctively minerally, dry finish, some sulfur flavor, and a lingering bitterness are usually present. Some clean alcohol flavor can be noted in stronger versions.","Mouthfeel":"Smooth, medium-light to medium body without hop-derived astringency. Medium to medium-high carbonation can give an overall dry sensation despite a supportive malt presence. A low, smooth alcohol warming can be sensed in stronger versions.","Style Comparison":"Generally will have more late hops and less fruitiness and caramel than British pale ales and Bitters. Has less hop intensity and a more pronounced malt flavor than typical American IPAs."},"th":{"Overall Impression":"เบียร์อังกฤษสีอ่อนที่มีรสขม แรงปานกลางยีสต์จัดการน้ำตาลได้ดีมาก มีกลิ่นและรสจากฮอป จบรสแบบ dry ใช้วัตถุดิบคลาสสิกของอังกฤษให้รายละเอียดในรสชาติที่แท้จริง","Aroma":"มีกลิ่นฮอปปานกลางถึงสูง มักเป็นกลิ่น floral, spicy-peppery หรือ citrus-orange จากธรรมชาติ กลิ่นจากการ dry-hop เล็กน้อยเป็นที่ยอมรับได้แต่ไม่จำเป็น มีมอลต์ในแบบ bready หรือ biscuity ในระดับต่ำปานกลางถึงปานกลาง สามารถเลือกมอลต์ที่คล้าย caramel หรือ toasty ได้ในระดับต่ำปานกลาง มีความ fruity น้อยถึงปานกลางเป็นที่ยอมรับได้สามารถมี sulfury อ่อนๆได้","Appearance":"ช่วงสีมีตั้งแต่สีทอง (golden) ไปจนถึงสีเหลืองอำพันเข้ม (deep amber) แต่ส่วนใหญ่จะค่อนข้างอ่อน ควรมีความใส แม้ว่าในแบบที่ dry-hop และไม่ผ่านการกรองอาจขุ่นเล็กน้อย มีฟองขนาดกลาง เกาะแก้วได้ดี สีขาวนวล","Flavor":"มีรสฮอปปานกลางถึงสูง มีความขมของฮอปปานกลางถึงสูงมากรสชาติของฮอปควรคล้ายกับกลิ่น (floral, spicy-peppery หรือ citrus- orange) ควรมีรสมอลต์ในแบบปานกลางถึงต่ำปานกลาง และมีลักษณะเหมือน bready อาจมี biscuit, toast, toffee, หรือ caramel ในระดับต่ำถึงปานกลาง มีความ Fruity ปานกลางถึงต่ำปานกลาง จบรสแบบ dry ปานกลางจนถึง dry และจบไปพร้อมกับความขมที่ไม่ระคายเคือง ความสมดุลมาจากฮอป แต่ก็ยังต้องมีมอลต์ที่คอยสนับสนุน ถ้าใช้น้ำที่มี sulfate สูงจะพบคาแรคเตอร์แร่ธาตุเด่นชัด จบรสไม่เหลือความหวาน รส sulfer และความขมที่ชัดเจน ในแบบที่แรงกว่าอาจจะพบรสแอลกอฮอล์สะอาด","Mouthfeel":"นุ่มลื่น เนื้อเบียร์แบบบางปานกลางถึงปานกลาง โดยปราศจากความฝาดจากฮอป คาร์โบเนชั่นปานกลางถึงสูงปานกลางสามารถให้ถึงความรู้สึกที่ dry แม้ว่าจะมีมอลต์อยู่ด้วยก็ตาม ในแบบที่แรงกว่าอาจจะพบความอุ่นจากแอลกอฮอล์ในระดับต่ำที่ราบเรียบ","Style Comparison":"โดยทั่วไปจะใส่ฮอปในช่วง late-hop มีความ fruity และ caramel น้อยกว่า Pale Ale และ Bitter ของอังกฤษ มีความเข้มข้นของฮอปน้อยกว่าและมีรสชาติของมอลต์ที่เด่นชัดกว่า American IPA ทั่วไป"},"tags":"high-strength, pale-color, top-fermented, british-isles, traditional-style, ipa-family, bitter, hoppy","ex":"Berkshire Lost Sailor IPA, Fuller's Bengal Lancer, Marston’s Old Empire IPA, Meantime London IPA, Thornbridge Jaipur, Worthington White Shield","OG":[1.05,1.07],"FG":[1.01,1.015],"IBU":[40.0,60.0],"SRM":[6.0,14.0],"ABV":[5.0,7.5]},{"c":"13A","n":"Dark Mild","cat":"13","cn":"Brown British Beer","tier":"B","gen":false,"en":{"Overall Impression":"A dark, low-gravity, malt-focused British session ale readily suited to drinking in quantity. Refreshing, yet flavorful for its strength, with a wide range of dark malt or dark sugar expression.","Aroma":"Low to moderate malt aroma, and may have some fruitiness. The malt expression can take on a wide range of character, which can include caramel, toffee, grainy, toasted, nutty, chocolate, or lightly roasted. Low earthy or floral hop aroma optional. Very low diacetyl optional.","Appearance":"Copper to dark brown or mahogany color. Generally clear, although is traditionally unfiltered. Low to moderate off-white to tan head; retention may be poor.","Flavor":"Generally a malty beer, although may have a very wide range of malt- and yeast-based flavors (e.g., malty, sweet, caramel, toffee, toast, nutty, chocolate, coffee, roast, fruit, licorice, plum, raisin) over a bready, biscuity, or toasty base. Can finish sweet to dry. Versions with darker malts may have a dry, roasted finish. Low to moderate bitterness, enough to provide some balance but not enough to overpower the malt in the balance. Moderate fruity esters optional. Low hop flavor optional. Low diacetyl optional.","Mouthfeel":"Light to medium body. Generally low to medium- low carbonation. Roast-based versions may have a light astringency. Sweeter versions may seem to have a rather full mouthfeel for the gravity. Should not be flat, watery, or thin.","Style Comparison":"Some versions may seem like lower- gravity modern English Porters. Much less sweet than London Brown Ale."},"th":{"Overall Impression":"เบียร์ session ale สัญชาติอังกฤษที่เน้นมอลต์มี gravity ต่ำและสีเข้ม เหมาะกับการดื่มในปริมาณมาก ให้ความสดชื่นพร้อมให้รสชาติเข้มข้นตามความแรง พร้อมด้วยคาแรคเตอร์ของ dark malt หรือ dark sugar ที่หลากหลาย","Aroma":"กลิ่นมอลต์ต่ำถึงปานกลาง อาจพบความ fruity บ้างคาแรคเตอร์ของมอลต์สามารถแสดงออกได้หลายแบบทั้ง caramel, toffee, grainy, toasted, nutty, chocolate, หรือ lightly roasted อาจพบกลิ่นฮอปแบบ earthy หรือ floral แบบต่ำได้ อาจพบ diacetyl แบบต่ำๆได้","Appearance":"สีทองแดง (copper) ถึงน้ำตาลเข้ม (dark brown) หรือสี Mahogany โดยทั่วไปแล้วจะใส แม้ว่าตามธรรมเนียมจะไม่มีการกรองก็ตาม มีฟองต่ำถึงปานกลางสีขาวนวลจนถึงสีน้ำตาลอ่อน; ฟองอาจจะเกาะแก้วไม่ดี","Flavor":"โดยทั่วไปเป็นเบียร์แบบเน้นมอลต์ มีรสชาติมอลต์และยีสต์ที่หลากหลายมาก (เช่น malty, sweet, caramel, toffee, toast, nutty, chocolate, coffee, roast, fruit, licorice, plum, raisin) ที่อยู่เหนือ base มอลต์แบบ bready, biscuity หรือ toasty สามารถจบได้แบบหวานจนถึง dry เบียร์ในแบบที่มีมอลต์สีเข้มอาจจะจบแบบ dry ที่มาพร้อมรสคั่ว มีความขมเล็กน้อยถึงปานกลาง เพียงพอที่จะทำให้เกิดความสมดุล แต่ไม่มากพอที่จะเอาชนะมอลต์ สามารถมี ester แบบ fruity ปานกลาง สามารถมีรสฮอปในระดับต่ำได้ อาจพบ diacetyl ในระดับต่ำได้","Mouthfeel":"เนื้อเบียร์บางถึงปานกลาง โดยทั่วไปจะมีคาร์โบเนชั่นต่ำถึงปานกลาง ในเบียร์แบบที่มีรสคั่วอาจมีความฝาดเล็กน้อย ในเบียร์แบบที่หวานอาจให้ความรู้สึกเต็มปากในเบียร์ที่แรงกว่า
